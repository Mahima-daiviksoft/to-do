c auth (`CryptoObject`), via plugins or native code.\n* Re-authenticate for sensitive actions (change password, payments).\n* Device binding / attestation: **Play Integrity API**, **App Attest/DeviceCheck** (iOS), Firebase App Check — backend verifies the request comes from a genuine app on a genuine device.\n* Rate limiting & lockouts on the server; CAPTCHA/bot protection where needed.\n\n---\n\n## 25.5 Secure data storage\n* Tokens/keys → `flutter_secure_storage` (Chapter 17 gotchas: iOS keychain persists after uninstall; Android backup restore).\n* Sensitive DBs → SQLCipher / encrypted Hive with key in secure storage.\n* Don't log sensitive data (`print(token)`!); strip logs in release; scrub crash reports.\n* Caches: HTTP caches may store sensitive responses — disable caching for sensitive endpoints (`Cache-Control: no-store`).\n* Clipboard: avoid copying secrets; clear after timeout; Android 13+ shows clipboard preview — mark sensitive (`ClipDescription.EXTRA_IS_SENSITIVE` via native).\n* **Screenshots / app switcher snapshots**: hide sensitive screens:\n  * Android: `FLAG_SECURE` (`WindowManager.LayoutParams.FLAG_SECURE`) via a plugin (`flutter_windowmanager_plus`, `no_screenshot`, `screen_protector`) or native code — blocks screenshots/recording and blanks recents thumbnail.\n  * iOS: can't fully block screenshots; detect via `UIApplication.userDidTakeScreenshotNotification`; obscure content when going to background (overlay on `inactive` lifecycle state) and detect screen recording (`UIScreen.isCaptured`).\n* Keyboard: `enableSuggestions: false`, `autocorrect: false` for sensitive fields; `obscureText` for passwords (prevents keyboard learning on most IMEs).\n\n---\n\n## 25.6 Network security\n* HTTPS only (Android blocks cleartext by default since API 28; iOS ATS).\n* **Certificate / public key pinning** for high-risk apps:\n```dart\n// Dio with a custom HttpClient (native platforms)\n(dio.httpClientAdapter as IOHttpClientAdapter).createHttpClient = () {\n  final client = HttpClient(context: SecurityContext(withTrustedRoots: false)\n    ..setTrustedCertificatesBytes(pinnedCertPemBytes));   // trust ONLY your cert/CA\n  return client;\n};\n// Alternative: validateCertificate callback in IOHttpClientAdapter checking SHA-256 fingerprint of cert.der\n```\n  Plan **rotation** (pin multiple keys/CA, remote-config fallback, expiry monitoring) — pinning failures brick older app versions.\n* Android `network_security_config.xml` can declare pins and debug-only user CA trust.\n* Don't disable certificate validation (`badCertificateCallback = (_, __, ___) => true`) except in local debug with explicit guards.\n* Validate server responses (types/sizes); limit redirects.\n\n---\n\n## 25.7 Code protection (binary hardening)\n* **Obfuscation**: `flutter build apk --obfuscate --split-debug-info=build/symbols` — renames Dart symbols in the AOT snapshot. Keep symbols to de-obfuscate crashes. Note: obfuscation doesn't hide strings or logic flow; it raises the bar.\n* Release builds are AOT machine code (harder to reverse than JS/Java bytecode) but tools (e.g., reFlutter, Blutter) can analyze Flutter snapshots — assume determined attackers can read your logic.\n* Android R8 for Java/Kotlin code.\n* **Root/jailbreak detection** (`flutter_jailbreak_detection`, `safe_device`, freeRASP/`freerasp` by Talsec): detect rooted devices, emulators, debuggers, hooking frameworks (Frida), tampering (signature mismatch), and react (warn, limit features, report to backend). All bypassable by skilled attackers → combine with server-side attestation (Play Integrity / App Attest).\n* Don't rely on client checks for business rules (e.g., \"isPremium\" flag in prefs → server must enforce).\n\n---\n\n## 25.8 Input validation & injection\n* SQL: always parameterized (`whereArgs`), Drift handles this.\n* WebView: don't load untrusted URLs with JS bridges enabled; validate `JavascriptChannel` messages; restrict navigation (`NavigationDelegate`); don't expose sensitive native functions to web content.\n* Deep links: treat parameters as untrusted — validate IDs, don't auto-execute actions (e.g., `myapp://transfer?to=x&amount=1000` must require user confirmation & server checks); prevent open redirects.\n* File paths: avoid path traversal when saving/downloading (`../`).\n* Rendering HTML/Markdown from users: sanitize.\n\n---\n\n## 25.9 Platform configuration hardening\n**Android**\n* `android:debuggable` is false in release automatically — don't override.\n* Exported components: `android:exported` explicit (required Android 12+); only export what's needed; protect with permissions.\n* `android:allowBackup` / `dataExtractionRules` to exclude sensitive data.\n* `usesCleartextTraffic=false`.\n* Intent filters & PendingIntents with `FLAG_IMMUTABLE`.\n* Keep `targetSdk` up to date (security behaviour changes).\n* Tapjacking: `filterTouchesWhenObscured` for sensitive buttons (native).\n\n**iOS**\n* ATS enabled; keychain accessibility classes; `NSFaceIDUsageDescription` for Face ID; Privacy manifest (`PrivacyInfo.xcprivacy`); data protection entitlement (`NSFileProtectionComplete`) for files.\n* Universal Links instead of custom schemes for sensitive flows (custom schemes can be hijacked).\n\n**Web**\n* XSS considerations (HtmlElementView, `dart:js_interop`), CSP headers, don't store tokens in localStorage if avoidable (prefer httpOnly cookies with backend), CORS correctly configured server-side.\n\n---\n\n## 25.10 Supply chain & dependencies\n* Review packages before adding (Chapter 2 checklist), especially plugins with native code and broad permissions.\n* Commit `pubspec.lock`; pin git dependencies to commit SHAs.\n* Dependency update cadence with changelog review; Dependabot/Renovate for pub (supported).\n* OSV scanner (`osv-scanner --lockfile=pubspec.lock`) for known vulnerabilities.\n* Protect CI secrets (signing keys in secret storage, least privilege), signed commits/tags if required, SBOM generation for regulated industries.\n\n---\n\n## 25.11 Privacy & compliance\n* Collect minimum data; get consent (GDPR/DPDP/CCPA); ATT prompt on iOS for tracking; Google Play **Data safety** form & App Store **privacy nutrition labels** must match reality (SDKs included!).\n* Account deletion in-app is **required** by both Apple (since 2022) and Google Play (since 2023/2024) if you allow account creation.\n* Children's apps: COPPA / Families policy restrictions on ads/analytics SDKs.\n* Health/finance: HIPAA, PCI-DSS (never store card data; use gateway SDKs/tokenization), RBI guidelines (India) for payments & data localization.\n\n---\n\n## 25.12 Security testing\n* Static analysis: MobSF (Mobile Security Framework) on APK/IPA; lints; secret scanning.\n* Dynamic: proxy traffic (Burp/mitmproxy) to verify TLS/pinning and no sensitive data leakage; Frida-based tests in pentests.\n* Third-party penetration testing before major releases for regulated apps.\n* Threat modeling (STRIDE) for new features handling sensitive data.\n\n---\n\n## 25.13 Interview Questions — Security\n\n**Q1. How do you store sensitive data in Flutter?** flutter_secure_storage (Keychain/Keystore) for small secrets; encrypted DB for larger data; never SharedPreferences/plain files; clear on logout.\n\n**Q2. How do you protect API keys?** Don't ship secrets; proxy via backend; restrict public client keys by app signature/bundle/API; use App Check/attestation.\n\n**Q3. What is certificate pinning and its risk?** Trusting only specific certs/keys for your domains to block MITM; risk of breaking the app on certificate rotation — pin multiple keys, plan rotation.\n\n**Q4. Does obfuscation make the app secure?** No — it raises reverse-engineering cost; secrets and critical logic must stay on the server.\n\n**Q5. How do you prevent screenshots of sensitive screens?** Android FLAG_SECURE; on iOS obscure content when backgrounded and detect screen capture/screenshot.\n\n**Q6. What is OWASP MASVS?** The OWASP Mobile Application Security Verification Standard defining security requirements (storage, crypto, auth, network, platform, code quality, resilience, privacy).\n\n**Q7. How do you implement secure authentication?** OAuth2/OIDC with PKCE via system browser, short-lived tokens, refresh rotation, secure storage, server-side authorization, MFA/biometric re-auth for sensitive actions.\n\n**Q8. What is root/jailbreak detection and its limitations?** Detects compromised devices/hooking; bypassable — combine with server-side integrity attestation and risk-based responses.\n\n**Q9. How do you secure deep links?** Use verified App Links/Universal Links, validate parameters, require auth/confirmation for actions, avoid sensitive data in URLs.\n\n**Q10. How do you handle third-party package risk?** Vetting, version pinning, vulnerability scanning, minimal permissions, code review of native parts, update policies.\n"}, {"n": 26, "file": "26-build-release-cicd.md", "title": "Chapter 26 — Flavors, Signing, Building, Store Release, CI/CD & Code Push", "subtitle": "Flavors, Signing, Building, Store Release, CI/CD & Code Push", "short": "Build, Release & CI/CD", "sub": "Flavors, signing, stores, pipelines", "level": "intermediate", "minutes": 10, "qa": 10, "md": "# Chapter 26 — Flavors, Signing, Building, Store Release, CI/CD & Code Push\n\n> **Goal:** Ship confidently: multiple environments, correct signing, automated pipelines, store submissions, staged rollouts and hotfix strategies. Every company job includes this; many juniors have never done it — knowing it makes you stand out.\n\n---\n\n## 26.1 Flavors (build variants) 🍦\n\n**5-year-old:** Same ice cream machine, different flavours: **dev** (testing server, orange icon), **staging** (pre-production), **prod** (real users). Each can be installed side-by-side on the same phone.\n\n### Android (productFlavors) — `android/app/build.gradle.kts`\n```kotlin\nandroid {\n    flavorDimensions += \"env\"\n    productFlavors {\n        create(\"dev\") {\n            dimension = \"env\"\n            applicationIdSuffix = \".dev\"\n            versionNameSuffix = \"-dev\"\n            resValue(\"string\", \"app_name\", \"MyApp Dev\")\n        }\n        create(\"staging\") {\n            dimension = \"env\"\n            applicationIdSuffix = \".stg\"\n            resValue(\"string\", \"app_name\", \"MyApp Staging\")\n        }\n        create(\"prod\") {\n            dimension = \"env\"\n            resValue(\"string\", \"app_name\", \"MyApp\")\n        }\n    }\n}\n```\nAndroidManifest: `android:label=\"@string/app_name\"`. Per-flavor resources/configs: `android/app/src/dev/res/...`, `android/app/src/dev/google-services.json`.\n\n### iOS (schemes + build configurations)\n* Duplicate build configurations: `Debug-dev`, `Release-dev`, `Debug-prod`, `Release-prod`, (+ `Profile-*`).\n* Create schemes named exactly like the flavor (`dev`, `prod`) using those configurations.\n* Per-config settings: `PRODUCT_BUNDLE_IDENTIFIER`, display name (`FLUTTER_APP_NAME` user-defined setting referenced in Info.plist `CFBundleDisplayName`), app icon set, `GoogleService-Info.plist` copied by a Run Script phase based on `${CONFIGURATION}`.\n* Recent Flutter versions can also read flavor-specific settings and support `flavors` declared in pubspec for assets (`flavors:` under an asset entry → asset only bundled in that flavor).\n\n### Dart side\n```bash\nflutter run --flavor dev -t lib/main_dev.dart --dart-define-from-file=env/dev.json\nflutter build appbundle --flavor prod -t lib/main_prod.dart --dart-define-from-file=env/prod.json\n```\n```dart\n// lib/main_dev.dart\nvoid main() => bootstrap(AppConfig.dev());\n// Or read flavor at runtime: appFlavor (from package:flutter/services.dart, Flutter 3.13+)\nimport 'package:flutter/services.dart';\nfinal flavor = appFlavor; // 'dev' | 'staging' | 'prod' | null\n```\nTools: **`flutter_flavorizr`** generates all this native setup; `very_good_cli` templates include flavors.\n\n---\n\n## 26.2 Versioning\n`pubspec.yaml`: `version: 2.4.1+241` → versionName/CFBundleShortVersionString `2.4.1`, versionCode/CFBundleVersion `241`.\n* Build number must **increase** for every store upload (Play rejects duplicates; App Store requires higher build per version).\n* Override in CI: `flutter build appbundle --build-name=2.4.1 --build-number=$GITHUB_RUN_NUMBER`.\n* Semantic versioning for user-facing versions; tag releases in git (`v2.4.1`); CHANGELOG.\n* Force-update policy: minimum supported version via remote config (Chapter 18).\n\n---\n\n## 26.3 Android signing & release\n\n1. Create an **upload keystore** (once; back it up securely — losing it is painful, though Play App Signing allows upload key reset):\n```bash\nkeytool -genkey -v -keystore ~/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload\n```\n2. `android/key.properties` (**never commit**; add to .gitignore):\n```\nstorePassword=...\nkeyPassword=...\nkeyAlias=upload\nstoreFile=/Users/me/upload-keystore.jks\n```\n3. `build.gradle.kts`:\n```kotlin\nimport java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties().apply {\n    val f = rootProject.file(\"key.properties\")\n    if (f.exists()) load(FileInputStream(f))\n}\nandroid {\n    signingConfigs {\n        create(\"release\") {\n            keyAlias = keystoreProperties[\"keyAlias\"] as String?\n            keyPassword = keystoreProperties[\"keyPassword\"] as String?\n            storeFile = (keystoreProperties[\"storeFile\"] as String?)?.let { file(it) }\n            storePassword = keystoreProperties[\"storePassword\"] as String?\n        }\n    }\n    buildTypes {\n        getByName(\"release\") { signingConfig = signingConfigs.getByName(\"release\") }\n    }\n}\n```\n4. Build: `flutter build appbundle --release --obfuscate --split-debug-info=build/symbols`.\n5. **Play App Signing** (mandatory for new apps with AAB): Google holds the **app signing key**; you sign uploads with your **upload key**. ⚠️ SHA fingerprints for Firebase/Google Sign-In/App Links must include the **app signing key** fingerprint from Play Console (common bug: works from local build, fails from Play Store).\n6. Play Console: internal testing → closed → open → production; **staged rollout** (e.g., 5% → 20% → 50% → 100%), halt rollout if crash spikes. New personal developer accounts must run a closed test with testers for a period before production access (Play policy introduced in 2023 — check current requirements).\n7. Requirements: target API level policy (recent), Data safety form, content rating, privacy policy URL, app access instructions for reviewers (test account), 64-bit (Flutter provides arm64-v8a), 16 KB memory page size support for apps targeting Android 15+ (Flutter engine supports it in recent versions; check native libs of plugins).\n\n---\n\n## 26.4 iOS signing & release\n* Apple Developer Program membership.\n* **Certificates** (Apple Development / Apple Distribution), **App IDs** (bundle identifier + capabilities), **Provisioning profiles** (Development, Ad Hoc, App Store), devices (for dev/ad hoc).\n* Xcode \"Automatically manage signing\" for small teams; **fastlane match** (certs/profiles in encrypted git/S3) for teams & CI.\n* Build: `flutter build ipa --release --obfuscate --split-debug-info=build/symbols --export-options-plist=ios/ExportOptions.plist` → `.ipa` in `build/ios/ipa`.\n* Upload: Xcode Organizer, **Transporter** app, `xcrun altool`/`notarytool` (altool upload deprecated → use Transporter / App Store Connect API via fastlane `pilot`/`deliver`).\n* **TestFlight** for internal (no review) and external testers (beta review).\n* App Store review guidelines pitfalls: crashes, incomplete features/placeholder content, missing account deletion, login required without demo account, Sign in with Apple requirement (4.8), IAP rules (3.1.1), misleading metadata, missing privacy usage strings, private API use, privacy manifest/required reason API declarations, minimum functionality (4.2) — \"app is just a website\".\n* **Phased release** (7-day automatic rollout, pausable), expedited review for critical fixes.\n* Export compliance (encryption): `ITSAppUsesNonExemptEncryption` = NO in Info.plist if you only use standard HTTPS.\n\n---\n\n## 26.5 Web & desktop distribution\n* Web: `flutter build web --release` (add `--wasm` for WebAssembly) → deploy `build/web` to Firebase Hosting, Netlify, Vercel, S3+CloudFront, GitHub Pages; set `--base-href` for subpaths; configure SPA rewrites; caching headers (service worker behaviour: Flutter's default service worker was deprecated — use standard HTTP caching / your own PWA strategy); PWA manifest.\n* Windows: `flutter build windows` → MSIX (`msix` package) for Microsoft Store or installer (Inno Setup).\n* macOS: `flutter build macos` → sign + **notarize** (Developer ID) for outside-App-Store distribution, or Mac App Store with sandbox entitlements.\n* Linux: Snap (`snapcraft`), Flatpak, AppImage, .deb.\n\n---\n\n## 26.6 CI/CD 🤖\n\n### Pipeline stages (typical)\n1. **Setup**: checkout, Flutter version (from `.fvmrc`/pinned), cache pub & Gradle & CocoaPods.\n2. **Static checks**: `dart format --output=none --set-exit-if-changed .`, `flutter analyze`, custom lints, codegen check (`build_runner` → `git diff --exit-code` to ensure generated files committed if your team commits them).\n3. **Tests**: `flutter test --coverage` (+ goldens), upload coverage.\n4. **Build**: debug/profile APKs for QA on PRs; release builds on main/tags.\n5. **Integration tests**: emulators in CI or Firebase Test Lab/BrowserStack.\n6. **Distribution**: Firebase App Distribution / TestFlight / Play internal track.\n7. **Release**: tag-triggered production builds, upload to stores (fastlane), changelog, symbols upload (Crashlytics/Sentry), notify Slack.\n\n### GitHub Actions example\n```yaml\nname: CI\non:\n  pull_request:\n  push:\n    branches: [main]\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: subosito/flutter-action@v2\n        with:\n          channel: stable\n          flutter-version-file: pubspec.yaml   # or a fixed version / .fvmrc\n          cache: true\n      - run: flutter pub get\n      - run: dart format --output=none --set-exit-if-changed .\n      - run: flutter analyze\n      - run: flutter test --coverage\n      - uses: codecov/codecov-action@v4\n        with: { files: coverage/lcov.info }\n\n  build-android:\n    needs: test\n    if: github.ref == 'refs/heads/main'\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-java@v4\n        with: { distribution: temurin, java-version: '17' }\n      - uses: subosito/flutter-action@v2\n        with: { channel: stable, cache: true }\n      - name: Decode keystore\n        run: echo \"${{ secrets.ANDROID_KEYSTORE_BASE64 }}\" | base64 -d > android/app/upload-keystore.jks\n      - name: key.properties\n        run: |\n          cat > android/key.properties \u003c\u003cEOF\n          storePassword=${{ secrets.KEYSTORE_PASSWORD }}\n          keyPassword=${{ secrets.KEY_PASSWORD }}\n          keyAlias=upload\n          storeFile=upload-keystore.jks\n          EOF\n      - run: flutter build appbundle --flavor prod -t lib/main_prod.dart --build-number=${{ github.run_number }} --obfuscate --split-debug-info=build/symbols\n      - uses: actions/upload-artifact@v4\n        with: { name: aab, path: build/app/outputs/bundle/prodRelease/app-prod-release.aab }\n```\n(`storeFile` in key.properties is resolved relative to the `android/app` module when using `file(...)` in the app's build script.)\n\niOS builds need **macOS runners** (`runs-on: macos-latest`), certificates/profiles via fastlane match or App Store Connect API keys, `flutter build ipa`.\n\n### Other CI/CD platforms\n* **Codemagic** (Flutter-focused, by Nevercode) — easy iOS signing, workflows in `codemagic.yaml`, M-series Macs.\n* **Bitrise**, **GitLab CI**, **Azure DevOps**, **CircleCI**, **Jenkins**, **Xcode Cloud** (iOS), **Appcircle**.\n* **fastlane** — automation lanes: `match` (signing), `gym` (build), `pilot` (TestFlight), `deliver` (App Store metadata/screenshots), `supply` (Play upload), `increment_build_number`.\n\n---\n\n## 26.7 Code push / over-the-air (OTA) updates\n* **Shorebird** — code push for Flutter (by former Flutter team lead Eric Seidel's company): `shorebird release android`, then `shorebird patch android` ships **Dart-only** changes directly to users without store review. Native code/assets changes still need a store release. Patches are applied on next app launch. Store policy: Apple allows interpreted code updates that don't change the app's primary purpose (guideline 3.3.2/2.5.2 nuance) — Shorebird positions itself as compliant; follow their guidance.\n* Server-driven UI (SDUI) is an alternative for dynamic screens (JSON-defined layouts: `rfw` package from Flutter team — Remote Flutter Widgets, `json_dynamic_widget`, `mirai`/`stac`).\n\n---\n\n## 26.8 Release management best practices (organisational)\n* **Release train**: regular cadence (e.g., every 2 weeks) with code freeze, release branch, QA regression, staged rollout.\n* **Git flow / trunk-based** with short-lived feature branches + feature flags (preferred for fast teams).\n* Release checklist: version bump, changelog, translations complete, analytics events verified, crash-free rate of beta, performance checks, store metadata/screenshots, privacy forms updated for new SDKs, backend compatibility (old app versions must keep working with new APIs — **API versioning**!).\n* Monitor after release: crash-free users (target ≥ 99.5–99.9%), ANRs, key funnels, reviews.\n* Rollback strategy: mobile can't roll back binaries → halt rollout, kill switches, hotfix, code push.\n* Keep old versions working: backward-compatible APIs, minimum version enforcement as last resort.\n\n---\n\n## 26.9 Common release problems\n| Problem | Fix |\n|---|---|\n| Release build crashes on startup | Check logs; R8 rules; missing permissions; obfuscation-sensitive code |\n| Google Sign-In fails only from Play Store | Add Play App Signing SHA-1/SHA-256 to Firebase/Google Cloud |\n| App Links don't verify after Play release | assetlinks.json needs Play signing key fingerprint |\n| \"You uploaded an APK or Android App Bundle that was signed in debug mode\" | Configure release signing |\n| \"Version code X has already been used\" | Increase build number |\n| iOS upload: \"Missing required icon / Invalid bundle\" | Provide all icon sizes (1024×1024 marketing icon without alpha), correct Info.plist |\n| ITMS-90683 Missing purpose string | Add usage description for each permission API referenced (even by SDKs) |\n| Crash reports unreadable | Upload obfuscation symbols & dSYMs |\n| Large AAB/IPA | Chapter 23 app size |\n| Users stuck on old version with broken API | Force update mechanism, API versioning |\n\n---\n\n## 26.10 Interview Questions — Release & CI/CD\n\n**Q1. What are flavors and how do you set them up?** Build variants for environments: Android productFlavors, iOS schemes/configurations, Dart entrypoints/dart-defines; separate app IDs, names, icons, Firebase configs.\n\n**Q2. How do you sign an Android app?** Generate an upload keystore, configure key.properties and signingConfigs (kept secret), build an AAB; Play App Signing re-signs with the app signing key.\n\n**Q3. APK vs AAB?** AAB is a publishing format; Play generates optimized APKs per device (ABI, density, language) → smaller downloads; required for new Play apps.\n\n**Q4. How do you release to the App Store?** Configure signing (certificates/profiles), build ipa, upload via Transporter/fastlane, TestFlight, submit for review with metadata, phased release.\n\n**Q5. What does your CI pipeline look like?** Format, analyze, test (+coverage/goldens), build, integration tests, distribute to testers, release on tags with symbol upload; secrets stored securely; pinned Flutter version.\n\n**Q6. What is staged rollout and why use it?** Releasing to a percentage of users first to catch issues; halt if crash metrics spike.\n\n**Q7. How do you handle a critical production bug quickly?** Halt rollout, kill switch/feature flag, hotfix with expedited review, code push for Dart-only fixes where allowed, communicate, postmortem.\n\n**Q8. What is obfuscation's impact on crash reporting?** Stack traces are obfuscated; upload split debug info symbols to symbolize.\n\n**Q9. What is Shorebird?** A code push solution for Flutter allowing Dart code patches to be delivered without store releases.\n\n**Q10. How do you manage different API endpoints per environment?** Flavors + dart-define-from-file/AppConfig injected at bootstrap; never hard-code per build manually.\n"}, {"n": 27, "file": "27-web-desktop-and-beyond.md", "title": "Chapter 27 — Flutter Web, Desktop, Embedded, TV, Wearables, Games & AI Features", "subtitle": "Flutter Web, Desktop, Embedded, TV, Wearables, Games & AI Features", "short": "Web, Desktop & Beyond", "sub": "Renderers, desktop UX, games, AI", "level": "intermediate", "minutes": 5, "qa": 6, "md": "# Chapter 27 — Flutter Web, Desktop, Embedded, TV, Wearables, Games & AI Features\n\n> **Goal:** Know what's different when targeting platforms beyond phones, so you can make good decisions and answer \"Should we use Flutter for our web app/desktop app?\".\n\n---\n\n## 27.1 Flutter Web 🌐\n\n### What it's good for\n✅ Web **apps**: dashboards, admin panels, internal tools, PWAs, interactive editors, companion web versions of mobile apps, embedding Flutter widgets in existing sites.\n❌ Content-heavy/SEO-critical sites (blogs, marketing pages, e-commerce landing pages) — Flutter renders to canvas; use HTML-first frameworks (or a hybrid: marketing site in HTML + app in Flutter).\n\n### Renderers & builds (recap)\n* `flutter build web` → JS (dart2js) + **CanvasKit** (Skia in Wasm).\n* `flutter build web --wasm` → **dart2wasm** (WasmGC) + **skwasm**, with automatic fallback to JS/CanvasKit in browsers without WasmGC support. Packages must use `dart:js_interop`/`package:web` (not `dart:html`) to be Wasm-compatible.\n* The HTML renderer has been removed.\n\n### Key web topics\n* **URL strategy** (`usePathUrlStrategy()`), server rewrites to index.html.\n* **Initial load size** (main.dart.js / wasm + CanvasKit): use deferred imports (`deferred as`) for code splitting, compress assets, CDN, caching headers; show an HTML loading indicator in `index.html` while Flutter boots (customize via `flutter_bootstrap.js` and `_flutter.loader.load({ onEntrypointLoaded })`).\n* **SEO**: limited; set `\u003ctitle>`/meta in index.html; semantics tree can expose text; consider prerendered static pages for marketing.\n* **Text selection & copy**: `SelectionArea`.\n* **Browser features**: right-click context menus (`BrowserContextMenu.disableContextMenu()` if you implement your own), keyboard shortcuts, mouse hover (`MouseRegion`), scrollbars, tab focus traversal.\n* **CORS** (Chapter 16), cookies/auth (httpOnly cookies with backend sessions are often safer than tokens in localStorage).\n* **Platform channels** don't exist on web in the same way; plugins provide web implementations in Dart/JS.\n* `dart:io` unavailable → conditional imports.\n* **Embedding**: Flutter can render into a specific `\u003cdiv>` (multi-view embedding: `hostElement`) inside an existing React/Angular app.\n* **Hot reload on web**: supported in recent versions (stable/default around 3.35+).\n* Accessibility: semantics must be enabled (button or `SemanticsBinding.instance.ensureSemantics()`).\n* Testing: `flutter test --platform chrome`, integration tests with `flutter drive -d chrome`.\n\n---\n\n## 27.2 Desktop (Windows, macOS, Linux) 🖥️\n\n### Desktop UX differences (adaptive design!)\n* Mouse + keyboard: hover states, cursors, right-click menus (`ContextMenuController`/`MenuAnchor`), keyboard shortcuts (`Shortcuts`/`Actions`), Tab focus traversal, scroll wheel/trackpad.\n* Window management: resizing (responsive layouts!), min sizes, title bars, multiple windows (multi-window support is in development — previewed around Flutter 3.44 with Canonical leading; community `desktop_multi_window`), `window_manager` package (size, position, always on top, hide on close), system tray (`tray_manager`/`system_tray`), native menus (`PlatformMenuBar` on macOS).\n* Native file dialogs: `file_selector` (official), `file_picker`.\n* Denser layouts (`VisualDensity.compact`), larger screens → master-detail.\n* Desktop distribution & signing (Chapter 26), auto-update (Sparkle on macOS via `auto_updater`, MSIX updates).\n* macOS sandbox entitlements: network client/server, file access (`com.apple.security.files.user-selected.read-write`).\n* Exit handling: `AppLifecycleListener.onExitRequested` to confirm unsaved work.\n* Rendering: Impeller becoming default on desktop in recent releases (3.47 per release notes).\n\n---\n\n## 27.3 Embedded, automotive & TV\n* **Custom embedders** using the Flutter Embedder API (C): Toyota (infotainment), BMW (iX app UI), Sony, LG webOS TVs (LG announced Flutter support), Raspberry Pi kiosks (`flutter-pi`), **Sony's/Toyota's `flutter-elinux`/ivi-homescreen** (embedded Linux).\n* **Android TV / Google TV**: D-pad focus navigation (`Focus`, `FocusTraversalGroup`, visible focus highlights), leanback launcher intent-filter, 10-foot UI.\n* **Apple TV (tvOS)**: not officially supported (community efforts).\n\n---\n\n## 27.4 Wearables\n* **Wear OS**: Flutter apps run (round screens: `wear_plus`/`wearable_rotary`, ambient mode); resource constraints.\n* **watchOS**: not supported natively — build a native SwiftUI watch app and communicate via `WatchConnectivity` (plugins like `watch_connectivity`).\n\n---\n\n## 27.5 Home screen widgets, App Clips, Live Activities, extensions\n* Home screen widgets (Android AppWidgets / iOS WidgetKit) must be **native UI**; share data via `home_widget` (App Groups on iOS, SharedPreferences on Android); can render Flutter widgets to images for display.\n* iOS **Live Activities / Dynamic Island**: native (ActivityKit) with data from Flutter via plugins (`live_activities`).\n* **App Clips** (iOS) / **Instant Apps** (Android) have size limits; Flutter is possible but challenging (size).\n* Share extensions, notification service extensions, keyboard extensions — native targets; sharing code/data with App Groups.\n\n---\n\n## 27.6 Games 🎮\n* **Flame** engine: game loop, sprites, animations, collision detection, input, effects, Forge2D (Box2D physics), Tiled maps, audio (`flame_audio`). Example: Google's I/O Pinball, \"Super Dash\" demo.\n* Flutter **Casual Games Toolkit** (ads, IAP, games services, Firebase).\n* `flutter_gpu` (experimental low-level GPU API) and fragment shaders for custom rendering.\n* For 3D/heavy games, Unity/Unreal/Godot remain better choices.\n\n---\n\n## 27.7 AI features in Flutter apps (2025–2026 landscape) 🤖\n* **Firebase AI Logic** (`firebase_ai`, formerly Vertex AI in Firebase) — call Gemini models from the app with App Check protection (don't embed raw API keys).\n* `google_generative_ai` Dart SDK was deprecated in favour of Firebase AI Logic.\n* **Flutter AI Toolkit** (`flutter_ai_toolkit`) — ready-made chat UI widgets (LlmChatView) with pluggable providers.\n* On-device ML: ML Kit (`google_mlkit_*` — text recognition, barcode, face detection, translation), TensorFlow Lite / LiteRT (`tflite_flutter`), MediaPipe; on-device LLMs (Gemini Nano via Android AICore — platform-specific; `flutter_gemma` community package).\n* Streaming responses (SSE/streams) → `StreamBuilder`/incremental text rendering; markdown rendering (`flutter_markdown_plus`/`gpt_markdown`).\n* Developer tooling: **Dart & Flutter MCP server** (lets AI coding assistants introspect your running app, analyze errors, search pub.dev), Gemini in Android Studio, AI rules files for Flutter.\n* Responsible AI: rate limit, moderate content, don't send PII without consent, cost control via backend proxies.\n\n---\n\n## 27.8 Interview Questions — Beyond mobile\n\n**Q1. Is Flutter web good for SEO?** Not by default — canvas rendering; use for apps, not content sites; add metadata/prerendering if needed.\n\n**Q2. CanvasKit vs skwasm?** CanvasKit: Skia compiled to Wasm used with JS builds; skwasm: used with Wasm (dart2wasm) builds — faster and can use multiple threads; falls back to CanvasKit when unsupported.\n\n**Q3. How do you reduce Flutter web load time?** Deferred loading, Wasm build, asset optimization, caching/CDN, loading indicator, tree shaking, avoid huge packages.\n\n**Q4. What changes when targeting desktop?** Mouse/keyboard interactions, window management, menus, file dialogs, responsive dense layouts, platform signing/distribution.\n\n**Q5. Can Flutter build watchOS/home screen widgets?** Not directly; use native code with data sharing (WatchConnectivity, App Groups, home_widget).\n\n**Q6. How would you add AI chat to a Flutter app?** Backend-proxied or Firebase AI Logic (App Check) LLM calls, streaming responses into UI, flutter_ai_toolkit or custom chat UI, safety & cost controls.\n"}, {"n": 28, "file": "28-organisational-best-practices.md", "title": "Chapter 28 — Working on a Big Flutter Project in a Company: Standards, Code Review, Git, Upgrades, Collaboration & Playbooks", "subtitle": "Working on a Big Flutter Project in a Company: Standards, Code Review, Git, Upgrades, Collaboration & Playbooks", "short": "Working in a Company", "sub": "Standards, reviews, upgrades, playbooks", "level": "advanced", "minutes": 8, "qa": 7, "md": "# Chapter 28 — Working on a Big Flutter Project in a Company: Standards, Code Review, Git, Upgrades, Collaboration & Playbooks\n\n> **Goal:** Behave like an experienced engineer on day one: follow conventions, write reviewable code, handle upgrades and dependencies safely, collaborate with design/backend/QA/product, and know what to do in common team situations.\n\n---\n\n## 28.1 Your first weeks on an existing Flutter codebase 🗺️\n1. **Run it**: follow README; note every undocumented step and fix the README (great first PR).\n2. **Identify the stack**: Flutter version (`.fvmrc`/CI), state management, router, DI, networking, storage, architecture style, codegen tools, flavors, CI.\n3. **Read the core**: `main*.dart`/bootstrap, router, DI setup, network client & interceptors, error handling, theme/design system, one complete feature end to end (UI → state → repository → API).\n4. **Read the conventions**: `analysis_options.yaml`, CONTRIBUTING, PR template, ADRs, folder structure.\n5. **Run the tests**; look at CI config.\n6. **Ask** about release process, environments, test accounts, feature flags, monitoring dashboards.\n7. **Ship something small** (bug fix) to learn the full workflow.\n\n**Golden rule:** *Consistency beats personal preference.* Follow the existing patterns even if you'd choose differently; propose changes through discussion/ADR, not by mixing styles.\n\n---\n\n## 28.2 Coding standards checklist ✅\n* `dart format` (CI enforced); lints (flutter_lints / very_good_analysis) with zero warnings.\n* Naming: files `snake_case.dart`; classes `UpperCamelCase`; private widgets `_Foo` in same file when small.\n* One public widget per file (generally); files \u003c ~300–400 lines; extract widgets.\n* `const` constructors; `final` fields; immutable models (freezed/equatable/records).\n* No hard-coded strings (l10n), colours (theme), magic numbers (spacing tokens), URLs (config).\n* No `print` (logger); no `dynamic` unless JSON/interop; no `!` unless proven safe; no empty `catch`.\n* Dispose everything you create; cancel subscriptions; check `mounted`/`context.mounted` after awaits.\n* Business logic out of widgets; widgets small & declarative.\n* Imports: package imports (or relative — be consistent); no importing other features' internals.\n* Public APIs documented with `///`.\n* Tests for logic and critical UI; regression test for each bug fix.\n* Accessibility: semantic labels, tap targets, text scaling.\n* Feature flags for risky changes.\n\n---\n\n## 28.3 Git workflow & pull requests\n* Branch naming: `feature/ABC-123-cart-coupons`, `fix/ABC-456-crash-on-logout`.\n* Commits: small, meaningful; Conventional Commits (`feat:`, `fix:`, `refactor:`, `test:`, `chore:`) if the team uses them (enables automated changelogs).\n* **PR size**: small (\u003c ~400 lines changed of real code); split refactors from features.\n* PR description: what & why, screenshots/videos for UI (light/dark, small/large screens), test steps, risks, linked ticket, migration notes.\n* Generated files: follow team policy (commit `*.g.dart` or generate in CI) — consistency matters.\n* Rebase/merge per team policy; keep main green; protected branches; required checks & reviews; CODEOWNERS for modules.\n\n### Code review checklist (as reviewer and author) 👀\n**Correctness**: Does it meet requirements? Edge cases (empty, error, loading, offline, long text, RTL, large fonts, slow network)? Null safety? Async races (double taps, out-of-order responses, setState after dispose)?\n**Architecture**: Logic in right layer? Follows existing patterns? No new state management style sneaking in? Dependencies injected?\n**Performance**: Unnecessary rebuilds? Heavy work in build? Lists lazy? Images sized? Leaks (dispose/cancel)?\n**UI/UX**: Matches design (spacing tokens, typography, colours), responsive, accessible, dark mode, localization.\n**Security/Privacy**: No secrets, no PII in logs, secure storage, input validation.\n**Tests**: Present & meaningful; not brittle.\n**Readability**: Names, small functions/widgets, comments for \"why\".\n**Release**: Feature flagged? Analytics events? Backward compatible with APIs/older app versions? Migration for stored data?\nTone: be kind, specific, explain why, distinguish blocking issues vs nits (\"nit:\"), praise good work.\n\n---\n\n## 28.4 Dependency management policy\n* Approval process for new dependencies (Chapter 2 checklist), documented in an ADR for big ones.\n* Wrap third-party SDKs behind your own interfaces (analytics, crash reporting, payments, maps) → swap/mocking easy.\n* Regular update cadence (e.g., monthly `flutter pub outdated` review; Renovate/Dependabot PRs); read changelogs for breaking changes; update one major at a time with tests.\n* Avoid `dependency_overrides` in main branch without ticket & comment.\n* Monitor abandoned packages; plan replacements early.\n* License compliance (`flutter pub deps`, license checker; `LicenseRegistry`/`showLicensePage` for in-app attributions).\n\n---\n\n## 28.5 Flutter SDK upgrade playbook ⬆️\nFlutter stable ships roughly quarterly; staying ≤ 1–2 versions behind keeps upgrades small.\n1. Read the release notes & **breaking changes** page for every version you skip.\n2. Create an upgrade branch; bump `.fvmrc`/CI version.\n3. `flutter pub upgrade` (and needed major bumps); `dart fix --apply`.\n4. Update Android toolchain if warned (Gradle, AGP, Kotlin, compileSdk/targetSdk, Java version); iOS (min deployment target, CocoaPods/SwiftPM, Xcode version).\n5. Fix analyzer deprecations (e.g., `withOpacity` → `withValues`, `WillPopScope` → `PopScope`, `MaterialState` → `WidgetState`, `textScaleFactor` → `textScaler`, Material/Cupertino package migration).\n6. Run full tests, goldens (expect diffs from framework visual changes — review carefully), integration tests on real devices.\n7. Smoke test critical flows on Android/iOS (and web/desktop if shipped); release via internal track first.\n8. Document notable changes for the team.\n\n---\n\n## 28.6 Collaborating with other roles 🤝\n**Designers**\n* Use Figma tokens → theme/ThemeExtension; agree on spacing scale, typography, components; request states (loading/empty/error/disabled/focus), dark mode, RTL, large text, tablet layouts.\n* Clarify platform adaptation (Material vs Cupertino behaviours).\n* Widgetbook/golden tests as shared component catalog.\n\n**Backend**\n* API contracts first (OpenAPI/GraphQL schema), generated clients, mock servers for parallel development.\n* Agree on error format (codes + messages), pagination style (cursor), date formats (ISO 8601 UTC), versioning, idempotency keys, rate limits, auth flows (token lifetimes, refresh).\n* Backward compatibility: old app versions in the wild for months — never break existing endpoints without versioning; feature flags server-side.\n\n**QA**\n* Testable builds per PR (Firebase App Distribution), test accounts, feature flag toggles in debug menus, environment switcher (dev builds only), stable keys/semantics for automation, reproducible bug reports (steps, device, logs, video).\n\n**Product/PM**\n* Estimate with buffers for platform specifics (permissions, store review, native SDKs), clarify acceptance criteria incl. edge cases & analytics; release timelines vs store review times; communicate risk early.\n\n---\n\n## 28.7 Debug menu (hidden developer tools) — common in companies\nInclude in non-prod builds: environment switcher, feature flag overrides, network logs viewer (e.g., `chucker_flutter`, `alice`), crash test button, clear data/reset onboarding, view device info/FCM token, mock locations, slow animations toggle, accessibility debugging.\n\n---\n\n## 28.8 Documentation\n* README (setup, run, flavors, test, release), CONTRIBUTING (conventions), ARCHITECTURE.md (layers, folders, diagrams), ADRs (`docs/adr/0001-use-riverpod.md`: context, decision, consequences), API docs (`dart doc`), runbooks (release, incident response), onboarding guide.\n\n---\n\n## 28.9 Technical debt management\n* Track debt explicitly (tickets with impact), allocate % of each sprint, boy-scout rule (leave code better), refactor behind tests, strangler pattern for legacy modules (e.g., migrate GetX features to Bloc one by one), deprecate internal APIs with `@Deprecated('Use X')`.\n\n---\n\n## 28.10 Situational playbook (what to do when…) 📘\n\n| Situation | Action |\n|---|---|\n| You disagree with the architecture | Raise with data in an RFC/ADR; propose incremental path; respect team decision; don't fork patterns silently |\n| Deadline is impossible | Communicate early with options (scope cut, phased release, feature flag), not silent overtime with hacks |\n| A teammate's PR introduces a bug in prod | Blameless: fix forward, add tests/process improvements, postmortem focusing on systems |\n| You must use an unfamiliar native SDK | Spike/prototype in a separate branch; Pigeon-based plugin wrapper; document; estimate with buffer |\n| Store rejection | Read the guideline cited; reply in Resolution Center with clarifications or fix; keep demo accounts ready; appeal if wrong |\n| Huge widget file (2,000 lines) | Refactor incrementally: extract widgets, move logic into state layer, add tests first |\n| Flaky CI tests | Quarantine with ticket, fix root cause (timing, shared state), never just retry forever |\n| Release day crash spike | Halt rollout, flag off, hotfix, communicate (Chapter 24 §24.8) |\n| Inconsistent state management across modules | Pick standard via ADR, document migration path, migrate opportunistically |\n| Junior asks for help | Pair program, explain why, point to docs/chapters, review kindly |\n| Need to estimate a feature | Break down: UI screens, states, API integration, edge cases, tests, platform specifics, analytics, l10n, accessibility, review/QA/store time |\n| Security issue found | Follow responsible disclosure internally, hotfix, rotate secrets, notify per policy |\n\n---\n\n## 28.11 Agile & delivery basics (interview behavioural readiness)\n* Scrum (sprints, standups, planning, review, retro) / Kanban; story points; Definition of Done (code + tests + review + docs + analytics + accessibility + l10n + QA).\n* Communicate blockers early; demo progress; write clear tickets (context, acceptance criteria, designs, API).\n\n---\n\n## 28.12 Interview Questions — Professional practice\n\n**Q1. How do you ensure code quality in a team?** Lints & formatting in CI, code reviews with checklist, tests, architecture conventions & ADRs, pair programming, static analysis, definition of done.\n\n**Q2. How do you handle Flutter upgrades in a large project?** Scheduled upgrades, read breaking changes, branch, dart fix, toolchain updates, full test suites & device testing, staged rollout.\n\n**Q3. How do you decide whether to add a package?** Maintenance, popularity, publisher, platform support, license, size, native permissions, alternatives, ability to wrap/replace.\n\n**Q4. How do you work with backend teams?** Contract-first APIs, generated clients, mock servers, agreed error/pagination/versioning formats, backward compatibility.\n\n**Q5. Tell me about a challenging bug you fixed.** Use STAR (Situation, Task, Action, Result): describe symptoms, investigation tools (DevTools, logs), root cause, fix, prevention (tests/monitoring).\n\n**Q6. How do you manage technical debt?** Make it visible, prioritize by impact, allocate capacity, refactor behind tests incrementally, avoid big-bang rewrites.\n\n**Q7. How do you mentor juniors?** Pairing, constructive reviews, documentation, gradual ownership, psychological safety.\n"}, {"n": 29, "file": "29-interview-questions-beginner.md", "title": "Chapter 29 — Interview Question Bank, Part 1: Freshers & Junior (0–2 years)", "subtitle": "Interview Question Bank, Part 1: Freshers & Junior (0–2 years)", "short": "Q&A: Freshers & Juniors", "sub": "130 fundamental questions", "level": "interview", "minutes": 12, "qa": 130, "md": "# Chapter 29 — Interview Question Bank, Part 1: Freshers & Junior (0–2 years)\n\n> How to use: read the question, answer **out loud** in your own words, then compare. Answers are written the way a strong candidate would say them — short first, then detail. Questions come from commonly reported company interviews (service companies, product startups, MNCs) and community question banks, updated for Dart 3 / Flutter 3.x.\n\n---\n\n## A. Flutter basics\n\n**1. What is Flutter?**\nGoogle's open-source UI toolkit for building natively compiled apps for mobile, web, desktop and embedded from a single Dart codebase. It uses its own rendering engine (Impeller/Skia) to draw every pixel, so UI is consistent across platforms.\n\n**2. What language does Flutter use and why?**\nDart — supports JIT (hot reload) and AOT (fast release code), has a GC optimised for short-lived objects, sound null safety, isolates for concurrency, and is controlled by Google, evolving with Flutter.\n\n**3. What are the advantages of Flutter?**\nSingle codebase, fast development with hot reload, expressive custom UI, near-native performance (AOT), consistent look across platforms, rich widget catalog, strong tooling (DevTools), growing ecosystem, multi-platform (mobile/web/desktop).\n\n**4. Disadvantages?**\nLarger app size, non-native widgets need emulation of platform look, web not SEO-friendly, some platform features need native code/plugins, plugin quality varies.\n\n**5. What is a widget?**\nAn immutable description of part of the UI. Everything in Flutter UI is built from widgets — layout, styling, gestures, even the app.\n\n**6. Stateless vs Stateful widget?**\nStateless: no mutable state, rebuilds only when parent/inherited data changes. Stateful: has a `State` object that persists across rebuilds and can call `setState` to update UI.\n\n**7. When would you use a StatelessWidget?**\nWhen the UI depends only on constructor parameters/inherited widgets — e.g., a label, an icon button that receives a callback, a product card receiving a product.\n\n**8. What is `setState`?**\nA method on `State` that runs a callback and marks the widget dirty so it rebuilds in the next frame.\n\n**9. What is the `build` method?**\nReturns the widget tree describing the UI for the current state; called often, so it must be fast and side-effect free.\n\n**10. What is `BuildContext`?**\nA reference to the widget's location in the tree (the Element), used to find ancestors like Theme, MediaQuery, Navigator.\n\n**11. What is hot reload? Hot restart?**\nHot reload injects code changes into the running app and rebuilds UI while preserving state. Hot restart restarts the app's Dart code from `main()`, losing state.\n\n**12. What is `main()` and `runApp()`?**\n`main()` is the Dart entry point; `runApp()` inflates the root widget and attaches it to the screen.\n\n**13. What is `MaterialApp`?**\nA convenience widget that sets up Material design: theme, navigation (Navigator), localization, MediaQuery, ScaffoldMessenger, etc.\n\n**14. What is `Scaffold`?**\nBasic Material page layout: app bar, body, floating action button, drawer, bottom navigation, snackbars/bottom sheets.\n\n**15. What is `Container`?**\nA convenience widget combining padding, margin, decoration, constraints, alignment and transform.\n\n**16. Container vs SizedBox?**\nSizedBox is lightweight, for fixed size or spacing, and const-friendly; Container is heavier and used when you need decoration/padding/etc.\n\n**17. Row vs Column?**\nRow lays children horizontally, Column vertically. Both are Flex widgets with main/cross axis alignment.\n\n**18. What is `mainAxisAlignment` and `crossAxisAlignment`?**\nAlignment along the main axis (Row: horizontal) and the perpendicular cross axis.\n\n**19. What is Expanded? Flexible?**\nExpanded makes a child fill remaining space in a Row/Column (tight). Flexible lets a child take up to its share of space but be smaller (loose).\n\n**20. What is a Stack?**\nA widget layering children on top of each other; `Positioned` places children relative to the edges.\n\n**21. What is `pubspec.yaml`?**\nProject manifest: name, version, SDK constraints, dependencies, assets, fonts.\n\n**22. How do you add a package?**\n`flutter pub add name` or add to `dependencies` in pubspec then `flutter pub get`, then import it.\n\n**23. How do you add images?**\nPut them in `assets/`, declare in pubspec under `flutter: assets:`, and use `Image.asset('assets/x.png')`.\n\n**24. How do you load a network image?**\n`Image.network(url)` (or `cached_network_image` for caching), with loading and error builders.\n\n**25. What is `ListView`?**\nA scrollable list of widgets; `ListView.builder` builds items lazily for long lists.\n\n**26. Difference between `ListView` and `ListView.builder`?**\nDefault constructor builds all children immediately; builder creates items on demand as they scroll into view.\n\n**27. What is `GridView`?**\nA scrollable 2D grid; `GridView.builder` with a grid delegate (`crossAxisCount` or `maxCrossAxisExtent`).\n\n**28. What is `SingleChildScrollView`?**\nMakes a single child scrollable (e.g., a form) — builds the whole child at once.\n\n**29. What is `TextField`? How do you read its value?**\nAn input widget; read via a `TextEditingController` (`controller.text`) or the `onChanged` callback.\n\n**30. How do you validate a form?**\nUse `Form` with a `GlobalKey\u003cFormState>`, `TextFormField` validators, and call `formKey.currentState!.validate()`.\n\n**31. How do you navigate between screens?**\n`Navigator.push(context, MaterialPageRoute(builder: (_) => NextPage()))` and `Navigator.pop(context)`; or named routes / go_router.\n\n**32. How do you pass data to another screen?**\nThrough the constructor of the next screen's widget.\n\n**33. How do you get data back from a screen?**\n`final result = await Navigator.push(...)`, and in the second screen `Navigator.pop(context, value)`.\n\n**34. What is a SnackBar and how do you show it?**\nA brief message at the bottom: `ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Hi')))`.\n\n**35. How do you show a dialog?**\n`showDialog(context: context, builder: (_) => AlertDialog(...))`.\n\n**36. What is `GestureDetector`?**\nA widget that detects gestures (tap, double tap, long press, drag, scale) on its child.\n\n**37. InkWell vs GestureDetector?**\nInkWell shows Material ripple feedback (needs a Material ancestor); GestureDetector has no visual feedback but supports more gestures.\n\n**38. What is `Theme`?**\nDefines colours, typography and component styles for the app; read via `Theme.of(context)`.\n\n**39. How do you implement dark mode?**\nProvide `theme` and `darkTheme` to MaterialApp with `themeMode: ThemeMode.system` (or user choice).\n\n**40. What is `MediaQuery`?**\nProvides screen/window info: size, padding (notch), text scale, orientation, brightness.\n\n**41. What is `SafeArea`?**\nAdds padding to avoid notches, status bars and system UI.\n\n**42. What is `Padding` and `EdgeInsets`?**\nPadding adds space around a child; EdgeInsets defines amounts (`all`, `symmetric`, `only`).\n\n**43. What is a `Key`?**\nAn identifier to preserve state of widgets when they move in the tree, e.g., list items being reordered.\n\n**44. What is the `const` keyword used for in Flutter?**\nCreates compile-time constant widgets/objects, reused across rebuilds, improving performance.\n\n**45. What is `final` vs `const`?**\nfinal: assigned once at runtime; const: compile-time constant, deeply immutable.\n\n**46. What is null safety?**\nTypes are non-nullable by default; nullable types use `?`; prevents null reference errors at compile time.\n\n**47. What are `?`, `!`, `??`, `?.` operators?**\nNullable type marker, null assertion, if-null default, null-aware member access.\n\n**48. What is `async`/`await`?**\nSyntax to write asynchronous code that waits for Futures without blocking the thread.\n\n**49. What is a Future?**\nAn object representing a value (or error) that will be available later.\n\n**50. What is a Stream?**\nA sequence of asynchronous events/values over time.\n\n**51. What is FutureBuilder?**\nA widget that builds UI based on the latest snapshot of a Future (waiting, data, error).\n\n**52. What is StreamBuilder?**\nBuilds UI from the latest value of a Stream.\n\n**53. What are packages vs plugins?**\nPackages are Dart code; plugins include platform-specific native code.\n\n**54. What is `flutter doctor`?**\nA command that checks your environment setup and lists missing dependencies.\n\n**55. What are debug, profile, release modes?**\nDebug (JIT, hot reload, slower), profile (AOT with profiling), release (AOT, optimised for users).\n\n**56. How do you build an APK / app bundle?**\n`flutter build apk --release` / `flutter build appbundle`.\n\n**57. What is the `assets` folder used for?**\nBundled files like images, fonts, JSON config.\n\n**58. What is `Material Design` and `Cupertino`?**\nGoogle's and Apple's design languages; Flutter provides widgets for both.\n\n**59. What is `AppBar`?**\nTop toolbar with title, leading and action widgets.\n\n**60. What is `BottomNavigationBar` / `NavigationBar`?**\nTab bars at the bottom for top-level navigation (NavigationBar is the Material 3 version).\n\n**61. What is `Drawer`?**\nA side panel menu opened from the edge or via the hamburger icon.\n\n**62. What is `TabBar` and `TabBarView`?**\nTabs with swipeable pages, coordinated by a TabController (often DefaultTabController).\n\n**63. What is `Icon` and where are icons from?**\nWidget for vector icons from fonts like `Icons` (Material) or `CupertinoIcons`.\n\n**64. What is `Text.rich` / `RichText`?**\nText with multiple styles via TextSpans.\n\n**65. What is `Wrap`?**\nLays children in a row/column and wraps to the next line when out of space.\n\n**66. What is `Align` / `Center`?**\nPosition a child within itself; Center is Align with center alignment.\n\n**67. What is `AspectRatio`?**\nSizes a child to a specific width:height ratio.\n\n**68. How do you make a widget clickable?**\nWrap with GestureDetector/InkWell or use a button widget.\n\n**69. How do you disable a button?**\nPass `onPressed: null`.\n\n**70. What is `CircularProgressIndicator`?**\nA spinner indicating loading.\n\n**71. What is `initState` used for?**\nOne-time initialization when the State is created: controllers, subscriptions, initial loads.\n\n**72. What is `dispose` used for?**\nCleanup: disposing controllers, cancelling subscriptions/timers.\n\n**73. What is `didChangeDependencies`?**\nCalled after initState and whenever inherited dependencies change.\n\n**74. What is `didUpdateWidget`?**\nCalled when the parent rebuilds with a new widget configuration.\n\n**75. What is the widget tree?**\nThe hierarchical structure of widgets forming the UI.\n\n**76. What is `debugShowCheckedModeBanner`?**\nMaterialApp flag to hide the \"DEBUG\" ribbon.\n\n**77. What is the difference between `Navigator.push` and `Navigator.pushReplacement`?**\npush adds on top (can go back); pushReplacement replaces current screen (can't go back to it).\n\n**78. How do you clear the navigation stack (e.g., after logout)?**\n`Navigator.pushAndRemoveUntil(context, route, (r) => false)`.\n\n**79. What is `SharedPreferences`?**\nKey-value persistent storage for small simple data like settings.\n\n**80. How do you make an HTTP request?**\nWith `http` or `dio` packages: `await http.get(Uri.parse(url))`, then `jsonDecode(response.body)`.\n\n**81. How do you parse JSON?**\n`jsonDecode` to a Map/List, then `Model.fromJson(map)` factories (manual or json_serializable).\n\n**82. What is `Visibility` widget?**\nShows/hides a child, optionally maintaining state/size.\n\n**83. What is `Opacity`?**\nMakes a child partially transparent.\n\n**84. What is `Hero` widget?**\nAnimates a shared widget between two screens.\n\n**85. What is `AnimatedContainer`?**\nA Container that animates changes to its properties automatically.\n\n**86. What is `Spacer`?**\nAn empty Expanded widget to push siblings apart in Row/Column.\n\n**87. What is `Divider`?**\nA thin horizontal line separator.\n\n**88. What is `Card`?**\nA Material panel with rounded corners and elevation.\n\n**89. What is `ListTile`?**\nA fixed-height row with leading, title, subtitle, trailing — used in lists.\n\n**90. What is `Checkbox`, `Switch`, `Radio`, `Slider`?**\nSelection controls, each with a value and `onChanged` callback.\n\n**91. What's the difference between `Image.asset` and `AssetImage`?**\nImage.asset is a widget; AssetImage is an ImageProvider (used with `Image(image:)`, `DecorationImage`, CircleAvatar).\n\n**92. What is `ClipRRect`?**\nClips a child with rounded corners.\n\n**93. What is `BoxDecoration`?**\nDefines background colour, gradient, image, border, radius and shadows for a box.\n\n**94. What is the `Flutter Inspector`?**\nDevTools tool to view the widget tree, layout, and debug UI.\n\n**95. What file is the entry point of a Flutter app?**\n`lib/main.dart` by default (configurable with `-t`).\n\n**96. How do you change the app name and icon?**\nAndroid: `android:label` in AndroidManifest + mipmap icons; iOS: `CFBundleDisplayName` in Info.plist + AppIcon; or packages like flutter_launcher_icons.\n\n**97. What is `Orientation` / how to lock orientation?**\n`SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp])` after ensureInitialized.\n\n**98. How do you get the screen width?**\n`MediaQuery.sizeOf(context).width`.\n\n**99. What is `LayoutBuilder`?**\nBuilds widgets based on parent constraints (for responsive designs).\n\n**100. What is `State management`?**\nHow app data that changes is stored, updated and reflected in the UI (setState, Provider, Riverpod, Bloc...).\n\n---\n\n## B. Dart basics (fresher level)\n\n**101. What are Dart's basic data types?** int, double, num, String, bool, List, Set, Map, Runes, Symbol, Null, Record.\n\n**102. `var` vs `dynamic`?** var infers a fixed type; dynamic disables type checking.\n\n**103. What is string interpolation?** `'Hello $name'`, `'${user.name}'`.\n\n**104. What is a List / Set / Map?** Ordered collection with duplicates / unique items / key-value pairs.\n\n**105. What are named parameters?** Parameters passed by name in `{}`; can be `required` or have defaults.\n\n**106. What are optional positional parameters?** In `[]`, optional by position.\n\n**107. What is an arrow function?** `=> expr` shorthand for a function returning one expression.\n\n**108. What is an anonymous function?** A function without a name, e.g., `(x) => x * 2`.\n\n**109. What is a class and object?** A blueprint and its instance.\n\n**110. What is a constructor? Named constructor?** Special method to create objects; named constructors give alternative creation paths (`Point.origin()`).\n\n**111. What is inheritance?** A class extending another to reuse/override behavior (`extends`).\n\n**112. What is an abstract class?** Cannot be instantiated; can declare abstract methods for subclasses.\n\n**113. What is an interface in Dart?** Every class implicitly defines an interface; use `implements`.\n\n**114. What is a mixin?** A reusable set of members added to a class with `with`.\n\n**115. What is `static`?** Class-level members not tied to instances.\n\n**116. What is an enum?** A fixed set of named values; enhanced enums can have fields and methods.\n\n**117. What is `try/catch/finally`?** Exception handling blocks.\n\n**118. What is a getter/setter?** Computed property accessors (`get`/`set`).\n\n**119. What does `_` prefix mean?** Private to the library (file).\n\n**120. What is `late`?** Non-nullable variable initialized later or lazily.\n\n**121. What is the cascade operator `..`?** Chain multiple operations on the same object.\n\n**122. What is the spread operator `...`?** Inserts elements of a collection into another.\n\n**123. What is `typedef`?** A type alias.\n\n**124. What is `assert`?** Debug-only check that throws if false.\n\n**125. What is `is` and `as`?** Type test and type cast.\n\n**126. What's `map`, `where`, `reduce`, `fold` on lists?** Transform, filter, combine (non-empty), combine with initial value.\n\n**127. What is a generic?** Type parameter allowing reusable type-safe code (`List\u003cint>`).\n\n**128. What is `toString()` override for?** Readable string representation for debugging.\n\n**129. What is `==` and `hashCode`?** Equality operator and hash used in sets/maps; override both for value equality.\n\n**130. What is `required` keyword?** Marks named parameters mandatory.\n\n---\n\n## C. Short practical tasks freshers are asked\n* Build a counter app (Chapter 1).\n* Build a login form with validation (Chapter 8).\n* Fetch and show a list of users from `https://jsonplaceholder.typicode.com/users` with loading/error states (Chapter 32 has a full solution).\n* Build a to-do list with add/delete/complete and persistence (Chapter 32).\n* Explain the output of a given layout (why overflow happens).\n* Swap two variables, reverse a string, check palindrome, find duplicates in a list, FizzBuzz in Dart (Chapter 32).\n\n## D. Tips for fresher interviews\n* Explain with small examples; draw the widget tree.\n* Mention `const`, keys, disposing controllers and `mounted` checks — shows maturity.\n* Have 1–2 personal projects on GitHub with clean code, README, screenshots, and tests.\n* Be honest about what you don't know; describe how you'd find out (docs, DevTools, experiments).\n"}, {"n": 30, "file": "30-interview-questions-intermediate.md", "title": "Chapter 30 — Interview Question Bank, Part 2: Intermediate (2–5 years)", "subtitle": "Interview Question Bank, Part 2: Intermediate (2–5 years)", "short": "Q&A: Intermediate", "sub": "100 mid-level and scenario questions", "level": "interview", "minutes": 12, "qa": 100, "md": "# Chapter 30 — Interview Question Bank, Part 2: Intermediate (2–5 years)\n\n> These are the questions that decide most mid-level interviews. Answers include the \"why\" and the trade-offs interviewers want to hear.\n\n---\n\n## A. Widgets, rendering & lifecycle\n\n**1. Explain the widget, element and render object trees.**\nWidgets are immutable configs rebuilt often; elements are long-lived instances that hold position, lifecycle and State and link widgets to render objects; render objects do layout, paint and hit testing. Flutter diffs new widgets against existing elements (`canUpdate`: same runtimeType & key) to reuse expensive objects.\n\n**2. What happens when you call setState?**\nThe callback runs synchronously; the element is marked dirty and a frame scheduled; on the next frame, dirty elements rebuild in depth order, then layout/paint/composite only what changed.\n\n**3. Full StatefulWidget lifecycle?**\ncreateState → initState → didChangeDependencies → build → (didUpdateWidget/setState/didChangeDependencies → build)* → deactivate → (activate) → dispose; reassemble on hot reload.\n\n**4. When is `didChangeDependencies` called?**\nImmediately after initState and whenever an InheritedWidget the State depends on changes (e.g., Theme, MediaQuery, Locale, Provider).\n\n**5. Why can't we call `Theme.of(context)` in initState?**\nDependencies on inherited widgets must be registered when the element is fully mounted; Flutter asserts in debug. Use didChangeDependencies.\n\n**6. When do you need keys? Give an example.**\nWhen stateful widgets of the same type are reordered/removed in a collection — e.g., a reorderable todo list with checkboxes holding local state: without keys, state stays at positions; with `ValueKey(todo.id)` it follows the item.\n\n**7. ValueKey vs ObjectKey vs UniqueKey vs GlobalKey?**\nValueKey compares value equality; ObjectKey compares identity of an object; UniqueKey is unique each instance (forces new element); GlobalKey is unique app-wide and provides access to State/context and reparenting.\n\n**8. What is InheritedWidget and how does Provider use it?**\nA widget that exposes data to descendants with O(1) lookup and notifies dependents when `updateShouldNotify` returns true. Provider wraps InheritedWidget (InheritedProvider) to simplify exposing/listening and to handle disposal.\n\n**9. Difference between `dependOnInheritedWidgetOfExactType` and `getInheritedWidgetOfExactType`?**\nThe first registers a dependency (rebuild on change); the second just reads.\n\n**10. Why are widgets immutable?**\nSimplifies diffing and reasoning; allows const canonicalization; changes are expressed by creating new widgets; mutable state lives in State/elsewhere.\n\n**11. What does the `const` constructor do at runtime for widgets?**\nInstances are canonicalized at compile time; identical instance on rebuild lets the element skip updating that subtree.\n\n**12. Explain the \"constraints go down, sizes go up\" rule with an example of an overflow fix.**\nRow gives unbounded width to non-flex children; a long Text tries to be its full width and overflows. Wrapping it in Expanded gives it a bounded width (remaining space), and `overflow: ellipsis` handles truncation.\n\n**13. What causes \"Vertical viewport was given unbounded height\"?**\nA ListView (wants infinite height) inside a Column/other scrollable (unbounded height). Fix with Expanded/SizedBox or slivers.\n\n**14. What is the difference between `MediaQuery.of(context).size` and `MediaQuery.sizeOf(context)`?**\nsizeOf subscribes only to size changes (InheritedModel aspect); `of` rebuilds on any MediaQuery change (e.g., keyboard insets).\n\n**15. What is LayoutBuilder vs MediaQuery for responsiveness?**\nLayoutBuilder gives parent constraints (component-level), MediaQuery gives window info (app-level).\n\n**16. What is a `RepaintBoundary`?**\nIsolates painting into its own layer so repaints don't propagate; useful for frequently changing subtrees.\n\n**17. What are slivers and when do you use CustomScrollView?**\nLazy scrollable building blocks with sliver protocol; CustomScrollView combines multiple slivers (app bars, lists, grids) into one scroll with effects.\n\n**18. How do you preserve state in tabs/PageView?**\nAutomaticKeepAliveClientMixin with `wantKeepAlive`, PageStorageKey, IndexedStack, or state outside widgets.\n\n**19. What is `addPostFrameCallback` and when do you use it?**\nRuns a callback after the current frame is rendered; used to show dialogs after build, measure sizes, or trigger navigation from initState safely.\n\n**20. What is the difference between `Navigator 1.0` and `2.0`?**\nImperative push/pop vs declarative page lists synced with app state & URLs (Router API).\n\n---\n\n## B. State management\n\n**21. How do you decide between setState and a state management library?**\nsetState for local ephemeral UI state; libraries for shared app state, business logic separation, testability, async/caching needs.\n\n**22. Explain Provider's `watch`, `read`, `select`.**\nwatch: listen & rebuild; read: one-time access in callbacks; select: rebuild only when a derived value changes.\n\n**23. What is `ChangeNotifierProvider.value` vs `create`?**\ncreate instantiates and disposes the notifier; value provides an existing instance without disposing it.\n\n**24. Riverpod vs Provider?**\nRiverpod is compile-safe, context-independent, supports multiple same-type providers, autoDispose/family, built-in async (AsyncValue), easy overrides for tests.\n\n**25. Explain ref.watch vs ref.read vs ref.listen.**\nwatch rebuilds/recomputes on change (in build); read is a one-time read (callbacks); listen triggers side effects.\n\n**26. What is AsyncValue and how do you render it?**\nUnion of loading/data/error; render via `when` or pattern matching on AsyncData/AsyncError/AsyncLoading.\n\n**27. Explain the Bloc pattern and its components.**\nEvents in, states out via streams; `on\u003cEvent>` handlers call repositories and emit immutable states; UI uses BlocBuilder/BlocListener; BlocProvider for DI.\n\n**28. Bloc vs Cubit?**\nCubit: functions emitting states; Bloc: events processed by handlers with transformers (debounce, droppable, restartable) and full traceability.\n\n**29. Why might BlocBuilder not rebuild after emit?**\nNew state equals old state (mutated list or Equatable props missing) — Bloc skips equal states.\n\n**30. How do you handle one-time events like navigation or snackbars?**\nBlocListener / ref.listen / listening to a stream of effects; not inside build logic. Avoid storing \"show snackbar\" as permanent state without consuming it.\n\n**31. What is `Equatable` / why do we need value equality?**\nProvides `==`/hashCode based on props → states compare by value → proper deduplication and testing.\n\n**32. How do you combine multiple states (e.g., filters + data)?**\nRiverpod: provider that watches both. Bloc: combine streams in a repository or listen to one bloc and add events to another in UI; or a single bloc owning both.\n\n**33. What is the difference between ephemeral and app state?**\nLocal vs shared/persistent; examples: current tab vs logged-in user.\n\n**34. Describe how you'd structure state for a paginated list with pull-to-refresh and errors.**\nState: items, page/cursor, status (initial/loading/success/failure), hasMore, isLoadingMore, error; events/methods: fetchFirst, fetchMore (guarded, droppable), refresh (reset); UI: footer loader, retry, empty view.\n\n**35. What is GetX and its criticisms?**\nAll-in-one state/DI/routing; criticized for magic/global state, testability, coupling and maintenance concerns.\n\n---\n\n## C. Async & Dart depth\n\n**36. Explain the event loop and microtasks.**\nAfter synchronous code, Dart drains the microtask queue fully, then processes one event, then microtasks again. Futures from timers/IO go to event queue; completion callbacks and scheduleMicrotask go to microtask queue.\n\n**37. Predict the output:**\n```dart\nvoid main() {\n  print('A');\n  Future(() => print('B'));\n  Future.microtask(() => print('C'));\n  print('D');\n}\n```\n`A D C B`.\n\n**38. How do you run network calls in parallel?**\nStart futures then `await Future.wait([...])` or records `(f1, f2).wait`.\n\n**39. What is an isolate and when do you use it?**\nSeparate memory/thread for CPU-heavy work (JSON parsing, image processing) to keep UI smooth; `Isolate.run`/`compute`.\n\n**40. Why does `items.forEach((i) async => await upload(i))` not wait?**\nforEach ignores returned futures; use `for` loop with await or `Future.wait`.\n\n**41. Single-subscription vs broadcast stream?**\nOne listener with buffering vs many listeners without buffering.\n\n**42. How do you debounce user input?**\nTimer cancel/restart, rxdart `debounceTime`, Bloc transformers, Riverpod delay + dispose check.\n\n**43. What are sealed classes and pattern matching used for in Flutter apps?**\nModelling finite states/results with exhaustive switches (e.g., UI states, API results), with destructuring.\n\n**44. What is a factory constructor? Where used?**\nConstructor that can return existing/subtype instances: fromJson, singletons, caches.\n\n**45. What are extension methods? Example in Flutter?**\nAdd methods to existing types: `context.theme`, `String.capitalized`.\n\n**46. What is `late final` useful for in State?**\nNon-nullable fields initialized in initState (controllers) or lazily.\n\n**47. What's the difference between `Iterable` and `List`?**\nIterable is lazy & sequential access; List is indexed and materialized.\n\n**48. Mixins: what does `on` do?**\nRestricts which classes can use the mixin (must extend/implement the `on` type), allowing the mixin to call its members.\n\n**49. Explain records and give a use case.**\nAnonymous immutable tuples with structural equality; return multiple values like `(User, List\u003cOrder>)`.\n\n**50. What are class modifiers (`base`, `interface`, `final`, `sealed`)?**\nControl extension/implementation outside the library; sealed enables exhaustiveness.\n\n---\n\n## D. Networking, storage & data\n\n**51. How do you structure networking in an app?**\nAPI client (Dio) with interceptors → remote data sources/services → repositories mapping DTOs to domain models & errors → state layer.\n\n**52. How do you implement token refresh?**\nInterceptor catching 401, single refresh (QueuedInterceptor/lock), retry original request, logout on failure, separate client for refresh.\n\n**53. How do you serialize JSON at scale?**\njson_serializable/freezed codegen; parse large payloads in isolates; handle nulls/unknown enum values.\n\n**54. Where do you store tokens and why not SharedPreferences?**\nSecure storage (Keychain/Keystore) because prefs are unencrypted.\n\n**55. sqflite vs Drift vs Hive?**\nRaw SQL vs typed reactive SQL with migrations vs simple key-value boxes (maintenance status: community fork).\n\n**56. How do you design offline support?**\nLocal DB as source of truth, sync queue, conflict resolution, connectivity awareness, optimistic UI.\n\n**57. How do you cancel an in-flight request when the user leaves a screen?**\nDio CancelToken cancelled in dispose / provider onDispose / bloc close.\n\n**58. How do you handle pagination?**\nOffset or cursor, guarded loadMore, hasMore flag, merging results, dedup, refresh reset.\n\n**59. How do you cache API responses?**\nHTTP cache interceptor, in-memory with TTL in repository, persistent DB cache with stale-while-revalidate.\n\n**60. How do you handle different environments' base URLs?**\nFlavors + dart-define(-from-file) → AppConfig injected into Dio.\n\n---\n\n## E. Navigation, platform & UI features\n\n**61. How do you implement authentication-aware routing?**\ngo_router redirect + refreshListenable bound to auth state; preserve original location.\n\n**62. go vs push in go_router?**\ngo: navigate to URL with stack built from route hierarchy; push: add on top of current stack.\n\n**63. How do you handle Android back button / predictive back?**\nPopScope (`canPop`, `onPopInvokedWithResult`); avoid deprecated WillPopScope.\n\n**64. How do deep links work?**\nApp Links/Universal Links configuration + domain verification files; router maps URL to screens.\n\n**65. What are platform channels? Give a real example.**\nMethodChannel to call native APIs not covered by plugins (e.g., reading a vendor SDK's device ID); EventChannel for native streams (sensor updates).\n\n**66. What is Pigeon and why use it?**\nGenerates type-safe channel code, removing stringly-typed errors.\n\n**67. How do you request runtime permissions?**\npermission_handler with manifest/Info.plist declarations; contextual requests; handle permanently denied.\n\n**68. How do push notifications work in different app states?**\nonMessage (foreground → show local notification), onMessageOpenedApp (background tap), getInitialMessage (terminated tap), onBackgroundMessage handler (top-level, vm:entry-point).\n\n**69. How do you implement localization?**\nflutter_localizations + gen-l10n ARB files, ICU plurals; RTL support with directional widgets.\n\n**70. How do you support tablets/large screens?**\nBreakpoints with LayoutBuilder, adaptive navigation (bar/rail/drawer), master-detail, constrained content widths.\n\n**71. How do you implement custom themes/design tokens?**\nColorScheme.fromSeed + component themes + ThemeExtension for custom tokens; design system package.\n\n**72. Implicit vs explicit animations?**\nImplicit animate property changes automatically; explicit use AnimationController for full control.\n\n**73. How do you create a shimmer/skeleton loader?**\nShimmer package or custom ShaderMask with LinearGradient animated by a controller; skeleton widgets with fixed sizes to avoid layout shift.\n\n**74. How do you build a custom chart or shape?**\nCustomPainter with Canvas; shouldRepaint; repaint listenable for animation.\n\n**75. How do you make a widget accessible?**\nSemantics labels, tooltips, contrast, tap targets, text scaling, focus order.\n\n---\n\n## F. Testing, performance & release\n\n**76. Unit vs widget vs integration tests?**\nPure logic vs UI component in test environment vs full app on device.\n\n**77. pump vs pumpAndSettle?**\nSingle frame vs pump until no scheduled frames (fails on infinite animations).\n\n**78. How do you mock an API in tests?**\nInject repository interfaces; mocktail mocks or fakes; MockClient for http; http_mock_adapter for Dio.\n\n**79. What are golden tests and their pitfalls?**\nVisual snapshots; fonts and platform rendering differences, update with --update-goldens.\n\n**80. How do you find out why a screen is janky?**\nProfile mode DevTools: UI vs raster thread; track rebuilds; CPU profiler; fix heavy builds/effects/images; re-measure.\n\n**81. How do you reduce rebuilds?**\nconst, smaller widgets, select/BlocSelector, builder child, MediaQuery aspects.\n\n**82. How do you reduce app size?**\nAAB, split-per-abi, obfuscate+split-debug-info, asset compression, remove heavy deps, R8.\n\n**83. How do you detect memory leaks?**\nDevTools memory snapshot diff, leak_tracker; check disposal of controllers/subscriptions.\n\n**84. What are flavors?**\nEnvironment-specific builds with distinct IDs/configs.\n\n**85. How do you sign and publish an Android app?**\nUpload keystore + key.properties + signingConfig; AAB; Play App Signing; tracks & staged rollout.\n\n**86. What is obfuscation and how do you read crash stack traces afterwards?**\nSymbol renaming; keep split-debug-info symbols and symbolize (`flutter symbolize`, Crashlytics/Sentry upload).\n\n**87. What CI steps do you set up?**\nFormat, analyze, test, build, distribute; pinned Flutter version; secrets management.\n\n**88. What is the difference between `flutter build apk` and `appbundle`?**\nAPK is installable directly; AAB is for Play distribution which generates optimized APKs.\n\n**89. How do you handle a production crash spike?**\nHalt rollout, feature flag off, hotfix, monitor, postmortem.\n\n**90. What's your approach to code review?**\nCorrectness, architecture consistency, performance, accessibility, tests, readability; kind & specific feedback.\n\n---\n\n## G. Scenario-based (mid-level favourites)\n\n**91. A user taps \"Pay\" twice and is charged twice. How do you prevent this?**\nDisable button during request/droppable transformer, command running-state guard, backend idempotency key per order, server verifies payment status; show progress & handle retries safely.\n\n**92. Search results flicker/out of order when typing fast. Fix?**\nDebounce input, cancel previous requests (CancelToken/restartable/switchMap), ignore stale responses by query token, sho
