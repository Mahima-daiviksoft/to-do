isting elements lets Flutter **reuse** expensive objects and do the minimum layout/paint work.\n\n### Reconciliation (how Flutter \"diffs\")\nWhen a parent rebuilds and returns a new child widget, the element calls `updateChild(oldChildElement, newWidget)`:\n1. `newWidget == null` → remove (unmount) old child element.\n2. Old element is null → **inflate** new widget (create new element + maybe render object).\n3. `Widget.canUpdate(old.widget, newWidget)` is true → **update** existing element with new widget (`element.update(newWidget)`), keeping State and RenderObject.\n4. Otherwise → **deactivate old element**, inflate a **new** one (State is lost!).\n\nAlso, if the new widget is **`identical`** to the old one (same instance — e.g., a `const` widget), Flutter **skips rebuilding** that subtree completely. That's why `const` matters.\n\nFor children **lists** (`Row`, `Column`, `ListView`...), `updateChildren` matches old and new children from the top and bottom by type+key, and uses **keys** to match moved children in the middle. Without keys, matching is **positional**.\n\n---\n\n## 6.3 StatelessWidget\n\nUse when the widget depends only on its **constructor arguments** and **inherited data** (Theme, MediaQuery…), and has no internal mutable state.\n\n```dart\nclass Greeting extends StatelessWidget {\n  const Greeting({super.key, required this.name});\n  final String name;\n\n  @override\n  Widget build(BuildContext context) {\n    return Text('Hello, $name!', style: Theme.of(context).textTheme.titleLarge);\n  }\n}\n```\n**When is a StatelessWidget's `build` called?**\n1. First time it's inserted in the tree.\n2. When its parent rebuilds and provides a new widget instance (not identical).\n3. When an `InheritedWidget` it depends on changes (e.g., `Theme.of(context)`, `MediaQuery.of(context)`).\n\n\"Stateless\" doesn't mean it never rebuilds — it means *it has no State object of its own*.\n\n---\n\n## 6.4 StatefulWidget\n\nA StatefulWidget has two classes: the **widget** (immutable config) and the **State** (mutable, long-lived, attached to the element).\n\n```dart\nclass Counter extends StatefulWidget {\n  const Counter({super.key, this.initial = 0});\n  final int initial;\n\n  @override\n  State\u003cCounter> createState() => _CounterState();\n}\n\nclass _CounterState extends State\u003cCounter> {\n  late int _count;\n\n  @override\n  void initState() {\n    super.initState();\n    _count = widget.initial;   // access the widget's config via `widget`\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return TextButton(\n      onPressed: () => setState(() => _count++),\n      child: Text('$_count'),\n    );\n  }\n}\n```\n**Why split into two classes?** Because widgets are recreated on every parent rebuild, but the State must **survive** those rebuilds. The State lives with the Element, and gets a *new* `widget` reference each time the parent rebuilds.\n\n---\n\n## 6.5 The StatefulWidget lifecycle — complete & precise ♻️\n\n```\ncreateState()\n   │\n   ▼\n[mounted = true]\ninitState()                      ← once\n   │\n   ▼\ndidChangeDependencies()          ← right after initState, and whenever an InheritedWidget it depends on changes\n   │\n   ▼\nbuild()  ◄──────────────────────────────┐\n   │                                     │\n   ├── setState() ───────────────────────┤ (marks dirty → build on next frame)\n   ├── didUpdateWidget(oldWidget) ───────┤ (parent rebuilt with new config of same type & key; build always follows)\n   ├── didChangeDependencies() ──────────┤\n   │                                     │\n   ▼\ndeactivate()      ← removed from tree (may be re-inserted in same frame via GlobalKey)\n   │\n   ├── activate()  ← re-inserted (GlobalKey reparenting) → build()\n   ▼\ndispose()         ← permanently removed; release resources\n[mounted = false]\n```\n\n| Method | When | What to do | What NOT to do |\n|---|---|---|---|\n| `createState()` | Framework creates element | Return new State | Logic |\n| `initState()` | Once, after State inserted | Init controllers, subscriptions, start one-time loads; call `super.initState()` **first** | `Theme.of(context)`/`MediaQuery.of(context)`/`dependOnInheritedWidgetOfExactType` (use didChangeDependencies); calling async and expecting result synchronously |\n| `didChangeDependencies()` | After initState and when inherited deps change | Work depending on InheritedWidgets (e.g., read locale, start something based on `Provider.of`) | Heavy work without checking whether it's needed (it can be called many times) |\n| `build()` | Often | Return widgets; be **pure & fast** | Side effects, network calls, `setState`, creating controllers |\n| `didUpdateWidget(old)` | Parent provided new widget config | Compare `old.x` vs `widget.x`; update controllers/subscriptions | Forgetting to call `super.didUpdateWidget(old)` |\n| `setState(fn)` | You call it | Synchronously mutate state inside fn, then marks dirty | Calling during build, after dispose, or with async fn |\n| `deactivate()` | Removed from tree | Rarely used | — |\n| `activate()` | Reinserted after deactivate | Rarely used | — |\n| `dispose()` | Permanently removed | Dispose controllers, cancel subscriptions/timers, remove listeners; call `super.dispose()` **last** | `setState`, using context to look up ancestors |\n| `reassemble()` | On **hot reload** (debug only) | Re-init things during development | Production logic |\n\n### `mounted`\n`mounted` is `true` between `initState` and `dispose`. Check it after `await`s before calling `setState`.\n\n### What exactly does `setState` do?\n```dart\n@protected\nvoid setState(VoidCallback fn) {\n  // (asserts in debug: not disposed, fn not async, etc.)\n  final Object? result = fn() as dynamic;\n  assert(result is! Future, 'setState() callback argument returned a Future.');\n  _element!.markNeedsBuild();\n}\n```\n1. Runs your callback **synchronously**.\n2. Calls `markNeedsBuild()` on the element → added to the **dirty elements list** and a frame is scheduled.\n3. On the next frame, `BuildOwner.buildScope` rebuilds dirty elements (in depth order) → `build()` is called.\n\nSo `setState` does **not** rebuild immediately and multiple `setState` calls in the same frame are **batched into one build**.\n\nThe callback is only for clarity — technically you can mutate state before calling `setState(() {})` and it works, but convention is to mutate inside the callback.\n\n**`setState` rebuilds the whole `build` method of that State** (and child widgets whose instances changed). Keep stateful widgets **small and low in the tree** to minimise rebuild cost.\n\n---\n\n## 6.6 BuildContext — \"where am I in the tree?\" 📍\n\n**5-year-old:** BuildContext is your **home address** in the big family tree. With your address you can ask \"who is my grandparent that has the Theme?\" or \"where is the nearest Navigator?\"\n\n**Grown-up:** `BuildContext` is an **interface implemented by `Element`**. Each widget's `build` receives *its own element* as context. It gives:\n* Lookup of ancestors: `Theme.of(context)`, `Navigator.of(context)`, `context.findAncestorStateOfType\u003cT>()`, `context.findAncestorWidgetOfExactType\u003cT>()`, `context.dependOnInheritedWidgetOfExactType\u003cT>()`, `context.getInheritedWidgetOfExactType\u003cT>()` (no dependency).\n* Size of render object after layout: `context.size` (only after layout, careful).\n* `context.mounted` (Flutter 3.7+).\n* `findRenderObject()`.\n\n### The #1 BuildContext bug: using the wrong context\n```dart\nclass MyPage extends StatelessWidget {\n  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n      body: ElevatedButton(\n        onPressed: () {\n          // This `context` belongs to MyPage — ABOVE the Scaffold.\n          Scaffold.of(context).openDrawer();  // ❌ \"Scaffold.of() called with a context that does not contain a Scaffold.\"\n        },\n        child: const Text('Open'),\n      ),\n    );\n  }\n}\n```\nFixes:\n```dart\n// 1. Builder gives a context BELOW the Scaffold\nbody: Builder(\n  builder: (innerContext) => ElevatedButton(\n    onPressed: () => Scaffold.of(innerContext).openDrawer(),\n    child: const Text('Open'),\n  ),\n),\n// 2. Extract the button into its own widget (its context is below Scaffold).\n// 3. Use a GlobalKey\u003cScaffoldState>.\n```\nSame bug class: `Provider.of\u003cX>(context)` where the provider is created in the same build method; `Navigator.of(context)` above `MaterialApp`; `MediaQuery.of(context)` above `MaterialApp` (\"No MediaQuery widget ancestor found\").\n\n### `of` vs `maybeOf`\n`Theme.of(context)` always returns something (falls back to default). `Navigator.of` throws if none; `Navigator.maybeOf` returns null. Many classes provide both.\n\n---\n\n## 6.7 InheritedWidget — sharing data down the tree efficiently\n\n**5-year-old:** It's like a **radio tower** 📻 at the top of the tree. Any widget below can tune in (`dependOn...`). When the tower broadcasts a new message, **only the widgets that tuned in** rebuild.\n\n```dart\nclass UserScope extends InheritedWidget {\n  const UserScope({super.key, required this.user, required super.child});\n  final User user;\n\n  static User of(BuildContext context) {\n    final scope = context.dependOnInheritedWidgetOfExactType\u003cUserScope>();\n    assert(scope != null, 'No UserScope found in context');\n    return scope!.user;\n  }\n\n  @override\n  bool updateShouldNotify(UserScope oldWidget) => user != oldWidget.user;\n}\n```\n* `dependOnInheritedWidgetOfExactType` — O(1) lookup (elements keep a map of inherited widgets) **and registers a dependency**: when `updateShouldNotify` returns true, dependents get `didChangeDependencies` + rebuild.\n* `getInheritedWidgetOfExactType` — O(1) lookup **without** dependency (no rebuilds).\n* `Theme`, `MediaQuery`, `Directionality`, `DefaultTextStyle`, `Localizations`, `Navigator`-ish scopes, `Provider` — all built on InheritedWidget (or InheritedNotifier/InheritedModel).\n\n### InheritedModel — rebuild only for the aspect you care about\n`MediaQuery` became an `InheritedModel` (Flutter 3.10). `MediaQuery.of(context)` rebuilds you on **any** change (keyboard opening changes viewInsets → rebuild!). Use aspect methods:\n```dart\nfinal size = MediaQuery.sizeOf(context);          // rebuild only when size changes\nfinal padding = MediaQuery.paddingOf(context);\nfinal insets = MediaQuery.viewInsetsOf(context);  // keyboard\nfinal textScaler = MediaQuery.textScalerOf(context);\nfinal brightness = MediaQuery.platformBrightnessOf(context);\n```\n👉 Performance tip asked in senior interviews: prefer `MediaQuery.sizeOf(context)` over `MediaQuery.of(context).size`.\n\n### InheritedNotifier\nCombines InheritedWidget with a `Listenable` (e.g., `ChangeNotifier`, `ValueNotifier`): dependents rebuild when the notifier notifies. Basis of simple DI/state patterns (Chapter 14).\n\n---\n\n## 6.8 Keys — name tags for widgets 🏷️\n\n**5-year-old:** Imagine kids sitting in chairs. If no one has a **name tag**, and the first kid leaves, the teacher just looks at chair positions: \"chair 1 is still here, chair 2 is still here…\" and gets confused about who's who. With **name tags**, the teacher knows exactly which kid moved where.\n\n### When do you NEED keys?\nWhen you have **a collection of stateful widgets of the same type** that can be **reordered, inserted, or removed**, and you want each one's state to follow it.\n\n#### The classic demo\n```dart\nclass ColorTile extends StatefulWidget {\n  const ColorTile({super.key});\n  @override\n  State\u003cColorTile> createState() => _ColorTileState();\n}\nclass _ColorTileState extends State\u003cColorTile> {\n  final color = Color(Random().nextInt(0xFFFFFFFF));   // state lives HERE\n  @override\n  Widget build(BuildContext context) => Container(width: 100, height: 100, color: color);\n}\n\n// Parent swaps tiles:\ntiles = [tiles[1], tiles[0]];\n```\nWithout keys: `Row` compares by position → same type at index 0 → `canUpdate` true → **element (and its State with the color) stays at index 0** → colours **don't swap**! 😱\nWith `ColorTile(key: UniqueKey())` or `ValueKey(id)`: elements are matched by key → states move → colours swap ✅.\n\n(If the colour were passed in from the parent as a constructor parameter — i.e., a StatelessWidget — swapping works without keys because the *widget* carries the data.)\n\n### Types of keys\n| Key | Equality based on | Use case |\n|---|---|---|\n| `ValueKey\u003cT>(value)` | `value ==` | Items with unique id: `ValueKey(todo.id)` |\n| `ObjectKey(object)` | `identical(object)` | When the object identity is unique but no simple id |\n| `UniqueKey()` | only equal to itself | Force a brand-new element every build (⚠️ creating UniqueKey in build = state reset each rebuild!) |\n| `PageStorageKey` | value | Preserve scroll position in PageStorage across tabs/routes |\n| `GlobalKey\u003cT>` | unique across the **entire app** | Access State/context from outside, move widget between parents keeping state, forms |\n| `GlobalObjectKey` | object identity, global | rare |\n\n**Local keys** (ValueKey, ObjectKey, UniqueKey) only need to be unique **among siblings**.\n\n### GlobalKey\n```dart\nfinal _formKey = GlobalKey\u003cFormState>();\nForm(key: _formKey, child: ...);\nif (_formKey.currentState!.validate()) { _formKey.currentState!.save(); }\n\nfinal scaffoldKey = GlobalKey\u003cScaffoldState>();\nscaffoldKey.currentState?.openDrawer();\n```\nGlobalKey gives: `currentState`, `currentContext`, `currentWidget`. Moving a widget with a GlobalKey to another parent **in the same frame** reparents the element and **keeps its State** (deactivate → activate).\n\n⚠️ GlobalKey downsides: expensive-ish (global registry), must be unique (error: *\"Multiple widgets used the same GlobalKey\"* — usually from creating a key in `build()` of a widget used twice, or two routes showing the same widget), encourage imperative coupling. Use sparingly.\n\n### Where to put the key\nPut the key **on the outermost widget of the list item**, i.e., the direct child of the list:\n```dart\nListView(children: [\n  for (final todo in todos)\n    TodoTile(key: ValueKey(todo.id), todo: todo),   // ✅ top-level of item\n]);\n// ❌ Wrong: Padding(child: TodoTile(key: ValueKey(todo.id)))  — the Padding is the sibling being matched!\n```\n\n### Keys and `ListView.builder`\nLazy lists reuse elements by index. If items can be removed/reordered and are stateful (e.g., checkboxes with local state, text fields, animations), give them `ValueKey(id)`. Use `findChildIndexCallback` in `ListView.builder`/`SliverChildBuilderDelegate` to help Flutter find moved keyed items efficiently.\n\n### Using keys to *reset* state on purpose\n```dart\n// When userId changes, give the form a new key → fresh state\nProfileForm(key: ValueKey(userId), userId: userId);\n```\n\n---\n\n## 6.9 Widget categories you must know\n\n1. **ComponentWidgets** (no render object): `StatelessWidget`, `StatefulWidget`, `ProxyWidget` (`InheritedWidget`, `ParentDataWidget`).\n2. **RenderObjectWidgets**:\n   * `LeafRenderObjectWidget` (no children): `RawImage`, `ErrorWidget`.\n   * `SingleChildRenderObjectWidget`: `Padding`, `Opacity`, `SizedBox`, `Align`, `ClipRRect`, `Transform`.\n   * `MultiChildRenderObjectWidget`: `Row`, `Column`, `Stack`, `Flex`, `Wrap`, `Flow`, `RichText`, `CustomMultiChildLayout`.\n3. **ParentDataWidget**: configures how a child is laid out by its parent: `Expanded`/`Flexible` (must be direct child of Flex: Row/Column), `Positioned` (must be child of Stack), `TableCell`, `LayoutId`. Misuse error: **\"Incorrect use of ParentDataWidget\"** — e.g., `Expanded` wrapped in a `Padding` inside a `Row` is fine only if the `Expanded` is the outer one: `Expanded` must be the *direct* child of a `Row`/`Column`/`Flex`, and `Positioned` must be a direct child of a `Stack` (wrap the inner widget instead: `Expanded(child: Padding(...))`).\n\n### Container is a convenience widget\n`Container` is a StatelessWidget composing `Padding`, `ConstrainedBox`, `DecoratedBox`, `Align`, `Transform`, `ColoredBox`, `ClipPath`, `LimitedBox` depending on which properties you set. Interview Q: *\"Container vs SizedBox?\"* → `SizedBox` is a lightweight single render object for fixed size/spacing and can be `const`; Container is heavier and can't be const with many params. Use `SizedBox` for gaps and fixed sizes, `ColoredBox` for just colour, `DecoratedBox` for decoration, `Padding` for padding.\n\n⚠️ `Container(color: X, decoration: BoxDecoration(...))` → **assertion error**: \"Cannot provide both a color and a decoration\". Put color inside the decoration.\n\n---\n\n## 6.10 Extract widgets, not helper methods (important best practice)\n\n```dart\n// ❌ Helper method\nWidget _buildHeader() => Text('Header $count');\n\n// ✅ Separate widget class\nclass Header extends StatelessWidget {\n  const Header({super.key, required this.count});\n  final int count;\n  @override\n  Widget build(BuildContext context) => Text('Header $count');\n}\n```\nWhy classes are better:\n1. **Own BuildContext** → correct `of(context)` lookups (fixes the Scaffold.of bug).\n2. **Rebuild optimisation**: a `const` widget or unchanged instance can be skipped; helper methods always re-execute with the parent.\n3. Separate element → only it rebuilds when its InheritedWidget dependency changes (not the whole parent).\n4. DevTools shows it in the widget tree; easier testing; reusable.\nHelper methods are fine for tiny, non-reused snippets but in interviews say \"prefer widget classes\".\n\n---\n\n## 6.11 Builder widgets & callbacks\n\n* `Builder` — new context.\n* `LayoutBuilder` — gives parent **constraints** (Chapter 7).\n* `StatefulBuilder` — local setState inside dialogs/bottom sheets:\n```dart\nshowDialog(context: context, builder: (_) => StatefulBuilder(\n  builder: (context, setLocalState) => Checkbox(\n    value: checked,\n    onChanged: (v) => setLocalState(() => checked = v!),\n  ),\n));\n```\n* `ValueListenableBuilder` — rebuild only when a `ValueNotifier` changes.\n* `ListenableBuilder` / `AnimatedBuilder` — rebuild when any `Listenable` changes (AnimatedBuilder is the same thing, named for animations).\n* `FutureBuilder`, `StreamBuilder` (Chapter 5).\n* `OrientationBuilder`, `TweenAnimationBuilder`.\n\n`child` parameter optimisation:\n```dart\nAnimatedBuilder(\n  animation: controller,\n  child: const ExpensiveWidget(),             // built ONCE\n  builder: (context, child) => Transform.rotate(\n    angle: controller.value * 2 * pi,\n    child: child,                             // reused every frame\n  ),\n);\n```\n\n---\n\n## 6.12 App lifecycle (whole app, not widget)\n\n```dart\nclass _AppState extends State\u003cApp> with WidgetsBindingObserver {\n  @override\n  void initState() {\n    super.initState();\n    WidgetsBinding.instance.addObserver(this);\n  }\n  @override\n  void dispose() {\n    WidgetsBinding.instance.removeObserver(this);\n    super.dispose();\n  }\n  @override\n  void didChangeAppLifecycleState(AppLifecycleState state) {\n    switch (state) {\n      case AppLifecycleState.resumed:  // visible & interactive\n      case AppLifecycleState.inactive: // visible but not receiving input (iOS app switcher, phone call overlay)\n      case AppLifecycleState.hidden:   // (3.13+) not visible; all platforms report it before paused\n      case AppLifecycleState.paused:   // in background (mobile)\n      case AppLifecycleState.detached: // engine running without a view (being destroyed / not yet attached)\n    }\n  }\n}\n```\nFlutter 3.13 added `AppLifecycleListener` — easier API with `onResume`, `onPause`, `onHide`, `onShow`, `onInactive`, `onDetach`, `onRestart`, `onExitRequested` (desktop exit handling):\n```dart\nlate final AppLifecycleListener _listener = AppLifecycleListener(\n  onResume: _refresh,\n  onPause: _saveDraft,\n);\n@override\nvoid dispose() { _listener.dispose(); super.dispose(); }\n```\nOther `WidgetsBindingObserver` callbacks: `didChangeMetrics` (rotation/resize/keyboard), `didChangePlatformBrightness`, `didChangeLocales`, `didHaveMemoryPressure`, `didChangeTextScaleFactor`/`didChangeAccessibilityFeatures`, `didPopRoute`/`didPushRouteInformation` (back button/deep links at root).\n\n---\n\n## 6.13 Common widget-level bugs & fixes\n\n| Error message | Cause | Fix |\n|---|---|---|\n| `setState() called after dispose()` | async completes after widget removed / un-cancelled stream/timer | check `mounted`; cancel subscriptions in dispose |\n| `setState() or markNeedsBuild() called during build` | calling setState (or a notifier that triggers rebuild) inside build / initState synchronously that triggers ancestor rebuild | move to event handler; use `WidgetsBinding.instance.addPostFrameCallback((_) {...})` |\n| `dependOnInheritedWidgetOfExactType\u003c...>() was called before initState() completed` | `Theme.of(context)` in initState | move to `didChangeDependencies` or `build` |\n| `Looking up a deactivated widget's ancestor is unsafe` | using `context` after widget disposed (e.g., in async callback, in dispose) | capture needed objects earlier (`final nav = Navigator.of(context)`), check `mounted` |\n| `Multiple widgets used the same GlobalKey` | same GlobalKey in two places/routes | create keys once per instance in State, not static/global; ensure single use |\n| `Duplicate keys found` | two siblings with same ValueKey | ensure IDs are unique |\n| `A RenderFlex overflowed by X pixels` | Chapter 7 | Chapter 7 |\n| `Incorrect use of ParentDataWidget` | Expanded/Flexible/Positioned not a direct child of Flex/Stack | restructure |\n| State not updating when parent passes new value | You copied `widget.value` into State in `initState` only | handle in `didUpdateWidget`, or read `widget.value` directly in build |\n| State \"sticks\" to wrong list item after delete | no keys on stateful list items | `ValueKey(item.id)` |\n| Text field loses focus/text on rebuild | `TextEditingController` created in `build`, or UniqueKey in build | create controller in initState; avoid UniqueKey in build |\n\nExample of the `didUpdateWidget` bug:\n```dart\nclass _PriceState extends State\u003cPrice> {\n  late double _displayed;\n  @override\n  void initState() { super.initState(); _displayed = widget.price; }\n\n  @override\n  void didUpdateWidget(covariant Price oldWidget) {\n    super.didUpdateWidget(oldWidget);\n    if (oldWidget.price != widget.price) {\n      _displayed = widget.price;   // ✅ sync state with new config\n    }\n  }\n  ...\n}\n```\n\n---\n\n## 6.14 Interview Questions — Widgets\n\n**Q1. What is a widget?** An immutable description of part of the UI; a configuration for an Element.\n\n**Q2. StatelessWidget vs StatefulWidget?** Stateless has no mutable state of its own and rebuilds only from parent/inherited changes; Stateful has a separate long-lived `State` object that can call `setState` to rebuild.\n\n**Q3. Explain the StatefulWidget lifecycle.** createState → initState → didChangeDependencies → build → (setState / didUpdateWidget / didChangeDependencies → build)* → deactivate → (activate → build) → dispose. Plus reassemble on hot reload.\n\n**Q4. What does setState do internally?** Runs the callback synchronously, then marks the element dirty (`markNeedsBuild`), scheduling a frame; dirty elements rebuild in the next frame's build phase. Multiple calls are batched.\n\n**Q5. What is BuildContext?** A handle to the widget's location in the tree — actually the Element. Used to look up ancestors and inherited widgets.\n\n**Q6. Why can't you use `Theme.of(context)` in initState?** Inherited dependencies aren't safe to establish there; use `didChangeDependencies` (or build). Reading with `listen: false`-style APIs that don't register dependencies may work, but the rule is to use didChangeDependencies.\n\n**Q7. Widget vs Element vs RenderObject?** Widget = immutable config; Element = instantiation in the tree, manages lifecycle, holds State, links widget to render object; RenderObject = does layout, painting, hit testing.\n\n**Q8. What are keys? When are they needed?** Identifiers to preserve/match element state when widgets of the same type move, are added or removed among siblings; needed for stateful items in reorderable/modified lists, to force state reset, to preserve scroll positions, and GlobalKeys for cross-tree access.\n\n**Q9. ValueKey vs ObjectKey vs UniqueKey vs GlobalKey?** See table §6.8.\n\n**Q10. What is InheritedWidget?** A widget that efficiently propagates data down the tree; descendants depending on it are rebuilt when `updateShouldNotify` returns true.\n\n**Q11. What is `didUpdateWidget` used for?** Reacting to new configuration from the parent (e.g., re-subscribe if a stream parameter changed, update animation targets).\n\n**Q12. What's the difference between `deactivate` and `dispose`?** Deactivate: element removed from tree, possibly re-inserted in the same frame (GlobalKey reparenting). Dispose: permanently removed; release resources.\n\n**Q13. Why is `build` called so many times, and is it expensive?** Build runs on any state/config/dependency change; it should be pure and cheap — creating widgets is cheap, while elements/render objects are reused. Costly work belongs elsewhere.\n\n**Q14. Why prefer widget classes over helper methods?** Own context, rebuild isolation, const-ability, better DevTools/testing.\n\n**Q15. What does `const` do for widgets?** Canonical instance; identical instance on rebuild lets Flutter skip updating that subtree.\n\n**Q16. What does `mounted` mean?** Whether the State is currently in the tree (between initState and dispose).\n\n**Q17. How do you run code after the first frame/build?** `WidgetsBinding.instance.addPostFrameCallback((_) { ... })` in initState (e.g., to show a dialog or measure sizes).\n\n**Q18. Can a StatelessWidget have mutable fields?** It shouldn't — widgets are `@immutable`; the analyzer warns. Mutable state belongs in a State or external state holder.\n\n**Q19. What is `Widget.canUpdate`?** Returns true if runtimeType and key match — decides whether an element is updated or replaced.\n\n**Q20. How does Flutter know which widgets to rebuild?** Only elements marked dirty (via setState, inherited dependency change, or listenable builders) and descendants receiving new widget instances get rebuilt; subtrees with identical widget instances are skipped.\n"}, {"n": 7, "file": "07-layout.md", "title": "Chapter 7 — Layout: Constraints, Flex, Stack, Responsive Design & Overflow Errors", "subtitle": "Layout: Constraints, Flex, Stack, Responsive Design & Overflow Errors", "short": "Layout", "sub": "Constraints, Flex, Stack, overflow errors", "level": "beginner", "minutes": 15, "qa": 15, "md": "# Chapter 7 — Layout: Constraints, Flex, Stack, Responsive Design & Overflow Errors\n\n> **Goal:** Never be confused by a layout again. The single rule **\"Constraints go down. Sizes go up. Parent sets position.\"** explains 90% of layout behaviour and 90% of layout bugs (yellow-black overflow stripes, \"unbounded height\", \"RenderBox was not laid out\").\n\n---\n\n## 7.1 The golden rule 🥇\n\n> **Constraints go down. Sizes go up. Parent sets position.**\n\n**5-year-old version:** A parent box tells its child: *\"You can be **between** this small and this big.\"* (constraints go down). The child thinks and says: *\"OK, I'll be **this** big.\"* (size goes up). Then the parent decides **where** to put the child (position). The child **never** decides its own position, and can't be bigger than allowed.\n\nStep by step (from the official docs):\n1. A widget gets its **constraints** from its parent: min width, max width, min height, max height.\n2. It goes through its children, telling each its constraints (can differ per child), and asks each child its size.\n3. It positions children (x, y) one by one.\n4. It tells its parent its own size (within original constraints).\n\n### Consequences (memorise these)\n* A widget **can't know its position** on screen during layout; the parent decides.\n* A widget **can't have any size it wants**; it must obey constraints. `Container(width: 100)` inside a parent that forces full width will be full width!\n* Final size depends on the parent too — you can't define size \"in isolation\".\n* **Alignment** decisions are made by the parent (`Center`, `Align`, `Row`'s alignment).\n\n---\n\n## 7.2 BoxConstraints\n\n```dart\nBoxConstraints(minWidth: 0, maxWidth: 300, minHeight: 0, maxHeight: 600)\n```\nTerminology:\n* **Tight** constraints: min == max (exact size forced). e.g., `BoxConstraints.tight(Size(100, 100))`. The **screen** gives the root widget tight constraints = screen size.\n* **Loose** constraints: min = 0, max = something. Child can be anywhere from 0 to max. e.g., `Center` loosens constraints for its child.\n* **Bounded**: max is finite.\n* **Unbounded**: max is `double.infinity`. Given by scrollables in their scroll direction and by `Row` (width) / `Column` (height) to non-flex children.\n\n### Experiments (official \"Understanding constraints\" examples, summarised)\n```dart\n// 1. Screen forces tight constraints → Container fills screen even with width 100\nContainer(width: 100, height: 100, color: Colors.red)   // as root → FULL SCREEN red\n\n// 2. Center loosens constraints → now 100×100\nCenter(child: Container(width: 100, height: 100, color: Colors.red))\n\n// 3. Container with no child and no size → as big as possible (fills Center's max)\nCenter(child: Container(color: Colors.red))   // full screen\n\n// 4. Container with child and no size → wraps child size\nCenter(child: Container(color: Colors.red, child: const Text('Hi')))\n\n// 5. ConstrainedBox can't override tighter parent constraints\nCenter(\n  child: ConstrainedBox(\n    constraints: const BoxConstraints(minWidth: 70, minHeight: 70, maxWidth: 150, maxHeight: 150),\n    child: Container(color: Colors.red, width: 10, height: 10),   // becomes 70×70\n  ),\n)\n\n// 6. UnconstrainedBox lets child be any size (may overflow → stripes)\nUnconstrainedBox(child: Container(width: 4000, height: 50, color: Colors.red))\n\n// 7. OverflowBox lets child be bigger without warning\n// 8. LimitedBox: limits size only when incoming constraints are unbounded\n// 9. FittedBox scales child to fit\nFittedBox(child: Text('Some very long text that would overflow'))\n// 10. FractionallySizedBox: size as fraction of parent\nFractionallySizedBox(widthFactor: 0.5, child: ...)\n```\n\n### Container's sizing algorithm (when there is no `width`/`height`)\n1. No child, no constraints, no alignment → tries to be **as big as possible** (unless incoming constraints are unbounded, then as small as possible).\n2. Has `alignment` → as big as possible, child aligned inside.\n3. Has child, no alignment → **size of child** (plus padding).\n(This is why \"Container behaves strangely\" is a common confusion.)\n\n---\n\n## 7.3 Row & Column (Flex) — the most used layout widgets\n\n```dart\nRow(\n  mainAxisAlignment: MainAxisAlignment.spaceBetween, // along the row (horizontal)\n  crossAxisAlignment: CrossAxisAlignment.center,     // perpendicular (vertical)\n  mainAxisSize: MainAxisSize.max,                    // take all width (default) or .min\n  textDirection: TextDirection.ltr,                  // affects start/end\n  verticalDirection: VerticalDirection.down,\n  spacing: 8,                                        // (Flutter 3.27+) gap between children\n  children: const [Icon(Icons.star), Text('4.5'), Text('(120)')],\n)\n```\n* **Main axis**: Row → horizontal, Column → vertical.\n* **Cross axis**: the other one.\n\n`MainAxisAlignment`: `start`, `end`, `center`, `spaceBetween` (no space at edges), `spaceAround` (half space at edges), `spaceEvenly` (equal everywhere).\n`CrossAxisAlignment`: `start`, `end`, `center`, `stretch` (fill cross axis), `baseline` (needs `textBaseline: TextBaseline.alphabetic`).\n\n### How Flex lays out (important for debugging!)\n1. Lay out **non-flexible** children first with **unbounded** main-axis constraints (Row gives each child `maxWidth: infinity`!) and cross-axis constraints from parent (loose, or tight if `stretch`).\n2. Remaining main-axis space is divided among **flexible** children (`Expanded`/`Flexible`) according to their `flex` factor.\n3. Position children per `mainAxisAlignment`.\n\nThat's why:\n* A long `Text` in a `Row` **overflows** (it was told \"you can be infinitely wide\"). Fix: wrap with `Expanded`/`Flexible`.\n* A `ListView` (horizontal) inside a `Row` crashes: unbounded width inside unbounded width.\n\n### Expanded vs Flexible vs Spacer\n```dart\nRow(children: [\n  Expanded(flex: 2, child: Container(color: Colors.red)),   // takes 2/3 of free space, MUST fill it\n  Flexible(flex: 1, child: Container(color: Colors.blue, width: 20)), // up to 1/3, can be smaller (loose)\n  const Spacer(),                                               // empty Expanded\n])\n```\n* `Expanded` = `Flexible(fit: FlexFit.tight)` — **must** fill the allotted space.\n* `Flexible` (default `fit: FlexFit.loose`) — **can** be smaller than the allotted space.\n* `Spacer(flex: 1)` — invisible expanded gap.\n\n### Gaps between children\n* `SizedBox(width: 8)` / `SizedBox(height: 8)` between children (classic).\n* `spacing:` parameter on Row/Column (Flutter 3.27+).\n* `Gap(8)` from the `gap` package (works in Row/Column/scrollables).\n* `Wrap(spacing:, runSpacing:)`.\n\n---\n\n## 7.4 Stack & Positioned — layers on top of each other 🥞\n\n```dart\nStack(\n  alignment: Alignment.center,       // for non-positioned children\n  clipBehavior: Clip.none,           // allow children outside bounds to be visible (default hardEdge)\n  fit: StackFit.loose,               // non-positioned children constraints\n  children: [\n    Image.asset('assets/bg.png'),                          // base layer, sizes the stack\n    const Positioned(top: 8, right: 8, child: Icon(Icons.favorite)),\n    Positioned.fill(child: Container(color: Colors.black26)), // fills entire stack\n    const Align(alignment: Alignment.bottomCenter, child: Text('Caption')),\n  ],\n)\n```\n* Stack's size = size of the largest **non-positioned** child (within constraints). If all children are positioned → Stack tries to be as big as possible.\n* `Positioned` must be a **direct child** of Stack.\n* Hit testing: children outside the Stack bounds (with `Clip.none`) are **visible but not tappable** — a classic bug (\"my badge button outside the card doesn't respond\"). Fix: make the Stack bigger (padding) so the child lies within bounds.\n* `IndexedStack` shows only one child by index but keeps all alive (state preserved) — used for bottom navigation tabs.\n\n---\n\n## 7.5 Other layout widgets you must know\n\n| Widget | Purpose |\n|---|---|\n| `Padding` | Space inside around child: `EdgeInsets.all(16)`, `.symmetric(horizontal: 8)`, `.only(left: 4)`, `.fromLTRB`, `EdgeInsetsDirectional.only(start: 8)` (RTL aware) |\n| `Center` / `Align` | Position child; `Alignment(-1..1, -1..1)`, `Alignment.topRight`, `AlignmentDirectional.centerStart`; `widthFactor`/`heightFactor` |\n| `SizedBox` | Fixed size / gap; `SizedBox.expand()`, `SizedBox.shrink()`, `SizedBox.square(dimension:)` |\n| `ConstrainedBox` | Add min/max constraints |\n| `UnconstrainedBox`, `OverflowBox`, `LimitedBox` | Advanced constraint control |\n| `AspectRatio` | Size child to a ratio (e.g., 16/9 video) |\n| `FittedBox` | Scale/fit child (`BoxFit.contain/cover/fill/scaleDown`) |\n| `FractionallySizedBox` | Size as fraction of available space |\n| `Expanded`, `Flexible`, `Spacer` | Flex children |\n| `Wrap` | Like Row/Column but wraps to next line (chips, tags) |\n| `Flow` | Efficient custom positioning with transforms (advanced) |\n| `Table` | Grid of rows with column widths (`FlexColumnWidth`, `FixedColumnWidth`, `IntrinsicColumnWidth`) |\n| `GridView` | Scrolling grid (Chapter 9) |\n| `IntrinsicHeight` / `IntrinsicWidth` | Size children to their intrinsic size (e.g., make Row children same height for a divider). ⚠️ **Expensive** (O(N²) potential) — avoid in lists |\n| `Baseline` | Align by text baseline |\n| `CustomSingleChildLayout`, `CustomMultiChildLayout` | Custom layout delegates |\n| `LayoutBuilder` | Build based on parent constraints |\n| `OrientationBuilder` | Portrait/landscape |\n| `SafeArea` | Avoid notches, status bar, home indicator |\n| `Offstage` | Lay out but don't paint (state kept) |\n| `Visibility` | Show/hide with options to maintain state/size/animation |\n| `Opacity` | Transparency (costly when animating — use `FadeTransition`/`AnimatedOpacity`) |\n| `Transform` | Rotate/scale/translate at paint time (doesn't affect layout) |\n| `RotatedBox` | Rotate by quarter turns **affecting layout** |\n| `ClipRRect`, `ClipOval`, `ClipPath` | Clip children (costly; use `borderRadius` on decoration when possible) |\n| `DecoratedBox` / `BoxDecoration` | Background, border, radius, shadow, gradient, image |\n| `Card`, `ListTile` | Material composites |\n\n### Visibility vs Offstage vs Opacity vs conditional\n| Technique | Takes space? | Keeps state? | Paints? | Hit-testable? | Cost |\n|---|---|---|---|---|---|\n| `if (show) Widget()` | No | ❌ (removed) | No | No | Cheapest when hidden |\n| `Visibility(visible: false)` | No (default) | ❌ by default (`maintainState: true` to keep) | No | No | Cheap |\n| `Offstage(offstage: true)` | No | ✅ | No | No | Layout still runs |\n| `Opacity(opacity: 0)` | Yes | ✅ | No (0 is optimised) | **Yes** (still tappable!) | Opacity between 0–1 costs a layer |\n| `IgnorePointer` / `AbsorbPointer` | — | — | — | blocks taps | — |\n\n---\n\n## 7.6 LayoutBuilder & responsive design\n\n### LayoutBuilder\n```dart\nLayoutBuilder(\n  builder: (context, constraints) {\n    if (constraints.maxWidth >= 1200) return const DesktopLayout();\n    if (constraints.maxWidth >= 600) return const TabletLayout();\n    return const MobileLayout();\n  },\n)\n```\nLayoutBuilder uses the **parent's constraints** (available space for this widget), not the full screen — great for reusable components.\n\n### MediaQuery\n```dart\nfinal size = MediaQuery.sizeOf(context);            // logical pixels of the window\nfinal padding = MediaQuery.paddingOf(context);       // safe area insets (notch)\nfinal viewInsets = MediaQuery.viewInsetsOf(context); // keyboard height in bottom\nfinal dpr = MediaQuery.devicePixelRatioOf(context);\nfinal textScaler = MediaQuery.textScalerOf(context);\nfinal orientation = MediaQuery.orientationOf(context);\n```\n**Logical pixels (dp):** Flutter uses logical pixels; ~38 per cm. Physical pixels = logical × devicePixelRatio.\n\n### Responsive vs Adaptive\n* **Responsive** — the layout adapts to **available space** (one column on phone, two on tablet).\n* **Adaptive** — the app adapts to the **platform/input type** (Cupertino vs Material controls, mouse hover, keyboard shortcuts, desktop menus, touch target sizes).\n\n### Material 3 window size classes (breakpoints)\n| Class | Width (dp) | Typical layout |\n|---|---|---|\n| Compact | \u003c 600 | Bottom navigation bar, single pane |\n| Medium | 600–839 | Navigation rail, maybe two panes |\n| Expanded | 840–1199 | Navigation rail/drawer, two panes |\n| Large | 1200–1599 | Permanent drawer, list-detail |\n| Extra-large | ≥ 1600 | Multiple panes |\n\nResponsive best practices:\n* Base decisions on **window width** (not device type/orientation) — split-screen and foldables exist.\n* Use `LayoutBuilder` for component-level decisions.\n* Don't lock orientation unless required (large screens; Android 16+ ignores orientation/resizability restrictions on large screens for apps targeting recent SDKs).\n* Constrain content width on big screens: `ConstrainedBox(constraints: BoxConstraints(maxWidth: 600), child: ...)` centered.\n* Use `Wrap`, `GridView` with `SliverGridDelegateWithMaxCrossAxisExtent`.\n* Packages: `flutter_adaptive_scaffold` (now discontinued/community), `responsive_framework`, `flutter_screenutil` (scales sizes by design dimensions — popular in companies, but beware of scaling text unnaturally and breaking accessibility).\n\n### SafeArea\n```dart\nScaffold(body: SafeArea(child: content));  // pads for notch/status bar/home indicator\nSafeArea(bottom: false, child: ...);       // selectively\n```\nOn Android 15+, apps targeting SDK 35 are **edge-to-edge by default** — content draws behind system bars, so correct `SafeArea`/padding handling is critical.\n\n---\n\n## 7.7 The famous layout errors (and EXACT fixes) 🚨\n\n### 7.7.1 \"A RenderFlex overflowed by 42 pixels on the right.\"\nYellow/black stripes. A Row/Column's children are bigger than the available space.\n```dart\n// ❌\nRow(children: [Icon(Icons.person), Text('A very very very long user name that keeps going')]);\n// ✅ Fix 1: Expanded/Flexible + overflow handling\nRow(children: [\n  const Icon(Icons.person),\n  Expanded(child: Text(name, overflow: TextOverflow.ellipsis, maxLines: 1)),\n]);\n// ✅ Fix 2: Wrap instead of Row\n// ✅ Fix 3: make it scrollable: SingleChildScrollView(scrollDirection: Axis.horizontal, child: Row(...))\n```\n**Column overflow when keyboard opens** (bottom overflowed by N pixels): The Scaffold resizes the body when the keyboard opens (`resizeToAvoidBottomInset: true` default), so a fixed-height Column of fields overflows. Fix: wrap in `SingleChildScrollView` (or use `ListView`). Don't \"fix\" by setting `resizeToAvoidBottomInset: false` unless you handle insets yourself — the keyboard would then cover fields.\n\n### 7.7.2 \"Vertical viewport was given unbounded height.\"\n```dart\n// ❌ ListView inside Column — Column gives unbounded height to children; ListView wants to fill infinite height.\nColumn(children: [Text('Header'), ListView(children: items)]);\n// ✅ Fix 1: Expanded\nColumn(children: [const Text('Header'), Expanded(child: ListView(children: items))]);\n// ✅ Fix 2: fixed height\nSizedBox(height: 200, child: ListView(...));\n// ✅ Fix 3: shrinkWrap (⚠️ lays out ALL children → bad for long lists)\nListView(shrinkWrap: true, physics: const NeverScrollableScrollPhysics(), children: items);\n// ✅ Best for complex scrolling pages: CustomScrollView with slivers (Chapter 9)\n```\nSame error horizontally: \"Horizontal viewport was given unbounded width\" (horizontal ListView inside Row) → wrap in `Expanded` or give a fixed width; a horizontal ListView inside a Column needs a **fixed height** (`SizedBox(height: 120, child: ListView(scrollDirection: Axis.horizontal, ...))`).\n\n### 7.7.3 \"RenderBox was not laid out\" / \"BoxConstraints forces an infinite width\"\nUsually a follow-up error caused by the unbounded constraint problems above. **Scroll to the FIRST error in the console** — later errors are consequences.\n```dart\n// ❌ TextField inside Row → \"An InputDecorator...cannot have an unbounded width\"\nRow(children: [TextField()]);\n// ✅\nRow(children: [Expanded(child: TextField())]);\n```\n```dart\n// ❌ Expanded inside a SingleChildScrollView > Column → unbounded height can't be divided\nSingleChildScrollView(child: Column(children: [Expanded(child: ...)])); // error: \"RenderFlex children have non-zero flex but incoming height constraints are unbounded.\"\n```\nFix: remove `Expanded`, or use `CustomScrollView` + `SliverFillRemaining(hasScrollBody: false)`, or `LayoutBuilder` + `ConstrainedBox(minHeight: constraints.maxHeight)` + `IntrinsicHeight` pattern:\n```dart\nLayoutBuilder(builder: (context, constraints) => SingleChildScrollView(\n  child: ConstrainedBox(\n    constraints: BoxConstraints(minHeight: constraints.maxHeight),\n    child: IntrinsicHeight(\n      child: Column(children: [\n        const Text('Top'),\n        const Spacer(),            // pushes button to bottom when content is short\n        ElevatedButton(onPressed: () {}, child: const Text('Submit')),\n      ]),\n    ),\n  ),\n));\n```\n\n### 7.7.4 \"Incorrect use of ParentDataWidget.\"\n`Expanded` not directly under Row/Column/Flex, or `Positioned` not directly under Stack. Fix structure.\n\n### 7.7.5 Container width ignored\nParent gives tight constraints (e.g., the item of a `ListView` is forced to full width cross-axis; `CrossAxisAlignment.stretch`). Fix: wrap with `Align`/`Center` to loosen constraints.\n\n### 7.7.6 Text overflow without error but cut off\nUse `maxLines`, `overflow: TextOverflow.ellipsis`, `softWrap`, `FittedBox`, or `AutoSizeText` package.\n\n### 7.7.7 Debugging layout tools\n* **Flutter Inspector** → \"Layout Explorer\" shows flex properties and constraints visually.\n* `debugPaintSizeEnabled = true;` (or press `p`) shows boxes, padding, alignment.\n* Hover/select a widget in DevTools to see its constraints & size.\n* Wrap with `ColoredBox(color: Colors.red.withValues(alpha: 0.3))` temporarily.\n\n---\n\n## 7.8 Building a real responsive screen (worked example)\n\n```dart\nclass ProductPage extends StatelessWidget {\n  const ProductPage({super.key, required this.product});\n  final Product product;\n\n  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n      appBar: AppBar(title: Text(product.name)),\n      body: SafeArea(\n        child: LayoutBuilder(\n          builder: (context, constraints) {\n            final wide = constraints.maxWidth >= 840;\n            final image = AspectRatio(\n              aspectRatio: 1,\n              child: ClipRRect(\n                borderRadius: BorderRadius.circular(16),\n                child: Image.network(product.imageUrl, fit: BoxFit.cover),\n              ),\n            );\n            final details = _Details(product: product);\n\n            if (wide) {\n              return Center(\n                child: ConstrainedBox(\n                  constraints: const BoxConstraints(maxWidth: 1200),\n                  child: Padding(\n                    padding: const EdgeInsets.all(24),\n                    child: Row(\n                      crossAxisAlignment: CrossAxisAlignment.start,\n                      children: [\n                        Expanded(child: image),\n                        const SizedBox(width: 32),\n                        Expanded(child: SingleChildScrollView(child: details)),\n                      ],\n                    ),\n                  ),\n                ),\n              );\n            }\n            return ListView(\n              padding: const EdgeInsets.all(16),\n              children: [image, const SizedBox(height: 16), details],\n            );\n          },\n        ),\n      ),\n    );\n  }\n}\n\nclass _Details extends StatelessWidget {\n  const _Details({required this.product});\n  final Product product;\n  @override\n  Widget build(BuildContext context) {\n    final t = Theme.of(context).textTheme;\n    return Column(\n      crossAxisAlignment: CrossAxisAlignment.start,\n      children: [\n        Text(product.name, style: t.headlineSmall),\n        const SizedBox(height: 8),\n        Row(children: [\n          Text('₹${product.price}', style: t.titleLarge),\n          const Spacer(),\n          const Icon(Icons.star, size: 18),\n          Text(product.rating.toStringAsFixed(1)),\n        ]),\n        const SizedBox(height: 16),\n        Text(product.description),\n        const SizedBox(height: 24),\n        SizedBox(\n          width: double.infinity,\n          child: FilledButton(onPressed: () {}, child: const Text('Add to cart')),\n        ),\n      ],\n    );\n  }\n}\n```\n\n---\n\n## 7.9 Interview Questions — Layout\n\n**Q1. Explain Flutter's layout algorithm.** Constraints go down, sizes go up, parent sets position — single pass (mostly linear) layout where parents pass BoxConstraints to children, children choose sizes within them, and parents position children.\n\n**Q2. Tight vs loose constraints?** Tight: min == max (exact size). Loose: min 0, child may choose anything up to max.\n\n**Q3. Why does my Container ignore its width?** Its parent passes tight constraints; Container must obey. Wrap in `Center`/`Align` to loosen.\n\n**Q4. Expanded vs Flexible?** Expanded forces child to fill allocated flex space (FlexFit.tight); Flexible allows child to be smaller (FlexFit.loose).\n\n**Q5. How to fix \"Vertical viewport was given unbounded height\"?** Give the scrollable bounded height — Expanded, SizedBox, or shrinkWrap (costly), or use slivers.\n\n**Q6. How do you make a layout responsive?** LayoutBuilder/MediaQuery breakpoints (window size classes), flexible widgets (Expanded, Wrap, Flexible, FractionallySizedBox, AspectRatio), constraining max widths, adaptive navigation (bar/rail/drawer), testing on multiple sizes.\n\n**Q7. MediaQuery vs LayoutBuilder?** MediaQuery provides app window info (size, padding, insets, text scale); LayoutBuilder provides constraints from the parent, better for reusable components.\n\n**Q8. Why use `MediaQuery.sizeOf` instead of `MediaQuery.of(context).size`?** `sizeOf` subscribes only to size changes (InheritedModel aspects), avoiding rebuilds when unrelated properties (like keyboard insets) change.\n\n**Q9. What is IntrinsicHeight and why is it expensive?** It sizes its child to the child's intrinsic height by running a speculative layout pass — can be O(N²) in nested cases; avoid in lists.\n\n**Q10. Stack sizing rules?** Sized by non-positioned children; positioned children placed relative to Stack edges; overflow clipped by default; out-of-bounds children don't receive hits.\n\n**Q11. Difference between `Transform` and `RotatedBox`?** Transform applies at paint time (layout unaffected, hit testing transformed); RotatedBox rotates in quarter turns during layout so surrounding layout adapts.\n\n**Q12. What is SafeArea?** Widget inserting padding to avoid OS intrusions (notches, status bar, home indicator).\n\n**Q13. Logical vs physical pixels?** Logical = device-independent units; physical = logical × devicePixelRatio.\n\n**Q14. How do you push a button to the bottom of a scrollable form when content is short?** LayoutBuilder + SingleChildScrollView + ConstrainedBox(minHeight) + IntrinsicHeight + Spacer, or CustomScrollView with SliverFillRemaining(hasScrollBody: false).\n\n**Q15. What's the difference between `Opacity(0)`, `Visibility` and `Offstage`?** See table §7.5 — Opacity keeps space and hit testing; Visibility removes from layout (optionally maintaining state); Offstage lays out but doesn't paint or hit-test.\n"}, {"n": 8, "file": "08-common-widgets-forms-dialogs.md", "title": "Chapter 8 — The Widget Catalog: Text, Images, Buttons, Inputs, Forms, Scaffold, Dialogs & More", "subtitle": "The Widget Catalog: Text, Images, Buttons, Inputs, Forms, Scaffold, Dialogs & More", "short": "Widget Catalog & Forms", "sub": "Buttons, inputs, validation, dialogs", "level": "beginner", "minutes": 13, "qa": 14, "md": "# Chapter 8 — The Widget Catalog: Text, Images, Buttons, Inputs, Forms, Scaffold, Dialogs & More\n\n> **Goal:** Know the everyday widgets thoroughly — their important properties, gotchas, and the modern (Material 3) replacements for deprecated ones.\n\n---\n\n## 8.1 App shells: MaterialApp, CupertinoApp, WidgetsApp\n\n```dart\nMaterialApp(\n  title: 'Shop',                        // used by OS task switcher (Android) / web tab\n  debugShowCheckedModeBanner: false,    // hide DEBUG ribbon\n  theme: lightTheme,\n  darkTheme: darkTheme,\n  themeMode: ThemeMode.system,          // .light/.dark/.system\n  home: const HomePage(),               // OR routes / onGenerateRoute / router config\n  routes: {'/settings': (_) => const SettingsPage()},\n  navigatorKey: rootNavigatorKey,       // navigate without context\n  scaffoldMessengerKey: messengerKey,   // show snackbars without context\n  localizationsDelegates: AppLocalizations.localizationsDelegates,\n  supportedLocales: AppLocalizations.supportedLocales,\n  locale: const Locale('en'),\n  builder: (context, child) => MediaQuery(           // wrap every route\n    data: MediaQuery.of(context).copyWith(textScaler: TextScaler.noScaling), // (⚠️ accessibility — don't disable scaling casually)\n    child: child!,\n  ),\n);\n// With go_router or Navigator 2.0:\nMaterialApp.router(routerConfig: router);\n```\n`MaterialApp` provides: `Navigator`, `Theme`, `MediaQuery`, `Localizations`, `Directionality`, `ScaffoldMessenger`, `DefaultTextStyle`, `Overlay`, `Shortcuts`/`Actions`, `HeroController`, etc. Many \"No X ancestor found\" errors mean you used something **above** MaterialApp.\n\n---\n\n## 8.2 Scaffold — the page skeleton 🦴\n\n```dart\nScaffold(\n  appBar: AppBar(\n    title: const Text('Inbox'),\n    centerTitle: true,\n    leading: const BackButton(),            // usually automatic\n    actions: [IconButton(icon: const Icon(Icons.search), onPressed: () {})],\n    bottom: const TabBar(tabs: [...]),       // with DefaultTabController\n    elevation: 0, scrolledUnderElevation: 3, // M3: tint when content scrolls under\n  ),\n  body: const InboxList(),\n  floatingActionButton: FloatingActionButton.extended(\n    onPressed: () {}, icon: const Icon(Icons.edit), label: const Text('Compose'),\n  ),\n  floatingActionButtonLocation: FloatingActionButtonLocation.endFloat,\n  drawer: const AppDrawer(),          // left (start) drawer\n  endDrawer: const FilterDrawer(),\n  bottomNavigationBar: NavigationBar(  // M3 (BottomNavigationBar is M2 style)\n    selectedIndex: index,\n    onDestinationSelected: (i) => setState(() => index = i),\n    destinations: const [\n      NavigationDestination(icon: Icon(Icons.home_outlined), selectedIcon: Icon(Icons.home), label: 'Home'),\n      NavigationDestination(icon: Icon(Icons.person_outline), label: 'Profile'),\n    ],\n  ),\n  bottomSheet: null,\n  backgroundColor: null,              // from theme\n  resizeToAvoidBottomInset: true,     // shrink body when keyboard shows\n  extendBody: false,                  // body behind bottom nav (for translucent bars)\n  extendBodyBehindAppBar: false,\n);\n```\n\n### Nested Scaffolds\nEach route usually has its own Scaffold. Avoid Scaffold inside Scaffold body unless needed (e.g., tabs with own FAB); inner AppBars then don't handle status bar padding automatically.\n\n---\n\n## 8.3 Text & typography\n\n```dart\nText(\n  'Hello world',\n  style: Theme.of(context).textTheme.bodyLarge?.copyWith(fontWeight: FontWeight.w600),\n  textAlign: TextAlign.center,\n  maxLines: 2,\n  overflow: TextOverflow.ellipsis,   // .clip/.fade/.ellipsis/.visible\n  softWrap: true,\n  textScaler: TextScaler.linear(1.0), // usually leave default to respect user setting\n  semanticsLabel: 'Greeting',\n  selectionColor: null,\n)\n\nText.rich(TextSpan(\n  text: 'By continuing you agree to our ',\n  children: [\n    TextSpan(\n      text: 'Terms',\n      style: const TextStyle(decoration: TextDecoration.underline),\n      recognizer: _tapRecognizer, // TapGestureRecognizer()..onTap = openTerms — create in initState & dispose!\n    ),\n    const TextSpan(text: '.'),\n  ],\n));\n\nconst SelectableText('Copy me');\nSelectionArea(child: Column(children: [...]));   // make many Texts selectable (web/desktop)\nDefaultTextStyle(style: ..., child: ...);         // default style for subtree\n```\n* `TextStyle` props: `fontSize`, `fontWeight`, `fontStyle`, `color`, `letterSpacing`, `wordSpacing`, `height` (line height multiplier), `decoration`, `fontFamily`, `fontFeatures` (tabular numbers: `FontFeature.tabularFigures()`), `shadows`, `overflow`, `leadingDistribution`.\n* **Text scaling:** `textScaleFactor` is deprecated (Flutter 3.16) in favour of `TextScaler` (supports nonlinear scaling on Android 14+).\n* `google_fonts` package downloads fonts at runtime (cache) or bundle them — for production, consider bundling (offline, GDPR/privacy reasons): `GoogleFonts.config.allowRuntimeFetching = false;` with font files in assets.\n\n---\n\n## 8.4 Images 🖼️\n\n```dart\nImage.asset('assets/images/logo.png', width: 120, fit: BoxFit.contain);\nImage.network(\n  url,\n  fit: BoxFit.cover,\n  loadingBuilder: (context, child, progress) =>\n      progress == null ? child : const Center(child: CircularProgressIndicator()),\n  errorBuilder: (context, error, stack) => const Icon(Icons.broken_image),\n  cacheWidth: 300,                 // ⭐ decode at smaller size → saves LOTS of memory\n);\nImage.file(File(path));\nImage.memory(bytes);\nconst FadeInImage.assetNetwork(placeholder: 'assets/ph.png', image: url);\n```\n* `BoxFit`: `fill` (stretch), `contain` (fit inside, letterbox), `cover` (fill & crop), `fitWidth`, `fitHeight`, `none`, `scaleDown`.\n* **`cached_network_image`** package — disk caching of network images (standard in production apps).\n* SVG: **`flutter_svg`** package (`SvgPicture.asset('assets/icon.svg')`). For performance, `vector_graphics` precompiles SVGs.\n* `Image.network` keeps decoded images in `ImageCache` (memory, default 1000 images / 100 MB). Huge images at full resolution cause **OOM crashes** — use `cacheWidth/cacheHeight` or `ResizeImage`.\n* `precacheImage(AssetImage('assets/hero.png'), context)` in `didChangeDependencies` to avoid flicker.\n* `Ink.image` / `Ink` for images with ink splashes.\n* `CircleAvatar(backgroundImage: NetworkImage(url))`.\n\n---\n\n## 8.5 Icons\n```dart\nconst Icon(Icons.favorite, color: Colors.red, size: 24, semanticLabel: 'Favorite');\nconst Icon(CupertinoIcons.heart);       // import cupertino_icons\nIcon(Icons.adaptive.share);             // platform-adaptive icon\n```\nCustom icon fonts via FlutterIcon.com / `IconData(0xe800, fontFamily: 'MyIcons')`. Material Symbols via `material_symbols_icons` package. Tree shaking of icon fonts happens in release (`--no-tree-shake-icons` disables; required if you construct `IconData` dynamically from non-const values).\n\n---\n\n## 8.6 Buttons (Material 3)\n\n| Widget | Look | Use |\n|---|---|---|\n| `FilledButton` | solid fill | primary action (M3) |\n| `FilledButton.tonal` | soft fill | secondary emphasis |\n| `ElevatedButton` | raised with shadow/tint | when separation from patterned background needed |\n| `OutlinedButton` | border | medium emphasis |\n| `TextButton` | text only | low emphasis, dialogs |\n| `IconButton` (+ `.filled`, `.filledTonal`, `.outlined`) | icon | toolbar actions |\n| `FloatingActionButton` (`.small`, `.large`, `.extended`) | FAB | main screen action |\n| `SegmentedButton` | segments | choose 1 or many options |\n| `DropdownMenu` / `DropdownButton` | menu | choose one |\n| `MenuAnchor`, `PopupMenuButton` | menus | overflow/context menus |\n| `CupertinoButton` | iOS style | iOS UI |\n\nOld `RaisedButton`, `FlatButton`, `OutlineButton` were **removed** (Flutter 2.x deprecated → removed in 3.x). Interviewers may ask: \"What replaced RaisedButton?\" → `ElevatedButton`.\n\n```dart\nFilledButton.icon(\n  onPressed: isLoading ? null : submit,     // null onPressed = DISABLED\n  icon: const Icon(Icons.send),\n  label: const Text('Send'),\n  style: FilledButton.styleFrom(\n    minimumSize: const Size.fromHeight(48),\n    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),\n  ),\n);\n\n// Per-state styling with WidgetStateProperty (was MaterialStateProperty before Flutter 3.19)\nButtonStyle(\n  backgroundColor: WidgetStateProperty.resolveWith((states) {\n    if (states.contains(WidgetState.disabled)) return Colors.grey;\n    if (states.contains(WidgetState.pressed)) return Colors.blue.shade700;\n    return Colors.blue;\n  }),\n);\n```\n**Disabling a button** = pass `onPressed: null`.\n\n**Preventing double taps** (very common real bug: duplicate orders/payments): disable while loading, or guard with a flag:\n```dart\nbool _submitting = false;\nFuture\u003cvoid> _submit() async {\n  if (_submitting) return;\n  setState(() => _submitting = true);\n  try { await api.placeOrder(); } finally { if (mounted) setState(() => _submitting = false); }\n}\n```\n(And the backend should be idempotent — use idempotency keys.)\n\n### InkWell vs GestureDetector\n* `InkWell` — Material ripple effect; needs a `Material` ancestor (else ripple is invisible/hidden behind a colored Container — wrap with `Material(color: ...)` or use `Ink` for decoration).\n* `GestureDetector` — no visual feedback, many gestures (Chapter 13).\n\n---\n\n## 8.7 Text input — TextField & TextFormField ⌨️\n\n```dart\nclass _LoginState extends State\u003cLogin> {\n  final _emailCtrl = TextEditingController();\n  final _focus = FocusNode();\n\n  @override\n  void dispose() {\n    _emailCtrl.dispose();   // ❗ always dispose controllers & focus nodes\n    _focus.dispose();\n    super.dispose();\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return TextField(\n      controller: _emailCtrl,\n      focusNode: _focus,\n      keyboardType: TextInputType.emailAddress,\n      textInputAction: TextInputAction.next,       // keyboard action button\n      autofillHints: const [AutofillHints.email],   // password managers\n      autocorrect: false,\n      textCapitalization: TextCapitalization.none,\n      obscureText: false,                            // true for passwords\n      maxLength: 50,\n      maxLines: 1,                                   // null = grows; minLines for multiline\n      inputFormatters: [FilteringTextInputFormatter.deny(RegExp(r'\\s'))],\n      decoration: InputDecoration(\n        labelText: 'Email',\n        hintText: 'you@example.com',\n        prefixIcon: const Icon(Icons.email),\n        suffixIcon: IconButton(icon: const Icon(Icons.clear), onPressed: _emailCtrl.clear),\n        border: const OutlineInputBorder(),\n        errorText: _error,     // shows error state\n        helperText: 'We never share it',\n        counterText: '',       // hide maxLength counter\n      ),\n      onChanged: (value) {},\n      onSubmitted: (_) => FocusScope.of(context).nextFocus(),\n      onTapOutside: (_) => FocusScope.of(context).unfocus(),  // dismiss keyboard on outside tap\n    );\n  }\n}\n```\nCommon input formatters: `FilteringTextInputFormatter.digitsOnly`, `.allow(RegExp(...))`, `LengthLimitingTextInputFormatter(10)`, custom `TextInputFormatter` subclass for masks (phone, card) — or packages like `mask_text_input_formatter`.\n\nReading/writing controller:\n```dart\n_emailCtrl.text;                          // read\n_emailCtrl.text = 'a@b.com';              // write (moves cursor to... careful)\n_emailCtrl.value = TextEditingValue(text: t, selection: TextSelection.collapsed(offset: t.length));\n_emailCtrl.addListener(() => print(_emailCtrl.text));\n```\n\nHide keyboard: `FocusScope.of(context).unfocus()` or `FocusManager.instance.primaryFocus?.unfocus()`.\nProgrammatic focus: `_focus.requestFocus()`; autofocus: `autofocus: true`.\n\n### Common TextField bugs\n| Bug | Fix |\n|---|---|\n| Controller created in `build` → cursor jumps, text resets | Create in `initState` (or as field), dispose in `dispose` |\n| TextField in Row → unbounded width error | Wrap in `Expanded` |\n| Keyboard covers field | `Scaffold(resizeToAvoidBottomInset: true)` + scrollable body; `Scrollable.ensureVisible`; `scrollPadding` |\n| Bottom overflow when keyboard opens | `SingleChildScrollView` |\n| `setState` on every keystroke rebuilding whole form | Keep form in its own widget; use `ValueListenableBuilder` on controller |\n| Losing text when list scrolls (TextField in ListView items) | Keep values in a model/state, not only in item widgets; or keys + AutomaticKeepAlive |\n| Arabic/RTL cursor issues | Use `TextDirection`/`Directionality` & locale correctly |\n\n---\n\n## 8.8 Forms & validation ✅\n\n```dart\nclass SignUpForm extends StatefulWidget {\n  const SignUpForm({super.key});\n  @override\n  State\u003cSignUpForm> createState() => _SignUpFormState();\n}\n\nclass _SignUpFormState extends State\u003cSignUpForm> {\n  final _formKey = GlobalKey\u003cFormState>();\n  final _password = TextEditingController();\n  String? _email;\n  bool _agree = false;\n\n  @override\n  void dispose() { _password.dispose(); super.dispose(); }\n\n  void _submit() {\n    final form = _formKey.currentState!;\n    if (!form.validate()) return;   // runs all validators, shows errors\n    form.save();                    // calls onSaved for each field\n    // call API with _email, _password.text\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return Form(\n      key: _formKey,\n      autovalidateMode: AutovalidateMode.onUserInteraction,  // validate as user types (after first interaction)\n      child: Column(children: [\n        TextFormField(\n          decoration: const InputDecoration(labelText: 'Email'),\n          keyboardType: TextInputType.emailAddress,\n          validator: (v) {\n            if (v == null || v.trim().isEmpty) return 'Email is required';\n            if (!RegExp(r'^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$').hasMatch(v)) return 'Enter a valid email';\n            return null;   // null = valid\n          },\n          onSaved: (v) => _email = v!.trim(),\n        ),\n        TextFormField(\n          controller: _password,\n          obscureText: true,\n          decoration: const InputDecoration(labelText: 'Password'),\n          validator: (v) => (v ?? '').length \u003c 8 ? 'At least 8 characters' : null,\n        ),\n        TextFormField(\n          obscureText: true,\n          decoration: const InputDecoration(labelText: 'Confirm password'),\n          validator: (v) => v != _password.text ? 'Passwords do not match' : null,\n        ),\n        FormField\u003cbool>(                      // custom form field (checkbox)\n          initialValue: _agree,\n          validator: (v) => v == true ? null : 'You must accept the terms',\n          builder: (state) => Column(children: [\n            CheckboxListTile(\n              value: state.value,\n              onChanged: (v) { state.didChange(v); _agree = v!; },\n              title: const Text('I accept the terms'),\n            ),\n            if (state.hasError) Text(state.errorText!, style: TextStyle(color: Theme.of(context).colorScheme.error)),\n          ]),\n        ),\n        FilledButton(onPressed: _submit, child: const Text('Sign up')),\n      ]),\n    );\n  }\n}\n```\n* `AutovalidateMode`: `disabled`, `always`, `onUserInteraction`, `onUnfocus` (added in recent Flutter 3.x releases).\n* Server-side errors: keep a `String? _serverError` and pass via `InputDecoration(errorText:)`, or use `forceErrorText` on `FormField`/`TextFormField` (available in recent Flutter 3.x releases).\n* `form.reset()` resets fields to initial values.\n* Packages for complex forms: `flutter_form_builder`, `reactive_forms`, `formz` (validation models, used with Bloc).\n* Wrap forms in `AutofillGroup` for password managers; call `TextInput.finishAutofillContext()` after login.\n\n---\n\n## 8.9 Selection controls\n\n```dart\nCheckbox(value: checked, onChanged: (v) => setState(() => checked = v!), tristate: false);\nCheckboxListTile(value: x, onChanged: ..., title: const Text('Wi-Fi'));\nSwitch(value: on, onChanged: (v) => setState(() => on = v));\nSwitch.adaptive(...);                         // Cupertino on iOS\nSwitchListTile(...);\nRadio\u003cGender>(value: Gender.male, groupValue: g, onChanged: (v) => setState(() => g = v));\n// Note: newer Flutter versions introduce RadioGroup to manage groupValue/onChanged — check your version.\nSlider(value: v, min: 0, max: 100, divisions: 10, label: '${v.round()}', onChanged: ...);\nRangeSlider(values: RangeValues(20, 80), onChanged: ...);\nChoiceChip(label: Text('S'), selected: size == 'S', onSelected: ...);\nFilterChip(...); InputChip(...); ActionChip(...);\nDropdownMenu\u003cString>(\n  dropdownMenuEntries: const [DropdownMenuEntry(value: 'in', label: 'India')],\n  onSelected: (v) {},\n);\nDropdownButtonFormField\u003cString>(items: [...], onChanged: ..., validator: ...);\n```\nDate & time pickers:\n```dart\nfinal date = await showDatePicker(\n  context: context,\n  initialDate: DateTime.now(),\n  firstDate: DateTime(2000),\n  lastDate: DateTime(2100),\n);\nfinal time = await showTimePicker(context: context, initialTime: TimeOfDay.now());\nfinal range = await showDateRangePicker(context: context, firstDate: ..., lastDate: ...);\n// iOS style: CupertinoDatePicker inside showCupertinoModalPopup\n```\n\n---\n\n## 8.10 Dialogs, bottom sheets, snackbars, overlays 💬\n\n### Dialogs\n```dart\nfinal confirmed = await showDialog\u003cbool>(\n  context: context,\n  barrierDismissible: false,          // tap outside doesn't close\n  builder: (dialogContext) => AlertDialog(\n    title: const Text('Delete item?'),\n    content: const Text('This cannot be undone.'),\n    actions: [\n      TextButton(onPressed: () => Navigator.pop(dialogContext, false), child: const Text('Cancel')),\n      FilledButton(onPressed: () => Navigator.pop(dialogContext, true), child: const Text('Delete')),\n    ],\n  ),\n);\nif (confirmed == true) { ... }  // could be null if dismissed\n```\n* Dialogs are **routes** pushed on the Navigator → `Navigator.pop(context, result)` returns a value.\n* Use the **dialog's own context** (`dialogContext`) to pop, especially with nested navigators.\n* `showAdaptiveDialog` + `AlertDialog.adaptive` for iOS look.\n* `SimpleDialog`, `Dialog` (custom content), `Dialog.fullscreen`.\n* `showGeneralDialog` for custom transitions.\n* Use `useRootNavigator: true` (default for showDialog) to show above nested navigators (bottom nav tabs).\n\n### Bottom sheets\n```dart\nfinal choice = await showModalBottomSheet\u003cString>(\n  context: context,\n  isScrollControlled: true,       // allow > half screen & keyboard handling\n  showDragHandle: true,\n  useSafeArea: true,\n  builder: (ctx) => Padding(\n    padding: EdgeInsets.only(bottom: MediaQuery.viewInsetsOf(ctx).bottom), // above keyboard\n    child: const ShareOptions(),\n  ),\n);\n// Draggable heights:\nDraggableScrollableSheet(initialChildSize: 0.4, minChildSize: 0.2, maxChildSize: 0.9,\n  builder: (ctx, scrollController) => ListView(controller: scrollController, children: ...));\n// Persistent: Scaffold.of(context).showBottomSheet(...)\n```\n\n### SnackBars\n```dart\nScaffoldMessenger.of(context).showSnackBar(\n  SnackBar(\n    content: const Text('Item deleted'),\n    action: SnackBarAction(label: 'UNDO', onPressed: undo),\n    behavior: SnackBarBehavior.floating,\n    duration: const Duration(seconds: 4),\n  ),\n);\nScaffoldMessenger.of(context).hideCurrentSnackBar();\n```\n`Scaffold.of(context).showSnackBar` was **removed** — use `ScaffoldMessenger` (snackbars survive route changes). For showing snackbars from non-UI code (e.g., a service), use a `GlobalKey\u003cScaffoldMessengerState>` on MaterialApp.\n\nAlso: `MaterialBanner` (`showMaterialBanner`), toasts via packages (`fluttertoast`, `toastification`).\n\n### Tooltips, popups & overlays\n```dart\nconst Tooltip(message: 'Add item', child: Icon(Icons.add));\nPopupMenuButton\u003cString>(itemBuilder: (_) => [const PopupMenuItem(value: 'edit', child: Text('Edit'))], onSelected: ...);\nMenuAnchor(menuChildren: [...], builder: (context, controller, child) => IconButton(onPressed: controller.open, ...));\n```\n`Overlay` / `OverlayEntry` / **`OverlayPortal`** (Flutter 3.10+, declarative overlay tied to widget tree) for custom popups like autocomplete dropdowns; `CompositedTransformTarget` + `CompositedTransformFollower` to anchor overlays to widgets. `Autocomplete\u003cT>` widget built-in.\n\n---\n\n## 8.11 Lists & tiles (intro — scrolling deep dive in Chapter 9)\n\n```dart\nListTile(\n  leading: const CircleAvatar(child: Text('A')),\n  title: const Text('Asha'),\n  subtitle: const Text('Last seen 2m ago'),\n  trailing: const Icon(Icons.chevron_right),\n  onTap: () {},\n  dense: false,\n  contentPadding: const EdgeInsets.symmetric(horizontal: 16),\n);\nconst Divider(height: 1);\nCard(child: ListTile(...));\nExpansionTile(title: const Text('FAQ'), children: [const Text('Answer')]);\nDismissible(\n  key: ValueKey(item.id),             // REQUIRED unique key\n  direction: DismissDirection.endToStart,\n  background: Container(color: Colors.red),\n  confirmDismiss: (dir) async => await askConfirm(),\n  onDismissed: (_) => setState(() => items.remove(item)), // MUST remove from data or error:\n  child: ListTile(title: Text(item.title)),               // \"A dismissed Dismissible widget is still part of the tree.\"\n);\nReorderableListView(onReorder: (oldI, newI) {...}, children: [for (final i in items) ListTile(key: ValueKey(i.id), ...)]);\n```\n\n---\n\n## 8.12 Progress, feedback & misc\n```dart\nconst CircularProgressIndicator();\nconst LinearProgressIndicator(value: 0.4);     // determinate\nCircularProgressIndicator.adaptive();\nRefreshIndicator(onRefresh: () async => await reload(), child: ListView(...)); // pull to refresh (child must be scrollable & AlwaysScrollableScrollPhysics if few items)\nconst Badge(label: Text('3'), child: Icon(Icons.notifications));\nChip(label: const Text('Flutter'), onDeleted: () {});\nStepper(steps: [...]);\nTabBar + TabBarView + DefaultTabController(length: 3, child: ...);\nNavigationRail(...); NavigationDrawer(...);\nSearchAnchor / SearchBar (M3 search);\nPlaceholder();   // draws a box with an X — scaffolding\n```\n`HapticFeedback.lightImpact()`, `SystemSound.play(SystemSoundType.click)`, `Clipboard.setData(ClipboardData(text: 'x'))`, `SystemChrome.setPreferredOrientations([...])`, `SystemChrome.setSystemUIOverlayStyle(...)` / `AnnotatedRegion\u003cSystemUiOverlayStyle>` for status bar icon colours.\n\n---\n\n## 8.13 Cupertino (iOS-style) widgets\n\n`CupertinoApp`, `CupertinoPageScaffold`, `CupertinoNavigationBar`, `CupertinoSliverNavigationBar` (large titles), `CupertinoTabScaffold`/`CupertinoTabBar`, `CupertinoButton`, `CupertinoSwitch`, `CupertinoSlider`, `CupertinoTextField`, `CupertinoAlertDialog`, `CupertinoActionSheet`, `CupertinoDatePicker`, `CupertinoPicker`, `CupertinoActivityIndicator`, `CupertinoContextMenu`, `CupertinoListSection`/`CupertinoListTile`, `CupertinoPageRoute` (swipe-back), `CupertinoSegmentedControl`/`CupertinoSlidingSegmentedControl`, `CupertinoSearchTextField`.\n\nAdaptive approach: Material widgets with `.adaptive` constructors (`Switch.adaptive`, `Slider.adaptive`, `CircularProgressIndicator.adaptive`, `AlertDialog.adaptive`, `Checkbox.adaptive`), or branch on `Theme.of(context).platform` / `defaultTargetPlatform`.\n\n---\n\n## 8.14 Interview Questions — Common widgets\n\n**Q1. What replaced `RaisedButton`/`FlatButton`/`OutlineButton`?** `ElevatedButton`/`TextButton`/`OutlinedButton` (and M3 adds `FilledButton`).\n\n**Q2. How do you disable a button?** Set `onPressed: null`.\n\n**Q3. How do you validate a form?** Wrap fields in `Form` with a `GlobalKey\u003cFormState>`, give `TextFormField`s `validator`s returning error strings or null, and call `formKey.currentState!.validate()`.\n\n**Q4. TextField vs TextFormField?** `TextFormField` wraps `TextField` in a `FormField`, integrating with `Form` (validator, onSaved, reset, autovalidate).\n\n**Q5. Why must controllers be disposed?** They hold listeners/resources (and for TextEditingController, platform text input connections); not disposing leaks memory.\n\n**Q6. How do you return data from a dialog?** `Navigator.pop(context, value)` and `await showDialog\u003cT>(...)`.\n\n**Q7. ScaffoldMessenger vs Scaffold.of for snackbars?** ScaffoldMessenger (root-level, persists across routes) replaced Scaffold.showSnackBar.\n\n**Q8. InkWell ripple not visible — why?** InkWell needs a `Material` ancestor and draws on it; an opaque `Container` color between hides the ink. Use `Material`/`Ink` for colour.\n\n**Q9. How do you prevent images from consuming too much memory?** `cacheWidth`/`cacheHeight`/`ResizeImage`, appropriately sized server images, caching packages, limit ImageCache size.\n\n**Q10. What is `Dismissible` and its common error?** Swipe-to-dismiss widget requiring a unique key; after `onDismissed` you must remove the item from the data list, else \"A dismissed Dismissible widget is still part of the tree\".\n\n**Q11. How do you show a bottom sheet that resizes with the keyboard?** `showModalBottomSheet(isScrollControlled: true)` + bottom padding = `MediaQuery.viewInsetsOf(context).bottom`.\n\n**Q12. What's `WidgetStateProperty`?** (Previously `MaterialStateProperty`) a way to resolve style values based on interaction states (pressed, hovered, focused, disabled, selected, error).\n\n**Q13. How do you make text selectable?** `SelectableText` or wrap in `SelectionArea`.\n\n**Q14. How do you dismiss the keyboard?** `FocusScope.of(context).unfocus()` / `FocusManager.instance.primaryFocus?.unfocus()`, `onTapOutside`, or `keyboardDismissBehavior: ScrollViewKeyboardDismissBehavior.onDrag` on scroll views.\n"}, {"n": 9, "file": "09-scrolling-and-slivers.md", "title": "Chapter 9 — Scrolling, Lists, Grids & Slivers", "subtitle": "Scrolling, Lists, Grids & Slivers", "short": "Scrolling & Slivers", "sub": "Lists, pagination, CustomScrollView", "level": "beginner", "minutes": 11, "qa": 10, "md": "# Chapter 9 — Scrolling, Lists, Grids & Slivers\n\n> **Goal:** Build fast, smooth lists of any size; understand viewports and slivers; implement pagination, pull-to-refresh, sticky headers, collapsing app bars, and fix scrolling bugs.\n\n---\n\n## 9.1 The 5-year-old picture: a window over a long paper roll 📜\n\nImagine a **very long paper roll** with drawings, and a **small window** you look through. You only need to *draw* the parts visible through the window (plus a little extra above and below so scrolling is smooth). That window is the **viewport**; the pieces of paper are **slivers** (\"thin slices\"); drawing only what's visible is **lazy building**.\n\n---\n\n## 9.2 SingleChildScrollView vs ListView\n\n| | `SingleChildScrollView` | `ListView` (default ctor) | `ListView.builder` / `.separated` |\n|---|---|---|---|\n| Builds children | All at once | All at once (children list) | **Lazily**, only visible + cache extent |\n| Good for | A form/one page bigger than screen | Small fixed lists | Long or infinite lists |\n| Memory | All children | All children | Only visible ones |\n\n```dart\nListView.builder(\n  itemCount: items.length,          // null = infinite\n  itemExtent: 72,                   // ⭐ fixed height → faster layout & jumping\n  // prototypeItem: const ListTile(title: Text('x')), // alternative: measure one prototype\n  padding: const EdgeInsets.symmetric(vertical: 8),\n  itemBuilder: (context, index) {\n    final item = items[index];\n    return ListTile(key: ValueKey(item.id), title: Text(item.title));\n  },\n);\n\nListView.separated(\n  itemCount: items.length,\n  separatorBuilder: (_, __) => const Divider(height: 1),\n  itemBuilder: (context, i) => ItemTile(item: items[i]),\n);\n```\n**Never** do `ListView(children: hugeList.map(...).toList())` for hundreds/thousands of items — it builds everything.\n\n### Important properties of scroll views\n* `scrollDirection: Axis.horizontal`\n* `reverse: true` (chat apps — newest at bottom, list starts at bottom)\n* `controller: ScrollController()`\n* `physics`: `BouncingScrollPhysics` (iOS), `ClampingScrollPhysics` (Android), `NeverScrollableScrollPhysics` (disable), `AlwaysScrollableScrollPhysics` (allow even if content short — needed for RefreshIndicator with few items), `PageScrollPhysics`. Default depends on platform (`ScrollConfiguration`).\n* `shrinkWrap: true` — size to content (⚠️ builds all items, avoid for long lists).\n* `primary` — use PrimaryScrollController (iOS tap-status-bar-to-top).\n* `cacheExtent` — pixels pre-built beyond viewport (default 250).\n* `keyboardDismissBehavior: ScrollViewKeyboardDismissBehavior.onDrag`.\n* `addAutomaticKeepAlives`, `addRepaintBoundaries` (default true), `addSemanticIndexes`.\n* `restorationId` for state restoration.\n\n---\n\n## 9.3 ScrollController\n\n```dart\nclass _FeedState extends State\u003cFeed> {\n  final _controller = ScrollController();\n\n  @override\n  void initState() {\n    super.initState();\n    _controller.addListener(_onScroll);\n  }\n\n  void _onScroll() {\n    final pos = _controller.position;\n    if (pos.pixels >= pos.maxScrollExtent - 300) {   // near bottom\n      context.read\u003cFeedCubit>().loadMore();\n
