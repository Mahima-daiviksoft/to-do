_portal.hide(),\n            child: Material(\n              elevation: 6,\n              borderRadius: BorderRadius.circular(8),\n              child: ConstrainedBox(\n                constraints: const BoxConstraints(maxHeight: 240, minWidth: 180),\n                child: ListView(\n                  shrinkWrap: true,\n                  padding: EdgeInsets.zero,\n                  children: [\n                    for (final item in widget.items)\n                      ListTile(\n                        dense: true,\n                        title: Text(item),\n                        onTap: () {\n                          _portal.hide();\n                          widget.onSelected(item);\n                        },\n                      ),\n                  ],\n                ),\n              ),\n            ),\n          ),\n        ),\n      ),\n      child: CompositedTransformTarget(\n        link: _link,\n        child: TapRegion(\n          groupId: _groupId,\n          child: OutlinedButton.icon(\n            onPressed: _portal.toggle,\n            icon: const Icon(Icons.arrow_drop_down),\n            label: const Text('Choose'),\n          ),\n        ),\n      ),\n    );\n  }\n}\n```\nWhy `OverlayPortal` instead of `OverlayEntry`? The overlay child is part of **your widget tree**, so it inherits Theme, Provider/Riverpod scopes and Localizations, and it rebuilds with your state. There is no manual insert/remove, and nothing leaks when the widget is disposed. Use `MenuAnchor` / `DropdownMenu` first if they fit your design.\n\n## 37.14 `SearchAnchor` + `SearchBar` (Material 3 search)\n```dart\nSearchAnchor(\n  builder: (context, controller) => SearchBar(\n    controller: controller,\n    hintText: 'Search products',\n    leading: const Icon(Icons.search),\n    onTap: controller.openView,\n    onChanged: (_) => controller.openView(),\n  ),\n  suggestionsBuilder: (context, controller) async {     // can be async → fetch from the API\n    final query = controller.text.trim();\n    if (query.isEmpty) return recentSearches.map((s) => ListTile(leading: const Icon(Icons.history), title: Text(s), onTap: () => controller.closeView(s)));\n    final results = await api.searchSuggestions(query); // ⚠️ add debounce/cancel for real apps (wrap in your own debouncer)\n    return results.map((r) => ListTile(title: Text(r.name), onTap: () {\n      controller.closeView(r.name);\n      context.push('/product/${r.id}');\n    }));\n  },\n);\n```\n`SearchAnchor.bar(...)` is a shortcut. For a full-screen search page, use `showSearch` with a `SearchDelegate` (the older API, still valid).\n\n## 37.15 `Autocomplete` (inline suggestions under a text field)\n```dart\nAutocomplete\u003cCity>(\n  displayStringForOption: (c) => c.name,\n  optionsBuilder: (TextEditingValue value) {\n    if (value.text.isEmpty) return const Iterable\u003cCity>.empty();\n    return cities.where((c) => c.name.toLowerCase().startsWith(value.text.toLowerCase()));\n  },\n  onSelected: (city) => debugPrint('Selected ${city.name}'),\n  fieldViewBuilder: (context, controller, focusNode, onSubmit) => TextField(\n    controller: controller,\n    focusNode: focusNode,\n    decoration: const InputDecoration(labelText: 'City'),\n  ),\n);\n```\n`optionsBuilder` may return a `Future` for async suggestions. Use `RawAutocomplete` for full control of the options layout.\n\n## 37.16 `Stepper` (multi-step forms / onboarding / checkout)\n```dart\nclass CheckoutStepper extends StatefulWidget {\n  const CheckoutStepper({super.key});\n  @override\n  State\u003cCheckoutStepper> createState() => _CheckoutStepperState();\n}\n\nclass _CheckoutStepperState extends State\u003cCheckoutStepper> {\n  int _step = 0;\n  final _formKeys = [GlobalKey\u003cFormState>(), GlobalKey\u003cFormState>()];\n\n  bool _validateCurrent() => _step >= _formKeys.length || _formKeys[_step].currentState!.validate();\n\n  @override\n  Widget build(BuildContext context) {\n    return Stepper(\n      currentStep: _step,\n      type: StepperType.vertical,                    // .horizontal for wide screens\n      onStepContinue: () {\n        if (!_validateCurrent()) return;\n        if (_step \u003c 2) setState(() => _step++); else _placeOrder();\n      },\n      onStepCancel: _step == 0 ? null : () => setState(() => _step--),\n      onStepTapped: (i) { if (i \u003c _step) setState(() => _step = i); },   // only allow going back\n      controlsBuilder: (context, details) => Row(children: [\n        FilledButton(onPressed: details.onStepContinue, child: Text(_step == 2 ? 'Place order' : 'Next')),\n        const SizedBox(width: 8),\n        if (details.onStepCancel != null) TextButton(onPressed: details.onStepCancel, child: const Text('Back')),\n      ]),\n      steps: [\n        Step(\n          title: const Text('Address'),\n          isActive: _step >= 0,\n          state: _step > 0 ? StepState.complete : StepState.editing,\n          content: Form(key: _formKeys[0], child: TextFormField(decoration: const InputDecoration(labelText: 'Street'), validator: (v) => (v ?? '').isEmpty ? 'Required' : null)),\n        ),\n        Step(\n          title: const Text('Delivery slot'),\n          isActive: _step >= 1,\n          state: _step > 1 ? StepState.complete : (_step == 1 ? StepState.editing : StepState.indexed),\n          content: Form(key: _formKeys[1], child: DropdownButtonFormField\u003cString>(\n            items: const [DropdownMenuItem(value: 'am', child: Text('Morning')), DropdownMenuItem(value: 'pm', child: Text('Evening'))],\n            onChanged: (_) {},\n            validator: (v) => v == null ? 'Pick a slot' : null,\n          )),\n        ),\n        Step(title: const Text('Review'), isActive: _step >= 2, content: const Text('Order summary…')),\n      ],\n    );\n  }\n\n  void _placeOrder() { /* … */ }\n}\n```\nNote: `Stepper` builds every step's `content`. The forms stay in the tree, so their keys stay valid. In production, many teams build a **PageView-based wizard** with their own progress indicator for full design control, and keep the wizard state in their state management, so a back gesture or process death doesn't lose it.\n\n---\n\n## 37.17 Interview questions — this chapter\n\n**Q1. What is state restoration and when is it needed?**\nIt restores UI state after the OS kills a backgrounded app (Android process death). You enable it with `restorationScopeId`, use RestorationMixin with RestorableProperties, and use restorable navigator APIs. Test it with \"Don't keep activities\".\n\n**Q2. Why can't `Navigator.push` routes be restored?**\nThey are built from closures, which can't be serialized. Restorable pushes use static route builders and serializable arguments.\n\n**Q3. Restoration vs persisting state to storage?**\nRestoration covers process death after the OS kills the app (saved instance state). It does not survive the user swiping the app away or a reboot. Persistence (DB/prefs) survives everything. Use both for important drafts.\n\n**Q4. Explain SliverConstraints and SliverGeometry.**\nThe constraints describe the scroll offset, remaining paint extent, overlap and cross-axis size. The geometry reports scroll extent, paint extent, layout extent, max paint extent and hit test extent, so the viewport can place the next slivers and know what's visible.\n\n**Q5. DataTable vs PaginatedDataTable vs TableView?**\nDataTable builds every row (small data). PaginatedDataTable shows pages from a DataTableSource. TableView builds lazily in both directions with pinned rows and columns (huge grids).\n\n**Q6. OverlayPortal vs OverlayEntry?**\nOverlayPortal declares the overlay child inside the widget tree, so it inherits context (theme, providers), updates with state and needs no manual insert/remove. OverlayEntry is imperative.\n\n**Q7. How do you anchor a popup to a widget?**\nCompositedTransformTarget + CompositedTransformFollower sharing a LayerLink, rendered in an overlay (OverlayPortal), with TapRegion to close it on outside taps.\n"}, {"n": 38, "file": "38-code-generation-and-publishing-packages.md", "title": "Chapter 38 — Code Generation Deep Dive (build_runner, build.yaml, writing a generator) & Publishing Packages to pub.dev", "subtitle": "Code Generation Deep Dive (build_runner, build.yaml, writing a generator) & Publishing Packages to pub.dev", "short": "Codegen & Publishing", "sub": "build.yaml, generators, pub.dev", "level": "advanced", "minutes": 11, "qa": 7, "md": "# Chapter 38 — Code Generation Deep Dive (build_runner, build.yaml, writing a generator) & Publishing Packages to pub.dev\n\n> **Goal:** Configure code generation for big projects (and keep it fast), write your own generator, and publish quality packages and plugins to pub.dev with high pub points and automated releases.\n\n---\n\n# Part A — Code generation\n\n## 38.1 5-year-old picture 🤖\nSome code is boring and repetitive (fromJson, toJson, copyWith, ==). Instead of writing it by hand, you hire a **robot helper** (a generator) that reads little **sticky notes** (annotations like `@JsonSerializable()`) on your classes and **writes the boring code for you** into separate files (`*.g.dart`). **build_runner** is the robot's boss: it decides which robots run on which files.\n\n## 38.2 Why codegen in Dart?\nFlutter disables `dart:mirrors` (runtime reflection), because it would break tree shaking and AOT size optimizations. Dart macros were **cancelled** (January 2025). So **build-time code generation** is the standard way to remove boilerplate:\n* `json_serializable`, `freezed`, `riverpod_generator`, `go_router_builder`, `retrofit_generator`, `drift_dev`, `injectable_generator`, `mockito`, `hive_ce_generator`, `flutter_gen_runner`, `auto_route_generator`, `envied_generator`, `isar_community_generator`, `dart_mappable_builder`, `slang_build_runner`…\n\n## 38.3 How it fits together\n```\nyour_file.dart              part 'your_file.g.dart';   ← you declare the part\n   @JsonSerializable()      (annotation from a *_annotation package in dependencies)\n          │\nbuild_runner (dev_dependency) runs the builders from generator packages (dev_dependencies)\n          │\n          ▼\nyour_file.g.dart            part of 'your_file.dart';  ← generated, contains _$UserFromJson…\n```\n* Annotation packages (`json_annotation`, `freezed_annotation`, `riverpod_annotation`) go in **dependencies**. Generators (`json_serializable`, `freezed`, `riverpod_generator`) and `build_runner` go in **dev_dependencies**.\n* Generated files use `part`/`part of`, so they can access private members of the library.\n* Many `source_gen`-based generators write into **one combined `.g.dart`** per file through the `source_gen:combining_builder`. That's why json_serializable and riverpod_generator output can share `user.g.dart`. Freezed writes a separate `.freezed.dart`.\n\n## 38.4 Commands\n```bash\ndart run build_runner build --delete-conflicting-outputs   # one-time build\ndart run build_runner watch -d                             # rebuild on save (-d = delete conflicting)\ndart run build_runner clean                                # clear the build cache (.dart_tool/build)\ndart run build_runner build --build-filter=\"lib/features/auth/**\"   # only some outputs (advanced; check docs)\n```\n* \"Conflicting outputs\" happens when `.g.dart` files already exist that build_runner didn't create (e.g., committed or from another branch). `-d` deletes and regenerates them.\n* `build_runner` versions from 2025 onward made big **speed improvements** (e.g., compiling builders ahead of time and faster incremental builds). Keep it up to date in large repos.\n\n## 38.5 `build.yaml`: configure generators project-wide\nPut a `build.yaml` next to `pubspec.yaml`:\n```yaml\ntargets:\n  $default:\n    builders:\n      # Configure json_serializable for the whole package (no need to repeat options in every annotation)\n      json_serializable:\n        options:\n          explicit_to_json: true\n          field_rename: snake\n          include_if_null: false\n          any_map: false\n          checked: false            # true → better error messages when JSON has the wrong type (slower)\n          create_to_json: true\n        generate_for:               # ⚡ only run on model files → much faster builds\n          include:\n            - lib/**/models/**.dart\n            - lib/**/dto/**.dart\n\n      freezed:\n        generate_for:\n          include:\n            - lib/**/models/**.dart\n            - lib/**/state/**.dart\n        # freezed-specific options (e.g., turning off generated features) are listed in the freezed README\n\n      riverpod_generator:\n        generate_for:\n          include:\n            - lib/**/providers/**.dart\n            - lib/**/*_provider.dart\n\n      # Turn a generator off completely\n      # some_package:some_builder:\n      #   enabled: false\n\n      source_gen:combining_builder:\n        options:\n          ignore_for_file:          # add ignores at the top of generated .g.dart files\n            - type=lint\n            - implicit_dynamic_parameter\n```\n* **`generate_for` is the #1 performance fix** in big projects. Without it, every builder analyzes every Dart file.\n* Annotation-level options override build.yaml: `@JsonSerializable(fieldRename: FieldRename.none)`.\n* In monorepos, each package has its own `build.yaml` and runs build_runner separately. Use melos scripts to run codegen only in packages that depend on `build_runner`.\n* Also exclude generated files from the analyzer and coverage (Chapter 2 and 22).\n\n## 38.6 Should generated files be committed?\n| Commit `*.g.dart` | Don't commit (generate in CI) |\n|---|---|\n| ✅ Fresh clones build immediately; reviewers see generated diffs; CI is faster | ✅ Smaller diffs; no merge conflicts in generated code |\n| ❌ Merge conflicts; must remember to regenerate | ❌ Everyone and CI must run build_runner; slower start |\nEither way, add a **CI check**: run build_runner and fail if `git diff --exit-code` shows changes (when committing), or make sure the CI build always generates first.\n\n## 38.7 Writing your own generator (`source_gen`)\nExample: annotate an enum with `@EnumLabels()` and generate a `label` extension.\n\n**Package layout** (a monorepo with 3 packages):\n```\npackages/\n  enum_labels_annotation/lib/enum_labels_annotation.dart\n  enum_labels_generator/\n    lib/builder.dart\n    lib/src/enum_labels_generator.dart\n    build.yaml\n  app/  (uses both)\n```\n**Annotation package**\n```dart\n// enum_labels_annotation.dart\nclass EnumLabels {\n  const EnumLabels();\n}\nconst enumLabels = EnumLabels();\n```\n**Generator**\n```dart\n// lib/src/enum_labels_generator.dart\nimport 'package:analyzer/dart/element/element.dart';\nimport 'package:build/build.dart';\nimport 'package:enum_labels_annotation/enum_labels_annotation.dart';\nimport 'package:source_gen/source_gen.dart';\n\nclass EnumLabelsGenerator extends GeneratorForAnnotation\u003cEnumLabels> {\n  @override\n  String generateForAnnotatedElement(Element element, ConstantReader annotation, BuildStep buildStep) {\n    if (element is! EnumElement) {\n      throw InvalidGenerationSourceError('@EnumLabels can only be used on enums.', element: element);\n    }\n    final name = element.name;\n    final cases = element.fields.where((f) => f.isEnumConstant).map((f) {\n      final label = f.name.replaceAllMapped(RegExp('([a-z])([A-Z])'), (m) => '${m[1]} ${m[2]}');\n      final pretty = label[0].toUpperCase() + label.substring(1);\n      return \"      $name.${f.name} => '$pretty',\";\n    }).join('\\n');\n\n    return '''\nextension ${name}Labels on $name {\n  String get label => switch (this) {\n$cases\n  };\n}\n''';\n  }\n}\n```\n> The `analyzer` package's element API has changed across major versions (a new \"element2\" model was introduced in 2025). Pin compatible `analyzer`/`source_gen` versions and follow their migration guides.\n\n**Builder factory**\n```dart\n// lib/builder.dart\nimport 'package:build/build.dart';\nimport 'package:source_gen/source_gen.dart';\nimport 'src/enum_labels_generator.dart';\n\nBuilder enumLabelsBuilder(BuilderOptions options) =>\n    SharedPartBuilder([EnumLabelsGenerator()], 'enum_labels');   // writes into the shared .g.dart\n```\n**Generator's build.yaml**\n```yaml\nbuilders:\n  enum_labels:\n    import: \"package:enum_labels_generator/builder.dart\"\n    builder_factories: [\"enumLabelsBuilder\"]\n    build_extensions: {\".dart\": [\".enum_labels.g.part\"]}\n    auto_apply: dependents           # applies automatically to packages that depend on this generator\n    build_to: cache                  # the .g.part goes to cache; combining_builder writes the final .g.dart\n    applies_builders: [\"source_gen:combining_builder\"]\n```\n**Usage in the app**\n```dart\nimport 'package:enum_labels_annotation/enum_labels_annotation.dart';\npart 'status.g.dart';\n\n@enumLabels\nenum OrderStatus { pending, outForDelivery, delivered }\n\n// OrderStatus.outForDelivery.label == 'Out For Delivery'\n```\n**Testing generators:** `package:build_test`'s `testBuilder(...)` with input assets and expected outputs. Also add a golden-file test of the generated code.\n\nOther generator types: `LibraryBuilder` (a standalone `.dart` output), and plain `Builder` implementations for non-Dart outputs such as assets and JSON. Keep generators **deterministic and fast**: no network, and no timestamps in the output.\n\n## 38.8 Codegen problems & fixes\n| Problem | Fix |\n|---|---|\n| `_$UserFromJson isn't defined` | `part 'user.g.dart';` missing/misspelled, or build_runner not run |\n| `Could not generate fromJson code for X` | Nested type not serializable → annotate it, add `explicitToJson`, or add a `JsonConverter` |\n| Builds take minutes | `generate_for`, fewer annotated files, update build_runner, split into packages |\n| Generated code changed after upgrading a generator | Expected; regenerate & review; pin versions in the lock file |\n| Version solving fails between analyzer/source_gen/generators | Upgrade all generators together; check `flutter pub deps`; rarely, `dependency_overrides` temporarily |\n| Freezed: \"missing implementations\" | Wrong class form for your freezed version (`abstract class X with _$X` in freezed 3) or the `.freezed.dart` part is missing |\n| Riverpod generator: `_$Counter` not found | Class name/provider naming, `part`, `riverpod_annotation` import |\n\n---\n\n# Part B — Publishing packages & plugins to pub.dev 📦\n\n## 38.9 Before you publish: checklist\n1. **Name**: lowercase_with_underscores, unique on pub.dev, not misleading (don't use `flutter_` names that imply official packages unless you're allowed).\n2. **pubspec.yaml**:\n```yaml\nname: smart_debouncer\ndescription: >-\n  A tiny, well-tested debouncer and throttler for Dart and Flutter with\n  cancellation, leading/trailing edges and stream transformers.   # 60–180 characters recommended\nversion: 1.0.0\nrepository: https://github.com/you/smart_debouncer\nissue_tracker: https://github.com/you/smart_debouncer/issues\ndocumentation: https://github.com/you/smart_debouncer#readme   # optional\ntopics: [debounce, throttle, streams, utilities]               # up to 5 topics, lowercase\nscreenshots:\n  - description: Debounced search demo\n    path: doc/screenshots/search.gif\nfunding:\n  - https://github.com/sponsors/you\nenvironment:\n  sdk: ^3.5.0\n  flutter: \">=3.24.0\"        # only if it depends on Flutter\ndependencies:\n  meta: ^1.15.0              # keep constraints WIDE (caret), so apps can resolve versions\ndev_dependencies:\n  test: ^1.25.0\n  lints: ^5.0.0\n```\n3. **README.md**: what it does, a quick example at the top, installation, features, platform support table, limitations, a contributing link. pub.dev renders this as your home page.\n4. **CHANGELOG.md**: an entry for every version (`## 1.0.0` + bullet points). It's required for full pub points.\n5. **LICENSE**: an OSI-approved license (MIT, BSD-3, Apache-2.0). pub.dev detects it.\n6. **example/**: `example/lib/main.dart` (or `example/example.dart` for Dart packages). pub.dev shows it in the Example tab.\n7. **Public API docs**: `///` on every public member. Check with `dart doc`. pub points include doc coverage (20%+ is the minimum for full points, but aim for 100%).\n8. **`lib/` structure**: public API in `lib/smart_debouncer.dart` (exports), implementation in `lib/src/` (private by convention).\n9. **Tests & CI** (format, analyze, test on multiple SDK versions).\n10. **`.pubignore`** to exclude large files from the archive (works like .gitignore; if present it replaces .gitignore for publishing).\n\n## 38.10 Pub points (max 160) and how to earn them\npub.dev scores packages with **pana**. Run it locally: `dart pub global activate pana && pana .`\n| Category | Requirements |\n|---|---|\n| Follow Dart file conventions | Valid pubspec, README, CHANGELOG, OSI license |\n| Provide documentation | Example + ≥20% documented public API |\n| Platform support | Works on multiple platforms (no unconditional dart:io for \"all platforms\"), declared plugin platforms |\n| Pass static analysis | No errors/warnings/lints; formatted code |\n| Support up-to-date dependencies | Works with the latest versions of dependencies & SDK |\n| Null safety / modern SDK | Sound null safety & a recent SDK constraint (Dart 3 compatible) |\nPopularity is now shown as **downloads**. **Likes** are separate.\n\n## 38.11 Publish\n```bash\ndart format .\ndart analyze            # or flutter analyze\ndart test               # or flutter test\ndart pub publish --dry-run   # validates & shows the files that will be uploaded\ndart pub publish             # asks for confirmation; first time opens Google login\n```\n* **Publishing is permanent.** You can't delete a version. You can:\n  * **retract** a version within **7 days** of publishing (pub stops picking it for new resolutions)\n  * mark the package **discontinued** (optionally pointing to a replacement)\n  * mark it unlisted\n* **Verified publisher**: create one on pub.dev for your domain (domain verified through Google Search Console) and transfer packages to it. It shows a ✓ badge and adds trust, which companies care about.\n* **Prereleases**: `2.0.0-dev.1`, `2.0.0-beta.2`. Users must opt in explicitly.\n* **SemVer discipline**:\n  * breaking API change → major\n  * new feature → minor\n  * bug fix → patch\n  * For `0.x`, a minor bump means breaking.\n\n## 38.12 Automated publishing from GitHub Actions (OIDC, no secrets)\n1. On pub.dev → package **Admin** → **Automated publishing** → enable GitHub Actions, set the repository and a tag pattern such as `v{{version}}`.\n2. Add a workflow:\n```yaml\n# .github/workflows/publish.yml\nname: Publish to pub.dev\non:\n  push:\n    tags: ['v[0-9]+.[0-9]+.[0-9]+*']\njobs:\n  publish:\n    permissions:\n      id-token: write          # required for OIDC authentication with pub.dev\n    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1\n    # with:\n    #   working-directory: packages/smart_debouncer   # for monorepos\n```\nFor Flutter packages, use a custom job: install Flutter (`subosito/flutter-action`), then run `flutter pub publish --force` with the same `id-token: write` permission (follow the pub.dev automated publishing docs for Flutter).\n3. Release: bump the version in pubspec + CHANGELOG → commit → `git tag v1.1.0 && git push --tags`.\n\nMonorepos: tag per package (`smart_debouncer-v1.1.0`) with a matching pattern, or use **melos version/publish** to version and publish many packages, with changelogs generated from conventional commits.\n\n## 38.13 Publishing a plugin: extra rules\n* Declare platforms under `flutter: plugin: platforms:` with `pluginClass`/`package` (Android), `pluginClass` (iOS/macOS), `fileName` (web), `dartPluginClass` for Dart-only implementations.\n* Federated plugins: publish `x_platform_interface` first, then the implementations, then the app-facing `x` package (with `default_package` endorsements).\n* **iOS:** support **Swift Package Manager** (`ios/\u003cname>/Package.swift`) and keep a CocoaPods podspec while the ecosystem transitions. Include a `PrivacyInfo.xcprivacy` privacy manifest if your plugin uses required-reason APIs or collects data.\n* **Android:** a `namespace` in Gradle, minimal permissions (apps inherit them!), ProGuard/R8 consumer rules (`consumer-rules.pro`) for reflection-based code, and the 16 KB page-size compatibility of native libraries.\n* Example app with integration tests. Document permissions/setup steps for every platform clearly in the README.\n* Keep platform interface changes **non-breaking**: add methods with default implementations that throw `UnimplementedError`.\n\n## 38.14 Maintaining packages (and judging others' packages)\n* Respond to issues; label them; have a contributing guide and issue templates.\n* Run CI against **stable and beta** Flutter so you catch breakages early.\n* Keep dependency constraints wide but tested (`dart pub downgrade` tests the lower bounds).\n* Deprecate APIs with `@Deprecated('Use x instead. Will be removed in 3.0')` before removing them.\n* Security: enable 2FA on your Google account. Automated publishing via OIDC means no long-lived tokens.\n\n---\n\n## 38.15 Interview questions — codegen & packages\n\n**Q1. Why does Flutter rely on code generation instead of reflection?**\ndart:mirrors is unavailable in Flutter because reflection defeats tree shaking and AOT optimizations, and macros were cancelled. Build-time generation produces plain Dart code with no runtime cost.\n\n**Q2. How do you speed up build_runner in a large project?**\nRestrict builders with `generate_for` in build.yaml, split the code into packages, keep build_runner/generators updated, use watch mode locally, and avoid unnecessary annotated files.\n\n**Q3. What is `SharedPartBuilder` / combining builder?**\nIt lets several source_gen generators write `.g.part` fragments that the combining builder merges into a single `.g.dart` part file.\n\n**Q4. How do you publish a package and ensure quality?**\nComplete pubspec metadata, README/CHANGELOG/LICENSE/example, documented API, analysis-clean code, tests, `pana` checks, `dart pub publish --dry-run`, then publish, preferably through automated OIDC publishing on tags.\n\n**Q5. Can you delete a published version?**\nNo. You can retract it within 7 days, discontinue or unlist the package, and publish fixed versions.\n\n**Q6. What are pub points?**\nA score (max 160) from pana analysis: conventions, documentation, platform support, static analysis, up-to-date dependencies, and modern SDK/null safety support.\n\n**Q7. dependencies vs dev_dependencies for codegen packages?**\nAnnotation packages go in dependencies (used in source). Generators and build_runner go in dev_dependencies (build tools only).\n"}, {"n": 39, "file": "39-release-automation-fastlane-codemagic-patrol.md", "title": "Chapter 39 — Release Automation: fastlane (Android & iOS), Codemagic, GitHub Actions for iOS, and Patrol E2E Tests", "subtitle": "Release Automation: fastlane (Android & iOS), Codemagic, GitHub Actions for iOS, and Patrol E2E Tests", "short": "Release Automation & Patrol", "sub": "fastlane, Codemagic, native E2E", "level": "advanced", "minutes": 9, "qa": 5, "md": "# Chapter 39 — Release Automation: fastlane (Android & iOS), Codemagic, GitHub Actions for iOS, and Patrol E2E Tests\n\n> **Goal:** Give you complete, copy-adaptable configuration files for automated builds and store uploads, plus end-to-end tests that can handle native UI (permission dialogs, notifications). Chapter 26 explained the concepts. This chapter has the actual files.\n\n> Tool options and flags change over time. Treat these files as solid templates, and check the official docs of fastlane, Codemagic and Patrol for the versions you install.\n\n---\n\n## 39.1 5-year-old picture 🏭\nReleasing an app by hand is like baking 100 cakes yourself, step by step, every week, and sometimes forgetting the sugar. **Automation** is a **cake factory**: you write the recipe once (config files), press a button (push a git tag), and it bakes, checks, boxes and delivers the cakes the same way every time.\n\n---\n\n## 39.2 fastlane setup\n```bash\n# macOS: Ruby/Bundler recommended so everyone uses the same fastlane version\ncd ios && bundle init && echo 'gem \"fastlane\"' >> Gemfile && bundle install && bundle exec fastlane init\ncd ../android && bundle init && echo 'gem \"fastlane\"' >> Gemfile && bundle install && bundle exec fastlane init\n```\nThis creates `ios/fastlane/` and `android/fastlane/`, each with an `Appfile` and a `Fastfile`. Commit the `Gemfile` + `Gemfile.lock`.\n\n### Credentials (never commit them)\n* **iOS:** an **App Store Connect API key** (.p8): key ID, issuer ID and key content (base64) stored in CI secrets. Signing certificates & profiles go through **match** (an encrypted git repo or S3/GCS bucket, with `MATCH_PASSWORD`).\n* **Android:** a **Google Play service account JSON** (Play Console → API access), stored as a CI secret, plus the upload keystore + passwords (Chapter 26).\n\n---\n\n## 39.3 `ios/fastlane/Fastfile`\n```ruby\ndefault_platform(:ios)\n\nROOT = File.expand_path(\"../..\", __dir__)   # __dir__ = ios/fastlane → ROOT = Flutter project root\n\nplatform :ios do\n  before_all do\n    setup_ci if ENV[\"CI\"]                  # creates a temporary keychain on CI machines\n  end\n\n  def asc_key\n    app_store_connect_api_key(\n      key_id: ENV[\"ASC_KEY_ID\"],\n      issuer_id: ENV[\"ASC_ISSUER_ID\"],\n      key_content: ENV[\"ASC_KEY_CONTENT_BASE64\"],\n      is_key_content_base64: true\n    )\n  end\n\n  desc \"Sync signing certificates & profiles (read-only on CI)\"\n  lane :certs do\n    asc_key\n    match(type: \"appstore\", app_identifier: \"com.mycompany.shop\", readonly: is_ci)\n  end\n\n  desc \"Build and upload to TestFlight\"\n  lane :beta do\n    asc_key\n    match(type: \"appstore\", app_identifier: \"com.mycompany.shop\", readonly: true)\n\n    build_number = latest_testflight_build_number(app_identifier: \"com.mycompany.shop\") + 1\n\n    Dir.chdir(ROOT) do\n      sh(\"flutter\", \"pub\", \"get\")\n      sh(\"flutter\", \"build\", \"ipa\", \"--release\",\n         \"--flavor\", \"prod\", \"-t\", \"lib/main_prod.dart\",\n         \"--build-number=#{build_number}\",\n         \"--obfuscate\", \"--split-debug-info=build/symbols\",\n         \"--export-options-plist=ios/ExportOptions.plist\")\n    end\n\n    ipa = Dir[\"#{ROOT}/build/ios/ipa/*.ipa\"].first\n    UI.user_error!(\"IPA not found\") unless ipa\n\n    upload_to_testflight(\n      ipa: ipa,\n      skip_waiting_for_build_processing: true,\n      changelog: ENV[\"RELEASE_NOTES\"] || \"Bug fixes and improvements\"\n    )\n  end\n\n  desc \"Submit the latest TestFlight build for App Store review\"\n  lane :release do\n    asc_key\n    deliver(\n      submit_for_review: true,\n      automatic_release: false,\n      phased_release: true,              # 7-day gradual rollout\n      skip_binary_upload: true,          # uses the build already on TestFlight\n      skip_screenshots: true,\n      force: true,                       # skip the HTML preview\n      precheck_include_in_app_purchases: false\n    )\n  end\nend\n```\n`ios/ExportOptions.plist` (App Store distribution with manual signing from match):\n```xml\n\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\u003c!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n\u003cplist version=\"1.0\">\n\u003cdict>\n  \u003ckey>method\u003c/key>\u003cstring>app-store-connect\u003c/string>   \u003c!-- older Xcode versions: app-store -->\n  \u003ckey>teamID\u003c/key>\u003cstring>ABCDE12345\u003c/string>\n  \u003ckey>signingStyle\u003c/key>\u003cstring>manual\u003c/string>\n  \u003ckey>provisioningProfiles\u003c/key>\n  \u003cdict>\n    \u003ckey>com.mycompany.shop\u003c/key>\u003cstring>match AppStore com.mycompany.shop\u003c/string>\n  \u003c/dict>\n  \u003ckey>uploadSymbols\u003c/key>\u003ctrue/>\n\u003c/dict>\n\u003c/plist>\n```\nFor manual signing, the Xcode project's Release configuration must also be set to use the match profile. Running `update_code_signing_settings` in the lane can do this. Extensions (notification service, widgets) need their own profiles in the dictionary.\n\n---\n\n## 39.4 `android/fastlane/Fastfile`\n```ruby\ndefault_platform(:android)\n\nROOT = File.expand_path(\"../..\", __dir__)   # android/fastlane → project root\n\nplatform :android do\n  def play_json\n    ENV[\"PLAY_SERVICE_ACCOUNT_JSON\"]          # the JSON content stored as a CI secret\n  end\n\n  desc \"Build AAB and upload to the internal testing track\"\n  lane :internal do\n    codes = google_play_track_version_codes(track: \"internal\", json_key_data: play_json)\n    version_code = (codes.max || 0) + 1\n\n    Dir.chdir(ROOT) do\n      sh(\"flutter\", \"pub\", \"get\")\n      sh(\"flutter\", \"build\", \"appbundle\", \"--release\",\n         \"--flavor\", \"prod\", \"-t\", \"lib/main_prod.dart\",\n         \"--build-number=#{version_code}\",\n         \"--obfuscate\", \"--split-debug-info=build/symbols\")\n    end\n\n    upload_to_play_store(\n      track: \"internal\",\n      aab: \"#{ROOT}/build/app/outputs/bundle/prodRelease/app-prod-release.aab\",\n      json_key_data: play_json,\n      release_status: \"completed\",          # \"draft\" for apps that were never published\n      skip_upload_metadata: true,\n      skip_upload_images: true,\n      skip_upload_screenshots: true\n    )\n  end\n\n  desc \"Promote internal → production with a staged rollout\"\n  lane :promote do |options|\n    upload_to_play_store(\n      track: \"internal\",\n      track_promote_to: \"production\",\n      rollout: options[:rollout] || \"0.1\",  # 10%\n      json_key_data: play_json,\n      skip_upload_changelogs: false\n    )\n  end\n\n  desc \"Increase the production rollout percentage\"\n  lane :rollout do |options|\n    upload_to_play_store(track: \"production\", rollout: options[:percent], json_key_data: play_json,\n                         skip_upload_aab: true, skip_upload_apk: true, skip_upload_metadata: true)\n  end\nend\n```\nRun it: `cd android && bundle exec fastlane internal`, or `bundle exec fastlane promote rollout:0.2`.\n\nRelease notes per version: `android/fastlane/metadata/android/\u003clocale>/changelogs/\u003cversionCode>.txt`. iOS metadata and screenshots: `ios/fastlane/metadata/` and `ios/fastlane/screenshots/` (managed by `deliver`).\n\n---\n\n## 39.5 GitHub Actions workflow using these lanes (iOS + Android)\n```yaml\nname: Release\non:\n  push:\n    tags: ['v*']\n\njobs:\n  android:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-java@v4\n        with: { distribution: temurin, java-version: '17' }\n      - uses: subosito/flutter-action@v2\n        with: { channel: stable, cache: true }\n      - uses: ruby/setup-ruby@v1\n        with: { ruby-version: '3.3', bundler-cache: true, working-directory: android }\n      - name: Signing files\n        run: |\n          echo \"${{ secrets.ANDROID_KEYSTORE_BASE64 }}\" | base64 -d > android/app/upload-keystore.jks\n          printf \"storePassword=%s\\nkeyPassword=%s\\nkeyAlias=upload\\nstoreFile=upload-keystore.jks\\n\" \\\n            \"${{ secrets.KEYSTORE_PASSWORD }}\" \"${{ secrets.KEY_PASSWORD }}\" > android/key.properties\n      - name: Upload to Play internal\n        working-directory: android\n        env:\n          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}\n        run: bundle exec fastlane internal\n\n  ios:\n    runs-on: macos-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: subosito/flutter-action@v2\n        with: { channel: stable, cache: true }\n      - uses: ruby/setup-ruby@v1\n        with: { ruby-version: '3.3', bundler-cache: true, working-directory: ios }\n      - name: TestFlight\n        working-directory: ios\n        env:\n          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}\n          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}\n          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}\n          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}\n          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}   # base64 \"user:token\" for the certs repo\n          RELEASE_NOTES: ${{ github.ref_name }}\n        run: bundle exec fastlane beta\n      - name: Upload Crashlytics symbols (optional)\n        run: echo \"firebase crashlytics:symbols:upload --app=$FIREBASE_IOS_APP_ID build/symbols\"\n```\nTips:\n* Pin the Xcode version on macOS runners (`sudo xcode-select -s /Applications/Xcode_XX.app`) so builds don't break when the runner image updates.\n* Cache CocoaPods (`ios/Pods`) keyed on `Podfile.lock`, and Gradle (`actions/setup-java` with `cache: gradle`).\n* Use `concurrency:` groups to avoid two releases running at the same time.\n\n---\n\n## 39.6 Codemagic (`codemagic.yaml` at the repo root)\n```yaml\nworkflows:\n  release:\n    name: Android & iOS release\n    instance_type: mac_mini_m2\n    max_build_duration: 90\n    integrations:\n      app_store_connect: ASC API Key          # name of the API key added in Codemagic team settings\n    environment:\n      flutter: stable\n      xcode: latest\n      cocoapods: default\n      android_signing:\n        - upload_keystore                     # keystore reference uploaded in Codemagic UI\n      ios_signing:\n        distribution_type: app_store\n        bundle_identifier: com.mycompany.shop\n      groups:\n        - google_play                         # contains GCLOUD_SERVICE_ACCOUNT_CREDENTIALS\n        - firebase                            # optional\n      vars:\n        FLAVOR: prod\n    triggering:\n      events: [tag]\n      tag_patterns:\n        - pattern: 'v*'\n          include: true\n    scripts:\n      - name: Get packages\n        script: flutter pub get\n      - name: Static analysis & tests\n        script: |\n          flutter analyze\n          flutter test\n      - name: Set up iOS signing in the Xcode project\n        script: xcode-project use-profiles\n      - name: Build Android App Bundle\n        script: |\n          flutter build appbundle --release --flavor $FLAVOR -t lib/main_prod.dart \\\n            --build-number=$BUILD_NUMBER --obfuscate --split-debug-info=build/symbols\n      - name: Build iOS IPA\n        script: |\n          flutter build ipa --release --flavor $FLAVOR -t lib/main_prod.dart \\\n            --build-number=$BUILD_NUMBER \\\n            --export-options-plist=/Users/builder/export_options.plist\n    artifacts:\n      - build/**/outputs/bundle/**/*.aab\n      - build/ios/ipa/*.ipa\n      - build/symbols/**\n      - flutter_drive.log\n    publishing:\n      google_play:\n        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS\n        track: internal\n        submit_as_draft: false\n      app_store_connect:\n        auth: integration\n        submit_to_testflight: true\n        beta_groups:\n          - Internal QA\n      email:\n        recipients: [mobile-team@mycompany.com]\n        notify: { success: true, failure: true }\n```\n* `$BUILD_NUMBER` is Codemagic's incrementing build counter. You can also fetch the latest store build number with Codemagic CLI tools (`google-play get-latest-build-number`, `app-store-connect get-latest-testflight-build-number`) and add 1.\n* `xcode-project use-profiles` applies the fetched signing profiles and writes `/Users/builder/export_options.plist`.\n* Codemagic also has a **workflow editor UI**, but YAML is easier to review and version, which is better for teams.\n\n---\n\n## 39.7 Other pipeline essentials\n* **Firebase App Distribution** for QA builds on every merge:\n  * fastlane plugin: `firebase_app_distribution(app: ENV[\"FIREBASE_APP_ID\"], groups: \"qa\", android_artifact_type: \"AAB\")`\n  * or the CLI: `firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk --app $APP_ID --groups qa`\n* **Version from tag:** parse `v2.4.1` → `--build-name=2.4.1`.\n* **Changelog** from conventional commits (`git-cliff`, `release-please`).\n* **Notifications:** Slack webhook on success or failure.\n* **Secrets rotation:** keystore passwords and API keys in a secret manager. Restrict who can trigger release workflows (protected tags/environments with required reviewers).\n\n---\n\n## 39.8 Patrol — E2E tests that can tap native UI 🤖\n`integration_test` can't tap system permission dialogs, notifications or settings. **Patrol** (LeanCode) can, and it also adds shorter finders.\n\n### Setup (summary — follow the Patrol docs for your version)\n```yaml\ndev_dependencies:\n  patrol: ^x.y.z     # check pub.dev\npatrol:\n  app_name: My Shop\n  android:\n    package_name: com.mycompany.shop\n  ios:\n    bundle_id: com.mycompany.shop\n```\n```bash\ndart pub global activate patrol_cli\npatrol doctor\n```\nNative setup: an Android instrumentation test runner class (`MainActivityTest.java`) and Gradle `testInstrumentationRunner` config; an iOS `RunnerUITests` target. These steps are documented step by step in Patrol's setup guide.\n\n### A test\n```dart\n// patrol_test/checkout_test.dart   (older Patrol versions use integration_test/)\nimport 'package:flutter/material.dart';\nimport 'package:patrol/patrol.dart';\nimport 'package:my_shop/main_test.dart' as app;   // app entry with fake backend / test config\n\nvoid main() {\n  patrolTest(\n    'user scans a product with the camera and adds it to the cart',\n    ($) async {\n      await app.main();\n      await $.pumpAndSettle();\n\n      await $('Log in').tap();\n      await $(#emailField).enterText('qa@example.com');        // #emailField → Key('emailField')\n      await $(#passwordField).enterText('Passw0rd!');\n      await $(#loginButton).tap();\n      await $('Home').waitUntilVisible();\n\n      await $(#scanButton).tap();\n\n      // Native permission dialog: Flutter-only tests can't do this\n      // (Patrol 4 moved native APIs to $.platform.mobile; older versions use $.native)\n      if (await $.platform.mobile.isPermissionDialogVisible()) {\n        await $.platform.mobile.grantPermissionWhenInUse();\n      }\n\n      await $(#fakeScanResult).tap();                             // test hook in the scanner screen\n      await $('Add to cart').tap();\n      expect($(#cartBadge).$('1'), findsOneWidget);\n\n      // Notifications\n      await $.platform.mobile.pressHome();\n      await $.platform.mobile.openNotifications();\n      await $.platform.mobile.tapOnNotificationBySelector(\n        Selector(textContains: 'Order confirmed'),   // selector class names also differ between Patrol versions\n      );\n    },\n  );\n}\n```\nRun it: `patrol test -t patrol_test/checkout_test.dart` (add `--device \u003cid>`). Patrol runs each test in isolation, works with Firebase Test Lab / BrowserStack / emulator.wtf, and supports **hot restart** while developing tests (`patrol develop`).\n\n### E2E best practices\n* A dedicated **test entry point** (`main_test.dart`) with a fake or staging backend, seeded data and disabled analytics/animations.\n* Stable selectors: `Key`s or semantics identifiers, not localized text.\n* Keep E2E tests few and focused on **critical journeys**: login, purchase, onboarding, deep link. Cover the rest with widget tests.\n* Run them nightly or on release branches if they're slow. Use sharding across devices.\n* Record videos and screenshots on failure as CI artifacts.\n\n---\n\n## 39.9 Interview questions — release automation\n\n**Q1. How do you automate iOS signing in CI?**\nfastlane match (encrypted certificates/profiles repo) or Codemagic/Xcode Cloud managed signing, an App Store Connect API key for authentication, and `setup_ci` for a temporary keychain.\n\n**Q2. How do you avoid version code conflicts?**\nCompute the build number from the store's latest build + 1, or from the CI run number. Never set it by hand.\n\n**Q3. What does a release pipeline look like for you?**\nTag → CI: analyze/test → build signed AAB/IPA with obfuscation → upload symbols → upload to internal track/TestFlight → QA → promote with staged rollout → monitor crash-free rate → increase the rollout.\n\n**Q4. Why Patrol over integration_test?**\nIt can interact with native UI (permission dialogs, notifications, system settings) and has better finders and test isolation, which makes real-world E2E flows testable.\n\n**Q5. Where do you store signing keys?**\nIn CI secret storage or a secret manager (base64-encoded files), never in the repo. Restrict access with protected environments, and back up keys securely.\n"}, {"n": 40, "file": "40-games-flame-advanced-ffi-stream-transformers.md", "title": "Chapter 40 — Games with Flame, Advanced FFI (structs, callbacks, ffigen) & Custom Stream Transformers", "subtitle": "Games with Flame, Advanced FFI (structs, callbacks, ffigen) & Custom Stream Transformers", "short": "Flame, FFI & Streams", "sub": "Mini-game, native memory, transformers", "level": "advanced", "minutes": 12, "qa": 8, "md": "# Chapter 40 — Games with Flame, Advanced FFI (structs, callbacks, ffigen) & Custom Stream Transformers\n\n> **Goal:** Build a small 2D game with Flame (game loop, components, sprites, input, collisions, overlays, audio). Go deeper into native interop (structs, memory, async callbacks from native threads, generated bindings). Master stream transformation by writing your own transformers.\n\n---\n\n# Part A — 2D games with Flame 🎮\n\n## 40.1 5-year-old picture\nA normal app redraws only when something changes. A **game** is a **cartoon that never stops**: about 60 times every second it **moves** everything a little (`update`) and **draws** everything again (`render`). That never-ending heartbeat is the **game loop**.\n\n## 40.2 Flame's building blocks\n| Concept | What it is |\n|---|---|\n| `FlameGame` | The root game: owns the loop, the `world` and the `camera` |\n| `GameWidget` | The Flutter widget that shows a game (place it anywhere in your widget tree) |\n| `Component` | Everything in the game is a component tree (like widgets, but mutable and updated every frame) |\n| `PositionComponent` | Has position, size, angle, scale, anchor |\n| `SpriteComponent` / `SpriteAnimationComponent` | Shows images / animations |\n| `World` + `CameraComponent` | The world holds game objects; the camera decides what part of the world you see (viewport, follow player) |\n| `update(double dt)` | Called every frame; `dt` = seconds since the last frame → multiply speeds by `dt` |\n| `render(Canvas canvas)` | Custom drawing (sprites render themselves) |\n| Mixins | `TapCallbacks`, `DragCallbacks`, `KeyboardHandler`, `CollisionCallbacks`, `HasGameReference\u003cT>` |\n| Hitboxes | `RectangleHitbox`, `CircleHitbox`, `PolygonHitbox` + `HasCollisionDetection` on the game |\n| Effects | `MoveEffect`, `ScaleEffect`, `RotateEffect`, `OpacityEffect`, `SequenceEffect` with `EffectController` |\n| Overlays | Flutter widgets (menus, HUD) on top of the game |\n| Bridge packages | `flame_audio`, `flame_forge2d` (physics), `flame_tiled` (maps), `flame_bloc`/`flame_riverpod` |\n\n## 40.3 A complete mini game: \"Catch the stars\" ⭐\n```yaml\ndependencies:\n  flame: ^x.y.z       # check pub.dev for the latest 1.x\nflutter:\n  assets:\n    - assets/images/  # Flame's default image prefix is assets/images/\n```\n```dart\nimport 'dart:math';\nimport 'package:flame/collisions.dart';\nimport 'package:flame/components.dart';\nimport 'package:flame/events.dart';\nimport 'package:flame/game.dart';\nimport 'package:flutter/material.dart';\n\nvoid main() {\n  runApp(MaterialApp(\n    home: Scaffold(\n      body: GameWidget\u003cStarGame>.controlled(\n        gameFactory: StarGame.new,\n        overlayBuilderMap: {\n          'hud': (context, game) => Hud(game: game),\n          'gameOver': (context, game) => GameOverMenu(game: game),\n        },\n        initialActiveOverlays: const ['hud'],\n      ),\n    ),\n  ));\n}\n\nclass StarGame extends FlameGame with HasCollisionDetection, DragCallbacks {\n  late Basket basket;\n  final score = ValueNotifier\u003cint>(0);       // Flutter overlays listen to this\n  final lives = ValueNotifier\u003cint>(3);\n  final _random = Random();\n  double _spawnTimer = 0;\n\n  @override\n  Color backgroundColor() => const Color(0xFF0B1026);\n\n  @override\n  Future\u003cvoid> onLoad() async {\n    // The camera looks at the world; with the default viewfinder, world (0,0) is the screen centre.\n    camera.viewfinder.anchor = Anchor.topLeft;  // make (0,0) the top-left corner, like normal screen coordinates\n    basket = Basket()..position = Vector2(size.x / 2, size.y - 80);\n    await world.add(basket);\n  }\n\n  @override\n  void update(double dt) {\n    super.update(dt);\n    if (lives.value \u003c= 0) return;\n    _spawnTimer += dt;\n    final interval = max(0.35, 1.2 - score.value * 0.02);   // gets harder over time\n    if (_spawnTimer >= interval) {\n      _spawnTimer = 0;\n      world.add(Star(speed: 150 + _random.nextDouble() * 150 + score.value * 3)\n        ..position = Vector2(_random.nextDouble() * (size.x - 40) + 20, -20));\n    }\n  }\n\n  @override\n  void onDragUpdate(DragUpdateEvent event) {\n    basket.position.x = (basket.position.x + event.localDelta.x).clamp(40, size.x - 40);\n  }\n\n  void caught() => score.value++;\n\n  void missed() {\n    lives.value--;\n    if (lives.value \u003c= 0) {\n      pauseEngine();\n      overlays.add('gameOver');\n    }\n  }\n\n  void restart() {\n    world.children.whereType\u003cStar>().forEach((s) => s.removeFromParent());\n    score.value = 0;\n    lives.value = 3;\n    overlays.remove('gameOver');\n    resumeEngine();\n  }\n\n  @override\n  void onRemove() {\n    score.dispose();\n    lives.dispose();\n    super.onRemove();\n  }\n}\n\nclass Basket extends RectangleComponent with HasGameReference\u003cStarGame> {\n  Basket() : super(size: Vector2(80, 24), anchor: Anchor.center, paint: Paint()..color = Colors.amber);\n\n  @override\n  Future\u003cvoid> onLoad() async => add(RectangleHitbox());\n}\n\nclass Star extends CircleComponent with HasGameReference\u003cStarGame>, CollisionCallbacks {\n  Star({required this.speed}) : super(radius: 12, anchor: Anchor.center, paint: Paint()..color = Colors.white);\n  final double speed;\n\n  @override\n  Future\u003cvoid> onLoad() async => add(CircleHitbox());\n\n  @override\n  void update(double dt) {\n    super.update(dt);\n    position.y += speed * dt;                      // ❗ frame-rate independent movement\n    if (position.y > game.size.y + 20) {\n      removeFromParent();\n      game.missed();\n    }\n  }\n\n  @override\n  void onCollisionStart(Set\u003cVector2> intersectionPoints, PositionComponent other) {\n    super.onCollisionStart(intersectionPoints, other);\n    if (other is Basket) {\n      removeFromParent();\n      game.caught();\n    }\n  }\n}\n\nclass Hud extends StatelessWidget {\n  const Hud({super.key, required this.game});\n  final StarGame game;\n  @override\n  Widget build(BuildContext context) => SafeArea(\n        child: Padding(\n          padding: const EdgeInsets.all(16),\n          child: Row(children: [\n            ValueListenableBuilder\u003cint>(\n              valueListenable: game.score,\n              builder: (_, s, __) => Text('Score: $s', style: const TextStyle(color: Colors.white, fontSize: 20)),\n            ),\n            const Spacer(),\n            ValueListenableBuilder\u003cint>(\n              valueListenable: game.lives,\n              builder: (_, l, __) => Text('❤️' * l, style: const TextStyle(fontSize: 20)),\n            ),\n          ]),\n        ),\n      );\n}\n\nclass GameOverMenu extends StatelessWidget {\n  const GameOverMenu({super.key, required this.game});\n  final StarGame game;\n  @override\n  Widget build(BuildContext context) => Center(\n        child: Card(\n          child: Padding(\n            padding: const EdgeInsets.all(24),\n            child: Column(mainAxisSize: MainAxisSize.min, children: [\n              Text('Game over! Score: ${game.score.value}', style: Theme.of(context).textTheme.titleLarge),\n              const SizedBox(height: 16),\n              FilledButton(onPressed: game.restart, child: const Text('Play again')),\n            ]),\n          ),\n        ),\n      );\n}\n```\nShapes are used so the example runs without image files. To use images, switch to `SpriteComponent` and load sprites in `onLoad`:\n```dart\nclass StarSprite extends SpriteComponent with HasGameReference\u003cStarGame> {\n  @override\n  Future\u003cvoid> onLoad() async {\n    sprite = await game.loadSprite('star.png');    // assets/images/star.png\n    size = Vector2.all(32);\n  }\n}\n// Animations from a sprite sheet:\nfinal animation = await game.loadSpriteAnimation(\n  'player_run.png',\n  SpriteAnimationData.sequenced(amount: 8, stepTime: 0.08, textureSize: Vector2(32, 32)),\n);\n```\nAudio: `flame_audio` → `FlameAudio.play('catch.wav')`, `FlameAudio.bgm.play('music.mp3')`. Preload sounds in `onLoad`.\n\n## 40.4 Game performance & architecture tips\n* Movement in `update` must use `dt`. Never assume 60 fps (120 Hz screens and slow devices exist).\n* Avoid allocations in `update` (reuse `Vector2`s), because GC pauses cause stutters.\n* Use sprite batching (`SpriteBatch`) for many identical sprites. Use object pools for bullets and particles.\n* Use the `world` + `camera` structure. Put HUD components in `camera.viewport` or use Flutter overlays.\n* Game state such as score and level can live in Bloc/Riverpod via `flame_bloc`/`flame_riverpod`, or `ValueNotifier`s as above.\n* Physics: `flame_forge2d` (Box2D). Tile maps: `flame_tiled`. Particles: `ParticleSystemComponent`.\n* Test components with `flame_test` (`testWithFlameGame`).\n* For 3D or console-quality games, use Unity, Godot or Unreal.\n\n---\n\n# Part B — Advanced Dart FFI ⚙️\n\n## 40.5 Structs, arrays & memory ownership\n```c\n// native/geo.h\ntypedef struct { double lat; double lng; } Point;\ndouble distance_km(Point a, Point b);\nint32_t sum_array(const int32_t* values, int32_t length);\nchar* greet(const char* name);       // returns malloc'ed string → caller must free with free_string\nvoid free_string(char* s);\n```\n```dart\nimport 'dart:ffi';\nimport 'package:ffi/ffi.dart';\n\nfinal class Point extends Struct {\n  @Double()\n  external double lat;\n  @Double()\n  external double lng;\n}\n\nfinal DynamicLibrary _lib = DynamicLibrary.open('libgeo.so');   // per-platform loading (see Chapter 19)\n\nfinal _distance = _lib.lookupFunction\u003cDouble Function(Point, Point), double Function(Point, Point)>('distance_km');\nfinal _sumArray = _lib.lookupFunction\u003cInt32 Function(Pointer\u003cInt32>, Int32), int Function(Pointer\u003cInt32>, int)>('sum_array');\nfinal _greet = _lib.lookupFunction\u003cPointer\u003cUtf8> Function(Pointer\u003cUtf8>), Pointer\u003cUtf8> Function(Pointer\u003cUtf8>)>('greet');\nfinal _freeString = _lib.lookupFunction\u003cVoid Function(Pointer\u003cUtf8>), void Function(Pointer\u003cUtf8>)>('free_string');\n\ndouble distanceKm(double lat1, double lng1, double lat2, double lng2) {\n  return using((arena) {                               // everything allocated with arena is freed at the end\n    final a = arena\u003cPoint>()..ref.lat = lat1..ref.lng = lng1;\n    final b = arena\u003cPoint>()..ref.lat = lat2..ref.lng = lng2;\n    return _distance(a.ref, b.ref);                    // structs are passed by value\n  });\n}\n\nint sum(List\u003cint> values) {\n  final ptr = calloc\u003cInt32>(values.length);\n  try {\n    ptr.asTypedList(values.length).setAll(0, values);  // fast copy into native memory\n    return _sumArray(ptr, values.length);\n  } finally {\n    calloc.free(ptr);                                  // ❗ Dart's GC does NOT manage native memory\n  }\n}\n\nString greet(String name) {\n  final namePtr = name.toNativeUtf8();\n  try {\n    final resultPtr = _greet(namePtr);\n    try {\n      return resultPtr.toDartString();\n    } finally {\n      _freeString(resultPtr);                          // free with the SAME allocator that allocated it (native side)\n    }\n  } finally {\n    malloc.free(namePtr);                              // toNativeUtf8 uses malloc by default\n  }\n}\n```\nRules of memory ownership:\n1. Whoever allocates must free, with the **matching allocator**.\n2. Document ownership for every function that returns a pointer.\n3. Use `Arena`/`using` for temporary allocations.\n4. For native objects tied to Dart objects' lifetimes, attach a **`NativeFinalizer`** (calls a native free function when the Dart object is garbage collected) and implement `Finalizable`.\n\n## 40.6 Callbacks from native to Dart\n| API | Use |\n|---|---|\n| `Pointer.fromFunction` | Older API: synchronous callbacks on the **same thread** only, static functions only |\n| `NativeCallable.isolateLocal` | Sync callbacks invoked on the isolate's own thread; can capture closures; must call `close()` |\n| `NativeCallable.listener` | Callbacks invoked from **any native thread**. The call is posted asynchronously to the Dart isolate. Return type must be `void`. Must `close()` when done |\n\n```c\n// native/worker.h\ntypedef void (*ProgressCallback)(int32_t percent);\nvoid start_long_task(ProgressCallback cb);   // runs on a background native thread and calls cb repeatedly\n```\n```dart\ntypedef ProgressNative = Void Function(Int32);\n\nfinal _startLongTask = _lib.lookupFunction\u003c\n    Void Function(Pointer\u003cNativeFunction\u003cProgressNative>>),\n    void Function(Pointer\u003cNativeFunction\u003cProgressNative>>)>('start_long_task');\n\nStream\u003cint> runLongTask() {\n  late final NativeCallable\u003cProgressNative> callable;\n  var closed = false;\n  void closeCallable() {                // close exactly once\n    if (closed) return;\n    closed = true;\n    callable.close();                   // ❗ otherwise the isolate stays alive and leaks\n  }\n\n  final controller = StreamController\u003cint>(onCancel: closeCallable);\n  callable = NativeCallable\u003cProgressNative>.listener((int percent) {\n    if (controller.isClosed) return;\n    controller.add(percent);\n    if (percent >= 100) {\n      closeCallable();\n      controller.close();\n    }\n  });\n  _startLongTask(callable.nativeFunction);\n  return controller.stream;\n}\n```\nAfter `close()`, the native side must not call the function pointer again. Design your C API so it stops calling (or unregisters) the callback before you close it.\n\n## 40.7 Generating bindings\n* **`ffigen`** (C/Objective-C): configure in `ffigen.yaml` and run `dart run ffigen`.\n```yaml\n# ffigen.yaml\nname: GeoBindings\ndescription: Bindings for libgeo\noutput: lib/src/geo_bindings.g.dart\nheaders:\n  entry-points:\n    - native/geo.h\n```\n  Use the generated class: `final bindings = GeoBindings(DynamicLibrary.open(...)); bindings.distance_km(a, b);`. Newer setups can generate `@Native` external functions resolved through **native assets** instead of manual `DynamicLibrary.open`.\n* **`jnigen`** (Java/Kotlin on Android): generates Dart classes that call JNI directly. For example, you can call Android SDK APIs synchronously without platform channels. Configure the classes to generate in `jnigen.yaml`.\n* **Swift:** expose `@objc` APIs and use ffigen's Objective-C support (Swift-specific tooling, \"swiftgen\", is evolving).\n* **Native assets / build hooks** (`hook/build.dart`, stable since Dart 3.10 / Flutter 3.38): your package compiles C/C++ (with `native_toolchain_c`) or downloads prebuilt binaries at build time, and Flutter bundles them for every target automatically. No more manual CMake/Gradle/Podspec wiring for pure-native packages.\n* **Rust:** `flutter_rust_bridge` (high-level codegen: structs, async, streams) or native assets with cargo.\n\n## 40.8 Threading & performance with FFI\n* An FFI call blocks the calling isolate until it returns. Run slow native functions in a helper isolate (`Isolate.run(() => nativeHeavy())`). The `DynamicLibrary` lookups must happen inside that isolate (top-level lazy finals are per isolate, which is fine).\n* `@Native(isLeaf: true)` / `lookupFunction(isLeaf: true)` marks calls that don't call back into Dart or block for long. Leaf calls are cheaper.\n* Pass large data as `Pointer\u003cUint8>` + length, or typed data views. Avoid per-element conversions.\n* Use `Uint8List` views over native memory (`asTypedList`) for zero-copy reads. Be careful with lifetimes: the view is invalid once the memory is freed. You can attach a finalizer to the view with `asTypedList(..., finalizer:)`.\n\n---\n\n# Part C — Custom Stream transformers 🔁\n\n## 40.9 Three ways to transform streams\n1. Built-in methods: `map`, `where`, `expand`, `asyncMap`, `asyncExpand`, `distinct`, `take`, `skip`, `timeout`, `handleError`.\n2. `StreamTransformer.fromHandlers` for simple element-by-element transforms.\n3. `StreamTransformer.fromBind` (or implementing `StreamTransformerBase`) for anything with state or timing (debounce, throttle, buffer, switchMap).\n\n### `fromHandlers`: drop invalid items and convert errors\n```dart\nfinal parseInts = StreamTransformer\u003cString, int>.fromHandlers(\n  handleData: (value, sink) {\n    final n = int.tryParse(value);\n    if (n != null) sink.add(n);          // skip non-numbers\n  },\n  handleError: (error, stack, sink) => sink.addError(FormatException('Upstream: $error'), stack),\n  handleDone: (sink) => sink.close(),\n);\n// Stream.fromIterable(['1', 'x', '3']).transform(parseInts) → 1, 3\n```\n\n### `fromBind`: debounce (with correct pause/cancel handling and flushing on done)\n```dart\nimport 'dart:async';\n\nStreamTransformer\u003cT, T> debounce\u003cT>(Duration duration) =>\n    StreamTransformer\u003cT, T>.fromBind((Stream\u003cT> input) {\n      late StreamController\u003cT> controller;\n      StreamSubscription\u003cT>? subscription;\n      Timer? timer;\n      T? pending;\n      var hasPending = false;\n\n      void flush() {\n        if (hasPending) {\n          hasPending = false;\n          controller.add(pending as T);\n        }\n      }\n\n      controller = StreamController\u003cT>(\n        sync: true,\n        onListen: () {\n          subscription = input.listen(\n            (event) {\n              pending = event;\n              hasPending = true;\n              timer?.cancel();\n              timer = Timer(duration, flush);\n            },\n            onError: controller.addError,\n            onDone: () {\n              timer?.cancel();\n              flush();                       // emit the last value instead of losing it\n              controller.close();\n            },\n          );\n        },\n        onPause: () => subscription?.pause(),\n        onResume: () => subscription?.resume(),\n        onCancel: () {\n          timer?.cancel();\n          return subscription?.cancel();\n        },\n      );\n      return controller.stream;\n    });\n\n// Usage:\n// searchQueries.transform(debounce(const Duration(milliseconds: 300))).listen(search);\n```\n(If the input is a broadcast stream and you want the output broadcast too, use `StreamController.broadcast` and handle multiple listeners. Libraries like `stream_transform` do this for you.)\n\n### `switchMap`: only the latest async request matters\n```dart\nStreamTransformer\u003cS, T> switchMap\u003cS, T>(Stream\u003cT> Function(S value) convert) =>\n    StreamTransformer\u003cS, T>.fromBind((input) {\n      late StreamController\u003cT> controller;\n      StreamSubscription\u003cS>? outer;\n      StreamSubscription\u003cT>? inner;\n      var outerDone = false;\n\n      controller = StreamController\u003cT>(\n        onListen: () {\n          outer = input.listen(\n            (value) {\n              inner?.cancel();                         // ❗ cancel the previous inner stream\n              inner = convert(value).listen(\n                controller.add,\n                onError: controller.addError,\n                onDone: () {\n                  inner = null;\n                  if (outerDone) controller.close();\n                },\n              );\n            },\n            onError: controller.addError,\n            onDone: () {\n              outerDone = true;\n              if (inner == null) controller.close();\n            },\n          );\n        },\n        onCancel: () async {\n          await inner?.cancel();\n          await outer?.cancel();\n        },\n      );\n      return controller.stream;\n    });\n\n// queries.transform(debounce(300.ms)).transform(switchMap((q) => Stream.fromFuture(api.search(q))))\n```\nThis is exactly the **\"search-as-you-type without out-of-order results\"** pattern from Chapter 16. In production, prefer the tested implementations in **`stream_transform`** (`debounce`, `throttle`, `switchMap`, `combineLatest`, `buffer`) or **`rxdart`**.\n\n### Testing transformers\n```dart\ntest('debounce emits only the last value', () {\n  fakeAsync((async) {\n    final controller = StreamController\u003cint>();\n    final results = \u003cint>[];\n    controller.stream.transform(debounce(const Duration(milliseconds: 300))).listen(results.add);\n    controller..add(1)..add(2)..add(3);\n    async.elapse(const Duration(milliseconds: 299));\n    expect(results, isEmpty);\n    async.elapse(const Duration(milliseconds: 1));\n    expect(results, [3]);\n    controller.close();\n  });\n});\n```\n\n---\n\n## 40.10 Interview questions — this chapter\n\n**Q1. Explain the game loop in Flame.**\nOn every frame, Flame calls `update(dt)` on the component tree (state changes scaled by elapsed time) and then `render(canvas)` (drawing). The FlameGame is driven by a Ticker inside GameWidget.\n\n**Q2. How do you make movement frame-rate independent?**\nMultiply velocities by `dt` (seconds since the last frame).\n\n**Q3. How do Flutter UI and a Flame game communicate?**\nOverlays (Flutter widgets above the game, toggled with `game.overlays`), shared notifiers/state management (flame_bloc/flame_riverpod), and the game reference passed to widgets.\n\n**Q4. Who frees memory returned from a C function?**\nWhoever allocated it, using the matching allocator. Expose native free functions, use Arena for temporary allocations, and use NativeFinalizer for objects tied to Dart lifetimes.\n\n**Q5. How do you receive callbacks from native background threads?**\n`NativeCallable.listener`, which posts calls to the Dart isolate asynchronously. Close it when finished.\n\n**Q6. What are native assets/build hooks?**\nA Dart/Flutter mechanism where packages declare build hooks (`hook/build.dart`) that compile or download native code, which the toolchain bundles automatically for each target platform.\n\n**Q7. How would you implement debounce on a stream?**\nA StreamTransformer (fromBind) with a Timer reset on each event, emitting the latest value when the timer fires, plus handling pause/resume/cancel and flushing on done. Or use stream_transform/rxdart.\n\n**Q8. What does switchMap solve?**\nIt cancels the previous inner async operation when a new value arrives, so only the latest request's results are emitted. This prevents out-of-order search results.\n"}, {"n": 41, "file": "41-interview-questions-extra-bank.md", "title": "Chapter 41 — Interview Question Bank, Part 4: 120 Extra Questions (All Levels)", "subtitle": "Interview Question Bank, Part 4: 120 Extra Questions (All Levels)", "short": "Q&A: 120 Extra Questions", "sub": "All levels, new topics", "level": "interview", "minutes": 19, "qa": 120, "md": "# Chapter 41 — Interview Question Bank, Part 4: 120 Extra Questions (All Levels)\n\n> These questions are **new**. They don't repeat Chapters 29–31, and they cover the topics added in Part VII as well as trickier corners of Dart and Flutter. Level tags: 🟢 junior, 🟡 mid, 🔴 senior.\n\n---\n\n## A. Dart corners (1–25)\n\n**1. 🟢 What's the difference between `List\u003cint>.empty()`, `[]` and `const []`?**\n`List.empty()` is fixed-length by default (can't add; use `growable: true` to allow it). `[]` is a growable empty list. `const []` is an immutable canonical list.\n\n**2. 🟢 What does `Iterable.followedBy` do?**\nIt lazily concatenates two iterables: `[1, 2].followedBy([3])` → (1, 2, 3).\n\n**3. 🟡 What is `Object.hash` / `Object.hashAll`?**\nHelpers that combine field hash codes correctly when you override `hashCode`.\n\n**4. 🟡 What is the difference between `as` and pattern casting `case final x as int`?**\nBoth throw if the type is wrong. Inside patterns, `as` casts *and* binds. Use `case int x` when you want a non-throwing type test.\n\n**5. 🟡 Why does `print(1 == 1.0)` print true?**\nDart's numeric equality compares values across int/double. `identical(1, 1.0)` is false on native platforms but true on the web, where both are JS numbers.\n\n**6. 🟡 What happens when an int overflows on native vs web?**\nNative: 64-bit two's-complement wraparound. Web: JS numbers lose precision beyond 2^53. Use `BigInt` when you need arbitrary precision.\n\n**7. 🟡 Explain `covariant` keyword.**\nIt allows an overriding method's parameter to have a narrower type than the parent's (e.g., `didUpdateWidget(covariant MyWidget old)`), with a runtime check.\n\n**8. 🟡 What's `noSuchMethod` used for?**\nIt is called for unknown member accesses (usually with `dynamic`). It's used by mock frameworks (mockito's generated mocks rely on it).\n\n**9. 🔴 How do generics and `is` checks interact at runtime?**\nGenerics are reified, so `list is List\u003cint>` checks the actual type argument. A `List\u003cdynamic>` containing only ints is still not a `List\u003cint>`.\n\n**10. 🟡 `Future.value` vs `Future.sync` vs `Future.microtask` vs `Future()`?**\n* `Future.value(x)`: a future already completed with x (callbacks run as microtasks).\n* `Future.sync(fn)`: runs fn immediately.\n* `Future.microtask(fn)`: runs fn in a microtask.\n* `Future(fn)`: runs fn in a later event (Timer.run).\n\n**11. 🟡 What does `await` on a non-Future value do?**\nIt wraps the value and suspends until the next microtask, so the code still yields to the event loop.\n\n**12. 🔴 What is a `Zone`-local value and a real use case?**\nA value stored with `runZoned(zoneValues: {...})` and read with `Zone.current[key]`. It's used for request-scoped context such as correlation IDs in logs, and by test frameworks.\n\n**13. 🟢 What is `typedef` for function types used for in Flutter?**\nCallback types like `VoidCallback`, `ValueChanged\u003cT>`, `ValueGetter\u003cT>`, `ValueSetter\u003cT>`, `WidgetBuilder`.\n\n**14. 🟡 How do `sync*` generators help performance?**\nThey produce values lazily on demand, avoiding building whole lists.\n\n**15. 🟡 What's the difference between `Stream.listen` `cancelOnError: true/false`?**\nWith true, the subscription cancels on the first error. With false (the default), it keeps receiving events after errors.\n\n**16. 🟡 `StreamController(sync: true)` — when?**\nWhen you want events delivered immediately during `add`, for example in transformers forwarding events. Be careful about re-entrancy.\n\n**17. 🔴 How can two isolates share large binary data efficiently?**\n`TransferableTypedData` (transfer instead of copy), `Isolate.exit` to send results without copying, or native memory through FFI.\n\n**18. 🟡 What are wildcard variables (Dart 3.7)?**\n`_` no longer creates a binding, so you can have several `_` parameters, e.g. `(_, _) => ...`.\n\n**19. 🟡 What do null-aware elements (Dart 3.8) look like?**\n`[?a, ?b]` adds an element only if it's non-null. In maps: `{'k': ?v}`.\n\n**20. 🔴 What are primary constructors (Dart 3.13)?**\nA class header that declares the constructor parameters and fields together, e.g. `class Point(var int x, var int y);`. It needs an SDK lower bound of 3.13.\n\n**21. 🟡 What are dot shorthands and when can't you use them?**\n`.value` instead of `Type.value` when the type is known from context. You can't use them where no context type exists (e.g., `var x = .center;`).\n\n**22. 🟡 What's the difference between `final class` and `sealed class`?**\nFinal: can be instantiated, but can't be extended or implemented outside its library. Sealed: abstract, with a known set of subtypes in the same library, so switches over it are exhaustive.\n\n**23. 🔴 Why can't you `await` inside `initState` directly, and what's the right pattern?**\n`initState` must be synchronous (the framework doesn't await it). Start an async method (`_load()`) and handle the result with `mounted` checks, or use FutureBuilder/state management.\n\n**24. 🟡 How do you write an extension on a generic type?**\n`extension ListX\u003cT> on List\u003cT> { T? get secondOrNull => length > 1 ? this[1] : null; }`\n\n**25. 🔴 Explain `Finalizer` vs `NativeFinalizer`.**\nFinalizer runs a Dart callback some time after an object becomes unreachable (no guarantees, not for critical cleanup). NativeFinalizer calls a native function and is more reliable for freeing native resources. Explicit `close`/`dispose` APIs are still preferred.\n\n---\n\n## B. Widgets, UI & layout (26–50)\n\n**26. 🟢 What is `FittedBox` used for?**\nScaling a child down (or up) to fit its parent, e.g. preventing long labels from overflowing.\n\n**27. 🟢 How do you give rounded corners to an image?**\n`ClipRRect(borderRadius: ..., child: Image(...))`, or use a `DecoratedBox`/`Container` with a `DecorationImage` and `borderRadius`.\n\n**28. 🟡 `Flexible(fit: FlexFit.tight)` vs `Expanded`?**\nThey are identical. Expanded is a shortcut.\n\n**29. 🟡 Why does `Column(mainAxisAlignment: center)` not center inside a `SingleChildScrollView`?**\nThe scroll view gives unbounded height, so the Column shrinks to its content. Use `ConstrainedBox(minHeight: constraints.maxHeight)` with a LayoutBuilder, or `SliverFillRemaining(hasScrollBody: false)` with `Center`.\n\n**30. 🟡 How do you make two widgets in a Row the same height?**\n`IntrinsicHeight` with `CrossAxisAlignment.stretch` (expensive), or fixed heights, or a Table.\n\n**31. 🟡 What is `ColoredBox` and why prefer it over `Container(color:)`?**\nIt's a single lightweight render object that only paints a color, and it can be const.\n\n**32. 🟡 `Material` widget — why does InkWell need it?**\nInk splashes are painted on the nearest `Material`'s ink layer. Without it (or under an opaque child), the splashes are hidden.\n\n**33. 🟡 What's the difference between `showModalBottomSheet` and `Scaffold.showBottomSheet`?**\nModal: a route with a barrier, returns a Future result, dismissed on outside tap. Persistent: part of the Scaffold, no barrier, controlled with a PersistentBottomSheetController.\n\n**34. 🟡 How do you lock text scaling for one widget (and should you)?**\n`MediaQuery.withClampedTextScaling(maxScaleFactor: 1.3, child: ...)` or override `textScaler`. Only clamp where layout truly breaks, because users rely on large text.\n\n**35. 🟡 What is `SliverFillRemaining(hasScrollBody: false)` for?**\nIt fills the remaining viewport with non-scrolling content, e.g. pushing a footer or button to the bottom when content is short.\n\n**36. 🔴 Why can `LayoutBuilder` cause extra rebuilds?**\nIt builds during layout, so its builder runs again whenever the incoming constraints change (for example on resize, or keyboard insets in some layouts). Keep its builder light.\n\n**37. 🟡 What does `RepaintBoundary.toImage` enable?**\nCapturing a widget as an image (`(key.currentContext!.findRenderObject() as RenderRepaintBoundary).toImage(pixelRatio: 3)`), e.g. for sharing a receipt.\n\n**38. 🟡 How do you render a widget offscreen to an image without showing it?**\nUse the `screenshot` package's `captureFromWidget`, or build it in an Overlay/Offstage with a RepaintBoundary, or use a `PictureRecorder` with your own painting.\n\n**39. 🟢 What is `Badge` widget?**\nA Material 3 widget that shows a small label or count on top of an icon.\n\n**40. 🟡 How do you implement a custom page transition for all routes?**\n`ThemeData.pageTransitionsTheme` with builders per platform, or `PageRouteBuilder`/go_router `CustomTransitionPage` per route.\n\n**41. 🟡 How do you handle very long text with \"Read more\"?**\nMeasure with `TextPainter` (`didExceedMaxLines`) inside a LayoutBuilder, toggle `maxLines`, and animate with AnimatedSize.\n\n**42. 🔴 How does `Flow` differ from `Stack` for animated menus?**\nFlow's delegate repositions children with transforms at **paint time**, without relayout, so it's efficient for animating many children.\n\n**43. 🟡 What's `ListWheelScrollView`?**\nA 3D wheel-like list (picker style). `CupertinoPicker` uses it.\n\n**44. 🟡 How do you show a widget only on wide screens without rebuilding the whole page on resize?**\nPut a small `LayoutBuilder`/`MediaQuery.sizeOf` check around just that part, or use separate layout widgets selected high up while keeping their children const.\n\n**45. 🔴 Why might `const` not work on your widget?**\nOne of its constructor arguments isn't a compile-time constant (runtime values, callbacks referencing instance members, non-const objects), or the class lacks a const constructor or has non-final fields.\n\n**46. 🟡 What is `KeyedSubtree`?**\nA widget that attaches a key to a subtree without adding layout. It's used to preserve identity when wrapping children dynamically.\n\n**47. 🟡 How do you detect when a widget becomes visible on screen?**\nThe `visibility_detector` package (for impressions and video autoplay), or scroll listeners combined with item positions.\n\n**48. 🔴 How do you implement a sticky \"Add to cart\" bar that hides when scrolling down and shows when scrolling up?**\nListen to `UserScrollNotification`/ScrollController direction and animate the bar with AnimatedSlide/SizeTransition. Alternatively, use `SliverFloatingHeader`-style slivers for headers.\n\n**49. 🟡 What is `SafeArea(minimum: ...)`?**\nIt guarantees minimum padding even on devices without system intrusions.\n\n**50. 🟡 Explain `MediaQuery.removePadding`.**\nIt removes inherited padding (e.g., the status bar top padding) for a subtree, such as a ListView inside a Drawer that would otherwise add top padding.\n\n---\n\n## C. State, architecture & data (51–75)\n\n**51. 🟡 How do you share state between two unrelated screens in Provider?**\nProvide it above MaterialApp (app scope), or above the navigator branch that contains both screens.\n\n**52. 🟡 In Riverpod, how do you reset all user-specific providers on logout?**\nMake them depend on (`ref.watch`) an auth/user-ID provider so they rebuild when the user changes. Or invalidate them explicitly, or scope them in a nested ProviderScope that is recreated (with a new key) on login.\n\n**53. 🔴 How do you avoid \"provider dependency cycles\"?**\nRestructure: extract shared logic into a third provider, pass data as parameters, or break cycles with events. Riverpod throws CircularDependencyError when it detects a cycle.\n\n**54. 🟡 In Bloc, how do you initialize data when a screen opens?**\nAdd an event in the BlocProvider's `create`: `create: (_) => ProductsBloc(repo)..add(ProductsRequested())`.\n\n**55. 🟡 When should a Cubit be global vs per-screen?**\nGlobal for app-wide state (auth, cart, settings). Per-screen for feature state that should reset when the user leaves. Scope it with route-level providers.\n\n**56. 🔴 How do you keep a long form's state across navigation and process death?**\nForm state in a state holder scoped to the flow (not the widget), drafts persisted to storage with a debounce, and restoration IDs for the current step.\n\n**57. 🟡 What is the Unit of Work / transaction concern on mobile?**\nGroup local DB writes in transactions so related data stays consistent, e.g. order + order items.\n\n**58. 🟡 How do you model \"loading more\" while showing existing items?**\nState with `items`, `isLoadingMore`, `hasMore` and `loadMoreError`, separate from the initial `status`.\n\n**59. 🔴 How do you implement optimistic updates with rollback?**\nUpdate the UI state immediately, call the
