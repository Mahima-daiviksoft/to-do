now();   // ✅ known at runtime\n// const time = DateTime.now(); // ❌ error: not a compile-time constant\n\nconst list = [1, 2, 3];        // the list itself is deeply immutable\n// list.add(4);                // ❌ runtime error: Unsupported operation: Cannot add to an unmodifiable list\n\nfinal list2 = [1, 2, 3];       // the VARIABLE can't be reassigned...\nlist2.add(4);                  // ✅ ...but the list contents CAN change!\n// list2 = [];                 // ❌ compile error\n```\n\nKey differences:\n1. **Time:** `const` = compile-time constant; `final` = assigned once at runtime.\n2. **Depth:** `const` makes the object **deeply/transitively immutable**; `final` only freezes the **reference**.\n3. **Canonicalisation:** identical `const` expressions share **one instance** in memory:\n   ```dart\n   print(identical(const [1, 2], const [1, 2])); // true\n   print(identical([1, 2], [1, 2]));             // false\n   ```\n4. **Instance fields:** instance fields can be `final`, not `const` (only `static const` fields allowed in classes).\n5. **Flutter impact:** `const` widgets are created once and **reused**; when Flutter sees the *same instance* during rebuild it can skip rebuilding that subtree. That's why the linter suggests `prefer_const_constructors`.\n\n#### `late`\nUse `late` when:\n1. A non-nullable variable will be initialised **after** declaration but **before** use (e.g., in `initState`).\n2. You want **lazy initialisation** — the initialiser runs only when first read.\n\n```dart\nclass _MyState extends State\u003cMyWidget> {\n  late final AnimationController controller; // set in initState\n\n  @override\n  void initState() {\n    super.initState();\n    controller = AnimationController(vsync: this, duration: const Duration(seconds: 1));\n  }\n}\n\nlate final config = loadHeavyConfig(); // runs only when first accessed\n```\n⚠️ If you read a `late` variable before it's set: `LateInitializationError: Field 'controller' has not been initialized.` If you assign a `late final` twice: `LateInitializationError: Field 'x' has already been initialized.`\n\n#### `dynamic` vs `Object?` vs `var`\n* `var` is **not a type**; it just means \"infer the type\". `var x = 1;` → `x` is `int` forever. `var x;` (no initializer) → `dynamic`.\n* `dynamic` **turns off** the type checker. Any method call compiles; errors happen at runtime (`NoSuchMethodError`).\n* `Object?` accepts any value but you must **check/cast** before calling type-specific methods. Safer.\n\n**Rule:** avoid `dynamic` except when dealing with JSON (`Map\u003cString, dynamic>`) or interop.\n\n---\n\n## 3.3 Built-in types\n\n### 3.3.1 Numbers\n```dart\nint a = 7;             // 64-bit integer on native; on web it's a JS number (53-bit precise)\ndouble b = 3.5;        // 64-bit floating point (IEEE 754)\nnum c = 5;             // supertype of int and double\nc = 5.5;               // allowed\n\nprint(7 / 2);   // 3.5   (/ always returns double)\nprint(7 ~/ 2);  // 3     (integer division)\nprint(7 % 2);   // 1     (remainder)\nprint(-7 % 2);  // 1     (Dart % is always non-negative for positive divisor)\nprint((-7).remainder(2)); // -1 (sign follows the dividend)\n\nprint(int.parse('42'));          // 42\nprint(int.tryParse('abc'));      // null (safe)\nprint(double.parse('3.14'));\nprint(3.14159.toStringAsFixed(2)); // \"3.14\"\nprint(10.clamp(0, 5));           // 5\nprint(0.1 + 0.2);                // 0.30000000000000004 (floating point!)\n```\n💰 **Money tip:** never use `double` for money in real apps → use integer cents (`int`) or a decimal package (`decimal`).\n\n### 3.3.2 Strings\n```dart\nvar s1 = 'single';\nvar s2 = \"double\";\nvar multi = '''\nLine 1\nLine 2''';\nvar raw = r'C:\\path\\no\\escape';     // raw string\nvar name = 'Ravi';\nprint('Hi $name, length ${name.length}'); // interpolation\nprint('a' + 'b');                // concatenation (prefer interpolation)\nprint('abc' * 2);                // abcabc\n\n// Useful methods\n'Hello'.toUpperCase();  'Hello'.toLowerCase();\n'  hi  '.trim();        'a,b,c'.split(',');      // [a, b, c]\n'hello'.contains('ell'); 'hello'.startsWith('he');\n'hello'.replaceAll('l', 'L');  'hello'.substring(1, 3); // \"el\"\n'hello'.indexOf('l');   // 2\n'5'.padLeft(3, '0');    // \"005\"\n```\nStrings are **immutable** and **UTF-16** encoded. For user-perceived characters (emoji, accents) use the `characters` package (`'👨‍👩‍👧'.characters.length == 1`).\n\n`StringBuffer` for building big strings efficiently:\n```dart\nfinal sb = StringBuffer();\nfor (var i = 0; i \u003c 3; i++) { sb.write(i); }\nprint(sb.toString()); // 012\n```\n\n### 3.3.3 Booleans\nOnly `true` and `false`. Dart does **not** have \"truthy\" values: `if (1)` or `if (list)` is a **compile error**. Use `if (list.isNotEmpty)`.\n\n### 3.3.4 Other core types\n* `List`, `Set`, `Map` (section 3.8), `Iterable`.\n* `Runes` (Unicode code points), `Symbol` (`#foo`), `Null`, `Never` (a function that never returns: always throws/loops), `void`, `Record` (Chapter 4), `Function`, `Future`/`Stream` (Chapter 5), `DateTime`, `Duration`, `Uri`, `RegExp`, `BigInt`.\n\n```dart\nfinal now = DateTime.now();\nfinal tomorrow = now.add(const Duration(days: 1));\nprint(tomorrow.difference(now).inHours); // 24\nfinal utc = DateTime.utc(2025, 1, 31);\nfinal parsed = DateTime.parse('2025-01-31T10:00:00Z');\nprint(parsed.isUtc);              // true\nprint(parsed.toLocal());\n```\n\n---\n\n## 3.4 Null safety — the seat belt 🚗\n\nSince Dart 2.12 (and **mandatory** since Dart 3.0), Dart has **sound null safety**.\n\n**5-year-old version:** Before null safety, any box could secretly be **empty**, and when you reached in to grab the toy — 💥 crash (\"null pointer exception\"). Now each box has a label: **\"always has a toy\"** (`String`) or **\"might be empty\"** (`String?`). The compiler won't let you grab from a \"might be empty\" box without checking first.\n\n```dart\nString name = 'Ana';     // can NEVER be null\nString? nickname;        // may be null (defaults to null)\n\n// print(nickname.length);    // ❌ compile error\nprint(nickname?.length);      // ✅ null-aware access → prints null\nprint(nickname ?? 'none');    // ✅ if-null operator → 'none'\nnickname ??= 'Annie';         // assign only if null\nprint(nickname!.length);      // ✅ \"bang\" — I PROMISE it's not null (throws if it is!)\n```\n\n### 3.4.1 Null-aware operators (memorise)\n| Operator | Name | Meaning |\n|---|---|---|\n| `?` in type | nullable type | `int?` may be null |\n| `?.` | null-aware access | call only if not null, else null |\n| `??` | if-null | left if not null, else right |\n| `??=` | null-aware assignment | assign if currently null |\n| `!` | null assertion (\"bang\") | cast away nullability; throws `TypeError` if null |\n| `?..` | null-aware cascade | `obj?..a()..b()` |\n| `...?` | null-aware spread | `[...?maybeList]` |\n| `?[` | null-aware index | `list?[0]` |\n| `?` element (Dart 3.8+) | null-aware collection element | `[?maybeItem]` adds only if non-null; `{?key: value}` |\n\n```dart\nString? maybe = getValue();\nfinal items = [1, 2, ?maybeInt];           // Dart 3.8+: adds maybeInt only if non-null\nfinal map = {'a': 1, if (maybe != null) 'b': maybe}; // older equivalent using collection-if\n```\n\n### 3.4.2 Type promotion (flow analysis)\nDart is smart: after a null check, the variable is **promoted** to non-null.\n```dart\nvoid greet(String? name) {\n  if (name == null) return;\n  print(name.length);   // ✅ name is promoted to String\n}\n```\n⚠️ **Promotion does NOT work on (non-private or non-final) fields** because another piece of code (or a getter override) could change them between the check and the use:\n```dart\nclass User {\n  String? email;\n  void send() {\n    if (email != null) {\n      // print(email.length); // ❌ error: 'email' is a public field, can't promote\n      final e = email;        // ✅ copy to local variable\n      if (e != null) print(e.length);\n    }\n  }\n}\n```\nSince Dart 3.2, **private final fields** *can* be promoted (`final String? _email;`).\n\n### 3.4.3 Why avoid `!`\n`!` is a promise to the compiler. Break the promise → runtime crash (`Null check operator used on a null value` — one of the most common Flutter crash messages in Crashlytics!). Prefer:\n* `if (x != null)` / local variable promotion\n* `??` defaults\n* pattern matching: `if (x case final value?) { ... }`\n\n### 3.4.4 `required` named parameters\n```dart\nvoid createUser({required String name, int? age, String country = 'IN'}) {}\n```\n\n---\n\n## 3.5 Operators\n\n```dart\n// Arithmetic\n+  -  *  /  ~/  %  -expr   ++  --\n// Equality & relational\n==  !=  >  \u003c  >=  \u003c=\n// Type test\nis  is!  as\n// Logical\n&&  ||  !\n// Bitwise\n&  |  ^  ~  \u003c\u003c  >>  >>>\n// Assignment\n=  +=  -=  *=  /=  ~/=  %=  ??=  &=  |=  ^=  \u003c\u003c=  >>=\n// Conditional\ncond ? a : b      a ?? b\n// Cascade\n..   ?..\n// Spread\n...  ...?\n```\n\n### Cascade `..` — \"and also do this to the same object\"\n```dart\nfinal paint = Paint()\n  ..color = Colors.red\n  ..strokeWidth = 4\n  ..style = PaintingStyle.stroke;\n// Equivalent to creating paint, then setting 3 properties, then returning paint.\n\nfinal list = \u003cint>[]..add(1)..add(2); // [1, 2]\n```\n\n### `is`, `as`\n```dart\nObject x = 'hello';\nif (x is String) print(x.toUpperCase()); // promoted\nfinal s = x as String;  // cast; throws TypeError if wrong\n```\n\n### `==` vs `identical()`\n* `==` → **equality**, can be overridden (value equality).\n* `identical(a, b)` → **same object in memory** (reference equality).\n\n---\n\n## 3.6 Control flow\n\n```dart\n// if / else\nif (score >= 90) {\n  grade = 'A';\n} else if (score >= 75) {\n  grade = 'B';\n} else {\n  grade = 'C';\n}\n\n// for\nfor (var i = 0; i \u003c 5; i++) { print(i); }\n// for-in\nfor (final fruit in ['apple', 'mango']) { print(fruit); }\n// forEach (don't use with async callbacks!)\n[1, 2, 3].forEach(print);\n// while / do-while\nwhile (n > 0) { n--; }\ndo { n++; } while (n \u003c 3);\n// break / continue / labels\nouter:\nfor (var i = 0; i \u003c 3; i++) {\n  for (var j = 0; j \u003c 3; j++) {\n    if (j == 1) continue outer;\n    if (i == 2) break outer;\n  }\n}\n```\n\n### Switch (Dart 3 — powerful!)\nOld style statement (no fall-through needed for non-empty cases since Dart 3 — `break` is optional):\n```dart\nswitch (command) {\n  case 'open':\n    open();\n  case 'close' || 'exit':   // logical-or pattern\n    close();\n  default:\n    unknown();\n}\n```\n**Switch expression** (returns a value):\n```dart\nfinal label = switch (statusCode) {\n  200 => 'OK',\n  404 => 'Not found',\n  >= 500 && \u003c 600 => 'Server error',   // relational patterns\n  _ => 'Other',                          // wildcard = default\n};\n```\nPatterns are covered fully in Chapter 4.\n\n### Collection if / for (super useful in Flutter widget lists!)\n```dart\nfinal isAdmin = true;\nfinal menu = [\n  'Home',\n  'Profile',\n  if (isAdmin) 'Admin Panel',\n  for (final n in [1, 2]) 'Item $n',\n];\n// ['Home', 'Profile', 'Admin Panel', 'Item 1', 'Item 2']\n\nColumn(children: [\n  const Text('Title'),\n  if (loading) const CircularProgressIndicator() else const Text('Done'),\n  ...items.map((e) => Text(e)),\n]);\n```\n\n### Assert\n```dart\nassert(age >= 0, 'Age must be non-negative');\n```\nRuns **only in debug mode** (stripped from release). Flutter framework uses many asserts to give helpful debug errors.\n\n---\n\n## 3.7 Functions\n\n### 3.7.1 Basics\n```dart\nint add(int a, int b) {\n  return a + b;\n}\nint multiply(int a, int b) => a * b;   // arrow syntax for a single expression\n```\nEvery function returns something; if no return statement, it returns `null` (with return type `void`/`dynamic`).\n\n### 3.7.2 Parameters\n```dart\n// Positional required\nvoid a(int x, int y) {}\n\n// Optional positional — in []\nvoid b(int x, [int y = 0, int? z]) {}\nb(1); b(1, 2); b(1, 2, 3);\n\n// Named — in {} ; optional by default; use `required` or defaults\nvoid c({required String name, int age = 0, String? email}) {}\nc(name: 'A', email: 'x@y.com');\n\n// Mixed: positional first, then named\nvoid d(int id, {bool verbose = false}) {}\n```\nYou can't mix `[]` and `{}` in the same function.\n\nSince Dart 2.17, **named arguments can appear anywhere** in the call:\n```dart\nd(verbose: true, 42);  // allowed\n```\n\n### 3.7.3 Functions are first-class objects\n```dart\nint square(int x) => x * x;\nfinal f = square;              // store in a variable\nprint([1, 2, 3].map(square));  // pass as argument\n\nvoid runTwice(void Function() action) { action(); action(); }\nrunTwice(() => print('hi'));   // anonymous function (lambda/closure)\n\ntypedef Compare = int Function(int a, int b);   // type alias\nCompare desc = (a, b) => b - a;\n```\n\n### 3.7.4 Closures — functions that remember 🧠\nA closure \"captures\" variables from the scope where it was created:\n```dart\nFunction makeCounter() {\n  var count = 0;\n  return () => ++count;   // remembers `count`\n}\nfinal counter = makeCounter();\nprint(counter()); // 1\nprint(counter()); // 2\n```\nFlutter callbacks like `onPressed: () => setState(() => _count++)` are closures capturing `this` and fields.\n\n⚠️ Closure capture in loops:\n```dart\nfinal callbacks = \u003cvoid Function()>[];\nfor (var i = 0; i \u003c 3; i++) {\n  callbacks.add(() => print(i));\n}\nfor (final c in callbacks) c();  // prints 0, 1, 2 (Dart creates a fresh `i` per iteration — unlike old JS `var`)\n```\n\n### 3.7.5 Lexical scope\nVariables are visible inside the `{}` block where they are declared and nested blocks.\n\n### 3.7.6 Getters & setters, tear-offs\n```dart\nclass Rect {\n  double width, height;\n  Rect(this.width, this.height);\n  double get area => width * height;     // getter\n  set side(double v) { width = v; height = v; } // setter\n}\n// Tear-off: referencing a method/constructor without calling it\nfinal parse = int.parse;               // method tear-off\nfinal makeList = List\u003cint>.empty;      // constructor tear-off (Dart 2.15+)\n['1','2'].map(int.parse).toList();\n```\n\n### 3.7.7 Wildcard variables (Dart 3.7+)\n`_` is now a non-binding wildcard; multiple `_` parameters are allowed:\n```dart\nlist.forEach((_) => count++);\nbuilder: (_, _, child) => child!,   // multiple wildcards allowed in Dart 3.7+\n```\n\n---\n\n## 3.8 Collections — List, Set, Map, Iterable\n\n### 3.8.1 List (ordered, allows duplicates, indexed)\n```dart\nfinal nums = \u003cint>[3, 1, 2];\nnums.add(4);                 // [3,1,2,4]\nnums.addAll([5, 6]);\nnums.insert(0, 0);\nnums.remove(1);              // removes first occurrence of value 1\nnums.removeAt(0);\nnums.removeWhere((n) => n.isEven);\nnums.sort();                 // in place\nnums.sort((a, b) => b.compareTo(a)); // descending\nprint(nums.first); print(nums.last); print(nums.length);\nprint(nums.isEmpty); print(nums.isNotEmpty);\nprint(nums.contains(3)); print(nums.indexOf(3));\nprint(nums.reversed.toList());\nprint(nums.sublist(0, 2));\n\n// Fixed-length & filled\nfinal zeros = List.filled(3, 0);          // [0,0,0] — fixed length!\nfinal gen = List.generate(5, (i) => i * i); // [0,1,4,9,16]\nfinal copy = List.of(nums);               // shallow copy\nfinal unmod = List.unmodifiable(nums);\n```\n⚠️ **`List.filled` with objects shares the same instance**:\n```dart\nfinal grid = List.filled(3, \u003cint>[]);   // all 3 rows are THE SAME list!\ngrid[0].add(1);\nprint(grid); // [[1], [1], [1]]  😱\nfinal ok = List.generate(3, (_) => \u003cint>[]); // ✅ separate lists\n```\n\n### 3.8.2 Set (unique items, unordered conceptually — default LinkedHashSet keeps insertion order)\n```dart\nfinal ids = \u003cint>{1, 2, 3};\nids.add(2);                 // no duplicate\nprint(ids.contains(2));     // fast O(1)\nfinal a = {1, 2, 3}, b = {2, 3, 4};\nprint(a.union(b));          // {1,2,3,4}\nprint(a.intersection(b));   // {2,3}\nprint(a.difference(b));     // {1}\nfinal unique = [1, 1, 2].toSet().toList(); // dedupe\n```\n⚠️ `{}` alone is a **Map**, not a Set. Empty set: `\u003cint>{}`.\n\n### 3.8.3 Map (key → value)\n```dart\nfinal ages = \u003cString, int>{'ann': 30, 'bob': 25};\nages['cat'] = 22;\nprint(ages['ann']);              // 30\nprint(ages['zzz']);              // null (lookup returns V?)\nages.putIfAbsent('dan', () => 40);\nages.update('ann', (v) => v + 1, ifAbsent: () => 0);\nages.remove('bob');\nprint(ages.containsKey('ann'));\nprint(ages.keys); print(ages.values);\nfor (final MapEntry(:key, :value) in ages.entries) {  // pattern destructuring (Dart 3)\n  print('$key = $value');\n}\nages.forEach((k, v) => print('$k:$v'));\nfinal upper = ages.map((k, v) => MapEntry(k.toUpperCase(), v));\n```\nVariants: `HashMap` (no order), `LinkedHashMap` (insertion order — default `{}`), `SplayTreeMap` (sorted by key).\n\n### 3.8.4 Iterable & functional methods\n`List` and `Set` are `Iterable`s. Most functional methods return **lazy** Iterables (computed only when iterated!).\n```dart\nfinal nums = [1, 2, 3, 4, 5];\nnums.map((n) => n * 2);               // (2,4,6,8,10) — lazy Iterable!\nnums.where((n) => n.isOdd);           // filter\nnums.firstWhere((n) => n > 3);        // 4 (throws StateError if none)\nnums.firstWhere((n) => n > 9, orElse: () => -1);\nnums.any((n) => n > 4);               // true\nnums.every((n) => n > 0);             // true\nnums.reduce((a, b) => a + b);         // 15 (throws on empty list)\nnums.fold\u003cint>(0, (sum, n) => sum + n); // 15 (safe for empty)\nnums.take(2); nums.skip(2);\nnums.takeWhile((n) => n \u003c 3);\nnums.expand((n) => [n, n]);           // flatMap\nnums.join(', ');                      // \"1, 2, 3, 4, 5\"\nnums.whereType\u003cint>();\nnums.indexed;                          // Dart 3: (0,1),(1,2)... records\n```\nFrom `package:collection` (official, very common):\n```dart\nimport 'package:collection/collection.dart';\nnums.firstWhereOrNull((n) => n > 9);   // null instead of throwing\nnums.groupListsBy((n) => n.isEven);    // {false: [1,3,5], true: [2,4]}\nnums.sum;  nums.average;  nums.max;\nnums.sortedBy((n) => -n);\nconst ListEquality().equals([1,2], [1,2]); // true (deep equality)\n```\nSince Dart 3.0 the core libraries also provide `nums.firstOrNull`, `lastOrNull`, `singleOrNull`, `elementAtOrNull`, `indexed` and `nonNulls` as extension members on `Iterable` (no import needed).\n\n#### ⚠️ Lazy iterable bug\n```dart\nvar counter = 0;\nfinal doubled = [1, 2, 3].map((n) { counter++; return n * 2; });\nprint(counter);         // 0 — nothing ran yet!\ndoubled.toList();\ndoubled.toList();\nprint(counter);         // 6 — ran twice!\n```\n**Fix:** call `.toList()` once and store it if you'll iterate multiple times. In Flutter, `children: items.map(...).toList()` (or spread `...items.map(...)`) is required because `children` expects a `List\u003cWidget>`.\n\n### 3.8.5 Spread operator\n```dart\nfinal a = [1, 2];\nfinal b = [0, ...a, 3];        // [0,1,2,3]\nList\u003cint>? maybe;\nfinal c = [...?maybe];         // [] if null\nfinal merged = {...mapA, ...mapB}; // later keys win\n```\n\n### 3.8.6 Immutability helpers\n```dart\nfinal frozen = List.unmodifiable([1, 2]);\nfinal view = UnmodifiableListView(myList); // dart:collection — read-only VIEW (changes in myList show through)\n```\n\n---\n\n## 3.9 Exceptions & error handling\n\n```dart\ntry {\n  final n = int.parse('abc');\n} on FormatException catch (e) {\n  print('Bad number: ${e.message}');\n} on Exception catch (e, stackTrace) {\n  print('Some exception: $e\\n$stackTrace');\n} catch (e) {\n  print('Anything else (including Errors): $e');\n  rethrow;                    // re-throw preserving stack trace\n} finally {\n  print('always runs');\n}\n\nthrow FormatException('Invalid');\nthrow ArgumentError.value(x, 'x', 'must be positive');\nthrow StateError('Not initialised');\nthrow UnimplementedError();\n```\n\n### `Exception` vs `Error` (interview favourite)\n* **`Exception`** — expected, recoverable problems the program should handle (network down → `SocketException`, bad input → `FormatException`, `TimeoutException`).\n* **`Error`** — **programmer bugs** that should not be caught normally; fix the code instead (`TypeError`, `RangeError`, `NoSuchMethodError`, `StateError`, `AssertionError`, `LateInitializationError`, `StackOverflowError`, `OutOfMemoryError`).\n\nCustom exception:\n```dart\nclass ApiException implements Exception {\n  final int statusCode;\n  final String message;\n  const ApiException(this.statusCode, this.message);\n  @override\n  String toString() => 'ApiException($statusCode): $message';\n}\n```\nYou *can* throw any object (`throw 'oops';`) but **don't** — throw `Exception`/`Error` subtypes (lint: `only_throw_errors`).\n\n---\n\n## 3.10 Libraries, imports & visibility\n\n```dart\nimport 'dart:math';                          // core library\nimport 'package:http/http.dart' as http;     // prefix to avoid name clashes\nimport 'package:my_app/utils.dart' show formatDate;   // only this name\nimport 'package:my_app/legacy.dart' hide OldThing;    // all except\nimport 'big_feature.dart' deferred as big;   // lazy load (web: code splitting)\nawait big.loadLibrary(); big.run();\n\nexport 'src/widgets.dart';                   // re-export (barrel files)\npart 'user.g.dart';                          // code-gen part file\npart of 'user.dart';                         // in the generated file\n```\n**Privacy:** Dart has **no `public/private/protected` keywords**. An identifier starting with `_` is **private to its library (file)** — not to its class! Two classes in the same file can see each other's `_fields`.\n\nCommon libraries: `dart:core` (auto-imported), `dart:async`, `dart:math`, `dart:convert` (JSON, UTF-8, base64), `dart:io` (files, sockets, HTTP — **not on web**), `dart:isolate`, `dart:typed_data`, `dart:collection`, `dart:ui` (Flutter engine), `dart:ffi`, `dart:js_interop` (web).\n\n**Conditional imports** (to support web and mobile with different implementations):\n```dart\nimport 'storage_stub.dart'\n  if (dart.library.io) 'storage_io.dart'\n  if (dart.library.js_interop) 'storage_web.dart';\n```\n\n---\n\n## 3.11 Dart coding conventions (Effective Dart)\n* `UpperCamelCase` for classes, enums, typedefs, extensions, type parameters.\n* `lowerCamelCase` for variables, functions, parameters, named constants (`const defaultTimeout`, NOT `DEFAULT_TIMEOUT`).\n* `lowercase_with_underscores` for file names, packages, directories, import prefixes.\n* Prefer `final` for locals that don't change.\n* Use `///` doc comments for public APIs.\n* Format with `dart format` (since Dart 3.7 the formatter uses a new \"tall\" style and decides trailing commas itself, depending on your language version).\n* Avoid `print`; prefer `debugPrint`/`log` from `dart:developer`/`package:logging`.\n\n---\n\n## 3.12 Common Dart bugs & fixes\n\n| Bug | Cause | Fix |\n|---|---|---|\n| `Null check operator used on a null value` | `!` on null | Avoid `!`; check null; trace where value should be set |\n| `type 'Null' is not a subtype of type 'String'` | JSON field missing/null cast to non-null | Use `String?` + defaults; validate JSON |\n| `type 'List\u003cdynamic>' is not a subtype of type 'List\u003cString>'` | JSON decode gives `List\u003cdynamic>` | `(json['tags'] as List).cast\u003cString>()` or `List\u003cString>.from(...)` or `.map((e) => e as String).toList()` |\n| `_Map\u003cString, dynamic>` not subtype of `Map\u003cString, String>` | same | `Map\u003cString, String>.from(json)` |\n| `LateInitializationError` | read before set | initialise in `initState`, or make nullable |\n| `RangeError (index)` | index out of bounds | check `length`, use `elementAtOrNull` |\n| `Bad state: No element` | `first`/`firstWhere`/`single`/`reduce` on empty | use `firstOrNull`, `firstWhereOrNull`, `fold` |\n| `Concurrent modification during iteration` | modifying list while looping | iterate a copy (`List.of(list)`) or use `removeWhere` |\n| `Unsupported operation: Cannot add to an unmodifiable list` | mutating const / unmodifiable list | copy: `[...list, item]` or `List.of(list)` |\n| `0.1 + 0.2 != 0.3` | floating point | compare with tolerance, use ints for money |\n| `List.filled` shared objects | same instance | `List.generate` |\n\n---\n\n## 3.13 Interview Questions — Dart basics\n\n**Q1. Difference between `final` and `const`?**\n`final`: single assignment, value determined at runtime, only reference is immutable. `const`: compile-time constant, deeply immutable, canonicalised (identical consts share one instance). Instance fields can be `final` but not `const`. Const widgets help Flutter skip rebuilds.\n\n**Q2. `var` vs `dynamic` vs `Object`?**\n`var` infers a static type from the initializer (fixed afterwards). `dynamic` disables static type checking — any member access compiles and may fail at runtime. `Object` is the root type of non-nullable values; members other than Object's must be accessed after type checks/casts.\n\n**Q3. What is null safety? What is \"sound\" null safety?**\nTypes are non-nullable by default; nullable types are marked `?`. \"Sound\" means the compiler *guarantees* a non-nullable variable can never be null at runtime (when all code is null-safe), allowing the compiler to optimise away null checks. Dart 3 requires 100% sound null safety.\n\n**Q4. What does the `late` keyword do?**\nDeclares a non-nullable variable initialised later (runtime check on access) and/or makes the initialiser lazy. Throws `LateInitializationError` on read-before-write or double-write for `late final`.\n\n**Q5. What is the `!` operator and its risk?**\nNull assertion: casts `T?` to `T`, throwing at runtime if null. Overuse causes \"Null check operator used on a null value\" crashes.\n\n**Q6. What is the difference between `??` and `?.`?**\n`a ?? b` returns `a` if non-null else `b`. `a?.b` accesses `b` only if `a` is non-null, otherwise the whole expression is null.\n\n**Q7. What are named vs positional parameters?**\nPositional parameters are passed by position (`[]` makes them optional); named parameters `{}` are passed by name and are optional unless `required`. Named improve readability and are standard in Flutter widget constructors.\n\n**Q8. What is a closure?**\nA function object that captures variables from its enclosing lexical scope and can use them later even after the scope has ended.\n\n**Q9. What's the difference between `Exception` and `Error`?**\nExceptions represent anticipated runtime failures meant to be caught; Errors represent programming bugs that generally shouldn't be caught.\n\n**Q10. Difference between `==` and `identical`?**\n`==` is overridable value equality; `identical` checks reference identity.\n\n**Q11. What is the cascade operator?**\n`..` performs a sequence of operations on the same object and returns the object, e.g., building `Paint()..color=..` .\n\n**Q12. What is the spread operator?**\n`...` inserts all elements of a collection into another collection literal; `...?` handles null.\n\n**Q13. What are collection if/for?**\nConditionally or iteratively include elements inside list/set/map literals — used heavily to build widget children declaratively.\n\n**Q14. Are `map`/`where` eager or lazy?**\nLazy; they return Iterables that compute on iteration. Iterating multiple times recomputes. Call `toList()` to materialise.\n\n**Q15. How is privacy achieved in Dart?**\nWith a leading underscore — private to the library (file), not the class. `part` files share the same library privacy.\n\n**Q16. What's the difference between `List.filled` and `List.generate`?**\n`filled` puts the *same* value in every slot (dangerous for mutable objects) and is fixed-length by default; `generate` calls a function per index.\n\n**Q17. What is `typedef`?**\nA type alias, e.g., `typedef JsonMap = Map\u003cString, dynamic>;` or function types `typedef Callback = void Function(int);`.\n\n**Q18. What does `int ~/ int` do?** Integer (truncating) division.\n\n**Q19. What happens if you `print` in release mode?** It still executes (prints to device log) — that's why `debugPrint`/loggers and `avoid_print` are preferred; `debugPrint` also throttles output to avoid Android log dropping. To fully remove logs in release, guard with `kDebugMode` or use a logger with levels.\n\n**Q20. What is type promotion and why doesn't it work on public fields?**\nFlow analysis narrows a variable's type after checks (`is`, `!= null`). Public or non-final fields could be overridden by a getter or modified between check and use, so they cannot be soundly promoted; copy to a local first (private final fields are promotable since Dart 3.2).\n"}, {"n": 4, "file": "04-dart-oop-and-modern-features.md", "title": "Chapter 4 — Dart Language, Part 2: OOP, Generics & Modern Dart 3 Features", "subtitle": "Dart Language, Part 2: OOP, Generics & Modern Dart 3 Features", "short": "Dart OOP & Dart 3", "sub": "Mixins, sealed classes, records, patterns", "level": "beginner", "minutes": 18, "qa": 20, "md": "# Chapter 4 — Dart Language, Part 2: OOP, Generics & Modern Dart 3 Features\n\n> **Goal:** Master classes, constructors (all kinds!), inheritance, abstract classes, interfaces, mixins, extensions, enums, generics, class modifiers, sealed classes, records, patterns, extension types, dot shorthands and primary constructors. These power every Flutter codebase and are standard interview material.\n\n---\n\n## 4.1 Classes and objects — cookie cutters 🍪\n\nA **class** is a **cookie cutter**; an **object (instance)** is a **cookie** made with it. Each cookie can have different sprinkles (field values), but the same shape (structure & behaviour).\n\n```dart\nclass Dog {\n  // Fields (instance variables)\n  final String name;\n  int age;\n\n  // Constructor\n  Dog(this.name, this.age);\n\n  // Method\n  void bark() => print('$name says Woof!');\n\n  // Getter\n  bool get isPuppy => age \u003c 1;\n\n  @override\n  String toString() => 'Dog($name, $age)';\n}\n\nvoid main() {\n  final rex = Dog('Rex', 3);   // `new` keyword is optional (and discouraged)\n  rex.bark();\n  rex.age++;\n  print(rex);                  // Dog(Rex, 4)\n}\n```\n\n---\n\n## 4.2 Constructors — every kind (interview gold)\n\n### 4.2.1 Generative constructor with initializing formals\n```dart\nclass Point {\n  final double x, y;\n  Point(this.x, this.y);           // \"this.x\" = initializing formal\n}\n```\n\n### 4.2.2 Named constructors\nDart has **no constructor overloading**; use named constructors:\n```dart\nclass Point {\n  final double x, y;\n  Point(this.x, this.y);\n  Point.origin() : x = 0, y = 0;\n  Point.fromJson(Map\u003cString, dynamic> json)\n      : x = (json['x'] as num).toDouble(),\n        y = (json['y'] as num).toDouble();\n}\nfinal p = Point.fromJson({'x': 1, 'y': 2});\n```\n\n### 4.2.3 Initializer list (runs before the body; can set final fields; can assert)\n```dart\nclass Temperature {\n  final double celsius;\n  final double fahrenheit;\n  Temperature(this.celsius)\n      : assert(celsius >= -273.15),\n        fahrenheit = celsius * 9 / 5 + 32;\n}\n```\n\n### 4.2.4 Redirecting constructor\n```dart\nclass Point {\n  final double x, y;\n  Point(this.x, this.y);\n  Point.onXAxis(double x) : this(x, 0);\n}\n```\n\n### 4.2.5 Const constructor\nAll fields must be `final`, no body:\n```dart\nclass Color {\n  final int r, g, b;\n  const Color(this.r, this.g, this.b);\n}\nconst red = Color(255, 0, 0);\nprint(identical(const Color(255, 0, 0), red)); // true — canonicalised\n```\nEvery Flutter widget you write should have a `const` constructor when possible.\n\n### 4.2.6 Factory constructor\nA `factory` constructor **doesn't have to create a new instance**. It can return a cached instance, a subtype, or do logic before creating:\n```dart\nclass Logger {\n  static final Map\u003cString, Logger> _cache = {};\n  final String name;\n  Logger._internal(this.name);                 // private named constructor\n\n  factory Logger(String name) =>\n      _cache.putIfAbsent(name, () => Logger._internal(name));\n}\n\nabstract class Shape {\n  factory Shape(String type) => switch (type) {\n        'circle' => Circle(),\n        'square' => Square(),\n        _ => throw ArgumentError(type),\n      };\n  double area();\n}\n```\nFactory vs generative:\n| | Generative | Factory |\n|---|---|---|\n| Must create new instance | ✅ | ❌ (can return existing/subtype) |\n| Has access to `this` | ✅ (in body) | ❌ |\n| Initializer list | ✅ | ❌ |\n| Can be `const` | ✅ | ✅ only as redirecting factory |\n| Common use | normal | singletons, caching, `fromJson`, returning subclasses |\n\n### 4.2.7 Singleton pattern in Dart\n```dart\nclass ApiClient {\n  ApiClient._();                             // private constructor\n  static final ApiClient instance = ApiClient._();\n  // or: factory ApiClient() => instance;\n}\n```\n(In big apps prefer dependency injection over global singletons — easier to test. See Chapter 21.)\n\n### 4.2.8 Super parameters (Dart 2.17+)\n```dart\nclass Animal {\n  final String name;\n  Animal(this.name);\n}\nclass Cat extends Animal {\n  final bool indoor;\n  Cat(super.name, {this.indoor = true});   // instead of Cat(String name) : super(name)\n}\n// In Flutter: const MyWidget({super.key});\n```\n\n### 4.2.9 Primary constructors (Dart 3.13+)\nDart 3.13 (released August 2026) added **primary constructors**: declare the constructor and its fields directly in the class header. They add no new semantics — just less boilerplate. Requires `environment: sdk: ^3.13.0`.\n```dart\n// Before\nclass Point {\n  final int x;\n  final int y;\n  const Point(this.x, this.y);\n}\n\n// With a primary constructor: `var`/`final` parameters become fields\nclass Point(var int x, var int y);\n```\nDart 3.13 also allows `new` in place of the class name to declare a (non-factory) constructor in the body, and `factory` alone for a factory constructor. A class with a primary constructor cannot have other *non-redirecting generative* constructors.\n> Because this is very new, most existing codebases (and interview code) still use classic constructors. Check the official Dart docs for the exact syntax variants (named/optional parameters, `const`, initializer bodies) before adopting team-wide.\n\n---\n\n## 4.3 Inheritance — `extends`\n\n```dart\nclass Animal {\n  void speak() => print('...');\n}\nclass Dog extends Animal {\n  @override\n  void speak() {\n    super.speak();          // call parent\n    print('Woof');\n  }\n}\n```\n* Dart has **single inheritance** (one superclass).\n* Every class implicitly extends `Object`.\n* `@override` annotation documents and lets the analyzer check that you're overriding.\n* Constructors are **not** inherited.\n\n### Polymorphism\n```dart\nfinal List\u003cAnimal> zoo = [Dog(), Cat()];\nfor (final a in zoo) a.speak();   // each calls its own version\n```\n\n---\n\n## 4.4 Abstract classes & interfaces\n\n### Abstract class\nCan't be instantiated; may contain abstract methods (no body) and concrete methods.\n```dart\nabstract class Repository {\n  Future\u003cList\u003cString>> fetchAll();        // abstract\n  void log(String m) => print('[repo] $m'); // concrete\n}\n```\n\n### Implicit interfaces — every class is an interface!\nIn Dart there is (traditionally) **no `interface` keyword**. Every class defines an interface. With `implements`, you must implement **all** members (no code inherited):\n```dart\nclass FakeRepository implements Repository {\n  @override\n  Future\u003cList\u003cString>> fetchAll() async => ['a', 'b'];\n  @override\n  void log(String m) {}     // must implement this too\n}\n```\nSince Dart 3, you can write `interface class` / `abstract interface class` to control this explicitly (see 4.9).\n\n### `extends` vs `implements` vs `with` (very common question)\n| | `extends` | `implements` | `with` |\n|---|---|---|---|\n| How many | one | many | many |\n| Inherits code | ✅ | ❌ (must implement everything) | ✅ (mixin code copied in) |\n| Calls `super` | ✅ | ❌ | ✅ (to the class before it in chain) |\n| Relationship | \"is-a\" | \"can act like / contract\" | \"has capability\" |\n\n---\n\n## 4.5 Mixins — sticker packs 🏷️\n\n**5-year-old version:** A mixin is a **sticker pack of abilities**. You can stick \"CanSwim\" and \"CanFly\" on a Duck. The Duck gets those abilities without being *born from* a Swimmer.\n\n```dart\nmixin CanSwim {\n  void swim() => print('Swimming');\n}\nmixin CanFly {\n  int altitude = 0;           // mixins can have state\n  void fly() => print('Flying at $altitude');\n}\nclass Duck extends Animal with CanSwim, CanFly {}\nDuck()..swim()..fly();\n```\n\n### Restricting a mixin with `on`\n```dart\nmixin Logging on State {           // only classes that extend State can use it\n  void log(String msg) => debugPrint('${widget.runtimeType}: $msg');\n}\n```\n\n### Flutter's famous mixins\n* `SingleTickerProviderStateMixin` / `TickerProviderStateMixin` — provide `vsync` for `AnimationController`.\n* `AutomaticKeepAliveClientMixin` — keep list item state alive when scrolled away.\n* `WidgetsBindingObserver` — app lifecycle (it's an abstract mixin class).\n* `RestorationMixin` — state restoration.\n* `ChangeNotifier` can be used as a mixin (`with ChangeNotifier`).\n\n### Linearization (order matters!)\n`class C extends A with M1, M2` builds a chain: `A → A+M1 → A+M1+M2 → C`. If M1 and M2 both define `hello()`, **the last one (M2) wins**, and `super.hello()` in M2 calls M1's.\n```dart\nmixin A { String hi() => 'A'; }\nmixin B { String hi() => 'B'; }\nclass X with A, B {}\nprint(X().hi()); // B\n```\n\n### Mixin vs abstract class\n* Mixins can't have generative constructors.\n* Since Dart 3, a class can't be used as a mixin unless declared `mixin` or `mixin class`.\n\n---\n\n## 4.6 Extension methods — adding new tricks to old toys 🧸\n\nAdd methods to existing types (even ones you don't own) without subclassing:\n```dart\nextension StringX on String {\n  String get capitalized =>\n      isEmpty ? this : '${this[0].toUpperCase()}${substring(1)}';\n  bool get isValidEmail => RegExp(r'^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$').hasMatch(this);\n}\n\nextension ContextX on BuildContext {\n  ThemeData get theme => Theme.of(this);\n  Size get screenSize => MediaQuery.sizeOf(this);\n  void showSnack(String msg) =>\n      ScaffoldMessenger.of(this).showSnackBar(SnackBar(content: Text(msg)));\n}\n\nprint('hello'.capitalized);   // Hello\ncontext.showSnack('Saved!');\n```\n⚠️ Extensions are resolved **statically** (by the declared type) — they don't work on `dynamic` and can't be overridden polymorphically.\n\n---\n\n## 4.7 Enums\n\n### Simple enum\n```dart\nenum Status { idle, loading, success, error }\nfinal s = Status.loading;\nprint(s.name);         // \"loading\"\nprint(s.index);        // 1\nprint(Status.values);  // [Status.idle, ...]\nStatus.values.byName('error'); // Status.error (throws if not found)\n```\n\n### Enhanced enums (Dart 2.17+) — fields, constructors, methods, interfaces\n```dart\nenum Planet implements Comparable\u003cPlanet> {\n  mercury(mass: 3.303e+23, radius: 2.4397e6),\n  earth(mass: 5.976e+24, radius: 6.37814e6);\n\n  const Planet({required this.mass, required this.radius});\n  final double mass;\n  final double radius;\n\n  double get surfaceGravity => 6.67300E-11 * mass / (radius * radius);\n\n  @override\n  int compareTo(Planet other) => mass.compareTo(other.mass);\n}\n\nenum HttpStatus {\n  ok(200), notFound(404), serverError(500);\n  const HttpStatus(this.code);\n  final int code;\n  static HttpStatus fromCode(int c) => values.firstWhere((e) => e.code == c);\n}\n```\nEnums work great with `switch` — the compiler checks **exhaustiveness** (forget a case → error).\n\n### Dot shorthands (Dart 3.10+)\nWhen the type is known from context, you can omit it:\n```dart\nStatus s = .loading;              // instead of Status.loading\nColumn(\n  mainAxisAlignment: .center,     // instead of MainAxisAlignment.center\n  crossAxisAlignment: .start,\n  children: [...],\n);\nswitch (s) {\n  case .idle: ...\n  case .loading: ...\n  // ...\n}\nEdgeInsets padding = .all(16);    // static members & constructors too\n```\nRequires `sdk: ^3.10.0`. Older code uses the full names — both are valid.\n\n---\n\n## 4.8 Generics — boxes that say what's inside 🎁\n\n**5-year-old version:** A generic is a box with a **label slot**: `Box\u003cApple>` only holds apples, `Box\u003cToy>` only toys. Same box design, safe contents.\n\n```dart\nclass Box\u003cT> {\n  final T value;\n  Box(this.value);\n  T open() => value;\n}\nfinal b = Box\u003cint>(5);\nfinal c = Box('hi');           // T inferred as String\n\nT firstOrDefault\u003cT>(List\u003cT> items, T fallback) =>\n    items.isEmpty ? fallback : items.first;\n\n// Bounded generics\nclass NumberBox\u003cT extends num> {\n  final T value;\n  NumberBox(this.value);\n  T doubleIt() => (value * 2) as T;\n}\n\n// Generic result type used in real apps:\nsealed class Result\u003cT> {\n  const Result();\n}\nfinal class Ok\u003cT> extends Result\u003cT> {\n  final T data;\n  const Ok(this.data);\n}\nfinal class Err\u003cT> extends Result\u003cT> {\n  final Object error;\n  const Err(this.error);\n}\n```\nDart generics are **reified** — type info is kept at runtime (`list is List\u003cint>` works), unlike Java's erasure.\n\n**Covariance gotcha:** Dart's generic classes are covariant: a `List\u003cint>` *is a* `List\u003cObject>`. This can cause runtime errors:\n```dart\nList\u003cObject> objs = \u003cint>[1, 2];\nobjs.add('x');  // compiles, but throws TypeError at runtime!\n```\n\n---\n\n## 4.9 Class modifiers (Dart 3) — `abstract`, `base`, `interface`, `final`, `sealed`, `mixin`\n\nDart 3 added modifiers controlling how a class can be used **outside its library**:\n\n| Declaration | Construct? | Extend outside lib? | Implement outside lib? | Mix in? | Exhaustive switch? |\n|---|---|---|---|---|---|\n| `class` | ✅ | ✅ | ✅ | ❌ | ❌ |\n| `base class` | ✅ | ✅ (subclasses must be base/final/sealed) | ❌ | ❌ | ❌ |\n| `interface class` | ✅ | ❌ | ✅ | ❌ | ❌ |\n| `final class` | ✅ | ❌ | ❌ | ❌ | ❌ |\n| `sealed class` | ❌ (implicitly abstract) | ❌ | ❌ | ❌ | ✅ |\n| `abstract class` | ❌ | ✅ | ✅ | ❌ | ❌ |\n| `abstract interface class` | ❌ | ❌ | ✅ | ❌ | ❌ | ← like a pure interface |\n| `mixin` | ❌ | ❌ | ✅ | ✅ | ❌ |\n| `mixin class` | ✅ | ✅ | ✅ | ✅ | ❌ |\n\nInside the **same library** (file), these restrictions don't apply.\n\n### Sealed classes — the \"closed family\" 👨‍👩‍👧\nA `sealed` class's direct subtypes must all be in the **same library**. So the compiler **knows all possible subtypes** and can check that a `switch` handles every one:\n```dart\nsealed class AuthState {}\nclass AuthInitial extends AuthState {}\nclass AuthLoading extends AuthState {}\nclass AuthSuccess extends AuthState { final User user; AuthSuccess(this.user); }\nclass AuthFailure extends AuthState { final String message; AuthFailure(this.message); }\n\nWidget build(BuildContext context) {\n  final state = ...;\n  return switch (state) {\n    AuthInitial() => const LoginForm(),\n    AuthLoading() => const CircularProgressIndicator(),\n    AuthSuccess(:final user) => HomePage(user: user),\n    AuthFailure(:final message) => ErrorView(message),\n    // No default needed; add a new subclass → compiler errors here until handled ✅\n  };\n}\n```\nThis is the modern replacement for many `freezed` union types and is widely used for Bloc states, API results, and navigation events.\n\n---\n\n## 4.10 Records (Dart 3) — anonymous mini-objects\n\nA **record** is a lightweight, immutable, **anonymous** bundle of values — like a tuple.\n```dart\n(String, int) getUser() => ('Asha', 30);         // positional\n({String name, int age}) getUser2() => (name: 'Asha', age: 30); // named\n\nfinal user = getUser();\nprint(user.$1);  // Asha  ($1, $2 for positional fields)\nprint(user.$2);  // 30\nfinal u2 = getUser2();\nprint(u2.name);\n\n// Destructuring with patterns\nfinal (name, age) = getUser();\nfinal (:name, :age) = getUser2();   // shorthand for (name: name, age: age)\n\n// Records have structural value equality\nprint((1, 'a') == (1, 'a')); // true\n\n// Swap\nvar a = 1, b = 2;\n(a, b) = (b, a);\n```\nUse records for **returning multiple values** from functions; use classes when the data has behaviour or is passed widely.\n\n---\n\n## 4.11 Patterns (Dart 3) — shape-matching 🔍\n\nPatterns let you **check the shape of a value and pull out pieces** at the same time.\n\n### Pattern kinds\n| Pattern | Example |\n|---|---|\n| Constant | `case 404:` |\n| Variable / wildcard | `case var x:` / `_` |\n| Relational | `case >= 200 && \u003c 300:` |\n| Logical or / and | `case 'y' \\|\\| 'yes':` / `case > 0 && \u003c 10:` |\n| Null-check | `case final v?:` (match if non-null, bind) |\n| Null-assert | `case final v!:` (throw if null) |\n| Cast | `case final n as int:` |\n| List | `case [first, ...rest]:` / `case [_, _]:` |\n| Map | `case {'type': 'user', 'id': int id}:` |\n| Record | `case (int x, int y):` |\n| Object | `case Point(x: 0, :final y):` |\n| Parenthesized | `case (1 \\|\\| 2) && != 3:` |\n\n### Where patterns appear\n```dart\n// 1. switch statements & expressions\nString describe(Object o) => switch (o) {\n      int n when n \u003c 0 => 'negative int',     // `when` guard clause\n      int() => 'int',\n      String s when s.isEmpty => 'empty string',\n      String() => 'string',\n      [] => 'empty list',\n      [final first, ...] => 'list starting with $first',\n      {'name': String name} => 'map with name $name',\n      (int a, int b) => 'pair $a,$b',\n      _ => 'something else',\n    };\n\n// 2. if-case\nfinal json = {'user': {'name': 'Ravi', 'age': 30}};\nif (json case {'user': {'name': String name, 'age': int age}}) {\n  print('$name is $age');      // safe JSON validation + extraction in one go!\n}\n\n// 3. variable declarations / destructuring\nfinal [a, b, c] = [1, 2, 3];\nfinal Point(:x, :y) = point;\n\n// 4. for-in loops\nfor (final (index, item) in items.indexed) { print('$index: $item'); }\n```\n\n### Exhaustiveness\n`switch` **expressions** must be exhaustive. With `bool`, enums, sealed types and nullable types, the compiler can verify completeness. Statement switches over these types are also checked.\n\n---\n\n## 4.12 Extension types (Dart 3.3+) — zero-cost wrappers\n\nAn **extension type** wraps an existing type with a **new static type** and a different API, with **no runtime cost** (it's erased at runtime).\n```dart\nextension type UserId(String value) {\n  bool get isValid => value.startsWith('usr_');\n}\nextension type Meters(double value) {\n  Meters operator +(Meters other) => Meters(value + other.value);\n}\n\nvoid loadUser(UserId id) {}\nloadUser(UserId('usr_1'));   // ✅\n// loadUser('usr_1');        // ❌ compile error — prevents mixing up IDs\n```\nUses: type-safe IDs, units, and **JS interop** (`dart:js_interop` uses extension types heavily for web). Caveat: since it's erased at runtime, `is UserId` checks the underlying type — it's a static-only safety net.\n\n---\n\n## 4.13 Equality & hashCode — value objects\n\nBy default, `==` compares **identity**. For data classes compare **values**:\n```dart\nclass User {\n  final String id;\n  final String name;\n  const User(this.id, this.name);\n\n  @override\n  bool operator ==(Object other) =>\n      identical(this, other) ||\n      other is User && other.id == id && other.name == name;\n\n  @override\n  int get hashCode => Object.hash(id, name);   // Object.hashAll(list) for lists\n}\n```\n**Rule:** if you override `==`, you **must** override `hashCode` consistently (equal objects ⇒ equal hash codes) — otherwise `Set`/`Map` break.\n\nWriting this by hand is error-prone. Teams use:\n* **`equatable`** — extend `Equatable`, list `props`.\n* **`freezed`** — code generation of `==`, `hashCode`, `copyWith`, `toString`, JSON, unions.\n* **records** — have built-in structural equality.\n* Data class macros were planned but **the Dart team cancelled macros in January 2025**; code generation (`build_runner`) remains the standard. (Interviewers sometimes ask — know that it was cancelled.)\n\n### `copyWith` pattern (immutable updates)\n```dart\nclass Todo {\n  final String title;\n  final bool done;\n  const Todo({required this.title, this.done = false});\n\n  Todo copyWith({String? title, bool? done}) =>\n      Todo(title: title ?? this.title, done: done ?? this.done);\n}\nfinal t2 = t1.copyWith(done: true);\n```\n⚠️ Gotcha: with `??` you can't set a nullable field *back to null*. Freezed handles that; manually you can use a sentinel or `ValueGetter\u003cT?>? field` parameter.\n\n---\n\n## 4.14 Static members, operators, callable classes, `noSuchMethod`\n\n```dart\nclass MathUtils {\n  static const double pi = 3.14159;\n  static int square(int x) => x * x;\n}\nMathUtils.square(3);\n\nclass Vector {\n  final double x, y;\n  const Vector(this.x, this.y);\n  Vector operator +(Vector o) => Vector(x + o.x, y + o.y);\n  Vector operator -() => Vector(-x, -y);\n  double operator [](int i) => i == 0 ? x : y;\n}\n\nclass Multiplier {\n  final int factor;\n  Multiplier(this.factor);\n  int call(int x) => x * factor;   // callable object\n}\nfinal triple = Multiplier(3);\nprint(triple(5)); // 15\n```\n\n---\n\n## 4.15 Composition over inheritance (Flutter's philosophy)\nFlutter widgets are built by **composing** small widgets rather than subclassing big ones. You don't extend `ElevatedButton` to make a \"PrimaryButton\" — you create a new `StatelessWidget` that *returns* a configured `ElevatedButton`. Interviewers ask \"why does Flutter prefer composition?\" → flexibility, smaller units, easier reuse, avoids fragile base class problems, deep hierarchies.\n\n---\n\n## 4.16 Interview Questions — Dart OOP & modern features\n\n**Q1. Does Dart support multiple inheritance?** No — single inheritance via `extends`; but a class can `implement` multiple interfaces and use multiple mixins (`with`).\n\n**Q2. What is a mixin? How is it different from inheritance and interfaces?** A mixin is a reusable chunk of class members that can be \"mixed into\" multiple class hierarchies with `with`. Unlike `extends` you can apply many; unlike `implements` you get the implementation. Restrict with `on`. Order matters (last wins).\n\n**Q3. What is a factory constructor? Give use cases.** A constructor that may return an existing instance or a subtype instead of always creating a new one: singletons, caches, `fromJson`, choosing implementation subclasses.\n\n**Q4. What's the difference between `extends` and `implements`?** `extends` inherits implementation (single); `implements` only adopts the interface and requires implementing all members (multiple allowed).\n\n**Q5. What are extension methods?** Statically-resolved methods added to existing types without modifying/subclassing them.\n\n**Q6. What are sealed classes and why are they useful?** Classes whose direct subtypes are all declared in the same library, allowing the compiler to check exhaustive switches over them; great for modelling states, events, results.\n\n**Q7. What are records?** Immutable, anonymous, fixed-size aggregates with positional and/or named fields and structural equality; useful for multiple return values.\n\n**Q8. What are patterns?** Syntax for matching values against shapes (constants, types, lists, maps, records, objects, relational/logical operators) and destructuring them, usable in switch, if-case, declarations and loops.\n\n**Q9. What is an extension type?** A compile-time-only wrapper giving a new static type and interface to an existing representation type with zero runtime overhead.\n\n**Q10. Difference between `abstract class` and `interface class`?** Abstract can't be instantiated but can be extended and implemented. `interface class` can be instantiated and implemented but not extended outside its library. `abstract interface class` = pure interface.\n\n**Q11. What does `base` / `final` class modifier do?** `base`: can be extended but not implemented outside the library (guarantees inherited implementation). `final`: neither extended nor implemented outside the library.\n\n**Q12. Why must `hashCode` be overridden with `==`?** Hash-based collections use hashCode to find buckets; equal objects with different hash codes break Set/Map lookups.\n\n**Q13. Why use `const` constructors?** Compile-time canonical instances, less memory/GC, and Flutter can skip rebuilding identical const widget subtrees.\n\n**Q14. What are named constructors and why does Dart need them?** Dart lacks overloading; named constructors (`Point.origin()`) provide multiple ways to construct with clear names.\n\n**Q15. What are super parameters?** `super.x` in constructor parameters forwards to the superclass constructor, e.g., `const MyWidget({super.key})`.\n\n**Q16. What's an initializer list?** Code after `:` in a constructor that runs before the body, used for initializing final fields, asserts and calling super/redirecting.\n\n**Q17. What are generics, and are Dart generics reified?** Parameterised types for type-safe reuse; yes, Dart keeps type arguments at runtime.\n\n**Q18. What happened to Dart macros?** They were an experimental metaprogramming feature (e.g., `@JsonCodable`); the Dart team stopped work on them in early 2025, focusing instead on improving code generation (build_runner speed) and smaller language features like augmentations-related improvements, dot shorthands and primary constructors.\n\n**Q19. What are dot shorthands?** Dart 3.10 syntax allowing `.value` instead of `Type.value` where the type is inferable from context — e.g., `mainAxisAlignment: .center`.\n\n**Q20. Explain `mixin class`.** A declaration usable both as a regular class (instantiate/extend) and as a mixin; required in Dart 3 if you want both behaviours.\n"}, {"n": 5, "file": "05-dart-async-and-isolates.md", "title": "Chapter 5 — Asynchronous Dart: Event Loop, Futures, Streams, Isolates & Zones", "subtitle": "Asynchronous Dart: Event Loop, Futures, Streams, Isolates & Zones", "short": "Async Dart & Isolates", "sub": "Event loop, Futures, Streams, Zones", "level": "beginner", "minutes": 15, "qa": 20, "md": "# Chapter 5 — Asynchronous Dart: Event Loop, Futures, Streams, Isolates & Zones\n\n> **Goal:** Truly understand how Dart does many things \"at once\" with one thread. This is one of the most heavily tested interview areas (event loop, microtasks, Future vs Stream, isolates, `compute`) and the source of many production bugs.\n\n---\n\n## 5.1 The 5-year-old story: one chef, many orders 👩‍🍳\n\nDart (per isolate) has **one chef** (one thread). The chef can only do one thing at a time. But when the chef puts a cake in the oven (a slow network request), they **don't stand and stare at the oven** — they write a sticky note \"when oven beeps, take cake out\" and go do other orders. When the oven beeps, the note goes into a **queue**, and the chef handles it when free.\n\n* The sticky-note system = **event loop**.\n* \"When oven beeps, do X\" = a **Future** with a callback / `await`.\n* A conveyor belt delivering many cakes over time = a **Stream**.\n* Hiring a **second chef in a separate kitchen** (no shared bowls, only passing notes through a window) = an **Isolate**.\n\nImportant: if the chef decides to **knead dough for 10 minutes without stopping** (heavy synchronous computation), *nobody* else is served — in Flutter that means **frozen UI / jank**. `async` does NOT make heavy CPU work run in the background! Only isolates do.\n\n---\n\n## 5.2 The event loop in detail\n\nEach isolate has:\n1. **Microtask queue** — high priority, small internal tasks (`scheduleMicrotask`, `Future.microtask`, completion callbacks of already-completed futures, `then` callbacks).\n2. **Event queue** — I/O events, timers, gestures, frame callbacks, messages from other isolates, `Future(...)`, `Future.delayed`.\n\nAlgorithm:\n```\nrun main() synchronously to completion\nloop forever:\n    while microtask queue not empty:\n        run next microtask\n    if event queue not empty:\n        run next event (then go back and drain microtasks again)\n```\n**Microtasks always run before the next event.** Too many microtasks → starve events (UI freezes).\n\n### The classic interview puzzle\n```dart\nimport 'dart:async';\n\nvoid main() {\n  print('1 - sync start');\n\n  Future(() => print('2 - event queue (Future)'));\n  Future.delayed(Duration.zero, () => print('3 - event queue (delayed 0)'));\n  scheduleMicrotask(() => print('4 - microtask'));\n  Future.microtask(() => print('5 - microtask (Future.microtask)'));\n  Future.value(1).then((_) => print('6 - then on completed future (microtask)'));\n  Future.sync(() => print('7 - Future.sync runs immediately'));\n\n  print('8 - sync end');\n}\n```\nOutput:\n```\n1 - sync start\n7 - Future.sync runs immediately\n8 - sync end\n4 - microtask\n5 - microtask (Future.microtask)\n6 - then on completed future (microtask)\n2 - event queue (Future)\n3 - event queue (delayed 0)\n```\nExplanation:\n* Synchronous code first: 1, 7 (`Future.sync` runs its callback synchronously), 8.\n* Then **all microtasks** in FIFO order: 4, 5, 6.\n* Then **events** in order: 2, 3.\n\n### Another puzzle with async/await\n```dart\nFuture\u003cvoid> task() async {\n  print('A');\n  await null;          // suspends; rest continues as a microtask\n  print('B');\n}\nvoid main() {\n  print('1');\n  task();\n  print('2');\n}\n// 1, A, 2, B\n```\n**Key rule:** an `async` function runs **synchronously until the first `await`**. Then it returns a `Future` to the caller, and the rest of the function continues later.\n\n---\n\n## 5.3 Future — a promise of one value later 🎟️\n\nA `Future\u003cT>` is like a **restaurant buzzer**: you get it now, and it will buzz later with either your food (**value**) or bad news (**error**).\n\nStates: **uncompleted** → **completed with value** OR **completed with error**.\n\n### 5.3.1 Creating futures\n```dart\nFuture\u003cint> a = Future.value(42);\nFuture\u003cint> b = Future.error(Exception('fail'));\nFuture\u003cint> c = Future.delayed(const Duration(seconds: 2), () => 42);\nFuture\u003cint> d = Future(() => compute42());   // schedule on event queue\n\n// Completer — manually complete (useful for wrapping callback APIs)\nFuture\u003cString> wrapCallbackApi() {\n  final completer = Completer\u003cString>();\n  legacyApi(onSuccess: completer.complete, onError: completer.completeError);\n  return completer.future;\n}\n```\n\n### 5.3.2 Consuming futures: `then` vs `async/await`\n```dart\n// then-style\nfetchUser().then((user) => print(user.name))\n           .catchError((e) => print('Error $e'))\n           .whenComplete(() => print('done'));\n\n// async/await style (preferred: reads like sync code)\nFuture\u003cvoid> load() async {\n  try {\n    final user = await fetchUser();\n    print(user.name);\n  } catch (e, st) {\n    print('Error $e $st');\n  } finally {\n    print('done');\n  }\n}\n```\n\n### 5.3.3 Running futures in parallel vs sequentially\n```dart\n// ❌ Sequential — total ≈ 3s\nfinal a = await fetchA(); // 1s\nfinal b = await fetchB(); // 1s\nfinal c = await fetchC(); // 1s\n\n// ✅ Parallel — total ≈ 1s\nfinal results = await Future.wait([fetchA(), fetchB(), fetchC()]);\n\n// ✅ Dart 3 records: typed parallel waits\nfinal (user, posts) = await (fetchUser(), fetchPosts()).wait;\n```\nBy default `Future.wait` waits for **all** futures to finish and then completes with the **first error** that occurred; pass `eagerError: true` to complete with an error as soon as any future fails (the others keep running regardless — futures can't be cancelled). The records `.wait` extension throws a `ParallelWaitError` that contains both the successful values and the errors.\n\nOther helpers:\n```dart\nawait Future.any([f1, f2]);                    // first to complete\nawait fetch().timeout(const Duration(seconds: 10)); // throws TimeoutException\nawait Future.forEach(items, (item) async => await upload(item)); // sequential async loop\nawait Future.doWhile(() async { ... return keepGoing; });\n```\n\n### 5.3.4 ⚠️ `forEach` with async — classic bug\n```dart\n// ❌ Does NOT wait! forEach ignores returned futures.\nitems.forEach((item) async {\n  await upload(item);\n});\nprint('All uploaded?'); // prints immediately, uploads still running\n\n// ✅ Sequential\nfor (final item in items) {\n  await upload(item);\n}\n// ✅ Parallel\nawait Future.wait(items.map(upload));\n```\n\n### 5.3.5 Unawaited futures & errors\nIf a Future errors and nobody listens, it becomes an **uncaught async error** (reported to the zone / `PlatformDispatcher.instance.onError`). Lint `unawaited_futures` catches missing awaits. When you intentionally don't await, use `unawaited(future)` from `dart:async` to document it.\n\n### 5.3.6 `FutureOr\u003cT>`\nA type meaning \"either `T` or `Future\u003cT>`\", used in APIs that accept sync or async callbacks.\n\n---\n\n## 5.4 Streams — a conveyor belt of values 🛤️\n\nA `Stream\u003cT>` delivers **many values over time** (plus possibly errors) and then optionally a **done** event. Examples: user typing, location updates, WebSocket messages, Firestore snapshots, Bloc states.\n\n| | Future | Stream |\n|---|---|---|\n| Number of values | one | zero or many |\n| Analogy | buzzer | conveyor belt / YouTube live |\n| Consume | `await`, `then` | `await for`, `listen` |\n| Flutter widget | `FutureBuilder` | `StreamBuilder` |\n\n### 5.4.1 Single-subscription vs broadcast\n* **Single-subscription** (default): **only one listener**, ever. Data is buffered until listened. Example: reading a file, HTTP response body. Listening twice → `Bad state: Stream has already been listened to.`\n* **Broadcast**: **many listeners**; events not buffered — late listeners miss earlier events. Example: button clicks, `StreamController.broadcast()`.\n```dart\nfinal broadcast = myStream.asBroadcastStream();\n```\n\n### 5.4.2 Creating streams\n```dart\n// 1. async* generator\nStream\u003cint> countDown(int from) async* {\n  for (var i = from; i >= 0; i--) {\n    await Future.delayed(const Duration(seconds: 1));\n    yield i;                  // emit a value\n  }\n}\n// yield* forwards all values from another stream:\nStream\u003cint> twice() async* { yield* countDown(3); yield* countDown(3); }\n\n// 2. StreamController\nfinal controller = StreamController\u003cString>();      // or .broadcast()\ncontroller.sink.add('hello');      // or controller.add\ncontroller.addError(Exception('x'));\nawait controller.close();          // ALWAYS close to avoid leaks\ncontroller.stream.listen(print);\n\n// 3. Built-ins\nStream.periodic(const Duration(seconds: 1), (i) => i);\nStream.fromIterable([1, 2, 3]);\nStream.fromFuture(fetch());\nStream.value(1); Stream.error(e); Stream.empty();\n```\nSynchronous generator (`sync*`) produces an `Iterable` lazily:\n```dart\nIterable\u003cint> naturals(int n) sync* { for (var i = 0; i \u003c n; i++) yield i; }\n```\n\n### 5.4.3 Listening\n```dart\nfinal StreamSubscription\u003cint> sub = countDown(5).listen(\n  (value) => print(value),\n  onError: (e) => print('error $e'),\n  onDone: () => print('done'),\n  cancelOnError: false,\n);\nsub.pause(); sub.resume();\nawait sub.cancel();   // ALWAYS cancel in dispose()!\n\n// await for (inside async function)\nawait for (final v in countDown(3)) {\n  print(v);\n}\n```\n\n### 5.4.4 Transforming streams\n```dart\nstream.map((x) => x * 2)\n      .where((x) => x > 2)\n      .distinct()                 // skip consecutive duplicates\n      .take(10).skip(1)\n      .asyncMap((x) => fetchDetails(x))  // async map, sequential\n      .handleError((e) => log(e))\n      .timeout(const Duration(seconds: 5));\nfinal first = await stream.first;\nfinal list = await stream.toList();\n```\nDebounce/throttle (for search boxes) are not in core — use `package:rxdart` (`debounceTime`, `switchMap`, `BehaviorSubject`, `combineLatest`) or `stream_transform` (`debounce`, `throttle`, `switchMap`), or implement with a `Timer`.\n\n### 5.4.5 RxDart subjects (common in older/enterprise code)\n* `PublishSubject` — broadcast, no replay.\n* `BehaviorSubject` — remembers the **latest** value; new listeners get it immediately (like a \"current state\").\n* `ReplaySubject` — replays all (or N) previous values.\n\n### 5.4.6 Stream memory leak bug\n```dart\nclass _ChatState extends State\u003cChat> {\n  StreamSubscription? _sub;\n\n  @override\n  void initState() {\n    super.initState();\n    _sub = chatService.messages.listen((m) => setState(() => _messages.add(m)));\n  }\n\n  @override\n  void dispose() {\n    _sub?.cancel();   // ❗ forget this → leak + \"setState() called after dispose()\"\n    super.dispose();\n  }\n}\n```\n\n---\n\n## 5.5 Isolates — a second kitchen 🏠🏠\n\n### 5.5.1 What is an isolate?\nAn **isolate** is Dart's unit of concurrency: its **own memory heap**, its **own event loop**, and its **own thread** (when running). Isolates **do not share mutable memory** → **no data races, no locks**. They communicate by **passing messages** through **ports** (`SendPort` / `ReceivePort`).\n\nThe Flutter app's Dart code runs in the **root isolate** (main isolate).\n\n### 5.5.2 When to use one\nAny CPU-heavy work that would take more than a few milliseconds (remember: 16 ms per frame at 60 fps):\n* Parsing/encoding big JSON (> ~100 KB… measure!)\n* Image processing, compression, encryption, hashing.\n* Sorting/filtering huge lists, search indexing.\n* Heavy database transformations, PDF generation.\n\n**Not needed for:** network requests or file I/O themselves — those are already asynchronous (the waiting happens outside Dart).\n\n### 5.5.3 `Isolate.run` (Dart 2.19+) — the easiest way\n```dart\nimport 'dart:convert';\nimport 'dart:isolate';\n\nFuture\u003cList\u003cPhoto>> parsePhotos(String body) {\n  return Isolate.run(() {\n    final list = jsonDecode(body) as List\u003cdynamic>;\n    return list.map((e) => Photo.fromJson(e as Map\u003cString, dynamic>)).toList();\n  });\n}\n```\n\n### 5.5.4 Flutter's `compute()`\n```dart\nimport 'package:flutter/foundation.dart';\n\nList\u003cPhoto> _parse(String body) { /* ... */ }   // top-level or static function\nfinal photos = await compute(_parse, responseBody);\n```\n`compute` takes a callback and one message argument; on native it uses `Isolate.run` internally; **on the web it runs on the same thread** (web has no Dart isolates — use Web Workers for true parallelism).\n\n### 5.5.5 Long-lived isolates with ports\n```dart\nFuture\u003cvoid> startWorker() async {\n  final receivePort = ReceivePort();\n  await Isolate.spawn(_worker, receivePort.sendPort);\n\n  late SendPort workerPort;\n  receivePort.listen((message) {\n    if (message is SendPort) {\n      workerPort = message;            // handshake\n      workerPort.send('job 1');\n    } else {\n      print('Result: $message');\n    }\n  });\n}\n\nvoid _worker(SendPort mainPort) {\n  final port = ReceivePort();\n  mainPort.send(port.sendPort);        // send our port back\n  port.listen((job) {\n    mainPort.send('done: $job');\n  });\n}\n```\n\n### 5.5.6 Rules and gotchas\n* Messages are **copied** (deep copy) between isolates — big messages cost time. `Isolate.exit()` (used by `Isolate.run`) can transfer the result **without copying**. `TransferableTypedData` transfers byte buffers efficiently.\n* Since Dart 2.15, isolates spawned with `Isolate.spawn` share an **isolate group** (same code), so spawning is fast and closures can be sent (with restrictions — no sockets, ReceivePorts, etc.).\n* **Platform channels / plugins in background isolates:** historically not possible; since Flutter 3.7 you can use `BackgroundIsolateBinaryMessenger.ensureInitialized(rootIsolateToken)` to call plugins from background isolates:\n  ```dart\n  final token = RootIsolateToken.instance!;\n  Isolate.run(() async {\n    BackgroundIsolateBinaryMessenger.ensureInitialized(token);\n    final prefs = await SharedPreferences.getInstance(); // works now\n  });\n  ```\n* You can't touch the widget tree / `BuildContext` / UI from another isolate.\n* Each isolate has its own copy of globals/singletons! A singleton initialised in main isolate is *not* initialised in a spawned one.\n* Isolates have memory overhead; for many small tasks, use a pool (packages like `isolate_manager`, `squadron`, `worker_manager`).\n\n### 5.5.7 Concurrency vs parallelism\n* **Concurrency** — dealing with many things at once (interleaving) → event loop + async.\n* **Parallelism** — doing many things *simultaneously* on multiple cores → isolates.\n\n---\n\n## 5.6 Zones — invisible bubbles around your code 🫧\n\nA **Zone** is an execution context that persists across async callbacks. It can:\n* Catch **uncaught async errors** in that zone.\n* Store zone-local values (like thread-locals).\n* Intercept `print`, timers, microtasks (used by test frameworks / `fake_async`).\n\n```dart\nrunZonedGuarded(() {\n  runApp(const MyApp());\n}, (error, stack) {\n  FirebaseCrashlytics.instance.recordError(error, stack, fatal: true);\n});\n```\n⚠️ **Zone mismatch warning:** if you call `WidgetsFlutterBinding.ensureInitialized()` in one zone and `runApp` in another, Flutter prints \"Zone mismatch\". Keep them in the same zone.\n\n**Modern recommended global error handling (Flutter 3.3+):**\n```dart\nvoid main() {\n  WidgetsFlutterBinding.ensureInitialized();\n\n  // 1. Errors thrown by the Flutter framework (build/layout/paint callbacks)\n  FlutterError.onError = (details) {\n    FlutterError.presentError(details);  // keeps console output in debug\n    crashReporter.recordFlutterError(details);\n  };\n\n  // 2. Uncaught async errors and errors outside Flutter callbacks\n  PlatformDispatcher.instance.onError = (error, stack) {\n    crashReporter.recordError(error, stack, fatal: true);\n    return true; // handled\n  };\n\n  // 3. Errors in background isolates (optional)\n  Isolate.current.addErrorListener(RawReceivePort((pair) async {\n    final List\u003cdynamic> errorAndStack = pair;\n    crashReporter.recordError(errorAndStack.first, StackTrace.fromString(errorAndStack.last.toString()));\n  }).sendPort);\n\n  // 4. What to show when a widget's build throws (instead of red screen in release)\n  ErrorWidget.builder = (details) => const Center(child: Text('Something went wrong'));\n\n  runApp(const MyApp());\n}\n```\n\n---\n\n## 5.7 Timers\n```dart\nfinal t = Timer(const Duration(seconds: 2), () => print('once'));\nfinal p = Timer.periodic(const Duration(seconds: 1), (timer) {\n  if (timer.tick == 5) timer.cancel();\n});\nt.cancel(); // ALWAYS cancel timers in dispose()\n```\nDebounce with a timer (search box):\n```dart\nTimer? _debounce;\nvoid onSearchChanged(String q) {\n  _debounce?.cancel();\n  _debounce = Timer(const Duration(milliseconds: 400), () => search(q));\n}\n```\n\n---\n\n## 5.8 Async in Flutter widgets — the dangerous parts\n\n### 5.8.1 `setState() called after dispose()`\n```dart\nFuture\u003cvoid> _load() async {\n  final data = await api.fetch();   // user navigated away during this await!\n  if (!mounted) return;             // ✅ guard\n  setState(() => _data = data);\n}\n```\n\n### 5.8.2 Using `BuildContext` across async gaps\n```dart\nonPressed: () async {\n  await save();\n  if (!context.mounted) return;     // ✅ Flutter 3.7+: BuildContext.mounted\n  Navigator.of(context).pop();\n  ScaffoldMessenger.of(context).showSnackBar(...);\n}\n```\nLint: `use_build_context_synchronously`. Alternative: capture `final navigator = Navigator.of(context);` **before** the await.\n\n### 5.8.3 `FutureBuilder` re-firing the future on every rebuild\n```dart\n// ❌ BAD: a new future is created on every build → infinite loading / repeated API calls\nFutureBuilder(future: api.fetchUser(), builder: ...);\n\n// ✅ GOOD: create once (initState / state management) and reuse\nlate final Future\u003cUser> _userFuture;\n@override\nvoid initState() {\n  super.initState();\n  _userFuture = api.fetchUser();\n}\nFutureBuilder\u003cUser>(\n  future: _userFuture,\n  builder: (context, snapshot) {\n    if (snapshot.connectionState == ConnectionState.waiting) {\n      return const CircularProgressIndicator();\n    }\n    if (snapshot.hasError) return Text('Error: ${snapshot.error}');\n    return Text(snapshot.data!.name);\n  },\n);\n```\n`ConnectionState` values: `none`, `waiting`, `active` (streams emitting), `done`.\n\n`StreamBuilder` similarly — don't create the stream inside `build`.\n\n---\n\n## 5.9 Error handling in async code — full reference\n```dart\n// Errors thrown inside async functions become errors of the returned Future.\nFuture\u003cvoid> f() async => throw Exception('x');\n\n// Catch with try/await:\ntry { await f(); } catch (e) { ... }\n\n// ❌ Not caught! The future isn't awaited inside the try.\ntry { f(); } catch (e) { /* never runs */ }\n\n// Streams: errors go to onError / handleError; await-for rethrows.\n```\n\n---\n\n## 5.10 Interview Questions — Async\n\n**Q1. Explain the Dart event loop.** Each isolate runs main synchronously, then loops: drains the microtask queue entirely, then processes one event from the event queue, repeat. Futures/timers/I-O schedule events; `scheduleMicrotask` and future completions schedule microtasks.\n\n**Q2. Future vs Stream?** Future = single async result (value or error). Stream = sequence of async events (zero or more values/errors, then done).\n\n**Q3. Is Dart single-threaded? How does Flutter avoid freezing?** Each isolate is single-threaded with an event loop. I/O is non-blocking so `await` doesn't block; heavy CPU work must be moved to another isolate (`Isolate.run`, `compute`) to avoid janking the UI.\n\n**Q4. Does `async` make code run in a background thread?** No. It only allows suspension at `await` points; the code still runs on the same isolate's thread.\n\n**Q5. What is the difference between microtask and event queues?** Microtasks have higher priority and are all processed before the next event; used for short internal follow-ups. Events include I/O, timers, user input, frames.\n\n**Q6. What's a Completer?** An object to create and manually complete a Future; used to adapt callback APIs to futures.\n\n**Q7. Single-subscription vs broadcast streams?** Single-subscription allows one listener and buffers events until listened; broadcast allows many listeners and doesn't buffer.\n\n**Q8. How do you cancel a stream subscription and why?** Store the `StreamSubscription` and call `cancel()` (e.g., in `dispose`) to free resources and avoid callbacks on disposed widgets.\n\n**Q9. `async*` vs `sync*`?** `async*` returns a Stream and can `await`; `sync*` returns a lazily evaluated Iterable. Both use `yield`/`yield*`.\n\n**Q10. What is an isolate? How do isolates communicate?** Independent worker with own memory and event loop; communicate by message passing through SendPort/ReceivePort; messages are copied (or transferred on exit).\n\n**Q11. `compute` vs `Isolate.run`?** `compute` is Flutter's wrapper (one argument, web fallback runs on main thread); `Isolate.run` is Dart's API for running a closure in a new isolate and returning its result.\n\n**Q12. How do you run futures in parallel?** `Future.wait([...])` or record `.wait` — start them before awaiting.\n\n**Q13. What is a Zone?** An execution context propagated across async callbacks, used for error handling (`runZonedGuarded`), zone-local values, and intercepting async ops in tests.\n\n**Q14. How do you handle uncaught errors globally in Flutter?** `FlutterError.onError` for framework errors, `PlatformDispatcher.instance.onError` for other uncaught errors, optionally `runZonedGuarded`, and `ErrorWidget.builder` for build failures.\n\n**Q15. Why shouldn't you create a future inside `build` for FutureBuilder?** `build` runs often; each rebuild starts a new future, re-triggering the request and resetting the builder to waiting.\n\n**Q16. What does `await` do under the hood?** It registers continuation callbacks on the future; the function is suspended and returns control to the event loop; when the future completes, the continuation is scheduled (as a microtask) to resume the function.\n\n**Q17. How to implement debounce for search?** Cancel/restart a `Timer` on each keystroke, or use rxdart's `debounceTime` on a stream of queries, combined with `switchMap` to discard stale responses.\n\n**Q18. Can you use plugins inside isolates?** Since Flutter 3.7, yes, via `BackgroundIsolateBinaryMessenger.ensureInitialized(RootIsolateToken)` (with plugin support caveats).\n\n**Q19. Can isolates share memory?** Not mutable Dart objects; they share code within an isolate group and can share immutable data efficiently, and can transfer buffers. Shared-memory is possible only via FFI/native memory.\n\n**Q20. What is `FutureOr`?** Union type `T | Future\u003cT>`, allowing APIs to accept sync or async values.\n"}, {"n": 6, "file": "06-widgets-fundamentals.md", "title": "Chapter 6 — Widgets Deep Dive: Stateless, Stateful, Lifecycle, BuildContext, Keys & the Three Trees", "subtitle": "Widgets Deep Dive: Stateless, Stateful, Lifecycle, BuildContext, Keys & the Three Trees", "short": "Widgets Deep Dive", "sub": "Three trees, lifecycle, BuildContext, keys", "level": "beginner", "minutes": 19, "qa": 20, "md": "# Chapter 6 — Widgets Deep Dive: Stateless, Stateful, Lifecycle, BuildContext, Keys & the Three Trees\n\n> **Goal:** Understand *exactly* how widgets work. This chapter is the heart of Flutter and of Flutter interviews: \"What is BuildContext?\", \"Explain the StatefulWidget lifecycle\", \"What are keys and when do you need them?\", \"Widget vs Element vs RenderObject\".\n\n---\n\n## 6.1 What is a widget really?\n\n**5-year-old:** A widget is a **LEGO instruction card** 📇. The card says \"put a red 2×4 brick here\". The card is not the brick. Cards are cheap — you can print new ones all day. The actual bricks (what you see) are built by Flutter based on the cards.\n\n**Grown-up:** A `Widget` is an **immutable configuration object** describing part of the UI. Its fields are `final`. When something changes, Flutter **creates new widget objects** (cheap) and compares them with the old ones to decide what work to do on the long-lived objects underneath (Elements and RenderObjects).\n\n```dart\n@immutable\nabstract class Widget extends DiagnosticableTree {\n  const Widget({this.key});\n  final Key? key;\n  @protected\n  Element createElement();\n  static bool canUpdate(Widget oldWidget, Widget newWidget) {\n    return oldWidget.runtimeType == newWidget.runtimeType\n        && oldWidget.key == newWidget.key;\n  }\n}\n```\nThat `canUpdate` method is **the most important rule in Flutter** — memorise it: *an element can be updated with a new widget if the runtime type and key are the same.*\n\n---\n\n## 6.2 The three trees 🌳🌳🌳\n\n| Tree | Object | Lifetime | Job | Analogy |\n|---|---|---|---|---|\n| **Widget tree** | `Widget` | Very short (rebuilt often) | Configuration / blueprint | Instruction cards |\n| **Element tree** | `Element` | Long-lived | Manages lifecycle, holds position in tree, connects widget ↔ render object, holds `State` | The **site manager** who reads the cards and keeps track of what's built where |\n| **Render tree** | `RenderObject` | Long-lived | Layout, painting, hit testing | The actual **bricks** |\n\n```\nWidget tree             Element tree                 RenderObject tree\nContainer ──────►  StatelessElement\n └ Padding ──────►  SingleChildRenderObjectElement ──► RenderPadding\n    └ Text ──────►  StatelessElement\n       └ RichText ► MultiChildRenderObjectElement ──► RenderParagraph\n```\nNot every widget has a RenderObject. **StatelessWidget/StatefulWidget** only *compose* other widgets (they create `ComponentElement`s). **RenderObjectWidget**s (`Padding`, `Opacity`, `RichText`, `Row`, `SizedBox`...) create RenderObjects.\n\n### Why three trees? (interview question)\n* Widgets are **cheap and immutable** → easy declarative programming; rebuild freely.\n* Elements & RenderObjects are **expensive and mutable** → kept and **updated in place** when possible.\n* Diffing new widgets against ex
