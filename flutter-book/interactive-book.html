for app data,     │\n│   caching, error handling, polling, domain models)│\n│        │ use                                      │\n│  Services (wrap ONE external API: HTTP client,   │\n│   platform plugin, local storage, Firebase)      │\n└──────────────────────────────────────────────────┘\n```\nKey recommendations:\n* **Views** contain minimal logic (only UI logic: animations, simple if/else for layout, routing calls).\n* **ViewModels** convert repository data into UI state, hold UI state, expose **Commands** (an object wrapping an action with `running`, `error`, `completed` states — prevents double execution and lets UI show loading/errors).\n* **Repositories** are the single source of truth for each data type; they transform raw service data into **domain models**; handle caching, retries, errors (return a `Result` type).\n* **Services** are stateless wrappers around APIs.\n* **Unidirectional data flow**: data flows Data → UI; events flow UI → Data.\n* **Dependency injection** via `provider` package in the official examples.\n* Use **immutable data models** (freezed recommended), `Result\u003cT>` (Ok/Error) for errors.\n* **Feature/layer folder structure** (UI organized by feature, data by type).\n\nCommand and Result (simplified from the official `compass_app` sample):\n```dart\n// A tiny Result type (the official sample defines a similar sealed class)\nsealed class Result\u003cT> {\n  const Result();\n  const factory Result.ok(T value) = Ok\u003cT>;\n  const factory Result.error(Exception error) = Error\u003cT>;\n}\nfinal class Ok\u003cT> extends Result\u003cT> { const Ok(this.value); final T value; }\nfinal class Error\u003cT> extends Result\u003cT> { const Error(this.error); final Exception error; }\n\nclass Command0\u003cT> extends ChangeNotifier {\n  Command0(this._action);\n  final Future\u003cResult\u003cT>> Function() _action;\n\n  bool _running = false;\n  bool get running => _running;\n  Result\u003cT>? _result;\n  bool get error => _result is Error;\n  bool get completed => _result is Ok;\n\n  Future\u003cvoid> execute() async {\n    if (_running) return;           // prevents double taps / duplicate requests\n    _running = true;\n    _result = null;\n    notifyListeners();\n    try {\n      _result = await _action();\n    } finally {\n      _running = false;\n      notifyListeners();\n    }\n  }\n}\n\nclass BookingViewModel extends ChangeNotifier {\n  BookingViewModel({required BookingRepository repo}) : _repo = repo {\n    load = Command0\u003cvoid>(_load)..execute();\n  }\n  final BookingRepository _repo;\n  late final Command0\u003cvoid> load;\n\n  List\u003cBooking> _bookings = [];\n  List\u003cBooking> get bookings => List.unmodifiable(_bookings);\n\n  Future\u003cResult\u003cvoid>> _load() async {\n    final result = await _repo.getBookings();     // Future\u003cResult\u003cList\u003cBooking>>>\n    switch (result) {\n      case Ok(:final value):\n        _bookings = value;\n        notifyListeners();\n        return const Result.ok(null);\n      case Error(:final error):\n        return Result.error(error);\n    }\n  }\n}\n\n// View\nListenableBuilder(\n  listenable: viewModel.load,\n  builder: (context, _) {\n    if (viewModel.load.running) return const Center(child: CircularProgressIndicator());\n    if (viewModel.load.error) return ErrorRetry(onRetry: viewModel.load.execute);\n    return ListenableBuilder(\n      listenable: viewModel,\n      builder: (context, _) => BookingList(viewModel.bookings),\n    );\n  },\n);\n```\n> Note: naming a class `Error` shadows `dart:core`'s `Error` inside that library — the official sample does this deliberately; in your own code you may prefer `Failure`/`Err`.\n\n\n\n---\n\n## 21.3 Clean Architecture (very common in companies/interviews)\n\nBased on Robert C. Martin's Clean Architecture — **dependencies point inward**: outer layers depend on inner layers, never the reverse.\n\n```\nlib/features/auth/\n├── presentation/          ← widgets, pages, state (Bloc/Cubit/Notifier/ViewModel)\n│   ├── pages/login_page.dart\n│   ├── widgets/\n│   └── bloc/login_bloc.dart\n├── domain/                ← PURE DART: no Flutter, no JSON, no Dio\n│   ├── entities/user.dart\n│   ├── repositories/auth_repository.dart   ← abstract interface\n│   └── usecases/login_user.dart\n└── data/\n    ├── models/user_dto.dart                ← JSON (de)serialization, mapping to entities\n    ├── datasources/auth_remote_data_source.dart\n    ├── datasources/auth_local_data_source.dart\n    └── repositories/auth_repository_impl.dart  ← implements domain interface\n```\nFlow: `LoginPage` → `LoginBloc` → `LoginUser` use case → `AuthRepository` (interface) ← `AuthRepositoryImpl` → remote/local data sources → API/DB.\n\n```dart\n// domain\nabstract interface class AuthRepository {\n  Future\u003cResult\u003cUser>> login(String email, String password);\n}\nclass LoginUser {\n  const LoginUser(this._repo);\n  final AuthRepository _repo;\n  Future\u003cResult\u003cUser>> call(String email, String password) {\n    if (!email.contains('@')) return Future.value(const Err(InvalidEmailFailure()));\n    return _repo.login(email, password);\n  }\n}\n\n// data\nclass AuthRepositoryImpl implements AuthRepository {\n  AuthRepositoryImpl(this._remote, this._local);\n  final AuthRemoteDataSource _remote;\n  final AuthLocalDataSource _local;\n  @override\n  Future\u003cResult\u003cUser>> login(String email, String password) async {\n    try {\n      final dto = await _remote.login(email, password);\n      await _local.saveToken(dto.token);\n      return Ok(dto.toEntity());\n    } on DioException catch (e) {\n      return Err(mapDioError(e));\n    }\n  }\n}\n```\n**Entities vs DTOs/models**: entities are business objects used everywhere in the app; DTOs mirror the API JSON. Mapping isolates the app from API changes.\n\n### Criticism / pragmatism (senior insight)\nFull Clean Architecture can be **over-engineering** for small features: use cases that just forward a call (`GetUser` → `repo.getUser()`), triple models per entity, lots of boilerplate. Pragmatic teams:\n* Make the **domain layer optional** (the official Flutter guide does too) — add use cases only when logic is complex or shared.\n* Keep repositories + clear state management as the minimum.\n* Be consistent across the codebase.\n\n---\n\n## 21.4 Folder structure: feature-first vs layer-first\n\n**Layer-first** (`lib/models`, `lib/screens`, `lib/services`, `lib/widgets`): simple for tiny apps; becomes a mess — a feature is scattered across folders.\n\n**Feature-first** (recommended for medium/large):\n```\nlib/\n├── main.dart / main_dev.dart / main_prod.dart\n├── app/                       ← App widget, router, theme, DI bootstrap\n├── core/                      ← shared: network client, errors, utils, extensions, constants, design system\n│   ├── network/\n│   ├── error/\n│   ├── storage/\n│   └── widgets/\n├── features/\n│   ├── auth/ (data/ domain/ presentation/)\n│   ├── cart/\n│   ├── checkout/\n│   └── profile/\n└── l10n/\n```\nRules: features don't import each other's internals (only public APIs / shared core); shared code goes to `core` (but keep `core` from becoming a junk drawer).\n\n---\n\n## 21.5 Modularization & monorepos 🧩\n\nFor big apps: split into **packages** (local path dependencies):\n```\nrepo/\n├── apps/\n│   ├── customer_app/\n│   └── merchant_app/          ← multiple apps sharing packages\n├── packages/\n│   ├── design_system/\n│   ├── api_client/            ← generated OpenAPI client\n│   ├── core/\n│   ├── feature_auth/\n│   ├── feature_payments/\n│   └── analytics/\n└── pubspec.yaml               ← Dart pub workspace root (Dart 3.6+)\n```\nBenefits: enforced boundaries (a package can't import what it doesn't depend on), faster incremental builds & tests, team ownership (CODEOWNERS), reuse across apps (white-label apps).\n\nTools:\n* **Pub workspaces** (Dart 3.6+): root `pubspec.yaml` with `workspace: [apps/customer_app, packages/core, ...]`, members with `resolution: workspace` → single shared resolution & lock file, `dart pub get` once.\n* **Melos** — scripts across packages (`melos bootstrap`, `melos run test`, versioning/publishing, filtering by changed packages). Melos 7 works on top of pub workspaces.\n* OpenAPI generators (`openapi_generator`, `swagger_parser`) to produce typed API clients from backend specs.\n\n---\n\n## 21.6 Dependency Injection (DI) 💉\n\n**5-year-old:** Instead of a toy making its own batteries, you **hand** it batteries. Then you can hand it **pretend batteries** in tests.\n\n**Constructor injection** (the core idea):\n```dart\nclass CheckoutViewModel {\n  CheckoutViewModel({required this.cartRepository, required this.paymentService});\n  final CartRepository cartRepository;\n  final PaymentService paymentService;\n}\n```\nHow to wire up instances:\n1. **Provider / Riverpod** — providers as DI containers (Riverpod providers are ideal: lazy, overridable in tests, scoped).\n2. **get_it** — service locator:\n```dart\nfinal getIt = GetIt.instance;\nvoid setupDi(Env env) {\n  getIt\n    ..registerLazySingleton\u003cDio>(() => buildDio(env))\n    ..registerLazySingleton\u003cAuthApi>(() => AuthApi(getIt()))\n    ..registerLazySingleton\u003cAuthRepository>(() => AuthRepositoryImpl(getIt(), getIt()))\n    ..registerFactory\u003cLoginBloc>(() => LoginBloc(authRepository: getIt()));   // new each time\n}\nfinal repo = getIt\u003cAuthRepository>();\n// tests: getIt.reset(); register fakes; or allowReassignment\n```\n   * `registerSingleton` (eager), `registerLazySingleton` (on first use), `registerFactory` (new instance each time), `registerSingletonAsync` (async init) + `allReady()`, **scopes** (`pushNewScope` on login / `popScope` on logout — great for user sessions).\n3. **injectable** — annotations (`@injectable`, `@lazySingleton`, `@module`, `@Environment('dev')`) generating get_it registration code.\n4. **BlocProvider/RepositoryProvider** for Bloc apps.\n\nService locator criticism: dependencies hidden (calls to `getIt()` inside classes) → prefer injecting via constructors and only use the locator at composition roots (where objects are created).\n\n---\n\n## 21.7 SOLID in Flutter (with examples)\n* **S**ingle Responsibility — a widget renders; a repository fetches; a validator validates. A 1,500-line `HomePage` violates it.\n* **O**pen/Closed — extend behaviour via new classes (new payment method class implementing `PaymentMethod`) instead of editing a giant `switch`.\n* **L**iskov Substitution — any `AuthRepository` implementation (real/fake) must behave correctly where the interface is expected.\n* **I**nterface Segregation — small interfaces (`Readable`, `Writable`), not one god interface.\n* **D**ependency Inversion — high-level modules (blocs) depend on abstractions (`AuthRepository`), not concretions (`FirebaseAuthRepository`).\n\nOther principles: DRY (but avoid premature abstraction — \"rule of three\"), KISS, YAGNI, composition over inheritance, Law of Demeter.\n\n---\n\n## 21.8 Design patterns used in Flutter (interview list)\n| Pattern | Where in Flutter |\n|---|---|\n| **Composite** | Widget tree itself |\n| **Observer** | ChangeNotifier, Streams, Listenable, InheritedWidget dependents |\n| **Builder** | `ListView.builder`, `LayoutBuilder`, builder callbacks |\n| **Factory** | Factory constructors, `fromJson` |\n| **Singleton** | `WidgetsBinding.instance`, `FirebaseAuth.instance`, get_it singletons |\n| **Strategy** | `ScrollPhysics`, `Curve`, `SliverGridDelegate`, `PageTransitionsBuilder` |\n| **Decorator** | Wrapping widgets (`Padding(child:)`), Dio interceptors |\n| **Adapter** | Repository mapping DTOs → entities; platform interface implementations |\n| **Facade** | Repository hiding multiple data sources |\n| **Repository** | Data layer |\n| **Command** | Official MVVM Commands, `Intent`/`Action` |\n| **State** | Bloc states / sealed classes |\n| **Proxy** | `ProxyWidget`, `ProxyProvider` |\n| **Delegate** | `SliverChildBuilderDelegate`, `CustomPainter`, `LocalizationsDelegate` |\n| **Template method** | `State` lifecycle hooks, `RenderBox.performLayout` |\n| **Visitor** | `visitChildElements`, `Element.visitChildren` |\n| **Mediator** | Bloc between UI and repositories |\n| **Dependency Injection** | Providers, get_it |\n\n---\n\n## 21.9 Error handling architecture\n* **Layers translate errors**: data layer catches technical exceptions and maps to domain failures; presentation maps failures to user messages (localized).\n* **Result type** vs throwing: Result makes errors explicit in signatures (`Future\u003cResult\u003cUser>>`); exceptions keep happy paths clean. Pick one convention per codebase.\n* Global handlers for unexpected errors (FlutterError.onError, PlatformDispatcher.onError) + crash reporting.\n* UI patterns: inline field errors, snackbar for transient, full-screen error with retry for page loads, offline banner.\n\n---\n\n## 21.10 Environment & configuration architecture\n* **Flavors**: dev / staging / prod (Chapter 26) with different app IDs, names, icons, Firebase projects, API base URLs.\n* `AppConfig` object built from `--dart-define-from-file` and injected at startup.\n* Feature flags via remote config with local defaults.\n* Separate `main_dev.dart`, `main_prod.dart` calling a shared `bootstrap(AppConfig)`:\n```dart\nFuture\u003cvoid> bootstrap(AppConfig config) async {\n  WidgetsFlutterBinding.ensureInitialized();\n  await setupErrorHandling(config);\n  await setupDi(config);\n  runApp(ProviderScope(overrides: [appConfigProvider.overrideWithValue(config)], child: const App()));\n}\n```\n\n---\n\n## 21.11 Architecture case study: an e-commerce app (system design answer template)\n\n**Requirements**: browse catalog (offline cache), search, product details, cart (sync across devices), checkout with payment gateway, order tracking (real-time), push notifications, auth, analytics, dark mode, i18n (EN/HI/AR).\n\n**Answer structure** (use in interviews):\n1. **Clarify** scope, scale (DAU), platforms, offline needs, team size.\n2. **High-level modules**: auth, catalog, search, cart, checkout, orders, profile, notifications; core: network, storage, design system, analytics, config.\n3. **Layers**: UI (Riverpod/Bloc), domain (cart rules, pricing), data (repositories with remote + local sources).\n4. **Data flow**: catalog repository → stale-while-revalidate (Drift cache + API); search with debounce + cancellation; cart as local source of truth synced to server (optimistic updates, conflict resolution: server wins on price/stock); orders via WebSocket/FCM updates.\n5. **Navigation**: go_router with StatefulShellRoute tabs, deep links (`/product/:id`), auth redirect preserving target.\n6. **Networking**: Dio + interceptors (auth refresh with queue, retry, logging), OpenAPI generated client, error mapping, certificate pinning if needed.\n7. **Payments**: gateway SDK via plugin; server creates order/payment intent; app never trusts client-side success — verify via backend webhook; idempotency keys.\n8. **Performance**: image CDN with sizes, cached_network_image, list virtualization, pagination (cursor), isolates for parsing, startup optimization.\n9. **Security**: secure storage for tokens, obfuscation, root/jailbreak detection (optional), no secrets in app, App Check/Play Integrity.\n10. **Quality**: unit/widget/golden/integration tests, CI with lint/test/build, feature flags, staged rollouts, crash monitoring, analytics funnels.\n11. **Scalability of team**: monorepo packages per feature, CODEOWNERS, design system package, ADRs (architecture decision records).\n\n---\n\n## 21.12 Interview Questions — Architecture\n\n**Q1. How do you structure a large Flutter app?** Feature-first folders/packages, layered architecture (presentation/domain/data), repositories as single source of truth, DI, consistent state management, shared core & design system, tests per layer.\n\n**Q2. What is the repository pattern?** An abstraction over data sources providing a clean API for domain data, handling caching, mapping and errors so the rest of the app doesn't know where data comes from.\n\n**Q3. Explain Clean Architecture in Flutter.** Presentation, domain (entities, use cases, repository interfaces — pure Dart), data (models, data sources, repository implementations); dependency rule points inward; benefits testability & independence; trade-off boilerplate.\n\n**Q4. What does the official Flutter architecture guide recommend?** MVVM: Views + ViewModels in UI layer, Repositories + Services in data layer, optional domain use cases, unidirectional data flow, Commands, Result type, immutable models, DI with provider.\n\n**Q5. What is dependency injection and how do you do it in Flutter?** Supplying dependencies from outside rather than creating them inside; constructor injection wired via Riverpod/Provider/get_it(+injectable)/RepositoryProvider.\n\n**Q6. Service locator vs DI?** Locator pulls dependencies from a global registry (hidden dependencies); DI pushes them via constructors (explicit). Use the locator only at composition roots.\n\n**Q7. How do you share code between multiple apps?** Monorepo with packages (pub workspaces/melos), design system package, shared core/network/analytics packages.\n\n**Q8. Entities vs models/DTOs?** Entities: domain objects independent of external formats; DTOs: data transfer shapes matching APIs/DB, mapped to entities.\n\n**Q9. What design patterns does Flutter use?** Composite (widgets), observer (listenables/streams), builder, factory, singleton, strategy, delegate, decorator, repository, etc.\n\n**Q10. How do you avoid over-engineering?** Start simple, add layers when complexity demands, avoid pass-through use cases, keep consistent conventions, document decisions (ADRs).\n"}, {"n": 22, "file": "22-testing.md", "title": "Chapter 22 — Testing: Unit, Widget, Golden, Integration, Mocking, Coverage & TDD", "subtitle": "Testing: Unit, Widget, Golden, Integration, Mocking, Coverage & TDD", "short": "Testing", "sub": "Unit, widget, golden, integration", "level": "intermediate", "minutes": 10, "qa": 12, "md": "# Chapter 22 — Testing: Unit, Widget, Golden, Integration, Mocking, Coverage & TDD\n\n> **Goal:** Write tests that catch real bugs, run fast in CI, and give the team confidence to refactor. Interviewers ask about test types, mocking, `pump` vs `pumpAndSettle`, testing async/streams/blocs/providers, and golden tests.\n\n---\n\n## 22.1 The testing pyramid 🔺\n\n```\n          ▲  Integration / E2E (few, slow, real device/emulator)\n         ▲▲▲  Widget tests (many, fast, no device)\n       ▲▲▲▲▲▲  Unit tests (most, fastest, pure Dart)\n```\n| Type | Tests | Speed | Confidence | Tooling |\n|---|---|---|---|---|\n| Unit | A function/class (logic, repos, blocs) | ms | narrow | `test` / `flutter_test` |\n| Widget | A widget/screen in a fake environment | ms–s | UI behaviour | `flutter_test` (`testWidgets`) |\n| Golden | Pixel output of a widget vs saved image | s | visual regressions | `matchesGoldenFile`, `alchemist` |\n| Integration | Full app on device/emulator/browser | s–min | end-to-end flows | `integration_test`, **Patrol**, Maestro, Appium |\n\n**5-year-old:** Unit test = check **one LEGO brick** isn't broken. Widget test = check **a small LEGO car** rolls. Integration test = check the **whole LEGO city** works together.\n\n---\n\n## 22.2 Unit tests\n\n```dart\n// lib/cart.dart\nclass Cart {\n  final _items = \u003cString, int>{};\n  void add(String id, {int qty = 1}) {\n    if (qty \u003c= 0) throw ArgumentError.value(qty, 'qty');\n    _items.update(id, (q) => q + qty, ifAbsent: () => qty);\n  }\n  int get totalItems => _items.values.fold(0, (a, b) => a + b);\n}\n\n// test/cart_test.dart\nimport 'package:flutter_test/flutter_test.dart';   // or package:test/test.dart for pure Dart packages\n\nvoid main() {\n  group('Cart', () {\n    late Cart cart;\n    setUp(() => cart = Cart());          // runs before each test\n    tearDown(() {});                     // after each\n    // setUpAll / tearDownAll — once per group/file\n\n    test('starts empty', () {\n      expect(cart.totalItems, 0);\n    });\n\n    test('adds quantities for same item', () {\n      cart..add('a')..add('a', qty: 2);\n      expect(cart.totalItems, equals(3));\n    });\n\n    test('throws on non-positive qty', () {\n      expect(() => cart.add('a', qty: 0), throwsArgumentError);\n    });\n  });\n}\n```\nMatchers: `equals`, `isTrue/isFalse`, `isNull/isNotNull`, `isA\u003cType>()`, `throwsA(isA\u003cApiException>())`, `contains`, `containsAll`, `hasLength`, `isEmpty`, `greaterThan`, `closeTo(3.14, 0.01)`, `orderedEquals`, `unorderedEquals`, `predicate`, `allOf/anyOf`, `isA\u003cUser>().having((u) => u.name, 'name', 'Asha')`.\n\nAsync:\n```dart\ntest('fetches user', () async {\n  final user = await repo.getUser('1');\n  expect(user.name, 'Asha');\n});\nexpect(future, completion(equals(42)));\nexpect(future, throwsA(isA\u003cTimeoutException>()));\nexpect(stream, emitsInOrder([1, 2, emitsDone]));\nexpect(stream, emitsThrough(3));\nexpect(stream, neverEmits(0));\n```\nTime-dependent code: `fake_async` / `FakeAsync().run((async) { ...; async.elapse(Duration(seconds: 5)); })`; inject a `Clock` (package `clock`) instead of calling `DateTime.now()` directly.\n\nRun: `flutter test`, `flutter test test/cart_test.dart`, `--name \"adds\"`, `--tags`, `--coverage`, `-j 4` (concurrency), `--reporter expanded`.\n\n---\n\n## 22.3 Mocking & fakes\n\n* **Fake** — a simple working implementation (in-memory repository). Preferred for many cases; readable.\n* **Mock** — records calls and returns programmed responses; verify interactions.\n* **Stub** — returns canned data.\n\n### mocktail (no codegen — most popular)\n```dart\nimport 'package:mocktail/mocktail.dart';\n\nclass MockAuthApi extends Mock implements AuthApi {}\nclass FakeLoginRequest extends Fake implements LoginRequest {}\n\nvoid main() {\n  setUpAll(() => registerFallbackValue(FakeLoginRequest())); // needed for any() with custom types\n\n  test('login saves token', () async {\n    final api = MockAuthApi();\n    final store = InMemoryTokenStore();                       // a fake\n    when(() => api.login(any())).thenAnswer((_) async => const LoginResponse(token: 't1'));\n\n    final repo = AuthRepositoryImpl(api, store);\n    await repo.login('a@b.com', 'pw');\n\n    expect(await store.read(), 't1');\n    verify(() => api.login(any())).called(1);\n    verifyNoMoreInteractions(api);\n  });\n\n  test('throws on network error', () {\n    final api = MockAuthApi();\n    when(() => api.login(any())).thenThrow(const SocketException('no net'));\n    expect(() => AuthRepositoryImpl(api, InMemoryTokenStore()).login('a', 'b'), throwsA(isA\u003cNetworkFailure>()));\n  });\n}\n```\n* `thenReturn` for sync values; **`thenAnswer((_) async => ...)` for Futures** (using `thenReturn(Future.value(x))` is an error in mockito/mocktail).\n* `captureAny()` + `verify(...).captured`.\n* **mockito** — uses codegen `@GenerateNiceMocks([MockSpec\u003cAuthApi>()])` + build_runner (null-safety era).\n\nRule: **mock at the boundaries** (API client, platform services), not your own domain logic. Too many mocks = brittle tests.\n\n---\n\n## 22.4 Widget tests 🧪\n\n```dart\nvoid main() {\n  testWidgets('counter increments when FAB tapped', (WidgetTester tester) async {\n    await tester.pumpWidget(const MaterialApp(home: CounterPage()));   // ❗ wrap in MaterialApp for Theme/Directionality/Navigator\n\n    expect(find.text('0'), findsOneWidget);\n    expect(find.text('1'), findsNothing);\n\n    await tester.tap(find.byIcon(Icons.add));\n    await tester.pump();                      // rebuild one frame\n\n    expect(find.text('1'), findsOneWidget);\n  });\n\n  testWidgets('login shows error on invalid email', (tester) async {\n    await tester.pumpWidget(MaterialApp(home: LoginPage(authRepository: FakeAuthRepository())));\n    await tester.enterText(find.byKey(const Key('login_email')), 'bad-email');\n    await tester.tap(find.widgetWithText(FilledButton, 'Login'));\n    await tester.pumpAndSettle();\n    expect(find.text('Enter a valid email'), findsOneWidget);\n  });\n}\n```\n\n### Finders\n`find.text('x')`, `find.textContaining('x')`, `find.byType(ListTile)`, `find.byKey(const Key('k'))`, `find.byIcon(Icons.add)`, `find.byWidget(w)`, `find.byWidgetPredicate((w) => w is Text && w.data!.startsWith('A'))`, `find.byTooltip('Delete')`, `find.bySemanticsLabel('...')`, `find.descendant(of: ..., matching: ...)`, `find.ancestor(...)`, `find.widgetWithText(ElevatedButton, 'Save')`, `.first`, `.last`, `.at(i)`.\nMatchers: `findsOneWidget`, `findsNothing`, `findsWidgets`, `findsNWidgets(n)`, `findsAtLeastNWidgets(n)`, `findsAny`.\n\n### Interactions\n`tap`, `longPress`, `enterText`, `drag(finder, Offset(0, -300))`, `fling`, `scrollUntilVisible(finder, 200, scrollable: find.byType(Scrollable).first)`, `ensureVisible`, `sendKeyEvent(LogicalKeyboardKey.enter)`, `pageBack()`, `binding.setSurfaceSize(Size(400, 800))` / `tester.view.physicalSize = ...` (+ `addTearDown(tester.view.reset)`) to test responsive layouts.\n\n### `pump` vs `pumpAndSettle` vs `pump(duration)` (MOST ASKED)\n* `pump()` — triggers **one frame** (rebuilds dirty widgets). Time doesn't advance (unless you pass a duration).\n* `pump(Duration(ms: 500))` — advances the fake clock by that duration and pumps a frame — use to step through animations/timers.\n* `pumpAndSettle()` — keeps pumping frames (100ms steps by default) **until no more frames are scheduled** (animations finished). ⚠️ **Times out** (error \"pumpAndSettle timed out\") with infinite animations (`CircularProgressIndicator`, repeating controllers) → use `pump(duration)` instead.\n* Widget tests run in a **FakeAsync zone**: timers and `Future.delayed` only progress when you pump with durations. Real async I/O (HTTP, files) won't work naturally → use `tester.runAsync(() async {...})` for real async, or (better) fakes.\n* By default, **HTTP requests in widget tests return 400** (`HttpOverrides` set by the test binding) — mock network.\n\n### Providing dependencies in widget tests\n```dart\nawait tester.pumpWidget(\n  ProviderScope(\n    overrides: [productRepoProvider.overrideWithValue(FakeProductRepo())],\n    child: const MaterialApp(home: ProductListPage()),\n  ),\n);\n// Bloc:\nawait tester.pumpWidget(BlocProvider\u003cLoginBloc>.value(value: mockLoginBloc, child: const MaterialApp(home: LoginView())));\nwhenListen(mockLoginBloc, Stream.fromIterable([const LoginState(status: LoginStatus.failure, error: 'x')]), initialState: const LoginState());\n```\nNavigation: provide a `MockNavigatorObserver` or a test `GoRouter`, then verify current route/widgets.\n\nImages: `Image.network` fails in tests → use `mocktail_image_network` (`mockNetworkImagesFor(() => tester.pumpWidget(...))`) or inject image providers.\n\n---\n\n## 22.5 Golden tests 🖼️\n\n```dart\ntestWidgets('ProductCard golden', (tester) async {\n  await tester.pumpWidget(MaterialApp(\n    theme: AppTheme.light,\n    home: Scaffold(body: Center(child: ProductCard(product: sampleProduct))),\n  ));\n  await expectLater(find.byType(ProductCard), matchesGoldenFile('goldens/product_card_light.png'));\n});\n```\n* Generate/update: `flutter test --update-goldens`.\n* ⚠️ **Fonts**: tests use the \"Ahem\" test font by default (text renders as boxes) unless you load real fonts (`loadAppFonts()` from `golden_toolkit` (discontinued), or `alchemist`, or load fonts manually with `FontLoader`).\n* ⚠️ **Platform differences**: golden pixels differ between macOS/Linux/Windows rendering → generate goldens in the same environment as CI (e.g., Docker/Linux) or use tolerant comparators; `alchemist` provides CI-friendly goldens (with obscured text) + platform goldens.\n* Test multiple themes (light/dark), text scales, locales (RTL), and screen sizes.\n* Great for design systems (catch unintended visual changes in PRs).\n\n---\n\n## 22.6 Integration tests (E2E)\n\n```yaml\ndev_dependencies:\n  integration_test:\n    sdk: flutter\n  flutter_test:\n    sdk: flutter\n```\n`integration_test/app_test.dart`:\n```dart\nimport 'package:integration_test/integration_test.dart';\nimport 'package:my_app/main.dart' as app;\n\nvoid main() {\n  IntegrationTestWidgetsFlutterBinding.ensureInitialized();\n\n  testWidgets('user can log in and see home', (tester) async {\n    app.main();                         // or pump your App with test config\n    await tester.pumpAndSettle();\n    await tester.enterText(find.byKey(const Key('login_email')), 'test@example.com');\n    await tester.enterText(find.byKey(const Key('login_password')), 'password123');\n    await tester.tap(find.byKey(const Key('login_submit')));\n    await tester.pumpAndSettle(const Duration(seconds: 5));\n    expect(find.text('Welcome'), findsOneWidget);\n  });\n}\n```\nRun: `flutter test integration_test/app_test.dart -d \u003cdevice>`; for web: `flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d chrome`. Firebase Test Lab / AWS Device Farm / BrowserStack for device matrices.\n\nLimitations of `integration_test`: can't interact with **native UI** (permission dialogs, notifications, system settings, WebViews' native content).\n* **Patrol** (by LeanCode) — extends Flutter tests with native automation (grant permissions, tap notifications, toggle Wi-Fi), nicer finders (`$('Login').tap()`), test isolation, sharding.\n* **Maestro** — YAML-based black-box UI flows (works with Flutter via semantics/text), popular for quick E2E.\n* **Appium Flutter driver** — for QA teams using Appium.\n* `flutter_driver` — the **old** API (deprecated in favour of integration_test).\n\nTips: use **stable keys** (`Key('login_submit')`) or semantics identifiers (`Semantics(identifier: ...)` for automation tools) instead of texts that change with localization; seed test data via a test backend/mock server; make tests independent; avoid fixed sleeps.\n\n---\n\n## 22.7 Testing specific things\n* **Blocs** — `bloc_test` (Chapter 15).\n* **Riverpod** — `ProviderContainer.test` + overrides (Chapter 15).\n* **ChangeNotifier** — call methods, assert state, count `notifyListeners` with a listener counter.\n* **Streams** — `emitsInOrder`, `StreamQueue` (package `async`).\n* **Platform channels** — `setMockMethodCallHandler` (Chapter 19).\n* **SharedPreferences** — `SharedPreferences.setMockInitialValues({})`.\n* **Navigation with go_router** — pump a `MaterialApp.router` with the real router and fake dependencies; assert `find.byType(DetailsPage)`.\n* **Accessibility** — `meetsGuideline` (Chapter 10).\n* **Memory leaks** — `leak_tracker_flutter_testing` (`testWidgets(..., experimentalLeakTesting: LeakTesting.settings.withTrackedAll())`).\n* **Performance** — `integration_test` with `binding.traceAction(...)` / `watchPerformance` to record frame timings in CI (`flutter drive --profile`).\n\n---\n\n## 22.8 Coverage\n```bash\nflutter test --coverage                       # coverage/lcov.info\ngenhtml coverage/lcov.info -o coverage/html   # (lcov tool) HTML report\nlcov --remove coverage/lcov.info '**/*.g.dart' '**/*.freezed.dart' -o coverage/lcov.info  # exclude generated\n```\nUpload to Codecov/Coveralls/SonarQube in CI. Coverage is a **signal, not a goal** — 100% coverage with weak assertions is worthless; aim for meaningful coverage of business logic (e.g., 80%+ on domain/data layers).\n\n---\n\n## 22.9 TDD & testing best practices\n* **Arrange–Act–Assert** structure; one behaviour per test; descriptive names (\"emits failure when API returns 401\").\n* Test **behaviour**, not implementation details.\n* Tests must be **deterministic** (no real time/network/random without seeds) and **independent** (no order dependence; reset singletons like get_it between tests).\n* Keep test helpers: `pumpApp(tester, widget, {overrides})` extension wrapping MaterialApp, theme, localizations, providers.\n* Write a failing test reproducing every production bug before fixing it (**regression tests**).\n* TDD: Red → Green → Refactor.\n* Run tests in CI on every PR; block merges on failures.\n* Flaky test policy: fix or quarantine with a ticket — never ignore silently.\n\n```dart\nextension PumpApp on WidgetTester {\n  Future\u003cvoid> pumpApp(Widget widget, {List\u003cOverride> overrides = const []}) {\n    return pumpWidget(ProviderScope(\n      overrides: overrides,\n      child: MaterialApp(\n        localizationsDelegates: AppLocalizations.localizationsDelegates,\n        supportedLocales: AppLocalizations.supportedLocales,\n        theme: AppTheme.light,\n        home: widget,\n      ),\n    ));\n  }\n}\n```\n\n---\n\n## 22.10 Common test failures & fixes\n| Failure | Fix |\n|---|---|\n| `No MediaQuery widget ancestor found` / `No Directionality widget found` / `No Material widget found` | Wrap in `MaterialApp` (or `Directionality`/`Material`) |\n| `pumpAndSettle timed out` | Infinite animation → `pump(duration)`; replace spinners in tests |\n| `A Timer is still pending even after the widget tree was disposed` | Cancel timers in dispose; pump enough time; avoid real timers |\n| `Bad state: No element` from finder `.first` | Widget not found — pump/settle first, check finder |\n| `The finder ... could not be tapped because it's offscreen` / hit test warning | `ensureVisible`/`scrollUntilVisible`, larger surface size, widget covered by another |\n| Real HTTP returns 400 | Mock network |\n| `MissingPluginException` | Mock channels / platform interface |\n| Golden mismatch on CI only | Fonts/platform rendering differences → consistent environment |\n| `LateInitializationError` in tests | setUp not initializing, test order dependence |\n| `type 'Null' is not a subtype of type 'Future\u003c...>'` (mocktail) | Missing `when(...).thenAnswer` stub for that call |\n\n---\n\n## 22.11 Interview Questions — Testing\n\n**Q1. Types of tests in Flutter?** Unit, widget, integration (plus golden visual tests).\n\n**Q2. pump vs pumpAndSettle?** pump renders a single frame (optionally advancing time); pumpAndSettle repeatedly pumps until no frames are scheduled — fails with endless animations.\n\n**Q3. How do you mock dependencies?** Inject interfaces; use mocktail/mockito mocks or hand-written fakes; override providers or use BlocProvider.value with mock blocs.\n\n**Q4. What are golden tests?** Snapshot tests comparing rendered widget pixels against reference images to catch visual regressions.\n\n**Q5. How do you test a Bloc?** bloc_test's `blocTest` with build/act/expect/verify, mocking repositories.\n\n**Q6. Why wrap widgets in MaterialApp during tests?** Many widgets need ancestors provided by MaterialApp (MediaQuery, Directionality, Theme, Navigator, Localizations).\n\n**Q7. How do you test code that uses DateTime.now or timers?** Inject a clock; use fake_async or widget tester's fake time with pump(duration).\n\n**Q8. integration_test vs flutter_driver vs Patrol?** integration_test runs widget-test-style tests on devices (replaces deprecated flutter_driver); Patrol adds native interactions and better ergonomics.\n\n**Q9. What is code coverage and is 100% necessary?** Percentage of lines executed by tests; useful signal but not a goal — focus on critical logic and meaningful assertions.\n\n**Q10. How do you make widget tests robust?** Use keys/semantics finders, avoid real network/time, test behaviour, helper pump methods, deterministic data.\n\n**Q11. How do you test platform channel code?** Mock MethodChannel handlers with TestDefaultBinaryMessengerBinding, or swap platform interface instances with fakes.\n\n**Q12. What's the difference between a mock and a fake?** A fake is a lightweight working implementation; a mock is programmed with expectations and verifies interactions.\n"}, {"n": 23, "file": "23-performance-and-devtools.md", "title": "Chapter 23 — Performance Optimization & DevTools: Jank, Rebuilds, Memory Leaks, Startup Time & App Size", "subtitle": "Performance Optimization & DevTools: Jank, Rebuilds, Memory Leaks, Startup Time & App Size", "short": "Performance & DevTools", "sub": "Jank, rebuilds, memory, app size", "level": "advanced", "minutes": 10, "qa": 12, "md": "# Chapter 23 — Performance Optimization & DevTools: Jank, Rebuilds, Memory Leaks, Startup Time & App Size\n\n> **Goal:** Diagnose and fix every common performance problem with evidence (DevTools), not guesses. Senior interviews: \"Your app is janky on scroll — how do you investigate?\", \"How do you reduce app size?\", \"How do you find memory leaks?\"\n\n---\n\n## 23.1 Performance mindset 🧭\n1. **Measure first** — in **profile mode**, on a **real, low/mid-range device** (not the emulator, not a flagship only).\n2. Find the **bottleneck** (UI thread? raster thread? network? startup?).\n3. Fix the **biggest** problem; re-measure.\n4. Prevent regressions (performance tests, benchmarks in CI, code review checklists).\n\nFrame budgets: 60 Hz → **16.67 ms**; 90 Hz → 11.1 ms; 120 Hz → **8.33 ms**. Both the UI thread and the raster thread must finish within the budget.\n\n---\n\n## 23.2 DevTools tour 🧰\nOpen via `flutter run --profile` then press `v`, or from the IDE.\n\n| Tool | Use |\n|---|---|\n| **Flutter Inspector** | Widget tree, layout explorer (constraints, flex), select widget on device, \"Highlight repaints\", \"Highlight oversized images\", \"Show guidelines\", slow animations |\n| **Performance** | Frame chart (UI & raster bars per frame; jank frames in red), **timeline events** (Build, Layout, Paint, Raster), \"Track widget builds\" / \"Track layouts\" / \"Track paints\" (shows which widgets rebuilt), rebuild stats, shader compilation flags (Skia) |\n| **CPU Profiler** | Sample Dart CPU usage: bottom-up/top-down/call tree, flame chart — find expensive functions |\n| **Memory** | Heap usage chart, GC events, **heap snapshots** & **diff** (find leaking classes), allocation tracing, \"Profile memory\" by class |\n| **Network** | HTTP requests (dart:io HttpClient-based — includes `http`/Dio on native), timing, headers, bodies |\n| **Logging** | `dart:developer` `log()` output, framework events |\n| **App Size** | Analyze `--analyze-size` JSON: treemap of code/assets by package; diff two builds |\n| **Deep Links** | Validate Android/iOS deep link setup |\n| **DevTools extensions** | Provider, Riverpod, Bloc, Drift, Patrol… package-provided tabs |\n| **Debugger** | Breakpoints, stepping, evaluate expressions |\n\nAlso: **Performance overlay** (`showPerformanceOverlay: true` in MaterialApp, or `P` key) — two graphs (top = raster, bottom = UI); red bars = slow frames.\n\nCustom timeline events for your own code:\n```dart\nimport 'dart:developer';\nTimeline.startSync('parseCatalog');\nparseCatalog();\nTimeline.finishSync();\n// or: Timeline.timeSync('parseCatalog', parseCatalog);\n```\n\n---\n\n## 23.3 Diagnosing jank: the decision tree 🌳\n\n```\nJank frame in DevTools →\n ├─ UI bar high (Dart/main thread)?\n │    ├─ Many widgets rebuilding?       → reduce rebuild scope (const, split widgets, select/BlocSelector, ValueListenableBuilder)\n │    ├─ Expensive build() logic?        → move computation out (memoize, precompute in state layer, isolates)\n │    ├─ Layout expensive?               → avoid IntrinsicHeight/Width, nested shrinkWrap lists, deep trees; use itemExtent\n │    ├─ Synchronous heavy work (JSON, sorting, crypto, image processing)? → Isolate.run / compute\n │    └─ GC pauses from huge allocations? → reduce allocations in hot paths\n └─ Raster bar high (GPU)?\n      ├─ saveLayer-heavy effects: Opacity on complex subtree, ShaderMask, ColorFilter, BackdropFilter, ClipPath with antiAlias → simplify/avoid, use FadeTransition, pre-blurred images\n      ├─ Huge images decoded at full res → cacheWidth/ResizeImage, proper image sizes\n      ├─ Too many layers / platform views → reduce\n      ├─ Complex paths/shadows (many BoxShadows, large blur radius) → cheaper shadows, cache\n      └─ (Skia only) First-run shader compilation → Impeller\n```\n\n---\n\n## 23.4 Reducing rebuilds (UI thread) — techniques with examples\n\n### 1. `const` everywhere possible\n```dart\nconst SizedBox(height: 16);\nconst Text('Static label');\nconst MyStaticHeader();      // requires const constructor\n```\nIdentical instances → Flutter skips rebuilding them.\n\n### 2. Push state down / split widgets\n```dart\n// ❌ Entire page rebuilds every second because the clock is stored in the page state\nclass _PageState extends State\u003cPage> { DateTime now = DateTime.now(); ... Timer → setState }\n\n// ✅ Only ClockText rebuilds\nclass ClockText extends StatefulWidget { ... }  // owns its own timer & setState\n```\n\n### 3. Rebuild only what listens\n* Provider: `Selector`, `context.select`, `Consumer` low in the tree.\n* Riverpod: `ref.watch(provider.select((s) => s.count))`.\n* Bloc: `BlocSelector`, `buildWhen`.\n* `ValueListenableBuilder`/`ListenableBuilder` for tiny reactive parts.\n\n### 4. Use the `child` parameter in builders\n```dart\nAnimatedBuilder(animation: c, child: const HeavyStatic(), builder: (_, child) => Transform.rotate(angle: c.value, child: child));\n```\n\n### 5. Avoid rebuilding because of MediaQuery\n`MediaQuery.sizeOf(context)` instead of `MediaQuery.of(context)` (keyboard animation would otherwise rebuild everything every frame!).\n\n### 6. Don't do work in build\n❌ Sorting/filtering a 5,000-item list in `build`, `DateFormat(...)` creation per item, regex compilation per build, `jsonDecode` in build.\n✅ Precompute in state layer; cache formatters (`static final _fmt = DateFormat.yMMMd();`).\n\n### 7. Keys & list item stability\nStable `ValueKey`s keep elements/state when lists change; avoid `UniqueKey()` in build (forces rebuild & state loss each frame).\n\n### 8. Avoid `setState` on huge widgets for tiny changes (e.g., text field typing rebuilding a whole form/page).\n\n---\n\n## 23.5 Rendering (raster) optimizations\n* **Opacity**: animating `Opacity` widget → use `FadeTransition`/`AnimatedOpacity`. For a static semi-transparent image use `color.withValues(alpha:)` on the color or `Image(color:, colorBlendMode:)`/`opacity:` param instead of an Opacity widget (`Image` has an `opacity` parameter taking an `Animation\u003cdouble>`).\n* **Clipping**: `ClipRRect` per list item is costly; prefer `BoxDecoration(borderRadius:)` with `clipBehavior: Clip.antiAlias` only where needed. Avoid `Clip.antiAliasWithSaveLayer`.\n* **Shadows/blur**: big `BoxShadow` blur radii and `BackdropFilter` (frosted glass) are expensive, especially over scrolling content; limit area (wrap with `ClipRect`), use `BackdropGroup`/`BackdropFilter.grouped` (newer Flutter APIs to share backdrop work) where available.\n* **RepaintBoundary** around frequently repainting parts (animations, video, tickers, charts) to avoid repainting static content; verify with \"Highlight repaints\".\n* **Images**: right size from CDN; `cacheWidth`; avoid `Image.network` with 4000×3000 photos in thumbnails; precache hero images.\n* **Text**: avoid huge `Text` reflows each frame; cache `TextPainter`s in custom painters.\n* **Platform views**: few, not in lists.\n\n---\n\n## 23.6 Lists & scrolling performance\n(See Chapter 9 checklist) — builder constructors, itemExtent/prototypeItem, avoid shrinkWrap, keep item builds cheap, paginate, cached images, avoid nested scroll views.\n\n---\n\n## 23.7 Heavy computation → isolates\n```dart\nfinal result = await Isolate.run(() => expensiveSearchIndex(data));\n```\nTypical candidates: JSON > ~100KB, image filters/compression, PDF generation, encryption, diffing big lists, Markdown parsing of large docs. Note the message copying cost (send minimal data; use `TransferableTypedData` for bytes).\n\n---\n\n## 23.8 Memory: leaks & bloat 🧠\n\n### Common leak sources\n1. Not disposing: `AnimationController`, `TextEditingController`, `ScrollController`, `PageController`, `TabController`, `FocusNode`, `ChangeNotifier`s you create, `StreamController`s.\n2. Not cancelling: `StreamSubscription`, `Timer`, listeners added to global objects (`WidgetsBinding.addObserver` without remove), `ValueNotifier.addListener` on long-lived objects.\n3. Global/static collections growing forever (caches without limits).\n4. Closures capturing `BuildContext`/State stored in long-lived objects (singletons, streams).\n5. Images: big decoded images in `ImageCache`; videos/camera controllers not disposed.\n6. Riverpod providers that should be autoDispose; blocs not closed; get_it singletons holding user data after logout.\n\n### Finding leaks\n* DevTools Memory → take snapshot → perform action N times (open/close screen) → snapshot → **diff**: classes whose instance counts keep growing (e.g., `_DetailsPageState` 10 instances after closing 10 times) = leak. Inspect **retaining path** (what holds it).\n* `leak_tracker` in tests detects not-disposed and not-GCed objects.\n* Android Studio Profiler / Xcode Instruments for native memory (images, platform views).\n\n### Reducing memory\n* `ImageCache` limits: `PaintingBinding.instance.imageCache.maximumSizeBytes = 100 \u003c\u003c 20;` clear on memory pressure (`didHaveMemoryPressure`).\n* Decode at display size (`cacheWidth`).\n* Paginate data; don't keep entire datasets in memory.\n* Dispose heavy resources when screens close.\n\n---\n\n## 23.9 Startup time 🚀\nMeasure: `flutter run --profile --trace-startup` → `build/start_up_info.json` (engineEnterTimestampMicros, timeToFirstFrameMicros...). Also Android vitals / Xcode Organizer launch metrics.\n\nImprove:\n* Do the **minimum before `runApp`** — show UI fast (native splash → first frame), initialize non-critical SDKs later (analytics, remote config fetch, ads) in parallel (`Future.wait`) or after first frame.\n* Avoid synchronous heavy work in `main()`/global initializers.\n* Lazy-load features; deferred imports (web code splitting; Android deferred components with Play Feature Delivery).\n* Reduce initial asset decoding (big images/fonts/Lottie on the first screen).\n* Pre-warm engine in add-to-app scenarios.\n* Keep the first screen's widget tree lean.\n\n---\n\n## 23.10 App size 📦\nMeasure: `flutter build apk --analyze-size --target-platform android-arm64` (or `appbundle`/`ios`) → open the generated JSON in DevTools App Size tool. Real download size: Play Console's App size report / App Store Connect's App Thinning size report.\n\nA Flutter \"hello world\" release is a few MB (engine + framework). Reduce:\n1. **App Bundles (AAB)** — Play delivers per-ABI/density splits automatically. For APK distribution: `--split-per-abi`.\n2. **Obfuscation + split debug info**: `--obfuscate --split-debug-info=build/symbols` (removes symbol names, smaller snapshot).\n3. **Tree-shake icons** (default in release); avoid dynamic `IconData` construction.\n4. **Assets**: compress images (WebP/AVIF), remove unused assets, use vector graphics (SVG→`vector_graphics`), download large assets on demand (CDN), subset fonts, avoid shipping many font weights.\n5. **Dependencies**: audit heavy packages (some pull big native SDKs: ML Kit models, maps, video, ffmpeg_kit). Use `--analyze-size` to see per-package size.\n6. **Android**: `isMinifyEnabled`/`isShrinkResources` (R8) for Java/Kotlin code; `resConfigs`/`localeFilters` to keep only needed languages from libraries.\n7. **iOS**: bitcode is deprecated (Xcode 14+); App Thinning delivers device-specific slices; check embedded frameworks.\n8. **Deferred components** (Android) / deferred libraries (web).\n\n---\n\n## 23.11 Network performance\nBatch/paginate requests, compress (gzip — automatic with Dio/http on native when server supports), cache (ETag/Cache-Control, local DB), avoid waterfall requests (parallelize with `Future.wait`), prefetch next pages, cancel unneeded requests, use HTTP/2/3 native clients (`cupertino_http`, `cronet_http`), CDN for images.\n\n---\n\n## 23.12 Battery & background\nAvoid continuous timers/polling (use push or longer intervals), stop animations offscreen (vsync does it for Tickers), pause location/sensors when not needed, batch work with WorkManager, avoid wake locks.\n\n---\n\n## 23.13 Performance testing & monitoring in organisations\n* **Benchmarks** in CI using `integration_test` + `traceAction` (frame build/raster time percentiles, e.g., `average_frame_build_time_millis`, `90th_percentile_frame_rasterizer_time_millis`, `missed_frame_build_budget_count`).\n* **Production monitoring**: Firebase Performance (app start, screen rendering: slow/frozen frames, network traces), Sentry performance, Android vitals (ANR rate, slow rendering), Xcode Organizer (hangs, launch time).\n* `FrameTiming` API: `SchedulerBinding.instance.addTimingsCallback((timings) { ... })` to report jank metrics from real users.\n* Performance budget per screen; PR checklist.\n\n---\n\n## 23.14 Performance checklist (print this) ✅\n- [ ] Measured in profile mode on low-end device\n- [ ] `const` constructors used; lint `prefer_const_constructors` on\n- [ ] Stateful widgets small; state scoped; selective rebuilds\n- [ ] No heavy work in `build`; formatters cached\n- [ ] Lists use builders/slivers; no `shrinkWrap` on long lists; `itemExtent` when possible\n- [ ] Images sized/cached; `cacheWidth` for thumbnails\n- [ ] No unnecessary `Opacity`/`ClipPath`/`BackdropFilter`/`saveLayer`\n- [ ] Animations use transitions/AnimatedBuilder with `child`; RepaintBoundary where useful\n- [ ] Heavy CPU work in isolates\n- [ ] All controllers/subscriptions/timers disposed\n- [ ] Startup: minimal pre-`runApp` work, deferred SDK init\n- [ ] App size analyzed; assets optimized; R8 enabled; obfuscation on\n- [ ] Performance monitored in production\n\n---\n\n## 23.15 Interview Questions — Performance\n\n**Q1. How do you investigate jank?** Reproduce in profile mode on a real device; DevTools Performance to see whether UI or raster thread exceeds budget; track widget rebuilds/layouts/paints; CPU profiler for Dart hotspots; fix and re-measure.\n\n**Q2. How do you reduce unnecessary rebuilds?** const widgets, splitting widgets, localized state, selective listening (select/Selector/BlocSelector/buildWhen), builder `child` param, avoiding MediaQuery.of, stable keys.\n\n**Q3. What is RepaintBoundary?** Creates a separate layer so repaints inside don't trigger repaints outside (and vice versa); useful for frequently changing subtrees; costs memory.\n\n**Q4. Why is Opacity expensive and alternatives?** It may require an offscreen saveLayer for children; use FadeTransition/AnimatedOpacity for animation, alpha colours, or Image opacity.\n\n**Q5. How do you handle heavy computation?** Move to background isolates (Isolate.run/compute), chunk work, or move server-side.\n\n**Q6. How do you find memory leaks?** DevTools memory snapshots & diffs, retaining paths, leak_tracker in tests; check disposals and subscriptions.\n\n**Q7. How do you reduce app size?** AAB/split per ABI, obfuscation + split debug info, asset optimization, remove heavy deps, R8 shrinking, deferred components, analyze-size.\n\n**Q8. How do you improve startup time?** Minimize work before first frame, defer/parallelize initialization, lazy loading, lightweight first screen, native splash, trace-startup measurement.\n\n**Q9. Why test performance in profile mode?** Debug mode uses JIT with assertions and debugging overhead; profile is AOT like release but keeps profiling hooks.\n\n**Q10. What are the UI and raster thread bars in the performance overlay?** Bottom graph = UI (Dart) thread frame times; top = raster (GPU) thread; red bars exceed the frame budget.\n\n**Q11. What is the frame budget at 120Hz?** ~8.33 ms per frame for each of UI and raster work.\n\n**Q12. How do images affect performance?** Decoding large images costs CPU/memory and raster time; downscale at decode (cacheWidth), cache appropriately, use correct formats/sizes.\n"}, {"n": 24, "file": "24-debugging-and-error-encyclopedia.md", "title": "Chapter 24 — Debugging Mastery & the Flutter Error Encyclopedia", "subtitle": "Debugging Mastery & the Flutter Error Encyclopedia", "short": "Debugging & Error Encyclopedia", "sub": "110 real errors with fixes", "level": "advanced", "minutes": 17, "qa": 6, "md": "# Chapter 24 — Debugging Mastery & the Flutter Error Encyclopedia\n\n> **Goal:** A systematic debugging method plus a lookup table of the errors you will meet in real projects — what they mean, why they happen, and exactly how to fix them. Keep this chapter open while working.\n\n---\n\n## 24.1 The debugging method (works for every bug) 🕵️\n\n1. **Read the FIRST error** in the console, completely. Flutter error messages are detailed and often contain the fix. Later errors are often consequences.\n2. **Reproduce** reliably. Note platform, device, OS version, build mode, Flutter version, app version, user state (logged in?), network state.\n3. **Isolate**: minimal reproduction (new screen/DartPad/`flutter create` sample). Binary search with git (`git bisect`) to find the commit that introduced it.\n4. **Inspect**: breakpoints, `debugPrint`, DevTools inspector, logs (`flutter logs`, `adb logcat`, Xcode console / Console.app).\n5. **Hypothesize → test → confirm**. Change one thing at a time.\n6. **Fix the root cause**, not the symptom (e.g., don't wrap everything in try/catch or add `!`).\n7. **Add a regression test**.\n8. **Document** (PR description, postmortem for incidents).\n\n### Debugging tools & tricks\n* Breakpoints & conditional breakpoints in VS Code/Android Studio; \"Break on exceptions\" (uncaught/all).\n* `debugger();` from `dart:developer` — programmatic breakpoint.\n* `debugPrint`, `log('msg', name: 'Cart', error: e, stackTrace: st)` (DevTools Logging view).\n* `debugDumpApp()`, `debugDumpRenderTree()`, `debugDumpLayerTree()`, `debugDumpSemanticsTree()`, `debugDumpFocusTree()`.\n* `debugPaintSizeEnabled`, `debugPaintBaselinesEnabled`, `debugPaintPointersEnabled`, `debugRepaintRainbowEnabled`, `debugPrintRebuildDirtyWidgets`, `debugPrintBeginFrameBanner`, `timeDilation = 5.0` (slow animations).\n* `toString()`/`toStringShort()`/`debugFillProperties` for readable diagnostics in your classes.\n* `FlutterError.demangleStackTrace`, `StackTrace.current`, `Chain.capture` (package `stack_trace`) for async stack chains.\n* Network: DevTools Network tab, Charles/Proxyman/mitmproxy (needs trusting user CAs on Android: network security config for debug builds), `LogInterceptor`.\n* Native: Android Studio (attach debugger to Android process, Logcat filters), Xcode (Debug → Attach to process; exception breakpoints; Instruments).\n* Release-only bugs: `flutter run --release` locally; check R8/ProGuard, obfuscation, missing manifest permissions, `kDebugMode`-only code, asserts that hid issues, tree-shaken entry points (`@pragma('vm:entry-point')`).\n* Crash reports: Crashlytics/Sentry with breadcrumbs; symbolize obfuscated traces with `flutter symbolize`.\n\n---\n\n## 24.2 Error encyclopedia — Layout & rendering\n\n| # | Error | Meaning / Cause | Fix |\n|---|---|---|---|\n| 1 | **A RenderFlex overflowed by N pixels on the right/bottom** | Row/Column children exceed available space | `Expanded`/`Flexible`, text `overflow`, `Wrap`, scroll view, smaller content |\n| 2 | **Vertical viewport was given unbounded height** | Scrollable inside an unbounded-height parent (Column, another scrollable) | `Expanded`, fixed `SizedBox` height, slivers; last resort `shrinkWrap` |\n| 3 | **Horizontal viewport was given unbounded width** | Horizontal list inside Row | `Expanded` / fixed width |\n| 4 | **RenderBox was not laid out: RenderXxx** | Consequence of earlier constraint error | Fix the first error |\n| 5 | **BoxConstraints forces an infinite width/height** | Widget wants infinite size (e.g., `SizedBox.expand`, `double.infinity` width) inside unbounded parent | Provide bounds |\n| 6 | **An InputDecorator, which is typically created by a TextField, cannot have an unbounded width** | TextField in Row | `Expanded(child: TextField())` |\n| 7 | **RenderFlex children have non-zero flex but incoming height constraints are unbounded** | `Expanded`/`Spacer` inside Column inside scroll view | Remove Expanded or use `SliverFillRemaining(hasScrollBody: false)` / IntrinsicHeight pattern |\n| 8 | **Incorrect use of ParentDataWidget** | Expanded/Flexible not direct child of Flex; Positioned not direct child of Stack | Restructure |\n| 9 | **Cannot hit test a render box with no size** / **'hasSize': is not true** | Querying size before layout / invisible widget | Use post-frame callback; ensure layout |\n| 10 | **A RenderViewport expected a child of type RenderSliver but received RenderBox** | Box widget in `slivers:` | `SliverToBoxAdapter`, `SliverPadding` |\n| 11 | **'Cannot provide both a color and a decoration'** | Container with both | Move color into BoxDecoration |\n| 12 | **Text has yellow double underline** | Text without a `Material`/`DefaultTextStyle` ancestor (e.g., in Hero flight, Overlay, or no Scaffold) | Wrap in `Material` or `Scaffold`, set style |\n| 13 | **Black/blank screen on launch** | Exception before first frame; missing `runApp`; awaiting a never-completing future in main; iOS: missing LaunchScreen | Check logs; wrap init in try/catch; ensure `runApp` |\n| 14 | **Red screen \"Exception caught by widgets library\"** (debug) / **grey box** (release) | Exception thrown in `build` | Fix the exception; customize `ErrorWidget.builder` |\n| 15 | **LayoutBuilder does not support returning intrinsic dimensions** | LayoutBuilder inside IntrinsicHeight/Width or something asking intrinsics | Avoid intrinsics around LayoutBuilder |\n| 16 | Image appears blurry | Low-res asset / wrong devicePixelRatio variant / `cacheWidth` too small | Provide 2x/3x assets; correct cache size |\n| 17 | **Unable to load asset: assets/...** | Not declared in pubspec, wrong path/case (case-sensitive on Linux/Android!), subfolder not listed, needs full restart | Fix pubspec & path; `flutter clean` |\n| 18 | Status bar icons invisible | Light icons on light background | `AnnotatedRegion\u003cSystemUiOverlayStyle>` / AppBar `systemOverlayStyle` |\n| 19 | Content behind navigation bar / notch (Android 15 edge-to-edge) | Not handling insets | `SafeArea`, `MediaQuery.paddingOf` |\n\n---\n\n## 24.3 Error encyclopedia — State & lifecycle\n\n| # | Error | Cause | Fix |\n|---|---|---|---|\n| 20 | **setState() called after dispose()** | Async result/timer/stream after widget removed | `if (!mounted) return;`, cancel subscriptions/timers in dispose |\n| 21 | **setState() or markNeedsBuild() called during build** | Triggering rebuilds (setState/notifyListeners/provider update) while building | Move to callbacks; `WidgetsBinding.instance.addPostFrameCallback` |\n| 22 | **dependOnInheritedWidgetOfExactType\u003cX>() ... was called before initState() completed** | `Theme.of`/`MediaQuery.of`/`Provider.of(listen:true)` in initState | Use `didChangeDependencies` or `context.read` (no listen) |\n| 23 | **Looking up a deactivated widget's ancestor is unsafe** | Using context of a disposed widget (after await, in dispose, in dialog after page popped) | Capture `Navigator.of(context)`/`ScaffoldMessenger.of(context)` before await; check `context.mounted` |\n| 24 | **This widget has been unmounted, so the State no longer has a context** | Same as above | Same |\n| 25 | **Multiple widgets used the same GlobalKey** | GlobalKey reused (static key, key created once but widget shown twice, two routes) | One key per widget instance |\n| 26 | **Duplicate keys found** | Same ValueKey among siblings | Unique ids |\n| 27 | **A dismissed Dismissible widget is still part of the tree** | Didn't remove item from list in onDismissed | Remove from data + setState |\n| 28 | **LateInitializationError: Field 'x' has not been initialized** | late read before assignment | Initialize earlier / nullable |\n| 29 | **Null check operator used on a null value** | `!` on null (common: `_formKey.currentState!` when Form not built, `snapshot.data!` when not loaded, `widget.x!`) | Check nulls; correct lifecycle |\n| 30 | **A XYZ was used after being disposed** (ChangeNotifier/AnimationController/TextEditingController) | Using after dispose, double dispose, Provider `create` disposing shared instance | Single owner; `.value` providers for existing objects |\n| 31 | **Bad state: Stream has already been listened to** | Second listener on single-subscription stream (e.g., StreamBuilder rebuilt with same stream after `.listen`, or two StreamBuilders) | `asBroadcastStream()`/broadcast controller; don't listen twice |\n| 32 | **Bad state: Cannot add new events after calling close** | Adding to closed StreamController (often in dispose race) | Check `isClosed`; order of disposal |\n| 33 | **StateError: Cannot emit new states after calling close** (Bloc) | Emitting after bloc closed (await gaps) | Check `isClosed`; cancel work on close |\n| 34 | **emit was called after an event handler completed normally** (Bloc) | emit inside stream.listen callback / unawaited future | `await emit.forEach`/`onEach`; await all futures |\n| 35 | **Could not find the correct Provider\u003cX> above this Widget** | Provider not ancestor (same build, new route, wrong type/import) | Builder/Consumer, move provider up, `.value` in new routes, consistent imports |\n| 36 | **Tried to listen to a value exposed with provider, from outside of the widget tree** | `watch`/`Provider.of` in callbacks | `read` |\n| 37 | **Bad state: No ProviderScope found** (Riverpod) | Missing root `ProviderScope` | Wrap app |\n| 38 | **Tried to modify a provider while the widget tree was building** (Riverpod) | State change during build/initState/didChangeDependencies | Delay with `Future(() => ...)`/post-frame or move to event |\n| 39 | State not updating when parent changes value | Copied widget property into state only in initState | `didUpdateWidget` or read `widget.x` directly |\n| 40 | UI doesn't update after modifying list | Mutated same list instance (ValueNotifier/Bloc/Riverpod equality) | Create new list (`[...old, item]`) |\n| 41 | Infinite rebuild loop / repeated API calls | Future/stream created in build; setState in build; provider watching something it changes | Create in initState/state layer |\n| 42 | TextField loses text/focus | Controller or key recreated on rebuild | Create controller once; avoid UniqueKey |\n\n---\n\n## 24.4 Error encyclopedia — Navigation & context\n\n| # | Error | Fix |\n|---|---|---|\n| 43 | **Navigator operation requested with a context that does not include a Navigator** | Use context under MaterialApp (Builder) or a navigatorKey |\n| 44 | **Scaffold.of() called with a context that does not contain a Scaffold** | Builder / separate widget / GlobalKey\u003cScaffoldState> |\n| 45 | **No MaterialLocalizations found** | Widget (e.g., showDatePicker, TextField context menu) needs MaterialApp & localizations delegates; in tests wrap with MaterialApp |\n| 46 | **No Material widget found** (e.g., InkWell/TextField/ListTile outside Material) | Wrap with `Material`/`Scaffold` |\n| 47 | **No MediaQuery widget ancestor found** | Use under MaterialApp/WidgetsApp or `MediaQuery` in tests |\n| 48 | **No Overlay widget found** (tooltip/dropdown above Navigator) | Use under MaterialApp |\n| 49 | **There are multiple heroes that share the same tag within a subtree** | Unique hero tags per route |\n| 50 | **'!_debugLocked': is not true** | Navigator push/pop during another navigation or during build | Defer with post-frame callback |\n| 51 | **GoException: no routes for location** | Wrong path / missing route / leading slash | Fix routes, add errorBuilder |\n| 52 | Black screen after `pop` | Popped last route | `canPop`/`maybePop` |\n\n---\n\n## 24.5 Error encyclopedia — Async, types & Dart\n\n| # | Error | Fix |\n|---|---|---|\n| 53 | **type 'Null' is not a subtype of type 'String' in type cast** | JSON key missing/null → nullable fields & defaults; validate data |\n| 54 | **type 'List\u003cdynamic>' is not a subtype of type 'List\u003cString>'** | `.cast\u003cString>()` / `List\u003cString>.from(...)` |\n| 55 | **type '_Map\u003cString, dynamic>' is not a subtype of type 'Map\u003cString, String>'** | `Map\u003cString, String>.from(...)` |\n| 56 | **type 'int' is not a subtype of type 'double'** | `(x as num).toDouble()` |\n| 57 | **_TypeError ... '_InternalLinkedHashMap\u003cObject?, Object?>'** (platform channel results) | `Map\u003cString, dynamic>.from(result as Map)` (recursively) |\n| 58 | **Unhandled Exception: ...** (async) | Await futures inside try/catch; handle stream errors; global handlers |\n| 59 | **FormatException: Unexpected character (at character 1) \u003c!DOCTYPE html>** | Server returned HTML (error page/login redirect/wrong URL) instead of JSON → check status codes & URL before decoding |\n| 60 | **RangeError (index): Invalid value: Not in inclusive range 0..N** | Index bounds; list changed during async gap |\n| 61 | **Concurrent modification during iteration** | Iterate over a copy |\n| 62 | **Stack Overflow** | Infinite recursion (getter calling itself, `==` calling itself, build recursion) |\n| 63 | **NoSuchMethodError: The method 'x' was called on null / Class 'X' has no instance method 'y'** | dynamic misuse → add types |\n| 64 | **TimeoutException after 0:00:10** | Slow network/server; tune timeouts; retry |\n| 65 | **Isolate: Illegal argument in isolate message: (object is a ReceivePort / closure capturing unsendable)** | Send only sendable data; don't capture `this` with sockets/streams |\n| 66 | **Binding has not yet been initialized** | `WidgetsFlutterBinding.ensureInitialized()` before using plugins; in tests `TestWidgetsFlutterBinding.ensureInitialized()` |\n| 67 | **Zone mismatch** | ensureInitialized and runApp in different zones → same zone |\n\n---\n\n## 24.6 Error encyclopedia — Build, Gradle, CocoaPods, Xcode\n\n| # | Error | Fix |\n|---|---|---|\n| 68 | **Gradle task assembleDebug failed with exit code 1** | Scroll up for the real error; `cd android && ./gradlew assembleDebug --stacktrace --info` |\n| 69 | **Unsupported class file major version 61/65/67** | JDK too new for Gradle → upgrade Gradle wrapper/AGP, or `flutter config --jdk-dir` to JDK 17 |\n| 70 | **Minimum supported Gradle version is X. Current version is Y** | Update `gradle-wrapper.properties` `distributionUrl` |\n| 71 | **Your project's Android Gradle Plugin version is lower than Flutter's minimum supported version** | Update AGP in `settings.gradle(.kts)` |\n| 72 | **Manifest merger failed: minSdkVersion X cannot be smaller than version Y declared in library** | Raise `minSdk` |\n| 73 | **Namespace not specified** (AGP 8) | Add `namespace` in module build.gradle; update old plugins |\n| 74 | **Duplicate class kotlin.collections.jdk8...** | Kotlin stdlib version conflict → align Kotlin version / Kotlin BOM |\n| 75 | **Execution failed for task ':app:mergeDexRelease'** / 64K method limit | minSdk ≥ 21 (multidex native) |\n| 76 | **Execution failed for task ':app:minifyReleaseWithR8' / Missing classes detected** | Add ProGuard `-keep`/`-dontwarn` rules from plugin docs (`missing_rules.txt` generated) |\n| 77 | **Inconsistent JVM-target compatibility detected for tasks 'compileDebugJavaWithJavac' (1.8) and 'compileDebugKotlin' (17)** | Align `compileOptions` & `kotlinOptions.jvmTarget` (or `kotlin { jvmToolchain(17) }`) |\n| 78 | **SDK location not found** | `local.properties` `sdk.dir` / `ANDROID_HOME` |\n| 79 | **Build failed due to use of deleted Android v1 embedding** | Migrate app/plugin to v2 embedding (FlutterActivity from `io.flutter.embedding.android`) |\n| 80 | **Keystore file not found for signing config 'release'** / **Failed to read key from store: Keystore was tampered with, or password was incorrect** | Check `key.properties` paths/passwords |\n| 81 | **CocoaPods could not find compatible versions for pod \"X\"** | `pod repo update`, raise iOS deployment target in Podfile, delete Podfile.lock & Pods |\n| 82 | **The iOS deployment target 'IPHONEOS_DEPLOYMENT_TARGET' is set to 9.0, but the range of supported deployment target versions is 12.0 to 18.x** | Post-install hook in Podfile to set min target for pods / update pods |\n| 83 | **No such module 'Flutter'** / **'Flutter/Flutter.h' file not found** | Open `.xcworkspace`; `flutter clean && flutter pub get && cd ios && pod install`; build from Flutter first |\n| 84 | **Signing for \"Runner\" requires a development team** | Set Team in Xcode Signing & Capabilities |\n| 85 | **Provisioning profile doesn't include the X capability / entitlement** | Regenerate profile with capability (Push, Associated Domains) |\n| 86 | **Module compiled with Swift X cannot be imported by Swift Y** | Clean derived data; update pods/Xcode |\n| 87 | **Sandbox: rsync.samba deny file-write-create** (Xcode 15+) | Set `ENABLE_USER_SCRIPT_SANDBOXING = NO` for Runner build settings (common with some pod scripts) |\n| 88 | **Command PhaseScriptExecution failed with a nonzero exit code** | Generic; read the script log; often FLUTTER_ROOT, CocoaPods, or flutter build errors |\n| 89 | **Error (Xcode): ... Flutter.framework ... does not contain bitcode** | Disable bitcode (deprecated) |\n| 90 | **Invalid Bundle / ITMS-90xxx on upload** | Read Apple's message: missing icons, privacy manifest (PrivacyInfo.xcprivacy required for certain APIs since 2024), invalid architectures, missing usage descriptions |\n| 91 | **ITMS-91053: Missing API declaration** | Add privacy manifest declaring required-reason APIs (update plugins that include their own manifests) |\n| 92 | **Target of URI doesn't exist: 'package:x/x.dart'** | `flutter pub get`; check package name & path; IDE restart (analysis server) |\n| 93 | **The getter 'x' isn't defined for the type ...** after codegen change | Run build_runner again; delete conflicting outputs |\n| 94 | **Conflicting outputs were detected and the build is unable to prompt** | `--delete-conflicting-outputs` |\n| 95 | **Because X depends on Y ... version solving failed** | Chapter 2 §2.5.2 |\n\n---\n\n## 24.7 Error encyclopedia — Platform & plugins\n\n| # | Error | Fix |\n|---|---|---|\n| 96 | **MissingPluginException(No implementation found for method ...)** | Full rebuild (not hot reload) after adding plugin; platform supported? channel name? background isolate? add-to-app registration? tests mocked? |\n| 97 | **PlatformException(sign_in_failed, ApiException: 10)** (Google Sign-In Android) | SHA-1/SHA-256 of signing keys (debug, upload, Play signing) not registered in Firebase/Google Cloud |\n| 98 | **PlatformException(already_active, Image picker is already active)** | Prevent double taps |\n| 99 | **Permission denied crash on iOS when requesting camera** | Info.plist usage description missing |\n| 100 | **CERTIFICATE_VERIFY_FAILED** | Invalid cert / missing intermediate / device date wrong / outdated root store |\n| 101 | **SocketException: Failed host lookup** | No internet/DNS/emulator network; Android INTERNET permission in release |\n| 102 | **XMLHttpRequest error** (web) | CORS, mixed content, server down |\n| 103 | **Unsupported operation: Platform._operatingSystem** (web) | `dart:io` Platform on web → `kIsWeb`/`defaultTargetPlatform` |\n| 104 | WebView blank on Android | Missing internet permission / cleartext / JS disabled (`setJavaScriptMode(JavaScriptMode.unrestricted)`) |\n| 105 | Google Maps blank/grey | API key missing/restricted wrongly, Maps SDK not enabled, billing not enabled |\n| 106 | Push not received | Chapter 18 table |\n| 107 | Deep link opens browser | Verification failure — Chapter 11 |\n| 108 | Release crash only, ClassNotFoundException | R8 removed class → keep rules |\n| 109 | `flutter_secure_storage` crash after restore | Backup excluded / reset on error |\n| 110 | Background handler not running in release | `@pragma('vm:entry-point')` |\n\n---\n\n## 24.8 \"What would you do if…\" — situational playbook 📘\n\n**…the app crashes for 2% of users after a release?**\n1. Check Crashlytics/Sentry: group by issue, versions, devices, OS.\n2. If severe: **halt staged rollout** (Play Console) / pause phased release (App Store), toggle a **feature flag/kill switch** if the feature is flagged.\n3. Reproduce with the same OS/device (Firebase Test Lab).\n4. Hotfix → test → expedited release; consider code push (Shorebird) for Dart-only fixes if your org uses it (respect store policies).\n5. Postmortem: root cause, why tests didn't catch it, add regression test & monitoring.\n\n**…the list screen is janky on low-end Android?** Profile mode → DevTools → identify UI vs raster → apply Chapter 23 fixes (builders, images, const, isolates, effects) → verify on the same device.\n\n**…a screen is slow to load data?** Check network waterfall (sequential calls?), payload size, server latency, parsing on main thread, caching (show cached first), pagination, prefetch.\n\n**…users report being logged out randomly?** Token refresh race (parallel 401s), refresh token rotation conflicts, secure storage read failures (Keychain accessibility when locked/background), clock skew with JWT expiry, server revoking sessions → add logging around auth, use queued refresh.\n\n**…the app works in debug but not in release?** Missing INTERNET permission, R8 stripping, obfuscation breaking reflection/`runtimeType.toString()` logic, `kDebugMode`-guarded init, tree-shaken entry points, env/config differences, asserts masking bugs.\n\n**…build fails after upgrading Flutter?** Read the breaking changes page for that version; `dart fix --apply`; update Gradle/AGP/Kotlin per Flutter's warnings; update plugins (`flutter pub upgrade --major-versions` carefully); `flutter clean`; pod repo update. Upgrade on a branch with CI; never on release day.\n\n**…two features conflict in state (e.g., cart badge stale)?** Ensure single source of truth (cart repository stream), derived values computed not duplicated, invalidate/refresh on mutations.\n\n**…memory grows until crash on image-heavy screens?** `cacheWidth`, limit ImageCache, dispose controllers, check leaks via snapshots.\n\n**…a plugin is abandoned and broken on new Android/iOS?** Check forks/community alternatives; fork & patch (git dependency pinned to commit) and upstream PR; or write your own minimal plugin with Pigeon.\n\n**…a production bug you can't reproduce?** Add breadcrumbs/logging (non-PII) around the flow, remote config–controlled verbose logging, collect device/OS/version patterns, try same conditions (slow network via network link conditioner, low memory, different locale/timezone/text scale, RTL, dark mode, accessibility settings, process death via \"Don't keep activities\").\n\n---\n\n## 24.9 Interview Questions — Debugging\n\n**Q1. How do you debug a layout overflow?** Read error (which RenderFlex, by how much), use Inspector layout explorer / debugPaintSizeEnabled, apply Expanded/Flexible/scroll/overflow handling.\n\n**Q2. How do you debug a release-only crash?** Reproduce with `--release`, check logs (logcat/Xcode), symbolicate obfuscated traces, check R8 rules/permissions/entry points/config differences.\n\n**Q3. What does \"setState called after dispose\" mean and how to prevent it?** Async callback updating a disposed State; check `mounted`, cancel subscriptions/timers/requests in dispose.\n\n**Q4. How do you handle \"Null check operator used on a null value\"?** Find the `!` in the stack trace, understand why null occurs (lifecycle/data), replace with proper null handling/state modelling.\n\n**Q5. What tools do you use for debugging Flutter apps?** IDE debugger, DevTools (inspector, performance, CPU, memory, network, logging), logs, crash reporting, proxies, native debuggers.\n\n**Q6. How do you debug network issues?** DevTools Network tab, interceptor logs (debug only), proxy tools, verifying status codes/headers/body, testing with curl/Postman, checking platform configs (permissions, ATS, CORS).\n"}, {"n": 25, "file": "25-security.md", "title": "Chapter 25 — Mobile App Security for Flutter (OWASP MASVS in Practice)", "subtitle": "Mobile App Security for Flutter (OWASP MASVS in Practice)", "short": "Security", "sub": "OWASP, secrets, storage, pinning", "level": "advanced", "minutes": 8, "qa": 10, "md": "# Chapter 25 — Mobile App Security for Flutter (OWASP MASVS in Practice)\n\n> **Goal:** Build apps that protect user data and company systems. Banks, fintech, health and enterprise clients will ask about these topics, and security interviews for senior roles use OWASP terminology.\n\n---\n\n## 25.1 The golden rule 🔑\n\n> **The app runs on a device you don't control. Anything inside the app (code, strings, assets, API keys) can be extracted, and any check in the app can be bypassed.**\n\n**5-year-old:** Your app is a **letter you mail to a stranger**. You can put it in an envelope (obfuscation), but they can still open it. So **never write your secret password inside the letter** — keep secrets in your own house (the server).\n\nTherefore: real security decisions (authorization, prices, payment success, feature entitlements) happen on the **server**. The client adds **defense in depth**.\n\n---\n\n## 25.2 OWASP Mobile Top 10 (2024) → Flutter mapping\n| Risk | Flutter-specific practice |\n|---|---|\n| M1 Improper Credential Usage | No hard-coded secrets; tokens in secure storage; short-lived tokens |\n| M2 Inadequate Supply Chain Security | Vet packages, pin versions (lock file), dependency scanning, verified publishers, review native code in plugins |\n| M3 Insecure Authentication/Authorization | Server-side authz; OAuth2 + PKCE; biometrics as convenience only; session expiry |\n| M4 Insufficient Input/Output Validation | Validate input; parameterized SQL; sanitize WebView content; deep link parameter validation |\n| M5 Insecure Communication | HTTPS/TLS only; no cleartext; certificate pinning for high-risk apps |\n| M6 Inadequate Privacy Controls | Minimize PII, consent, privacy manifests, data deletion |\n| M7 Insufficient Binary Protections | Obfuscation, integrity checks, root/jailbreak detection, anti-tamper (RASP) where justified |\n| M8 Security Misconfiguration | Disable debug flags in release, `android:debuggable=false`, `allowBackup` rules, exported components |\n| M9 Insecure Data Storage | Secure storage, encrypted DB, no sensitive data in logs/prefs/caches/screenshots |\n| M10 Insufficient Cryptography | Use vetted libraries/platform crypto; no custom crypto; proper key storage |\n\nOWASP **MASVS** (verification standard) and **MASTG** (testing guide) are the references auditors use.\n\n---\n\n## 25.3 Secrets & API keys\n* ❌ Hard-coding `const stripeSecretKey = 'sk_live_...'` — extractable from the binary (`strings libapp.so`) in minutes.\n* ❌ `.env` assets — also bundled & readable.\n* ✅ Keep secrets on the **backend**; the app calls your backend, which calls third parties.\n* ✅ Public keys meant for clients (Firebase config, Stripe *publishable* key, Maps keys) are fine — **restrict them** (Android package + SHA-1, iOS bundle ID, HTTP referrers, API restrictions, quotas).\n* ✅ `--dart-define` values are *not* secret either; `envied` obfuscation only slows attackers.\n* Rotate keys if leaked; add secret scanning in CI (gitleaks, GitHub secret scanning); never commit keystores/`key.properties`/service account JSON.\n\n---\n\n## 25.4 Authentication & sessions\n* OAuth 2.0 / OIDC with **Authorization Code + PKCE** (`flutter_appauth`) for third-party identity providers; system browser (ASWebAuthenticationSession / Custom Tabs), never embedded WebView for credentials.\n* Access token short-lived (5–15 min), refresh token longer & rotated; store in secure storage; refresh with locking (Chapter 16).\n* Logout: revoke tokens server-side, clear secure storage, DB, caches, in-memory state.\n* **Biometrics** (`local_auth`) unlock locally-stored credentials/keys; never treat \"biometric success\" as server authentication by itself. For strong binding, use keys in Keystore/Secure Enclave that require biometri
