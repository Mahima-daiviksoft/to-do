Q3. How do you parse JSON?** jsonDecode → Map → fromJson factories (manual or json_serializable/freezed); heavy payloads in an isolate.\n\n**Q4. Why use code generation for JSON?** Less boilerplate, fewer typos, consistent null handling, nested models, maintainability.\n\n**Q5. How do you handle errors from APIs?** Map transport and HTTP errors into domain failure types; show friendly messages; log details; retry where appropriate.\n\n**Q6. How do you cancel requests?** Dio CancelToken (or closing http client); cancel in dispose or when a newer request supersedes.\n\n**Q7. What is CORS and why does it affect Flutter web?** Browser security policy requiring the server to allow cross-origin requests; it's fixed on the server/proxy, not in Flutter.\n\n**Q8. How do you build an offline-first app?** Local DB as single source of truth, UI observes DB, sync layer with outbox queue and conflict resolution, connectivity awareness, background sync.\n\n**Q9. What is certificate pinning?** Validating the server certificate/public key against known values to prevent MITM even with compromised CAs; requires rotation planning.\n\n**Q10. How do you implement retries correctly?** Exponential backoff with jitter for transient failures, only idempotent requests or with idempotency keys, max attempts.\n\n**Q11. What is an interceptor?** Middleware hooking into request/response/error to modify, log, retry or resolve them.\n\n**Q12. REST vs GraphQL?** REST: resource endpoints, simple caching; GraphQL: single endpoint, clients specify fields, reduces over/under-fetching, needs more tooling and caching strategy.\n"}, {"n": 17, "file": "17-local-storage-and-databases.md", "title": "Chapter 17 — Local Storage: Preferences, Secure Storage, Files, SQLite (sqflite/Drift), NoSQL & Caching", "subtitle": "Local Storage: Preferences, Secure Storage, Files, SQLite (sqflite/Drift), NoSQL & Caching", "short": "Storage & Databases", "sub": "Secure storage, sqflite, Drift, migrations", "level": "intermediate", "minutes": 9, "qa": 8, "md": "# Chapter 17 — Local Storage: Preferences, Secure Storage, Files, SQLite (sqflite/Drift), NoSQL & Caching\n\n> **Goal:** Choose the right storage for each kind of data, use it correctly, migrate schemas safely, and avoid data-loss and security bugs.\n\n---\n\n## 17.1 5-year-old picture: drawers, safes and filing cabinets 🗄️\n\n* **Sticky notes on the fridge** (SharedPreferences) — tiny things like \"dark mode on\".\n* **A locked safe** (secure storage) — secret keys, passwords, tokens.\n* **A box of papers** (files) — photos, PDFs, downloads.\n* **A big filing cabinet with an index** (databases) — thousands of organised records you can search.\n\n---\n\n## 17.2 Decision table\n\n| Data | Store in | Why |\n|---|---|---|\n| Small settings/flags (theme, onboarding seen, last tab) | `shared_preferences` | Simple key-value, not secure |\n| Tokens, passwords, encryption keys, PII secrets | `flutter_secure_storage` | Keychain (iOS) / Keystore-backed encryption (Android) |\n| Structured relational data, queries, joins, offline-first | **Drift** (SQLite, typed, reactive) or **sqflite** | SQL power, migrations |\n| Fast object storage / NoSQL | **ObjectBox**, **Isar (community fork)**, **Hive CE**, **Sembast** | Simple objects, speed |\n| Large binary (images, PDFs, videos) | Files via `path_provider` | Don't put big blobs in prefs/DB |\n| Cached HTTP responses/images | `dio_cache_interceptor`, `cached_network_image`(uses `flutter_cache_manager`) | Automatic expiry |\n| Cloud-synced data | Firestore (offline cache), Supabase, Realm-like solutions | Sync handled |\n\n> ⚠️ Ecosystem note (2024–2026): the original authors stopped maintaining **Hive** and **Isar**. Community forks **`hive_ce`** and **`isar_community`** continue them. For new projects, many teams choose **Drift** (actively maintained, SQL, web support) or **ObjectBox**. Interviewers may ask \"Hive vs Isar vs Drift\" — mention maintenance status.\n\n---\n\n## 17.3 shared_preferences\n\n```dart\n// Classic API (cached, synchronous reads after getInstance)\nfinal prefs = await SharedPreferences.getInstance();\nawait prefs.setBool('onboarding_done', true);\nawait prefs.setString('locale', 'hi');\nawait prefs.setInt('launch_count', (prefs.getInt('launch_count') ?? 0) + 1);\nawait prefs.setStringList('recent_searches', ['a', 'b']);\nfinal done = prefs.getBool('onboarding_done') ?? false;\nawait prefs.remove('locale');\nawait prefs.clear();\n```\nNewer APIs (shared_preferences 2.3+):\n* `SharedPreferencesAsync` — always reads from the platform (no stale cache across isolates/processes).\n* `SharedPreferencesWithCache` — explicit cache with an `allowList` of keys.\nThe legacy `SharedPreferences` class is planned for eventual deprecation — new code should prefer the new APIs.\n\nFacts:\n* Android: stored in XML (`SharedPreferences`) or **DataStore** (newer backend option); iOS/macOS: `NSUserDefaults`; web: `localStorage`; Windows/Linux: JSON file.\n* **Not encrypted** — readable on rooted/jailbroken devices and in backups. Never store tokens/passwords.\n* Data **isn't guaranteed to be persisted** synchronously across crashes (write is async).\n* Not for large data (it's loaded into memory).\n* Only primitive types — store complex objects as JSON strings (or use a DB).\n* Tests: `SharedPreferences.setMockInitialValues({'key': value})`.\n\nBest practice: wrap in a typed `SettingsStore` class with keys as constants — avoid string typos scattered everywhere.\n\n---\n\n## 17.4 flutter_secure_storage 🔐\n\n```dart\nconst storage = FlutterSecureStorage(\n  aOptions: AndroidOptions(encryptedSharedPreferences: true), // option depends on plugin version; newer versions use their own cipher by default\n  iOptions: IOSOptions(accessibility: KeychainAccessibility.first_unlock_this_device),\n);\nawait storage.write(key: 'refresh_token', value: token);\nfinal token = await storage.read(key: 'refresh_token');\nawait storage.delete(key: 'refresh_token');\nawait storage.deleteAll();\n```\n* iOS: **Keychain**. ⚠️ Keychain items **survive app uninstall** on iOS! If a user reinstalls, old tokens may still exist → on first launch after install (detect using a SharedPreferences flag, which *is* wiped on uninstall), clear secure storage.\n* Android: encrypts values using keys stored in the **Android Keystore**. Android **Auto Backup** can restore encrypted data to a new device where the Keystore key doesn't exist → decryption crashes (`BadPaddingException`). Exclude secure storage files from backup (`android:allowBackup=\"false\"` or `fullBackupContent`/`dataExtractionRules` rules) or handle errors by clearing.\n* `KeychainAccessibility` choices matter for background access (e.g., `first_unlock` to read in background fetch).\n* Biometric-protected secrets: `local_auth` + secure storage (or platform APIs binding keys to biometrics).\n\n---\n\n## 17.5 Files with path_provider\n\n```dart\nimport 'dart:io';\nimport 'package:path_provider/path_provider.dart';\nimport 'package:path/path.dart' as p;\n\nfinal docs = await getApplicationDocumentsDirectory();   // user data, backed up (iOS)\nfinal support = await getApplicationSupportDirectory();  // app data not user-visible\nfinal temp = await getTemporaryDirectory();              // cache; OS may delete anytime\nfinal cache = await getApplicationCacheDirectory();\n// Android only: getExternalStorageDirectory(), getExternalCacheDirectories(); iOS: getLibraryDirectory()\n// Desktop: getDownloadsDirectory()\n\nfinal file = File(p.join(docs.path, 'notes.json'));\nawait file.writeAsString(jsonEncode(notes), flush: true);\nfinal content = await file.readAsString();\nif (await file.exists()) await file.delete();\n```\n* `dart:io` isn't available on **web** — use conditional imports or IndexedDB-based storage.\n* Always build paths with `package:path` (`p.join`) — never string-concatenate with `/`.\n* Write atomically for important data: write to a temp file, then `rename` (prevents corruption on crash).\n* Large file copies/encryption → isolate.\n* User-visible files (save to Downloads/Gallery): Android scoped storage rules (Android 10+), `MediaStore`; packages `gal` (save images/videos to gallery), `file_picker`, `share_plus`, `open_filex`. iOS needs `UIFileSharingEnabled`/`LSSupportsOpeningDocumentsInPlace` to expose files in the Files app.\n\n---\n\n## 17.6 SQLite with sqflite\n\n```dart\nimport 'package:sqflite/sqflite.dart';\n\nclass NotesDb {\n  static const _version = 2;\n  Database? _db;\n\n  Future\u003cDatabase> get db async => _db ??= await openDatabase(\n        p.join(await getDatabasesPath(), 'notes.db'),\n        version: _version,\n        onConfigure: (db) async => db.execute('PRAGMA foreign_keys = ON'),\n        onCreate: (db, version) async {\n          await db.execute('''\n            CREATE TABLE notes(\n              id INTEGER PRIMARY KEY AUTOINCREMENT,\n              title TEXT NOT NULL,\n              body TEXT,\n              pinned INTEGER NOT NULL DEFAULT 0,\n              updated_at INTEGER NOT NULL\n            )''');\n          await db.execute('CREATE INDEX idx_notes_updated ON notes(updated_at)');\n        },\n        onUpgrade: (db, oldVersion, newVersion) async {\n          if (oldVersion \u003c 2) {\n            await db.execute('ALTER TABLE notes ADD COLUMN pinned INTEGER NOT NULL DEFAULT 0');\n          }\n          // if (oldVersion \u003c 3) { ... } — cumulative, never edit old steps\n        },\n      );\n\n  Future\u003cint> insert(Note n) async =>\n      (await db).insert('notes', n.toMap(), conflictAlgorithm: ConflictAlgorithm.replace);\n\n  Future\u003cList\u003cNote>> search(String q) async {\n    final rows = await (await db).query('notes',\n        where: 'title LIKE ?', whereArgs: ['%$q%'],          // ❗ parameterised — prevents SQL injection\n        orderBy: 'updated_at DESC', limit: 50);\n    return rows.map(Note.fromMap).toList();\n  }\n\n  Future\u003cvoid> bulkInsert(List\u003cNote> notes) async {\n    final database = await db;\n    await database.transaction((txn) async {                  // ❗ transactions: atomic + MUCH faster\n      final batch = txn.batch();\n      for (final n in notes) batch.insert('notes', n.toMap());\n      await batch.commit(noResult: true);\n    });\n  }\n}\n```\nNotes:\n* SQLite has no boolean/date types → store `INTEGER` 0/1 and epoch millis (or ISO text).\n* Inside a `transaction`, use `txn`, **not** `db` → using `db` inside deadlocks!\n* `sqflite` works on Android/iOS/macOS; desktop via `sqflite_common_ffi`; web via `sqflite_common_ffi_web` (experimental).\n* Keep a single DB instance (opening multiple connections → \"database is locked\").\n* Migrations: increase `version`; `onUpgrade` must handle **every** older version path; test upgrades from old app versions with real data!\n\n---\n\n## 17.7 Drift (type-safe, reactive SQLite) ⭐\n\n```dart\nimport 'package:drift/drift.dart';\npart 'app_database.g.dart';\n\nclass Todos extends Table {\n  IntColumn get id => integer().autoIncrement()();\n  TextColumn get title => text().withLength(min: 1, max: 200)();\n  BoolColumn get done => boolean().withDefault(const Constant(false))();\n  DateTimeColumn get createdAt => dateTime().withDefault(currentDateAndTime)();\n  IntColumn get categoryId => integer().nullable().references(Categories, #id)();\n}\n\nclass Categories extends Table {\n  IntColumn get id => integer().autoIncrement()();\n  TextColumn get name => text()();\n}\n\n@DriftDatabase(tables: [Todos, Categories])\nclass AppDatabase extends _$AppDatabase {\n  AppDatabase(super.e);\n\n  @override\n  int get schemaVersion => 2;\n\n  @override\n  MigrationStrategy get migration => MigrationStrategy(\n        onCreate: (m) => m.createAll(),\n        onUpgrade: (m, from, to) async {\n          if (from \u003c 2) await m.addColumn(todos, todos.categoryId);\n        },\n        beforeOpen: (details) async => customStatement('PRAGMA foreign_keys = ON'),\n      );\n\n  Stream\u003cList\u003cTodo>> watchActive() =>\n      (select(todos)..where((t) => t.done.equals(false))..orderBy([(t) => OrderingTerm.desc(t.createdAt)])).watch();\n\n  Future\u003cint> addTodo(String title) => into(todos).insert(TodosCompanion.insert(title: title));\n  Future\u003cvoid> toggle(Todo t) => update(todos).replace(t.copyWith(done: !t.done));\n}\n// Open with drift_flutter: AppDatabase(driftDatabase(name: 'app'))\n```\nWhy teams love Drift: compile-time checked queries (Dart API or `.drift` SQL files), **streams that auto-update** UI when tables change, migrations tooling (`drift_dev schema dump` + generated step-by-step migrations + migration tests), joins, transactions, isolates support, web support (WASM SQLite), encryption via SQLCipher setup.\n\n---\n\n## 17.8 NoSQL options (brief)\n\n### Hive (CE)\n```dart\nawait Hive.initFlutter();\nfinal box = await Hive.openBox\u003cString>('settings');\nawait box.put('theme', 'dark');\nbox.get('theme');\n// Typed objects need TypeAdapters (codegen with hive_ce_generator)\nValueListenableBuilder(valueListenable: box.listenable(), builder: ...);\n```\nPure Dart, fast for small/medium data, encryption via `HiveAesCipher` (store key in secure storage). Boxes are loaded into memory (non-lazy boxes). Not for complex queries.\n\n### Isar (community)\nFast, indexed queries, links, full-text-ish search, multi-isolate. Original maintainer left; use `isar_community` fork.\n\n### ObjectBox\nVery fast embedded object DB with relations, queries, vector search (on-device AI), and a commercial sync product.\n\n### Sembast\nPure-Dart NoSQL JSON store; works on web (IndexedDB) — simple.\n\n---\n\n## 17.9 Web storage\n* `shared_preferences` → localStorage.\n* IndexedDB via `idb_shim`, Drift (WASM + OPFS/IndexedDB), Sembast web, Hive CE (IndexedDB).\n* Remember: browser storage can be cleared by the user/browser at any time; quota limits.\n\n---\n\n## 17.10 Data security at rest\n* Encrypt sensitive databases: **SQLCipher** (`sqlcipher_flutter_libs` with Drift/sqflite), Hive encryption; key in secure storage.\n* Don't store PII unnecessarily (privacy laws: GDPR, India's DPDP Act 2023, CCPA).\n* Clear user data on logout (DB, files, secure storage, caches, image cache).\n* Exclude sensitive files from cloud backups when required.\n\n---\n\n## 17.11 Common storage bugs\n| Bug | Cause / Fix |\n|---|---|\n| `MissingPluginException(No implementation found for method getAll on channel plugins.flutter.io/shared_preferences)` | Plugin added without full restart/rebuild; in tests not mocked; called in a background isolate without setup → full rebuild, `setMockInitialValues`, BackgroundIsolateBinaryMessenger |\n| `Binding has not yet been initialized` | Using storage before `runApp` without `WidgetsFlutterBinding.ensureInitialized()` |\n| Data lost after app update | Changed key names/DB schema without migration |\n| `DatabaseException(no such column)` after update | Missing `onUpgrade` step / didn't bump version |\n| Database locked / deadlock | Using `db` inside `transaction` instead of `txn`; multiple instances |\n| Tokens survive reinstall on iOS | Keychain persists — clear on first run |\n| Crash decrypting secure storage after device restore | Backup restored without Keystore key — exclude from backup, catch & reset |\n| Slow app start | Opening big Hive boxes / heavy DB work before first frame → lazy open, show UI first |\n| Web: `Unsupported operation: Platform._operatingSystem` / dart:io errors | dart:io used on web → conditional imports |\n\n---\n\n## 17.12 Interview Questions — Storage\n\n**Q1. Where would you store an auth token?** flutter_secure_storage (Keychain/Keystore), never SharedPreferences; consider short-lived access tokens + refresh tokens.\n\n**Q2. SharedPreferences limitations?** Small primitive data only, unencrypted, async writes, loaded into memory, not for complex/large data.\n\n**Q3. sqflite vs Drift vs Hive/Isar/ObjectBox?** sqflite: raw SQLite with manual SQL; Drift: typed, reactive SQLite with migrations tooling; Hive: lightweight key-value boxes; Isar/ObjectBox: fast NoSQL object DBs with indexes/queries; consider maintenance status (Hive/Isar community forks).\n\n**Q4. How do you handle DB migrations?** Versioned schema; cumulative onUpgrade steps for every old version; never modify past migrations; test upgrade paths; Drift's schema tools.\n\n**Q5. How do you make DB writes fast?** Batch inserts in transactions, indexes on queried columns, avoid N+1 queries, run heavy work in isolates.\n\n**Q6. Which directory for what?** Documents for user data, Support for app internal data, Temporary/Cache for re-creatable caches.\n\n**Q7. How do you clear data on logout?** Delete tokens from secure storage, clear DB tables/user-specific files, caches (image cache, HTTP cache), reset state providers/blocs.\n\n**Q8. What is an offline-first approach?** Local DB as source of truth, UI observes it, background sync with server and conflict resolution.\n"}, {"n": 18, "file": "18-firebase-and-integrations.md", "title": "Chapter 18 — Firebase, Backend Services & Common Integrations (Auth, Push, Analytics, Crashlytics, Payments, Maps, Media, Permissions, Background Work)", "subtitle": "Firebase, Backend Services & Common Integrations (Auth, Push, Analytics, Crashlytics, Payments, Maps, Media, Permissions, Background Work)", "short": "Firebase & Integrations", "sub": "Auth, Firestore, push, Crashlytics", "level": "intermediate", "minutes": 11, "qa": 10, "md": "# Chapter 18 — Firebase, Backend Services & Common Integrations (Auth, Push, Analytics, Crashlytics, Payments, Maps, Media, Permissions, Background Work)\n\n> **Goal:** Integrate the services every real company app uses — correctly, securely, and with knowledge of the platform gotchas that cause most production incidents.\n\n---\n\n## 18.1 Firebase setup (FlutterFire)\n\n```bash\ndart pub global activate flutterfire_cli\nfirebase login\nflutterfire configure            # creates lib/firebase_options.dart, registers apps, downloads config\nflutter pub add firebase_core\n```\n```dart\nimport 'package:firebase_core/firebase_core.dart';\nimport 'firebase_options.dart';\n\nFuture\u003cvoid> main() async {\n  WidgetsFlutterBinding.ensureInitialized();\n  await Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform);\n  runApp(const MyApp());\n}\n```\n* Multiple environments: separate Firebase projects (dev/staging/prod) — `flutterfire configure --project=myapp-dev --out=lib/firebase_options_dev.dart` per flavor; plus `google-services.json` per Android flavor (`android/app/src/dev/`) and `GoogleService-Info.plist` per iOS scheme (copy script in build phase).\n* Firebase **client config/API keys are not secrets** — security is enforced by **Security Rules** and **App Check**, not by hiding keys.\n\n---\n\n## 18.2 Firebase Authentication\n```dart\nfinal auth = FirebaseAuth.instance;\nawait auth.createUserWithEmailAndPassword(email: e, password: p);\nawait auth.signInWithEmailAndPassword(email: e, password: p);\nawait auth.signOut();\nauth.authStateChanges().listen((user) { /* null = signed out */ });   // drive your router redirect with this\nauth.idTokenChanges(); auth.userChanges();\nfinal idToken = await auth.currentUser?.getIdToken();                  // send to your backend; verify server-side\n\n// Google Sign-In (google_sign_in package + credential)\n// Sign in with Apple (sign_in_with_apple) — REQUIRED by App Store if you offer other third-party logins (App Store guideline 4.8, with some exceptions)\n// Phone auth: verifyPhoneNumber(codeSent:, verificationCompleted:, verificationFailed:, codeAutoRetrievalTimeout:)\ntry { ... } on FirebaseAuthException catch (e) {\n  switch (e.code) {\n    case 'user-not-found' || 'wrong-password' || 'invalid-credential': ...\n    case 'email-already-in-use': ...\n    case 'too-many-requests': ...\n    case 'network-request-failed': ...\n  }\n}\n```\nNote: Firebase has moved toward `invalid-credential` for wrong email/password (email enumeration protection), so don't rely on `user-not-found`/`wrong-password` alone.\n\nOther auth providers/backends: Supabase Auth, Auth0 (`auth0_flutter`), AWS Cognito/Amplify, Keycloak/OAuth2+PKCE with `flutter_appauth`, custom JWT backend.\n\n**Auth architecture pattern:**\n`AuthRepository` (wraps SDK) → exposes `Stream\u003cAuthUser?>` → app-level auth state (Bloc/Riverpod) → router `redirect` + `refreshListenable` → on logout clear all user data.\n\n---\n\n## 18.3 Cloud Firestore\n```dart\nfinal db = FirebaseFirestore.instance;\n\n// Typed collection with converter\nfinal todosRef = db.collection('users').doc(uid).collection('todos').withConverter\u003cTodo>(\n  fromFirestore: (snap, _) => Todo.fromJson({...snap.data()!, 'id': snap.id}),\n  toFirestore: (todo, _) => todo.toJson()..remove('id'),\n);\n\nawait todosRef.add(Todo(title: 'Buy milk'));\nawait todosRef.doc(id).update({'done': true});   // update on raw ref for partial fields\nawait todosRef.doc(id).delete();\n\n// Real-time stream\nStream\u003cList\u003cTodo>> watch() => todosRef\n    .where('done', isEqualTo: false)\n    .orderBy('createdAt', descending: true)\n    .limit(20)\n    .snapshots()\n    .map((s) => s.docs.map((d) => d.data()).toList());\n\n// Pagination with cursors\nfinal next = await todosRef.orderBy('createdAt').startAfterDocument(lastDoc).limit(20).get();\n\n// Transactions & batched writes\nawait db.runTransaction((tx) async {\n  final snap = await tx.get(accountRef);\n  tx.update(accountRef, {'balance': (snap['balance'] as num) - 100});\n});\nfinal batch = db.batch()..set(a, dataA)..delete(b);\nawait batch.commit();\n\nFieldValue.serverTimestamp(); FieldValue.increment(1); FieldValue.arrayUnion(['x']);\n```\nKey knowledge:\n* Offline persistence enabled by default on mobile (cache); writes are queued.\n* **Composite indexes** required for multi-field queries → error message includes a link to create it.\n* Billing is per document read → avoid reading whole collections; paginate; denormalize data for reads.\n* Listeners must be cancelled (StreamBuilder handles it; manual `listen` → cancel in dispose).\n* **Security Rules** are mandatory (never ship `allow read, write: if true;`):\n```\nrules_version = '2';\nservice cloud.firestore {\n  match /databases/{db}/documents {\n    match /users/{uid}/todos/{todoId} {\n      allow read, write: if request.auth != null && request.auth.uid == uid;\n    }\n  }\n}\n```\n* Realtime Database (older JSON tree DB), Cloud Storage (`firebase_storage` for file uploads with `putFile`, progress via `snapshotEvents`), Cloud Functions (`cloud_functions` `httpsCallable('fn').call(data)`), **App Check** (`firebase_app_check` — attestation with Play Integrity / App Attest so only your genuine app can call your backend).\n\n---\n\n## 18.4 Push notifications (FCM) 🔔\n\n### Concepts\n* **FCM** (Firebase Cloud Messaging) delivers to Android directly and to iOS via **APNs** (upload APNs auth key `.p8` to Firebase).\n* Message types:\n  * **Notification message** (`notification` payload): OS shows it automatically when app is in background/terminated.\n  * **Data message** (`data` only): delivered to your app code; you decide what to show (on iOS, data-only messages are delivered as \"silent/background\" pushes and are **throttled & not guaranteed**).\n* App states: **foreground**, **background**, **terminated** — each handled differently.\n\n### Code\n```dart\n@pragma('vm:entry-point')     // ❗ needed so the function isn't tree-shaken in release\nFuture\u003cvoid> _firebaseMessagingBackgroundHandler(RemoteMessage message) async {\n  await Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform); // runs in its own isolate\n  // light work only: e.g., update badge/local DB\n}\n\nFuture\u003cvoid> main() async {\n  WidgetsFlutterBinding.ensureInitialized();\n  await Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform);\n  FirebaseMessaging.onBackgroundMessage(_firebaseMessagingBackgroundHandler); // top-level function\n  runApp(const MyApp());\n}\n\nFuture\u003cvoid> setupPush() async {\n  final fm = FirebaseMessaging.instance;\n  final settings = await fm.requestPermission(alert: true, badge: true, sound: true); // iOS + Android 13+\n  if (settings.authorizationStatus == AuthorizationStatus.denied) return;\n\n  final token = await fm.getToken();          // send to your backend (associate with user)\n  fm.onTokenRefresh.listen(sendTokenToServer);  // tokens change! (reinstall, restore, clear data)\n\n  // Foreground messages: NOT shown automatically on Android → show with flutter_local_notifications\n  FirebaseMessaging.onMessage.listen((m) => localNotifications.show(m));\n  // iOS foreground presentation:\n  await fm.setForegroundNotificationPresentationOptions(alert: true, badge: true, sound: true);\n\n  // User tapped notification while app in background:\n  FirebaseMessaging.onMessageOpenedApp.listen((m) => router.go(m.data['route'] ?? '/'));\n  // App launched from terminated state by tapping a notification:\n  final initial = await fm.getInitialMessage();\n  if (initial != null) router.go(initial.data['route'] ?? '/');\n\n  await fm.subscribeToTopic('promotions');\n}\n```\n### Platform setup checklist\n* **Android 13+**: `POST_NOTIFICATIONS` runtime permission (requestPermission handles it). Create **notification channels** (Android 8+) — with `flutter_local_notifications` (importance levels, sound).\n* Default notification icon must be **white-on-transparent** (else shows a grey square) — set `com.google.firebase.messaging.default_notification_icon` meta-data.\n* **iOS**: enable Push Notifications + Background Modes (Remote notifications) capabilities; APNs key in Firebase; test on a **real device** (simulators support push in recent Xcode versions via `.apns` files / drag & drop, but end-to-end FCM delivery is best tested on device).\n* iOS rich notifications (images) need a **Notification Service Extension**.\n\n### Common push bugs\n| Bug | Fix |\n|---|---|\n| No notifications on iOS | APNs key missing/wrong team, capability missing, testing on simulator, provisioning profile without push |\n| Foreground notification doesn't appear (Android) | Expected — show via flutter_local_notifications |\n| Background handler not called in release | Missing `@pragma('vm:entry-point')`, handler not top-level |\n| Tap doesn't navigate on cold start | Handle `getInitialMessage` after router is ready |\n| Duplicate notifications | Both FCM notification payload and your local notification shown — use data messages or don't re-show |\n| Notifications stopped for some users | Stale tokens: update on `onTokenRefresh`; remove invalid tokens server-side (`UNREGISTERED` errors) |\n| Xiaomi/Oppo/etc. kill background app | OEM battery optimizations; ask users to whitelist; high-priority messages |\n\nLocal notifications & scheduling: `flutter_local_notifications` (with `timezone` for zoned schedules; Android 12+ exact alarms permission `SCHEDULE_EXACT_ALARM`/`USE_EXACT_ALARM` restrictions). Alternatives: OneSignal, Airship, AWS SNS/Pinpoint.\n\n---\n\n## 18.5 Crash reporting & analytics\n\n### Crashlytics\n```dart\nFlutterError.onError = FirebaseCrashlytics.instance.recordFlutterFatalError;\nPlatformDispatcher.instance.onError = (error, stack) {\n  FirebaseCrashlytics.instance.recordError(error, stack, fatal: true);\n  return true;\n};\nawait FirebaseCrashlytics.instance.setUserIdentifier(hashedUserId);  // no raw PII\nFirebaseCrashlytics.instance.log('Checkout started');                // breadcrumbs\nawait FirebaseCrashlytics.instance.setCrashlyticsCollectionEnabled(!kDebugMode);\n```\n* **Obfuscated builds** (`--obfuscate --split-debug-info=build/symbols`) → upload symbols (`firebase crashlytics:symbols:upload --app=\u003cid> build/symbols`) or stack traces are unreadable.\n* iOS: dSYM upload (Crashlytics run script). Android NDK: native symbols if needed.\n* Alternatives: **Sentry** (`sentry_flutter` — performance tracing, release health, breadcrumbs, session replay), Bugsnag, Datadog, Instabug.\n\n### Analytics\n```dart\nawait FirebaseAnalytics.instance.logEvent(name: 'add_to_cart', parameters: {'item_id': id, 'value': 499});\nawait FirebaseAnalytics.instance.logScreenView(screenName: 'Checkout');\n// GoRouter/Navigator: FirebaseAnalyticsObserver(analytics: FirebaseAnalytics.instance)\n```\nOrg practice: an `AnalyticsService` interface (so you can swap/multiplex providers: Firebase, Mixpanel, Amplitude, Segment), an **event taxonomy document** (naming conventions, required params), **consent** management (GDPR/ATT — iOS App Tracking Transparency prompt via `app_tracking_transparency` when tracking across apps).\n\n### Remote Config & A/B testing & feature flags\n```dart\nfinal rc = FirebaseRemoteConfig.instance;\nawait rc.setConfigSettings(RemoteConfigSettings(fetchTimeout: const Duration(seconds: 10), minimumFetchInterval: const Duration(hours: 1)));\nawait rc.setDefaults({'new_checkout_enabled': false, 'min_supported_version': '1.0.0'});\nawait rc.fetchAndActivate();\nfinal enabled = rc.getBool('new_checkout_enabled');\nrc.onConfigUpdated.listen((_) => rc.activate());   // real-time updates\n```\nUses: kill switches, gradual rollouts, **force update** (compare `min_supported_version` with `package_info_plus` version → show blocking update dialog / `in_app_update` on Android / App Store link on iOS). Alternatives: LaunchDarkly, Statsig, ConfigCat, Unleash.\n\nFirebase Performance Monitoring (`firebase_performance`), In-App Messaging, App Distribution (beta builds to testers), Test Lab (device farm).\n\n---\n\n## 18.6 Supabase & other BaaS\n`supabase_flutter`: Postgres + Row Level Security, Auth, Storage, Realtime, Edge Functions.\n```dart\nawait Supabase.initialize(url: url, anonKey: anonKey);   // anon key is public; RLS protects data\nfinal data = await Supabase.instance.client.from('todos').select().eq('done', false).order('created_at');\nSupabase.instance.client.from('todos').stream(primaryKey: ['id']).listen(...);\n```\nOthers: AWS Amplify, Appwrite, PocketBase, Parse, Back4App; Serverpod / Dart Frog (Dart backends).\n\n---\n\n## 18.7 Permissions (permission_handler)\n```dart\nfinal status = await Permission.camera.status;\nif (status.isDenied) {\n  final result = await Permission.camera.request();\n  if (result.isPermanentlyDenied) {\n    // Explain & send to settings\n    await openAppSettings();\n  }\n}\n// Others: Permission.location, locationAlways, photos, storage (legacy), notification, microphone, contacts, bluetoothScan…\n```\nRules:\n* **Declare** in AndroidManifest (`\u003cuses-permission>`) and Info.plist usage descriptions — else instant crash (iOS) or silent denial.\n* Ask **in context** (when the user taps \"Scan\"), with a **pre-permission explanation** screen — better grant rates and required by store policies.\n* Handle all states: granted, denied, permanently denied (Android \"don't ask again\" / iOS after first denial), restricted (parental controls), limited (iOS limited photo access), provisional (iOS notifications).\n* Android 13+: granular media permissions (`READ_MEDIA_IMAGES`, `READ_MEDIA_VIDEO`, ...); Android 14+ \"selected photos\" partial access; prefer the **Photo Picker** (`image_picker` uses it) which needs **no permission**.\n* Background location requires a separate permission + strong justification for Play/App Store review.\n* Remove unused permissions (plugins can merge permissions into your manifest — check the merged manifest; remove with `tools:node=\"remove\"`).\n\n---\n\n## 18.8 Device features & popular plugins (know what exists)\n\n| Need | Package(s) |\n|---|---|\n| Camera / photos | `image_picker`, `camera`, `image_cropper`, `photo_manager` |\n| Video | `video_player` (official), `chewie`, `media_kit`, `better_player_plus` |\n| Audio | `just_audio`, `audioplayers`, `audio_service` (background), `record` |\n| Location / geofencing | `geolocator`, `location`, `geocoding`, `flutter_background_geolocation` (commercial) |\n| Maps | `google_maps_flutter`, `flutter_map` (OpenStreetMap), `mapbox_maps_flutter`, Apple Maps (`apple_maps_flutter`) |\n| QR/Barcode | `mobile_scanner` |\n| Biometrics | `local_auth` |\n| In-app web | `webview_flutter` (official), `flutter_inappwebview` |\n| URLs / phone / email | `url_launcher` (add `\u003cqueries>` in Android manifest for intent visibility on Android 11+; `LSApplicationQueriesSchemes` on iOS for canLaunch) |\n| Share | `share_plus` |\n| Device info / app version | `device_info_plus`, `package_info_plus` |\n| Connectivity | `connectivity_plus` |\n| Sensors | `sensors_plus` |\n| Bluetooth | `flutter_blue_plus`, `flutter_reactive_ble` |\n| NFC | `nfc_manager` |\n| PDF | `pdf` + `printing`, `syncfusion_flutter_pdfviewer`, `pdfrx` |\n| Charts | `fl_chart`, `syncfusion_flutter_charts`, `graphic` |\n| Payments | `in_app_purchase` (official), RevenueCat `purchases_flutter`, Stripe `flutter_stripe`, Razorpay `razorpay_flutter`, `pay` (Google Pay/Apple Pay) |\n| Ads | `google_mobile_ads` |\n| Contacts / calendar | `flutter_contacts`, `device_calendar` |\n| Home widgets | `home_widget` (Android/iOS home screen widgets — native UI) |\n| On-device ML / AI | `google_mlkit_*`, `tflite_flutter`, Firebase AI Logic (`firebase_ai`), `google_generative_ai` (deprecated in favour of Firebase AI Logic) |\n| App review / update | `in_app_review`, `in_app_update`, `upgrader` |\n\n### Payments: policy knowledge (interviews ask!)\n* **Digital goods/subscriptions** consumed in the app (premium features, coins) → must use **Apple In-App Purchase / Google Play Billing** (store policies), with exceptions/regional changes (e.g., US court rulings in 2025 allowing external purchase links on iOS in the US, EU DMA alternatives, Google Play alternative billing in some regions). Know that rules changed and vary by region.\n* **Physical goods/services** (e-commerce, food delivery, rides) → normal payment gateways (Stripe, Razorpay, PayPal).\n* Always **verify purchases server-side** (receipts / Google Play Developer API / App Store Server API & notifications), handle pending/restored purchases, and `completePurchase` to avoid automatic refunds on Android (3 days un-acknowledged).\n\n---\n\n## 18.9 Background work\nFlutter apps can't run arbitrary Dart forever in the background on mobile; the OS controls it.\n| Need | Tool |\n|---|---|\n| Periodic/deferred work (sync, uploads) | `workmanager` (Android WorkManager; iOS BGTaskScheduler — iOS runs it opportunistically, not exact) |\n| Background fetch | `background_fetch` |\n| Long-running (music, navigation, tracking) | Foreground service (Android, with notification and **foreground service type** declarations required on Android 14+) — `flutter_foreground_task`; iOS background modes (audio, location) |\n| Large downloads/uploads | `background_downloader` (uses URLSession / WorkManager) |\n| Alarms | `android_alarm_manager_plus` (Android only) |\n| Push-triggered | FCM data/silent push → background handler |\n\nBackground Dart code runs in a **separate isolate** with a fresh memory space — re-initialize Firebase/DI there; annotate entry points with `@pragma('vm:entry-point')`.\n\n---\n\n## 18.10 Interview Questions — Integrations\n\n**Q1. How do push notifications work in Flutter?** FCM (via APNs on iOS) delivers messages; app requests permission, registers a token with backend; handle foreground (onMessage + local notification), background tap (onMessageOpenedApp), terminated tap (getInitialMessage), and background data handler (top-level, vm:entry-point).\n\n**Q2. Notification vs data messages?** Notification messages are displayed by the OS when app isn't in foreground; data messages are handled by app code (and are throttled on iOS when silent).\n\n**Q3. How do you secure Firestore?** Security Rules validating auth and data, App Check, least-privilege structure; client API keys aren't secrets.\n\n**Q4. How do you implement force update?** Remote config / backend minimum version vs package_info version → blocking dialog to store (in_app_update on Android).\n\n**Q5. How do you handle permissions properly?** Declare in manifests, request contextually with rationale, handle denied/permanently denied (open settings), use permissionless pickers when possible.\n\n**Q6. How do you report crashes in release?** Crashlytics/Sentry with FlutterError.onError + PlatformDispatcher.onError, upload symbols for obfuscated builds, breadcrumbs, user IDs (hashed).\n\n**Q7. What are the rules for in-app payments?** Digital content → store billing (IAP/Play Billing) with server-side verification; physical goods → regular payment gateways; regional rule variations exist.\n\n**Q8. How do you run tasks in the background?** workmanager/BGTaskScheduler for deferred tasks, foreground services for long-running work, push-triggered handlers; separate isolate with re-initialization.\n\n**Q9. Why does my background message handler not run in release?** It must be a top-level/static function annotated with `@pragma('vm:entry-point')` to survive tree shaking, and registered before runApp.\n\n**Q10. Firebase vs Supabase?** Firebase: NoSQL (Firestore), mature mobile SDKs, FCM, Crashlytics; Supabase: Postgres SQL with RLS, open-source, relational queries, realtime; choose based on data model and vendor needs.\n"}, {"n": 19, "file": "19-platform-integration.md", "title": "Chapter 19 — Talking to Native: Platform Channels, Pigeon, FFI, Plugins, Platform Views, Add-to-App & Web Interop", "subtitle": "Talking to Native: Platform Channels, Pigeon, FFI, Plugins, Platform Views, Add-to-App & Web Interop", "short": "Platform Integration", "sub": "Channels, Pigeon, FFI, plugins", "level": "intermediate", "minutes": 12, "qa": 11, "md": "# Chapter 19 — Talking to Native: Platform Channels, Pigeon, FFI, Plugins, Platform Views, Add-to-App & Web Interop\n\n> **Goal:** Call Kotlin/Swift/C/JS from Dart and back, write your own plugin, embed native views, and add Flutter into existing native apps. Senior interviews almost always include \"how would you access a native SDK that has no Flutter plugin?\"\n\n---\n\n## 19.1 5-year-old picture: walkie-talkies 📻\n\nDart lives in one house; Android (Kotlin) and iOS (Swift) live in neighbouring houses. They speak different languages. A **platform channel** is a **walkie-talkie** on a named frequency (`'com.myapp/battery'`). Dart says \"getBatteryLevel, over!\" and Kotlin answers \"87, over!\". Messages are translated into a common \"radio language\" by a **codec**.\n\n---\n\n## 19.2 Channel types\n\n| Channel | Direction | Use |\n|---|---|---|\n| `MethodChannel` | Dart ↔ Native, request/response (async) | Call a function and get a result |\n| `EventChannel` | Native → Dart stream | Sensors, location updates, connectivity changes |\n| `BasicMessageChannel` | Bidirectional messages with custom codec | Custom protocols, strings/JSON |\n\nAll channel calls are **asynchronous** and messages are serialized with a codec: `StandardMessageCodec` supports `null`, `bool`, `int`, `double`, `String`, `Uint8List`/`Int32List`/`Int64List`/`Float64List`, `List`, `Map` (nested). Custom objects must be converted (Map) or use Pigeon.\n\n| Dart | Kotlin | Swift |\n|---|---|---|\n| null | null | nil (NSNull when nested) |\n| bool | Boolean | NSNumber(value: Bool) |\n| int (≤32 bit) | Int | NSNumber(value: Int32) |\n| int (>32 bit) | Long | NSNumber(value: Int) |\n| double | Double | NSNumber(value: Double) |\n| String | String | String |\n| Uint8List | ByteArray | FlutterStandardTypedData(bytes:) |\n| List | List | Array |\n| Map | HashMap | Dictionary |\n\n---\n\n## 19.3 MethodChannel example: battery level\n\n**Dart**\n```dart\nclass BatteryService {\n  static const _channel = MethodChannel('com.mycompany.app/battery');\n\n  Future\u003cint?> getBatteryLevel() async {\n    try {\n      return await _channel.invokeMethod\u003cint>('getBatteryLevel');\n    } on PlatformException catch (e) {     // native returned an error\n      debugPrint('Failed: ${e.code} ${e.message}');\n      return null;\n    } on MissingPluginException {          // no handler registered on this platform (e.g., web, or forgot registration)\n      return null;\n    }\n  }\n}\n```\n\n**Android (Kotlin) — `MainActivity.kt`**\n```kotlin\nclass MainActivity : FlutterActivity() {\n    private val CHANNEL = \"com.mycompany.app/battery\"\n\n    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {\n        super.configureFlutterEngine(flutterEngine)\n        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->\n            when (call.method) {\n                \"getBatteryLevel\" -> {\n                    val level = getBatteryLevel()\n                    if (level != -1) result.success(level)\n                    else result.error(\"UNAVAILABLE\", \"Battery level not available.\", null)\n                }\n                else -> result.notImplemented()\n            }\n        }\n    }\n\n    private fun getBatteryLevel(): Int {\n        val bm = getSystemService(BATTERY_SERVICE) as BatteryManager\n        return bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)\n    }\n}\n```\n\n**iOS (Swift) — `AppDelegate.swift`**\n```swift\n@main\n@objc class AppDelegate: FlutterAppDelegate {\n  override func application(_ application: UIApplication,\n                            didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {\n    let controller = window?.rootViewController as! FlutterViewController\n    let channel = FlutterMethodChannel(name: \"com.mycompany.app/battery\",\n                                       binaryMessenger: controller.binaryMessenger)\n    channel.setMethodCallHandler { call, result in\n      guard call.method == \"getBatteryLevel\" else { result(FlutterMethodNotImplemented); return }\n      UIDevice.current.isBatteryMonitoringEnabled = true\n      let level = UIDevice.current.batteryLevel\n      if level \u003c 0 {\n        result(FlutterError(code: \"UNAVAILABLE\", message: \"Battery level not available.\", details: nil))\n      } else {\n        result(Int(level * 100))\n      }\n    }\n    GeneratedPluginRegistrant.register(with: self)\n    return super.application(application, didFinishLaunchingWithOptions: launchOptions)\n  }\n}\n```\n> Note: newer Flutter iOS templates adopt the **UIScene** lifecycle and implicit engine registration (`FlutterImplicitEngineDelegate` / registering in `didInitializeImplicitFlutterEngine`) — follow the migration guide for your Flutter version when the template differs. The channel concepts are identical.\n\n### Rules\n* **Always** reply exactly once: `result.success`, `result.error`, or `result.notImplemented` — never twice (crash: \"Reply already submitted\"), never zero (Dart future hangs forever).\n* Native handlers run on the **platform main thread** by default — don't block it; dispatch heavy work to a background thread and reply on the main thread (iOS: `DispatchQueue.main.async { result(...) }`; Android: post to main looper). (Android/iOS also support background **task queues** for channels: `binaryMessenger.makeBackgroundTaskQueue()`.)\n* Dart → native calls must originate from the root isolate unless using `BackgroundIsolateBinaryMessenger`.\n* Native → Dart calls: `channel.invokeMethod(\"onEvent\", args)` on native; Dart side `channel.setMethodCallHandler((call) async { ... })`.\n\n---\n\n## 19.4 EventChannel example (native → Dart stream)\n\n**Dart**\n```dart\nconst _events = EventChannel('com.mycompany.app/charging');\nStream\u003cString> get chargingStatus => _events.receiveBroadcastStream().map((e) => e as String);\n```\n**Kotlin**\n```kotlin\nEventChannel(flutterEngine.dartExecutor.binaryMessenger, \"com.mycompany.app/charging\")\n  .setStreamHandler(object : EventChannel.StreamHandler {\n      private var receiver: BroadcastReceiver? = null\n      override fun onListen(arguments: Any?, events: EventChannel.EventSink) {\n          receiver = object : BroadcastReceiver() {\n              override fun onReceive(context: Context, intent: Intent) {\n                  val status = intent.getIntExtra(BatteryManager.EXTRA_STATUS, -1)\n                  events.success(if (status == BatteryManager.BATTERY_STATUS_CHARGING) \"charging\" else \"discharging\")\n              }\n          }\n          registerReceiver(receiver, IntentFilter(Intent.ACTION_BATTERY_CHANGED))\n      }\n      override fun onCancel(arguments: Any?) {   // Dart cancelled subscription → clean up!\n          unregisterReceiver(receiver); receiver = null\n      }\n  })\n```\n\n---\n\n## 19.5 Pigeon — type-safe channels (recommended) 🕊️\n\nHand-written channels use stringly-typed method names and maps → runtime errors. **Pigeon** (official) generates type-safe Dart, Kotlin/Java, Swift/ObjC, C++ (Windows), GObject (Linux) code from a Dart interface definition.\n\n`pigeons/messages.dart`:\n```dart\nimport 'package:pigeon/pigeon.dart';\n\n@ConfigurePigeon(PigeonOptions(\n  dartOut: 'lib/src/messages.g.dart',\n  kotlinOut: 'android/app/src/main/kotlin/com/mycompany/app/Messages.g.kt',\n  kotlinOptions: KotlinOptions(package: 'com.mycompany.app'),\n  swiftOut: 'ios/Runner/Messages.g.swift',\n))\n\nclass DeviceInfo {\n  DeviceInfo({required this.model, required this.osVersion, this.batteryLevel});\n  String model;\n  String osVersion;\n  int? batteryLevel;\n}\n\n@HostApi()                          // Dart calls native\nabstract class DeviceApi {\n  DeviceInfo getDeviceInfo();\n  @async\n  bool requestPermission(String name);\n}\n\n@FlutterApi()                       // native calls Dart\nabstract class DeviceEventsApi {\n  void onLowBattery(int level);\n}\n```\nRun: `dart run pigeon --input pigeons/messages.dart`. Then implement the generated `DeviceApi` interface in Kotlin/Swift and register with `DeviceApi.setUp(binaryMessenger, impl)`. In Dart: `final info = await DeviceApi().getDeviceInfo();` — fully typed. Pigeon also supports event channels (`@EventChannelApi`) in newer versions.\n\n---\n\n## 19.6 Dart FFI — calling C directly ⚡\n\n**FFI (Foreign Function Interface)** calls C-ABI functions **synchronously**, with no message serialization — much faster than channels for compute-heavy native libraries (image processing, crypto, SQLite, ML runtimes, audio DSP, Rust libs).\n\n```c\n// native/add.c\n#include \u003cstdint.h>\nint32_t add(int32_t a, int32_t b) { return a + b; }\n```\n```dart\nimport 'dart:ffi';\nimport 'dart:io';\n\ntypedef AddNative = Int32 Function(Int32 a, Int32 b);\ntypedef AddDart = int Function(int a, int b);\n\nfinal DynamicLibrary lib = Platform.isAndroid\n    ? DynamicLibrary.open('libadd.so')\n    : DynamicLibrary.process();          // iOS: statically linked\n\nfinal add = lib.lookupFunction\u003cAddNative, AddDart>('add');\nprint(add(2, 3)); // 5\n```\n* Memory: `package:ffi` → `calloc`/`malloc`, `toNativeUtf8()`, **free manually** (`calloc.free(ptr)`) or use `Arena`/`using`. Native finalizers (`NativeFinalizer`) for cleanup.\n* `@Native` annotations (Dart 3.x) for static binding resolution with **native assets / build hooks** (`hook/build.dart`, stable in Dart 3.10 / Flutter 3.38) — packages can compile and bundle native code automatically (C via `native_toolchain_c`, Rust via community tooling).\n* **ffigen** generates bindings from C headers; **jnigen** generates Dart bindings for Java/Kotlin (Android) via JNI; **Objective-C/Swift** interop via ffigen (Objective-C bindings; Swift via `@objc` / swiftgen tooling). This \"direct native interop\" is the Flutter team's long-term direction to reduce channel boilerplate; combined with the merged UI/platform thread it enables synchronous calls to platform APIs.\n* `flutter create --template=plugin_ffi` / `package_ffi` templates.\n* Long-running native calls block the calling isolate → call from a helper isolate.\n* Rust: `flutter_rust_bridge` generates high-level bindings (async, structs, streams) — popular for crypto/heavy logic.\n\n### Channels vs FFI\n| | Platform channels / Pigeon | FFI |\n|---|---|---|\n| Target | Platform APIs in Kotlin/Java/Swift/ObjC | C ABI (C, C++ via extern \"C\", Rust, Go via cgo) — and via jnigen/ffigen, Java/ObjC |\n| Sync? | Async only | Sync (and async callbacks via NativeCallable) |\n| Overhead | Serialization + thread hop | Very low |\n| Use | Camera SDKs, payment SDKs, OS services | Compute libraries, DBs, codecs |\n\n---\n\n## 19.7 Writing a plugin 🔌\n\n```bash\nflutter create --template=plugin --platforms=android,ios,web --org com.mycompany my_scanner\n```\nStructure:\n```\nmy_scanner/\n├── lib/my_scanner.dart                       # public Dart API\n├── lib/my_scanner_platform_interface.dart    # abstract PlatformInterface (federated style)\n├── lib/my_scanner_method_channel.dart        # default MethodChannel implementation\n├── android/src/main/kotlin/.../MyScannerPlugin.kt  # implements FlutterPlugin, MethodCallHandler, (ActivityAware)\n├── ios/Classes/MyScannerPlugin.swift         # (or ios/my_scanner/Sources/... for SwiftPM)\n├── example/                                  # example app (also used for integration tests)\n└── pubspec.yaml  →  flutter: plugin: platforms: android: package/pluginClass, ios: pluginClass ...\n```\nAndroid plugin essentials:\n* `FlutterPlugin.onAttachedToEngine` / `onDetachedFromEngine` (register/unregister channels).\n* Need an `Activity` (permissions, startActivityForResult, UI)? Implement `ActivityAware` (`onAttachedToActivity`, `onDetachedFromActivityForConfigChanges`, ...) and `PluginRegistry.ActivityResultListener` / `RequestPermissionsResultListener`.\n* Android V1 embedding (`Registrar`) is **removed** — old plugins using it don't compile with current Flutter (\"No registrar\"/\"v1 embedding\" errors). Update or fork.\n\niOS plugin: `FlutterPlugin` protocol, `register(with registrar:)`, `addApplicationDelegate` for app lifecycle events, Swift Package Manager support (`Package.swift`) + CocoaPods `.podspec`.\n\n### Federated plugins\nSplit one plugin into packages: `my_scanner` (app-facing), `my_scanner_platform_interface` (abstract interface using `plugin_platform_interface` with token verification), `my_scanner_android`, `my_scanner_ios`, `my_scanner_web`, ... Benefits: different teams/maintainers per platform, add platforms without touching the core, endorsed implementations (`default_package` in pubspec). Used by official plugins (url_launcher, shared_preferences, camera…).\n\n### Testing plugins\n* Dart side: mock the channel:\n```dart\nTestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger\n    .setMockMethodCallHandler(const MethodChannel('com.mycompany.app/battery'), (call) async {\n  if (call.method == 'getBatteryLevel') return 42;\n  return null;\n});\n```\n* Or set `MyScannerPlatform.instance = FakePlatform();` (platform interface pattern).\n* Native unit tests (JUnit / XCTest) in the example app; integration tests in `example/integration_test`.\n\n---\n\n## 19.8 Platform views — embedding native UI 🪟\n\nWhen you need a **native view** inside Flutter (Google Maps, WebView, native ad views, a native video player/AR SDK):\n* Android: `AndroidView` / `PlatformViewLink` with modes:\n  * **Hybrid Composition (HC)** — native view added to the Android view hierarchy; best fidelity (accessibility, text input), but historically reduced Flutter performance / thread synchronization costs.\n  * **Texture Layer Hybrid Composition (TLHC)** — renders native view into a texture; better Flutter performance; some views (SurfaceView-based) have issues.\n  * **Virtual Display** (legacy fallback).\n  * Newer Flutter versions (3.44) introduced an improved **\"Hybrid Composition++\"** mode for Android (requires Vulkan-capable devices) — check docs for status.\n* iOS: `UiKitView` (native views composited with Flutter; costs extra layers — avoid many overlapping).\n* macOS: `AppKitView`; Web: `HtmlElementView` (with `ui_web.platformViewRegistry.registerViewFactory`).\n\nCosts: more memory, possible jank when scrolling many platform views, gesture conflicts (`gestureRecognizers: {Factory(() => EagerGestureRecognizer())}` to give the native view gestures inside scrollables), keyboard issues. Keep their number small; avoid platform views in long lists.\n\n---\n\n## 19.9 Add-to-App (Flutter inside an existing native app)\n\nLarge companies (e.g., banks, e-commerce) often adopt Flutter **incrementally**:\n```bash\nflutter create -t module my_flutter_module\n```\n* Android: include the module as a source dependency in `settings.gradle` or as AAR (`flutter build aar`); start with `FlutterActivity.withCachedEngine(\"engine_id\")`, `FlutterFragment`, or `FlutterView`.\n* iOS: embed via CocoaPods (`install_all_flutter_pods`) or frameworks (`flutter build ios-framework`); present `FlutterViewController(engine:)`.\n* **Pre-warm & cache** `FlutterEngine` to avoid startup delay (engine startup takes time and memory). Use `FlutterEngineGroup` to create multiple lightweight engines sharing resources (multiple Flutter screens).\n* Entry points: run a specific Dart function (`@pragma('vm:entry-point') void featureMain()`) and initial route.\n* Communication with host via platform channels/Pigeon.\n* Limitations/gotchas: multiple Flutter instances memory, plugin registration per engine, hot reload via `flutter attach`, consistent theming, back navigation between native/Flutter stacks.\n\n---\n\n## 19.10 Web interop (JS)\n\nModern way: **`dart:js_interop`** + **`package:web`** (replacing old `dart:html`, `dart:js`, `package:js`, which are deprecated and **don't work with Wasm**).\n```dart\nimport 'dart:js_interop';\nimport 'package:web/web.dart' as web;\n\n@JS('alert')\nexternal void jsAlert(JSString message);\n\n@JS('JSON.stringify')\nexternal JSString stringify(JSAny? obj);\n\nextension type Analytics._(JSObject _) implements JSObject {\n  external void track(JSString event);\n}\n@JS('window.analytics')\nexternal Analytics get analytics;\n\nvoid demo() {\n  jsAlert('Hello from Dart'.toJS);\n  analytics.track('signup'.toJS);\n  web.window.localStorage.setItem('k', 'v');\n}\n```\nConditional imports keep mobile code free of web libraries (Chapter 3).\n\n---\n\n## 19.11 Platform detection\n```dart\nimport 'package:flutter/foundation.dart';\nif (kIsWeb) { ... }\nswitch (defaultTargetPlatform) {          // works on web too (reports underlying OS)\n  case TargetPlatform.android: ...\n  case TargetPlatform.iOS: ...\n  default: ...\n}\n// dart:io Platform.isAndroid — ❌ crashes on web; guard with kIsWeb first\nTheme.of(context).platform                // overridable in tests/theme\n```\n\n---\n\n## 19.12 Common native integration bugs\n| Error | Cause / Fix |\n|---|---|\n| `MissingPluginException(No implementation found for method X on channel Y)` | Hot reload after adding plugin (do a full rebuild); channel name mismatch; plugin doesn't support platform; native registration missing (custom engine/add-to-app without `GeneratedPluginRegistrant`); background isolate |\n| `PlatformException(...)` | Native returned error — read code/message; handle in Dart |\n| Future never completes | Native handler never called `result` |\n| `Reply already submitted` crash | result called twice |\n| App crashes calling UI API from background thread | Reply/UI on main thread |\n| `Unhandled Exception: type '_Map\u003cObject?, Object?>' is not a subtype of type 'Map\u003cString, dynamic>'` | Channel maps are `Map\u003cObject?, Object?>` → `Map\u003cString, dynamic>.from(result)` or `.cast\u003cString, dynamic>()` (nested maps too!) |\n| Release build: native class not found | R8/ProGuard stripped it → add `-keep` rules |\n| iOS: plugin not found | `pod install` not run / SwiftPM issue / min iOS version |\n| Plugin uses v1 embedding | Upgrade plugin/fork |\n| FFI `Failed to lookup symbol` | Wrong lib name, symbol mangled (C++ needs `extern \"C\"`), library not bundled for ABI, iOS symbol stripped (`-Wl,-u` / mark as used) |\n\n---\n\n## 19.13 Interview Questions — Platform integration\n\n**Q1. What are platform channels?** Named asynchronous message channels between Dart and host platform code using codecs; MethodChannel (RPC), EventChannel (streams), BasicMessageChannel (messages).\n\n**Q2. How would you use a native SDK without a Flutter plugin?** Write a plugin or in-app channel code (preferably Pigeon) wrapping the SDK in Kotlin/Swift, expose a Dart API, handle lifecycle/threading/errors, test on both platforms; or FFI if it's a C library; or jnigen/ffigen for direct bindings.\n\n**Q3. What is Pigeon?** A code generator producing type-safe channel code for Dart and native languages from a Dart interface definition.\n\n**Q4. What is Dart FFI and when would you use it?** Direct synchronous calls into C-ABI libraries with minimal overhead — compute-heavy or existing native libraries.\n\n**Q5. MethodChannel vs EventChannel?** Request/response vs continuous native→Dart event stream.\n\n**Q6. What is a federated plugin?** A plugin split into app-facing, platform-interface and per-platform implementation packages.\n\n**Q7. What are platform views and their costs?** Embedding native views in the Flutter tree (AndroidView/UiKitView/HtmlElementView); costs in performance, memory, composition and gestures.\n\n**Q8. What is add-to-app?** Integrating Flutter modules into existing native apps; uses cached/pre-warmed FlutterEngines and channels for communication.\n\n**Q9. Which thread do platform channel handlers run on?** The platform main thread by default (background task queues are available); responses should be sent on the main thread.\n\n**Q10. How do you call JS from Flutter web?** `dart:js_interop` with `@JS` external declarations and extension types; `package:web` for DOM APIs.\n\n**Q11. Why does `MissingPluginException` happen?** No registered native implementation for that channel on the current engine/platform — commonly after hot reload of a newly added plugin, in tests, unsupported platform, or wrong channel name.\n"}, {"n": 20, "file": "20-flutter-internals.md", "title": "Chapter 20 — Flutter Internals: Bindings, the Frame Pipeline, Build/Layout/Paint/Composite, Layers, Impeller, the Dart VM & Hot Reload", "subtitle": "Flutter Internals: Bindings, the Frame Pipeline, Build/Layout/Paint/Composite, Layers, Impeller, the Dart VM & Hot Reload", "short": "Flutter Internals", "sub": "Frame pipeline, Impeller, Dart VM", "level": "advanced", "minutes": 13, "qa": 12, "md": "# Chapter 20 — Flutter Internals: Bindings, the Frame Pipeline, Build/Layout/Paint/Composite, Layers, Impeller, the Dart VM & Hot Reload\n\n> **Goal:** Know how Flutter works *under the hood*. This is what distinguishes a senior/lead candidate, and it's what lets you debug \"impossible\" bugs and performance problems.\n\n---\n\n## 20.1 The bindings — glue between framework and engine\n\n`WidgetsFlutterBinding` is a singleton mixing in several bindings:\n\n| Binding | Responsibility |\n|---|---|\n| `BindingBase` | Base, service extensions |\n| `GestureBinding` | Receives pointer events from the engine, hit tests, dispatches, runs gesture arena |\n| `SchedulerBinding` | Frame scheduling: transient callbacks (animations/Tickers), persistent callbacks (rendering pipeline), post-frame callbacks; task priorities |\n| `ServicesBinding` | Platform messages (channels), lifecycle, keyboard, system chrome |\n| `PaintingBinding` | Image cache, shader warm-up (legacy), font loading |\n| `SemanticsBinding` | Accessibility |\n| `RendererBinding` | Owns the `PipelineOwner` & render views (root of RenderObject tree), drives layout/paint/composite |\n| `WidgetsBinding` | Owns the `BuildOwner` (element tree builds), lifecycle observers, routes from platform |\n\n`runApp(widget)` → `WidgetsFlutterBinding.ensureInitialized()` → attaches root widget (`View` → `RawView`… with the `RenderView` root) → `scheduleWarmUpFrame()`.\n\nMulti-view: since Flutter 3.x the binding supports **multiple views** (`PlatformDispatcher.views`, `View` widget, `runWidget`) — used for multi-window desktop (in progress) and web embedding into multiple DOM elements.\n\n---\n\n## 20.2 The life of a frame 🎞️\n\n```\nVSync signal from OS (e.g., every 16.67ms @60Hz / 8.33ms @120Hz)\n        │\n        ▼\nEngine calls PlatformDispatcher.onBeginFrame ──► SchedulerBinding.handleBeginFrame\n        │   ① Transient callbacks: Tickers → AnimationControllers update values\n        │      (listeners mark widgets dirty / render objects needsPaint)\n        ▼\nMicrotasks run (between beginFrame and drawFrame)\n        ▼\nEngine calls onDrawFrame ──► SchedulerBinding.handleDrawFrame\n        │   ② Persistent callbacks → WidgetsBinding.drawFrame():\n        │        a. BUILD   — buildOwner.buildScope(): rebuild dirty elements\n        │        b. LAYOUT  — pipelineOwner.flushLayout()\n        │        c. COMPOSITING BITS — pipelineOwner.flushCompositingBits()\n        │        d. PAINT   — pipelineOwner.flushPaint()  (records into layers/pictures)\n        │        e. COMPOSITE — renderView.compositeFrame(): build Scene from layer tree → engine\n        │        f. SEMANTICS — pipelineOwner.flushSemantics()\n        │        g. FINALIZE TREE — buildOwner.finalizeTree(): unmount inactive elements (dispose)\n        │   ③ Post-frame callbacks (addPostFrameCallback)\n        ▼\nUI thread done (must be \u003c frame budget)\n        ▼\nRASTER THREAD: Scene/LayerTree → Impeller (or Skia) → GPU commands → present\n(must ALSO be \u003c frame budget; runs in parallel with the next frame's UI work)\n```\nKey insights:\n* **Two budgets**: UI thread work (build/layout/paint recording) and raster thread work (GPU rasterization) each must fit in ~16ms (60 fps) or ~8ms (120 fps). DevTools shows both bars. Red UI bar → expensive Dart code; red raster bar → expensive drawing (saveLayer, blur, clipping, huge images, too many layers).\n* Flutter doesn't draw continuously — **frames are only scheduled when something changes** (`scheduleFrame` from setState, animations, etc.). Idle apps use no CPU.\n* `addPostFrameCallback` runs after the frame is laid out & painted — safe to measure sizes or show dialogs after first build.\n* `SchedulerBinding.instance.schedulerPhase` tells you where you are; calling `setState` during the build phase (except for descendants being built later) triggers the \"setState during build\" assertion.\n\n---\n\n## 20.3 Build phase in detail\n\n* `BuildOwner` maintains a **dirty list** of elements (from `markNeedsBuild`).\n* `buildScope` sorts dirty elements by **depth** (parents first) and calls `rebuild()` on each → `performRebuild()` → `build()` → `updateChild` for its children (reconciliation, Chapter 6).\n* An element rebuilt by its parent in this pass is removed from the dirty list (no double build).\n* Inactive elements (removed this frame) are kept in `_InactiveElements` and either **reactivated** (GlobalKey reparenting) or **unmounted** at `finalizeTree` (→ `State.dispose`).\n* **GlobalKey lookups** use a registry in BuildOwner.\n* `InheritedElement` keeps a set of dependents; when updated and `updateShouldNotify` is true → `didChangeDependencies` + mark dependents dirty.\n* Each element has `_inheritedElements` (a persistent hash map) → `dependOnInheritedWidgetOfExactType` is O(1).\n\n### Element types\n* `ComponentElement` (`StatelessElement`, `StatefulElement`, `ProxyElement` → `InheritedElement`, `ParentDataElement`).\n* `RenderObjectElement` (`LeafRenderObjectElement`, `SingleChildRenderObjectElement`, `MultiChildRenderObjectElement`, `RootRenderObjectElement`), slivers too.\n* `RenderObjectElement.mount` → `widget.createRenderObject(this)` and attaches to the nearest ancestor RenderObjectElement's render object (`insertRenderObjectChild`).\n* On update → `widget.updateRenderObject(this, renderObject)` (setters call markNeedsLayout/Paint only if values changed).\n\n---\n\n## 20.4 Layout phase in detail\n\n* `PipelineOwner._nodesNeedingLayout`: render objects marked by `markNeedsLayout()`.\n* `markNeedsLayout` walks **up** to the nearest **relayout boundary** and marks it; only boundaries are queued.\n* A render object is a **relayout boundary** if: `!parentUsesSize` OR `sizedByParent` OR constraints are **tight** OR parent isn't a RenderObject. Then its size can't change due to child changes from the parent's point of view.\n* `flushLayout` sorts by depth and calls `_layoutWithoutResize` → `performLayout()`.\n* `layout(constraints, parentUsesSize:)` skips work if constraints unchanged and not dirty (**caching**).\n* **Single-pass layout**: each render object is laid out at most once per frame in normal cases → O(N). Exceptions: **intrinsic** queries (`getMinIntrinsicWidth`, used by `IntrinsicHeight/Width`, `Table`) do speculative extra passes → potentially O(N²); `LayoutBuilder` delays building children to layout time; **dry layout** (`computeDryLayout`) computes size without side effects.\n* Box protocol: `BoxConstraints` → `Size`. Sliver protocol: `SliverConstraints` (scrollOffset, remainingPaintExtent, overlap, axis direction, cacheOrigin…) → `SliverGeometry` (scrollExtent, paintExtent, layoutExtent, maxPaintExtent, hitTestExtent, hasVisualOverflow…).\n* Debug flags: `debugPrintMarkNeedsLayoutStacks`, `debugProfileLayoutsEnabled` (shows layout events in timeline).\n\n---\n\n## 20.5 Paint & compositing\n\n* `markNeedsPaint()` walks up to the nearest **repaint boundary** (`isRepaintBoundary == true`) and schedules it.\n* Each repaint boundary has its own **`OffsetLayer`**; painting records drawing commands into a `PictureRecorder` → `Picture` stored in a `PictureLayer`.\n* Painting doesn't rasterize! It **records** commands (display list). Rasterization happens on the raster thread.\n* **Layer tree**: `ContainerLayer`, `OffsetLayer`, `PictureLayer`, `OpacityLayer`, `ClipRectLayer`/`ClipRRectLayer`/`ClipPathLayer`, `TransformLayer`, `ColorFilterLayer`, `ImageFilterLayer`, `BackdropFilterLayer`, `ShaderMaskLayer`, `TextureLayer` (video/camera), `PlatformViewLayer`, `LeaderLayer`/`FollowerLayer`, `AnnotatedRegionLayer`.\n* `needsCompositing` bits: some effects (opacity on a repaint boundary subtree, platform views, textures) need separate layers; `flushCompositingBits` computes them.\n* `compositeFrame` → `SceneBuilder` builds a `Scene` from the layer tree → `FlutterView.render(scene)` hands it to the engine.\n* Retained layers: a repaint boundary that didn't change **reuses its previous layer** (no re-recording) — this is why `RepaintBoundary` helps for frequently-changing subtrees (e.g., an animated spinner over a static page) and for static complex subtrees next to changing ones.\n* The engine may also **cache rasterized layers** (raster cache in Skia; Impeller has different caching strategies).\n* **`saveLayer`** forces an offscreen buffer — expensive (Opacity on complex children historically, `ShaderMask`, `ColorFilter`, some clips with antiAliasWithSaveLayer, `BackdropFilter`). DevTools \"Highlight oversized images\" / \"checkerboard offscreen layers\" (`checkerboardOffscreenLayers: true`) help find them.\n\n### RepaintBoundary trade-off\nEach boundary = extra layer (memory, compositing). Use when a subtree repaints often and independently. Flutter already adds them for list items (`addRepaintBoundaries`), routes, scroll views etc. DevTools \"Highlight repaints\" (rainbow borders) shows what repaints.\n\n---\n\n## 20.6 The rendering backends: Skia & Impeller 🖌️\n\n### Skia (historic default)\n* Google's 2D graphics library (also used by Chrome, Android).\n* Problem: **runtime shader compilation**. The first time an effect (e.g., a particular blur/gradient/clip combo) is drawn, Skia generates & compiles GPU shaders on the raster thread → long first-frame stutter = **\"shader compilation jank\"**, notably on iOS/Metal.\n* Mitigation was **SkSL warm-up**: run app with `--cache-sksl`, press `M` to save shaders, bundle with `--bundle-sksl-path` — device/driver-specific & brittle. (No longer relevant with Impeller.)\n\n### Impeller (current default on mobile)\n* Built by the Flutter team specifically for Flutter.\n* **All shaders compiled ahead of time** at engine build time (a fixed, smaller set of shader variants) → **no runtime shader compilation jank**.\n* Uses modern APIs: **Metal** (iOS/macOS), **Vulkan** (Android; falls back to **OpenGL ES** on devices without good Vulkan support).\n* Predictable performance, tessellation of paths on GPU/CPU, designed for concurrency, easier to profile.\n* Timeline:\n  * iOS: default since **Flutter 3.10** (May 2023); Skia opt-out **removed in 3.29**.\n  * Android: default on API 29+ since **Flutter 3.27**; older devices/drivers fall back (to OpenGL ES Impeller backend or Skia depending on version/device).\n  * macOS/desktop: preview, becoming default progressively (Flutter 3.47 makes Impeller the desktop default per release notes).\n  * Web: uses CanvasKit (Skia compiled to WebAssembly) or **skwasm** (with Wasm builds); Impeller-on-web work is ongoing.\n* Opt-out on Android (while allowed): `flutter run --no-enable-impeller` or manifest meta-data `io.flutter.embedding.android.EnableImpeller` = false. (Some SDKs/plugins historically forced this off — and newer Flutter versions are removing Skia on modern Android entirely, so check your version.)\n\n---\n\n## 20.7 Threads & runners (recap with depth)\n\n* **Platform runner** — main OS thread.\n* **UI runner** — root isolate Dart code. Since Flutter 3.29 (Android/iOS) the UI and platform threads are **merged** by default (Dart runs on the platform main thread), enabling synchronous native interop. Conceptually, \"UI thread\" work is still separate from raster work.\n* **Raster runner** — rasterization via Impeller/Skia.\n* **IO runner** — image decoding, asset loading, GPU uploads.\n* Dart `Isolate`s you spawn get their own OS threads from a thread pool.\n\n---\n\n## 20.8 The Dart VM, compilation & memory\n\n### Compilation pipeline\n* **Debug (native)**: Dart source → **kernel** (`.dill`, intermediate representation produced by the CFE — Common Front End) → run in VM with **JIT** compiler; incremental compilation enables hot reload.\n* **Profile/Release (native)**: kernel → **AOT compiler** (gen_snapshot) → native machine code snapshot (`libapp.so` on Android, `App.framework` on iOS). The release engine (`libflutter.so`/`Flutter.framework`) contains a precompiled runtime (no JIT — iOS forbids JIT anyway).\n* **Web**: `dartdevc` (debug, modular JS), `dart2js` (release, optimized JS), `dart2wasm` (WasmGC). \n* **Tree shaking**: removes unused classes/methods in AOT and dart2js; also icon font subsetting.\n* **Obfuscation** (`--obfuscate --split-debug-info=\u003cdir>`): renames symbols, reducing reverse engineering ease; symbol map needed to de-obfuscate stack traces (`flutter symbolize`).\n\n### Memory management & garbage collection\n* Dart uses a **generational GC**:\n  * **New space (young generation)**: a **semi-space scavenger** (copying collector) — very fast for short-lived objects (most widgets!). Live objects are copied between two halves; dead ones are just abandoned.\n  * **Old space**: **concurrent mark-sweep** (with compaction when needed) for long-lived objects (elements, render objects, state, caches).\n* GC runs per isolate group; Flutter engine can schedule GCs at idle times between frames (`notifyIdle`) to avoid jank.\n* **Memory leaks in Dart** = objects still reachable unintentionally: listeners not removed, stream subscriptions not cancelled, controllers not disposed, static/global caches growing, closures capturing `BuildContext`/State, timers. GC can't collect reachable objects.\n* Tools: DevTools Memory view (heap snapshots, diff, allocation tracing), `leak_tracker` package (Flutter's own tests use it; can be enabled in widget tests via `LeakTesting`).\n* Images are the biggest memory consumers — decoded bitmaps live in native memory (ImageCache holds `ui.Image` handles).\n\n### Snapshot & startup\nApp startup = native launch → engine init → Dart VM/isolate start → load AOT snapshot → `main()` → first frame. Measure with `flutter run --trace-startup --profile` (writes `start_up_info.json`: time to first frame). Optimize: defer heavy init, lazy-load features, avoid big synchronous work before `runApp`, use deferred components (Android dynamic feature modules) / deferred imports (web).\n\n---\n\n## 20.9 How hot reload actually works 🔥\n1. You save a file; the Flutter tool's **frontend server** incrementally recompiles **changed libraries** into a kernel diff.\n2. The diff is sent to the running Dart VM via the **VM Service** protocol.\n3. The VM **reloads** the libraries: replaces class/function definitions **in place**, keeping the heap (all existing objects/state stay alive). Field layouts are updated; existing instances keep values.\n4. Flutter calls `reassemble()` on the tree and schedules a full rebuild of all widgets (`build` methods rerun with new code).\n5. Because `main()`/`initState` aren't re-run and static fields keep values, those changes aren't reflected (Chapter 1 list).\n\nHot reload is only possible with JIT (debug). On web, hot reload became supported (Flutter 3.32 experimental, stable/default in 3.35–3.38) via DDC's new module system.\nHot restart: recompiles and restarts the root isolate (Dart state lost) without rebuilding native code.\n\n---\n\n## 20.10 Text rendering pipeline (brief)\n`Text` → `RichText` → `RenderParagraph` → `TextPainter` → `dart:ui ParagraphBuilder` → engine (SkParagraph/libtxt, HarfBuzz shaping, ICU line breaking, font fallback) → glyph runs drawn via Impeller/Skia text renderer. Text layout can be expensive: avoid re-laying out large text unnecessarily; `TextPainter` should be cached in custom painters.\n\n---\n\n## 20.11 Platform channels internals\n`MethodChannel.invokeMethod` → codec encodes to `ByteData` → `BinaryMessenger.send` → `PlatformDispatcher.sendPlatformMessage` → engine → platform runner → embedder's `BinaryMessenger` → handler → reply bytes back through the same path → completes Dart Future. Thread hops are why channels are slower than FFI.\n\n---\n\n## 20.12 Web rendering\n* **CanvasKit** renderer: Skia compiled to WebAssembly drawing into `\u003ccanvas>` (WebGL) — consistent with mobile, ~1.5MB+ download.\n* **skwasm**: used when building with `--wasm` (requires WasmGC support — Chromium-based browsers 119+ and Firefox 120+; Safari/WebKit support has lagged because of engine bugs, so check the current Flutter web docs); faster startup & multi-threaded rendering where cross-origin isolation headers allow; falls back to JS + CanvasKit when Wasm isn't supported.\n* The old **HTML renderer** (DOM/CSS based) was **deprecated and removed** (2024–2025). `--web-renderer` flag removed accordingly.\n* Semantics/accessibility tree mapped to DOM ARIA nodes; text input uses hidden DOM input elements.\n* Implications: canvas apps aren't SEO-friendly; first load size; use Flutter web for **apps** (dashboards, tools, PWAs) rather than content sites.\n\n---\n\n## 20.13 Interview Questions — Internals\n\n**Q1. Describe what happens when setState is called until pixels change.** markNeedsBuild → scheduleFrame → vsync → beginFrame (animations) → drawFrame: build dirty elements (diff widgets, update render objects) → layout dirty render objects (to relayout boundaries) → paint dirty repaint boundaries into layers → composite scene → raster thread rasterizes with Impeller/Skia → GPU presents.\n\n**Q2. What are relayout and repaint boundaries?** Points in the render tree that stop layout/paint invalidation from propagating upward: relayout boundary when parent doesn't use child size/tight constraints/sizedByParent; repaint boundary has its own layer.\n\n**Q3. What is the difference between the UI thread and raster thread?** UI runs Dart build/layout/paint recording; raster converts the layer tree into GPU commands. Either exceeding the frame budget causes jank.\n\n**Q4. What is shader compilation jank and how does Impeller fix it?** Skia compiled shaders at first use causing stutters; Impeller precompiles all shaders at build time.\n\n**Q5. How does Dart's garbage collector work?** Generational: fast copying scavenger for young objects, concurrent mark-sweep(-compact) for old; Flutter schedules GC during idle time.\n\n**Q6. JIT vs AOT in Flutter?** JIT in debug for hot reload & fast iteration; AOT in profile/release for speed, startup and iOS compliance.\n\n**Q7. How does hot reload work?** Incremental kernel compile of changed libraries, VM reloads code while preserving heap state, framework reassembles and rebuilds the widget tree.\n\n**Q8. What is the layer tree?** Output of painting: a tree of layers (picture, transform, opacity, clip, etc.) which the engine composites and rasterizes.\n\n**Q9. What is saveLayer and why is it expensive?** It renders content into an offscreen buffer and then composites it — costs memory bandwidth and GPU time, and on some GPUs forces render pass switches.\n\n**Q10. What is tree shaking?** Removing unreachable code at compile time (AOT/dart2js) to reduce binary size.\n\n**Q11. What renderers exist for Flutter web?** CanvasKit (default for JS builds) and skwasm (for Wasm builds); the HTML renderer was removed.\n\n**Q12. What is a Ticker and how does it relate to vsync?** An object that calls a callback once per frame (driven by SchedulerBinding's transient callbacks on vsync), muted via TickerMode when not visible.\n"}, {"n": 21, "file": "21-architecture.md", "title": "Chapter 21 — App Architecture for Large Projects: MVVM, Clean Architecture, Repositories, DI, Modularization & Design Patterns", "subtitle": "App Architecture for Large Projects: MVVM, Clean Architecture, Repositories, DI, Modularization & Design Patterns", "short": "Architecture", "sub": "MVVM, Clean Architecture, DI, modules", "level": "advanced", "minutes": 12, "qa": 10, "md": "# Chapter 21 — App Architecture for Large Projects: MVVM, Clean Architecture, Repositories, DI, Modularization & Design Patterns\n\n> **Goal:** Structure a codebase that 5–50 developers can work on for years without it collapsing. This chapter is crucial for senior interviews (\"How would you architect X?\") and for real company work.\n\n---\n\n## 21.1 Why architecture? (5-year-old) 🏠\n\nIf you build a house by throwing bricks anywhere, it falls when you add a second floor. **Architecture** is the **blueprint**: kitchen here, plumbing there, walls with clear jobs. Then many builders can work at once, and you can replace the fridge without breaking the walls.\n\nGoals of good app architecture:\n1. **Separation of concerns** — UI, business logic and data access are separate.\n2. **Testability** — logic testable without UI or real network.\n3. **Scalability** — add features without touching everything.\n4. **Maintainability/readability** — newcomers find things quickly.\n5. **Replaceability** — swap REST for GraphQL, Hive for Drift, Firebase for your own backend with limited changes.\n6. **Team parallelism** — features developed independently.\n\n---\n\n## 21.2 The official Flutter architecture recommendation (docs.flutter.dev/app-architecture)\n\nFlutter's team published an architecture guide (2024–2025) recommending **MVVM with a layered approach**:\n\n```\n┌──────────────────── UI layer ────────────────────┐\n│  View (widgets)  ◄──listens──  ViewModel          │\n│    user events ──calls──►   (ChangeNotifier,      │\n│                              exposes UI state +   │\n│                              Commands)            │\n└───────────────────────────────┬───────────────────┘\n                                │ uses\n┌──────────────── (optional) Domain layer ─────────┐\n│  Use cases / interactors (complex/reused logic)  │\n└───────────────────────────────┬───────────────────┘\n                                │\n┌──────────────────── Data layer ──────────────────┐\n│  Repositories (source of truth
