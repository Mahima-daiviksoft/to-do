ageQuality: 80);\nfinal XFile? video = await _picker.pickVideo(source: ImageSource.gallery, maxDuration: const Duration(minutes: 1));\nfinal List\u003cXFile> media = await _picker.pickMultipleMedia();   // photos + videos together\n```\n\n### ⚠️ Android \"lost data\" (activity killed while the camera is open)\nOn low-memory Android devices, the OS may **kill your app's activity** while the camera app is open. When the user comes back, `pickImage` never returns a value. You can recover the result at startup:\n```dart\nFuture\u003cvoid> retrieveLostData() async {\n  final LostDataResponse response = await _picker.retrieveLostData();\n  if (response.isEmpty) return;\n  final files = response.files;\n  if (files != null) { /* handle recovered images */ } else { /* response.exception */ }\n}\n```\nYou can reproduce this with **Developer options → Don't keep activities**.\n\n### Web\n`XFile.path` is a **blob URL** on the web, and `dart:io` `File` doesn't work there. Use `await xfile.readAsBytes()` and `Image.memory(bytes)` to show it.\n\n---\n\n## 34.3 Cropping & compressing\n* **`image_cropper`** opens a native crop UI (uCrop on Android, TOCropViewController on iOS). On Android you must add `UCropActivity` to the manifest, as the plugin's README explains.\n* **`flutter_image_compress`** does native compression and format conversion:\n```dart\nfinal XFile? out = await FlutterImageCompress.compressAndGetFile(\n  input.absolute.path, '${tempDir.path}/out.jpg',\n  quality: 80, minWidth: 1080, minHeight: 1080, format: CompressFormat.jpeg,\n);\n```\n* **Pure Dart:** the `image` package can resize and apply filters. It is CPU-heavy, so always run it inside `Isolate.run`.\n* **EXIF:** photos from phones may be **rotated** in their EXIF metadata. Either the server reads the EXIF orientation, or you \"bake in\" the rotation before uploading (compress libraries can do this, e.g. `autoCorrectionAngle`). Remove GPS EXIF data for privacy when needed.\n\n---\n\n## 34.4 Custom camera screen: the `camera` plugin\n\nUse this when you need your **own** camera UI: a scanner overlay, KYC selfie frames, custom buttons, filters, or frame-by-frame image streams for ML.\n\n### Setup\n* **iOS `Info.plist`:**\n  * `NSCameraUsageDescription`\n  * `NSMicrophoneUsageDescription` (if `enableAudio` is true)\n* **Android:** follow the README's `minSdk` requirement. The plugin requests the camera permission at runtime when you initialize the controller.\n\n### Complete camera page (with correct lifecycle handling)\n```dart\nimport 'package:camera/camera.dart';\nimport 'package:flutter/material.dart';\n\nclass CameraPage extends StatefulWidget {\n  const CameraPage({super.key});\n  @override\n  State\u003cCameraPage> createState() => _CameraPageState();\n}\n\nclass _CameraPageState extends State\u003cCameraPage> with WidgetsBindingObserver {\n  List\u003cCameraDescription> _cameras = const [];\n  CameraController? _controller;\n  int _cameraIndex = 0;\n  bool _recording = false;\n  String? _error;\n\n  @override\n  void initState() {\n    super.initState();\n    WidgetsBinding.instance.addObserver(this);\n    _setup();\n  }\n\n  Future\u003cvoid> _setup() async {\n    try {\n      _cameras = await availableCameras();\n      if (_cameras.isEmpty) {\n        setState(() => _error = 'No camera found');\n        return;\n      }\n      await _initController(_cameras[_cameraIndex]);\n    } on CameraException catch (e) {\n      setState(() => _error = _describe(e));\n    }\n  }\n\n  Future\u003cvoid> _initController(CameraDescription description) async {\n    final old = _controller;\n    _controller = null;\n    if (mounted) setState(() {});\n    await old?.dispose();                         // ❗ always dispose the previous controller\n\n    final controller = CameraController(\n      description,\n      ResolutionPreset.high,                      // low/medium/high/veryHigh/ultraHigh/max\n      enableAudio: true,\n      imageFormatGroup: ImageFormatGroup.jpeg,\n    );\n    try {\n      await controller.initialize();\n      await controller.setFlashMode(FlashMode.auto);\n      if (!mounted) {\n        await controller.dispose();\n        return;\n      }\n      setState(() => _controller = controller);\n    } on CameraException catch (e) {\n      await controller.dispose();\n      if (mounted) setState(() => _error = _describe(e));\n    }\n  }\n\n  String _describe(CameraException e) => switch (e.code) {\n        'CameraAccessDenied' => 'Camera permission denied. Enable it in Settings.',\n        'CameraAccessDeniedWithoutPrompt' => 'Camera permission denied permanently (iOS). Open Settings.',\n        'CameraAccessRestricted' => 'Camera access restricted (parental controls).',\n        'AudioAccessDenied' => 'Microphone permission denied.',\n        _ => 'Camera error: ${e.code} ${e.description}',\n      };\n\n  // ❗ The camera is a shared OS resource. Release it when the app goes to the background\n  // and set it up again when the app comes back. Otherwise other apps can't use it,\n  // and your preview may freeze or crash when the app resumes.\n  @override\n  void didChangeAppLifecycleState(AppLifecycleState state) {\n    final controller = _controller;\n    if (controller == null || !controller.value.isInitialized) return;\n    if (state == AppLifecycleState.inactive) {\n      _controller = null;\n      controller.dispose();\n    } else if (state == AppLifecycleState.resumed) {\n      _initController(controller.description);\n    }\n  }\n\n  @override\n  void dispose() {\n    WidgetsBinding.instance.removeObserver(this);\n    _controller?.dispose();\n    super.dispose();\n  }\n\n  Future\u003cvoid> _takePicture() async {\n    final c = _controller;\n    if (c == null || !c.value.isInitialized || c.value.isTakingPicture) return;\n    try {\n      final XFile photo = await c.takePicture();\n      if (!mounted) return;\n      Navigator.of(context).pop(photo);           // return the file to the caller\n    } on CameraException catch (e) {\n      setState(() => _error = _describe(e));\n    }\n  }\n\n  Future\u003cvoid> _toggleRecording() async {\n    final c = _controller;\n    if (c == null) return;\n    if (_recording) {\n      final XFile video = await c.stopVideoRecording();\n      setState(() => _recording = false);\n      if (mounted) Navigator.of(context).pop(video);\n    } else {\n      await c.prepareForVideoRecording();         // iOS: avoids a delay at start\n      await c.startVideoRecording();\n      setState(() => _recording = true);\n    }\n  }\n\n  void _switchCamera() {\n    if (_cameras.length \u003c 2) return;\n    _cameraIndex = (_cameraIndex + 1) % _cameras.length;\n    _initController(_cameras[_cameraIndex]);\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    if (_error != null) {\n      return Scaffold(appBar: AppBar(), body: Center(child: Text(_error!, textAlign: TextAlign.center)));\n    }\n    final c = _controller;\n    if (c == null || !c.value.isInitialized) {\n      return const Scaffold(backgroundColor: Colors.black, body: Center(child: CircularProgressIndicator()));\n    }\n    return Scaffold(\n      backgroundColor: Colors.black,\n      body: Stack(fit: StackFit.expand, children: [\n        Center(child: CameraPreview(c)),         // keeps the camera's aspect ratio\n        // Example overlay: a frame for document scanning\n        IgnorePointer(\n          child: Center(\n            child: Container(\n              width: 300, height: 190,\n              decoration: BoxDecoration(border: Border.all(color: Colors.white, width: 2), borderRadius: BorderRadius.circular(12)),\n            ),\n          ),\n        ),\n        SafeArea(\n          child: Align(\n            alignment: Alignment.bottomCenter,\n            child: Padding(\n              padding: const EdgeInsets.all(24),\n              child: Row(mainAxisAlignment: MainAxisAlignment.spaceEvenly, children: [\n                IconButton(onPressed: _switchCamera, icon: const Icon(Icons.cameraswitch, color: Colors.white)),\n                FloatingActionButton(onPressed: _takePicture, child: const Icon(Icons.camera)),\n                IconButton(\n                  onPressed: _toggleRecording,\n                  icon: Icon(_recording ? Icons.stop : Icons.videocam, color: _recording ? Colors.red : Colors.white),\n                ),\n              ]),\n            ),\n          ),\n        ),\n      ]),\n    );\n  }\n}\n\n// Usage: final result = await Navigator.push\u003cXFile>(context, MaterialPageRoute(builder: (_) => const CameraPage()));\n```\n\n### More controller features\n```dart\nawait c.setZoomLevel(2.0);                       // range: getMinZoomLevel()/getMaxZoomLevel()\nawait c.setFocusPoint(const Offset(0.5, 0.5));   // normalized 0..1 coordinates\nawait c.setExposurePoint(const Offset(0.5, 0.5));\nawait c.setFlashMode(FlashMode.torch);\nawait c.lockCaptureOrientation(DeviceOrientation.portraitUp);\nawait c.pausePreview(); await c.resumePreview();\n\n// Frame stream for ML (barcode, faces). It is heavy: process at most one frame at a time.\nbool processing = false;\nawait c.startImageStream((CameraImage image) async {\n  if (processing) return;\n  processing = true;\n  try { await detector.process(image); } finally { processing = false; }\n});\nawait c.stopImageStream();\n```\nFor barcodes or QR codes, use **`mobile_scanner`** instead of the camera plugin. It wraps ML Kit and AVFoundation and is much easier. For text and faces, use the **`google_mlkit_*`** packages, converting `CameraImage` to `InputImage` as their README shows.\n\n### Common camera bugs\n| Bug | Fix |\n|---|---|\n| Black preview after returning from background | Handle `didChangeAppLifecycleState` (dispose on inactive, set up again on resumed) |\n| `CameraException(cameraPermission)` | Permission denied → show a \"go to Settings\" message (`openAppSettings`) |\n| Preview stretched | Don't force the preview to fill the screen. Keep the aspect ratio, or use `FittedBox(fit: BoxFit.cover)` with a sized box and clipping |\n| Crash on hot reload | Camera native state + hot reload is fragile → hot restart |\n| `takePicture` called twice | Check `value.isTakingPicture` |\n| Out-of-memory with image stream | Throttle frames, process in isolates, lower the resolution preset |\n| Emulator issues | Test on real devices |\n\n---\n\n## 34.5 Video playback: `video_player` (official) + `chewie` (ready-made controls)\n\n### Setup\n* **Android:** add the `INTERNET` permission for network videos. Cleartext HTTP needs extra config, so use HTTPS.\n* **iOS:** HTTPS only (ATS rules).\n* **Web:** autoplay rules apply. Browsers usually allow autoplay only when the video is **muted**.\n\n### Complete player with controls\n```dart\nimport 'package:flutter/material.dart';\nimport 'package:video_player/video_player.dart';\n\nclass VideoScreen extends StatefulWidget {\n  const VideoScreen({super.key, required this.url});\n  final String url;\n  @override\n  State\u003cVideoScreen> createState() => _VideoScreenState();\n}\n\nclass _VideoScreenState extends State\u003cVideoScreen> {\n  late final VideoPlayerController _controller;\n  late final Future\u003cvoid> _init;\n\n  @override\n  void initState() {\n    super.initState();\n    _controller = VideoPlayerController.networkUrl(\n      Uri.parse(widget.url),\n      videoPlayerOptions: VideoPlayerOptions(mixWithOthers: true),   // don't stop the user's music\n    );\n    _init = _controller.initialize().then((_) {\n      _controller.setLooping(false);\n      _controller.play();\n    });\n    // Other sources: VideoPlayerController.asset('assets/intro.mp4'), .file(File(path)), .contentUri(uri) on Android\n  }\n\n  @override\n  void dispose() {\n    _controller.dispose();               // ❗ releases native decoders. Leaks here are very costly\n    super.dispose();\n  }\n\n  String _fmt(Duration d) =>\n      '${d.inMinutes.remainder(60).toString().padLeft(2, '0')}:${d.inSeconds.remainder(60).toString().padLeft(2, '0')}';\n\n  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n      appBar: AppBar(title: const Text('Video')),\n      body: FutureBuilder\u003cvoid>(\n        future: _init,                   // created once in initState (not inside build!)\n        builder: (context, snapshot) {\n          if (snapshot.hasError) return Center(child: Text('Cannot play video: ${snapshot.error}'));\n          if (snapshot.connectionState != ConnectionState.done) {\n            return const Center(child: CircularProgressIndicator());\n          }\n          return Column(children: [\n            AspectRatio(\n              aspectRatio: _controller.value.aspectRatio,\n              child: Stack(alignment: Alignment.bottomCenter, children: [\n                VideoPlayer(_controller),\n                VideoProgressIndicator(_controller, allowScrubbing: true),\n              ]),\n            ),\n            // Rebuild ONLY the controls whenever the player value changes\n            ValueListenableBuilder\u003cVideoPlayerValue>(\n              valueListenable: _controller,\n              builder: (context, value, _) => Row(children: [\n                IconButton(\n                  icon: Icon(value.isPlaying ? Icons.pause : Icons.play_arrow),\n                  onPressed: () => value.isPlaying ? _controller.pause() : _controller.play(),\n                ),\n                Text('${_fmt(value.position)} / ${_fmt(value.duration)}'),\n                if (value.isBuffering) const Padding(padding: EdgeInsets.all(8), child: SizedBox.square(dimension: 16, child: CircularProgressIndicator(strokeWidth: 2))),\n                const Spacer(),\n                IconButton(\n                  icon: Icon(value.volume == 0 ? Icons.volume_off : Icons.volume_up),\n                  onPressed: () => _controller.setVolume(value.volume == 0 ? 1 : 0),\n                ),\n              ]),\n            ),\n          ]);\n        },\n      ),\n    );\n  }\n}\n```\n`VideoPlayerController` is a `ValueNotifier\u003cVideoPlayerValue>`. That's why `ValueListenableBuilder` works with it. Other useful APIs: `seekTo(Duration)`, `setPlaybackSpeed(1.5)`, `value.hasError`, `value.errorDescription`, `value.buffered`, `value.size`, `value.isCompleted`.\n\n### Chewie (full-screen, speed menu, subtitles)\n```dart\nfinal chewie = ChewieController(\n  videoPlayerController: _controller,\n  autoPlay: true,\n  looping: false,\n  allowFullScreen: true,\n  playbackSpeeds: const [0.5, 1, 1.5, 2],\n  errorBuilder: (context, msg) => Center(child: Text(msg)),\n);\nChewie(controller: chewie);\n// dispose both: chewie.dispose(); _controller.dispose();\n```\n\n### Video feeds (Reels/Shorts style), the senior-level part\n* Use a vertical `PageView.builder`. Keep at most **3 controllers alive** (previous, current, next) and dispose the others. Each decoder uses native memory, and devices limit how many can run at once.\n* Play only the visible page. Pause when the route is covered (`RouteAware`) or the app goes to the background.\n* Preload the next video's `initialize()` early. Cache downloads using `flutter_cache_manager` and play from the file. Use HLS streaming (`.m3u8`) for adaptive bitrate.\n* In plain lists, use `visibility_detector` to autoplay the most visible video.\n* Alternatives: **`media_kit`** (libmpv based, desktop + mobile, many formats) and **`better_player_plus`** (DRM, caching, HLS tracks).\n* DRM (Widevine/FairPlay) usually needs a specialized plugin or native SDK.\n* Picture-in-picture and background playback need native/platform work or specialized plugins.\n\n---\n\n## 34.6 Audio playback: `just_audio` (+ `audio_service` for background)\n\n```dart\nimport 'package:just_audio/just_audio.dart';\nimport 'package:audio_session/audio_session.dart';\n\nclass PlayerService {\n  final player = AudioPlayer();\n\n  Future\u003cvoid> init() async {\n    final session = await AudioSession.instance;\n    await session.configure(const AudioSessionConfiguration.music());   // handles interruptions like phone calls & ducking\n    player.playbackEventStream.listen((_) {}, onError: (Object e, StackTrace st) {\n      // network/codec errors arrive here\n    });\n  }\n\n  Future\u003cvoid> playUrl(String url) async {\n    try {\n      await player.setUrl(url);            // also: setAsset, setFilePath, setAudioSource(...)\n      await player.play();                 // ⚠️ the Future completes when playback STOPS/pauses, not when it starts!\n    } on PlayerException catch (e) {\n      // e.code, e.message\n    } on PlayerInterruptedException {\n      // a new source was loaded before this one finished loading\n    }\n  }\n\n  Future\u003cvoid> playlist(List\u003cString> urls) async {\n    await player.setAudioSource(ConcatenatingAudioSource(\n      children: [for (final u in urls) AudioSource.uri(Uri.parse(u))],\n    ));\n    // ⚠️ Newer just_audio versions prefer `player.setAudioSources([...])`. Check your version's README.\n    player.play();\n  }\n\n  Future\u003cvoid> dispose() => player.dispose();\n}\n```\nBuilding the UI from streams:\n```dart\nStreamBuilder\u003cPlayerState>(\n  stream: service.player.playerStateStream,\n  builder: (context, snap) {\n    final state = snap.data;\n    final processing = state?.processingState;\n    if (processing == ProcessingState.loading || processing == ProcessingState.buffering) {\n      return const CircularProgressIndicator();\n    }\n    final playing = state?.playing ?? false;\n    return IconButton(\n      icon: Icon(playing ? Icons.pause : Icons.play_arrow),\n      onPressed: playing ? service.player.pause : service.player.play,\n    );\n  },\n);\nStreamBuilder\u003cDuration>(\n  stream: service.player.positionStream,\n  builder: (_, snap) => Slider(\n    value: (snap.data ?? Duration.zero).inMilliseconds.toDouble()\n        .clamp(0, (service.player.duration ?? Duration.zero).inMilliseconds.toDouble()),\n    max: (service.player.duration ?? Duration.zero).inMilliseconds.toDouble().clamp(1, double.infinity),\n    onChanged: (v) => service.player.seek(Duration(milliseconds: v.toInt())),\n  ),\n);\n```\n\n### Background audio & lock-screen controls\nUse **`audio_service`**. Your handler class (extends `BaseAudioHandler`) wraps the player. It publishes `mediaItem` and `playbackState` (controls: play/pause/skip) and runs a foreground service on Android with a media notification. **`just_audio_background`** is a simpler option for basic cases.\n* **Android:** follow the README's manifest entries. These include the media playback foreground service type (`FOREGROUND_SERVICE_MEDIA_PLAYBACK` for Android 14+) and the `AudioService`/`MediaButtonReceiver` declarations. MainActivity may need to extend `AudioServiceActivity`.\n* **iOS:** add `UIBackgroundModes` → `audio`.\n\nShort sound effects (button clicks, games): use **`audioplayers`** or `flame_audio`. They have low latency and can play several sounds at once.\n\n---\n\n## 34.7 Recording audio: `record`\n```dart\nimport 'package:record/record.dart';\nimport 'package:path_provider/path_provider.dart';\n\nfinal recorder = AudioRecorder();\n\nFuture\u003cvoid> start() async {\n  if (!await recorder.hasPermission()) return;                 // asks for permission if needed\n  final dir = await getTemporaryDirectory();\n  final path = '${dir.path}/note_${DateTime.now().millisecondsSinceEpoch}.m4a';\n  await recorder.start(const RecordConfig(encoder: AudioEncoder.aacLc, bitRate: 128000, sampleRate: 44100), path: path);\n}\n\nFuture\u003cString?> stop() => recorder.stop();          // returns the file path\n// recorder.onAmplitudeChanged(const Duration(milliseconds: 100)) → animated waveform\n// recorder.pause() / resume() / cancel(); recorder.dispose() when done\n```\nSetup:\n* **iOS:** `NSMicrophoneUsageDescription`.\n* **Android:** `RECORD_AUDIO`.\n\n---\n\n## 34.8 Uploading media reliably\n* **Small files:** Dio `FormData` with `onSendProgress` (Chapter 16).\n* **Large files and videos:**\n  * Get a **pre-signed URL** from your backend, then upload straight to S3/GCS. Your servers never carry the bytes.\n  * Use **resumable / multipart uploads** (tus protocol, S3 multipart) so a broken connection doesn't restart from zero.\n  * Use **`background_downloader`** for uploads that continue in the background (URLSession on iOS, WorkManager on Android).\n* Compress before uploading. Generate thumbnails with `video_thumbnail`. Show progress and allow cancel and retry.\n* Validate type and size on **both** the client and the server.\n\n---\n\n## 34.9 Interview questions — media\n\n**Q1. `image_picker` vs `camera`?**\nimage_picker opens the system picker or camera to choose a single photo or video. It's simple and needs no permission for the gallery on modern Android. The `camera` plugin gives you a live preview and full control for building a custom camera UI, image streams and video recording.\n\n**Q2. Why must you dispose the CameraController on `inactive`?**\nThe camera is an exclusive OS resource. If you don't release it in the background, other apps can't use it and your preview breaks or crashes on resume. Set it up again on `resumed`.\n\n**Q3. How do you reduce image upload size?**\nPass `maxWidth`/`imageQuality` to the picker, use native compression, convert to WebP/JPEG, strip EXIF data, and upload through pre-signed URLs.\n\n**Q4. How do you build a TikTok-style feed efficiently?**\nUse a PageView with at most ~3 live video controllers. Preload the next video and dispose far-away ones. Play only the visible item, use HLS with caching, and pause when the screen is covered or the app is in the background.\n\n**Q5. How do you play audio in the background with lock-screen controls?**\nUse audio_service (a foreground service and media session on Android; background mode `audio` on iOS) together with just_audio, and configure audio_session to handle interruptions.\n\n**Q6. What does `retrieveLostData` solve?**\nAndroid can kill your activity while the camera app is open. retrieveLostData recovers the picked result when the app restarts.\n\n**Q7. How do you scan QR codes?**\nWith mobile_scanner (ML Kit / AVFoundation). It handles the preview, detection, the torch and lifecycle.\n\n**Q8. Why doesn't `File` work with picked images on web?**\ndart:io doesn't exist on the web. XFile gives you bytes (`readAsBytes`) and a blob URL instead.\n"}, {"n": 35, "file": "35-maps-and-location.md", "title": "Chapter 35 — Maps & Location: Google Maps, OpenStreetMap, Geolocation, Geocoding, Geofencing & Background Tracking", "subtitle": "Maps & Location: Google Maps, OpenStreetMap, Geolocation, Geocoding, Geofencing & Background Tracking", "short": "Maps & Location", "sub": "Permissions, Google Maps, background", "level": "intermediate", "minutes": 11, "qa": 6, "md": "# Chapter 35 — Maps & Location: Google Maps, OpenStreetMap, Geolocation, Geocoding, Geofencing & Background Tracking\n\n> **Goal:** Show maps with markers and routes, get the user's location correctly (including permissions and denied cases), turn coordinates into addresses, track location in the background legally, and keep the battery healthy.\n\n---\n\n## 35.1 5-year-old picture 🗺️\nYour phone has a **GPS compass** that knows where you are. The **map** is a picture book of the world. **Markers** are stickers you put on the pictures. To use the compass you must ask permission. Using it **while the app is closed** needs extra permission and a very good reason.\n\n---\n\n## 35.2 Location permissions: the rules\n| Level | Android | iOS |\n|---|---|---|\n| While using the app | `ACCESS_COARSE_LOCATION` (approximate) and/or `ACCESS_FINE_LOCATION` (precise) | `NSLocationWhenInUseUsageDescription` |\n| Background (\"Always\") | + `ACCESS_BACKGROUND_LOCATION` (Android 10+), requested **separately, after** foreground permission is granted. Since Android 11 the user picks \"Allow all the time\" in **Settings** | + `NSLocationAlwaysAndWhenInUseUsageDescription`, `UIBackgroundModes: location` |\n| Precise vs approximate | Android 12+: the user can grant only approximate | iOS 14+: precise toggle (`NSLocationTemporaryUsageDescriptionDictionary` for temporary precise access) |\n\n**Store policies:**\n* Google Play requires a **declaration form** and a demo video for background location. It is only allowed for core features that clearly benefit the user (navigation, fitness tracking, delivery drivers, family safety).\n* Apple reviews \"Always\" usage strictly.\n\nAsk for **when-in-use** first. Ask for background only when the user turns on a feature that needs it, after showing an explanation screen.\n\n---\n\n## 35.3 Getting the location: `geolocator`\n\n### Manifest / Info.plist\n```xml\n\u003c!-- android/app/src/main/AndroidManifest.xml -->\n\u003cuses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n\u003cuses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n```\n```xml\n\u003c!-- ios/Runner/Info.plist -->\n\u003ckey>NSLocationWhenInUseUsageDescription\u003c/key>\n\u003cstring>We use your location to show nearby stores.\u003c/string>\n```\n\n### A location service that handles every case\n```dart\nimport 'package:geolocator/geolocator.dart';\n\nsealed class LocationResult {}\nfinal class LocationOk extends LocationResult { LocationOk(this.position); final Position position; }\nfinal class LocationServiceDisabled extends LocationResult {}\nfinal class LocationDenied extends LocationResult {}\nfinal class LocationDeniedForever extends LocationResult {}\n\nclass LocationService {\n  Future\u003cLocationResult> current() async {\n    // 1. Is GPS/location turned on in the device settings?\n    if (!await Geolocator.isLocationServiceEnabled()) return LocationServiceDisabled();\n\n    // 2. Permission\n    var permission = await Geolocator.checkPermission();\n    if (permission == LocationPermission.denied) {\n      permission = await Geolocator.requestPermission();\n      if (permission == LocationPermission.denied) return LocationDenied();\n    }\n    if (permission == LocationPermission.deniedForever) return LocationDeniedForever();\n\n    // 3. Position. Use the last known position first for speed, then a fresh fix with a timeout.\n    final last = await Geolocator.getLastKnownPosition();   // may be null/stale; not supported on web\n    try {\n      final fresh = await Geolocator.getCurrentPosition(\n        locationSettings: const LocationSettings(\n          accuracy: LocationAccuracy.high,\n          timeLimit: Duration(seconds: 10),\n        ),\n      );\n      return LocationOk(fresh);\n    } on Exception {\n      if (last != null) return LocationOk(last);\n      rethrow;\n    }\n  }\n\n  Stream\u003cPosition> track({int distanceFilterMeters = 10}) => Geolocator.getPositionStream(\n        locationSettings: LocationSettings(\n          accuracy: LocationAccuracy.high,\n          distanceFilter: distanceFilterMeters,   // only emit after moving N meters → saves battery\n        ),\n      );\n\n  Future\u003cvoid> openSettings() => Geolocator.openAppSettings();\n  Future\u003cvoid> openLocationSettings() => Geolocator.openLocationSettings();\n\n  double distanceMeters(Position a, Position b) =>\n      Geolocator.distanceBetween(a.latitude, a.longitude, b.latitude, b.longitude);\n}\n```\nIn the UI, use `switch` on the result:\n* `LocationServiceDisabled` → show a \"Turn on location\" button that calls `openLocationSettings()`.\n* `LocationDeniedForever` → show a \"Open Settings\" button.\n* `LocationDenied` → explain why you need it and let the user retry.\n\nAccuracy levels: `lowest`, `low`, `medium`, `high`, `best`, `bestForNavigation`. Higher accuracy uses more battery.\n\n### Platform-specific settings\n```dart\nfinal settings = switch (defaultTargetPlatform) {\n  TargetPlatform.android => AndroidSettings(\n      accuracy: LocationAccuracy.high,\n      distanceFilter: 10,\n      intervalDuration: const Duration(seconds: 5),\n      // Background tracking on Android: a foreground service with a visible notification\n      foregroundNotificationConfig: const ForegroundNotificationConfig(\n        notificationTitle: 'Tracking your run',\n        notificationText: 'Location is used while your workout is active',\n        enableWakeLock: true,\n      ),\n    ),\n  TargetPlatform.iOS || TargetPlatform.macOS => AppleSettings(\n      accuracy: LocationAccuracy.high,\n      distanceFilter: 10,\n      activityType: ActivityType.fitness,\n      pauseLocationUpdatesAutomatically: true,\n      allowBackgroundLocationUpdates: true,      // requires UIBackgroundModes: location\n      showBackgroundLocationIndicator: true,     // blue pill in the status bar\n    ),\n  _ => const LocationSettings(accuracy: LocationAccuracy.high, distanceFilter: 10),\n};\nfinal stream = Geolocator.getPositionStream(locationSettings: settings);\n```\nFor Android background tracking, also declare the foreground service permissions that the geolocator README lists for your version (`FOREGROUND_SERVICE`, `FOREGROUND_SERVICE_LOCATION` on Android 14+) and `ACCESS_BACKGROUND_LOCATION` if tracking continues after the app is closed.\n\nAlternatives: the `location` package (similar API), and `flutter_background_geolocation` (a commercial package with very reliable background tracking, geofencing, activity recognition and battery-conscious motion detection; licensed for Android release builds).\n\n---\n\n## 35.4 Geocoding (address ↔ coordinates)\n```dart\nimport 'package:geocoding/geocoding.dart';\n\nfinal placemarks = await placemarkFromCoordinates(12.9716, 77.5946);\nfinal p = placemarks.first;\nfinal address = '${p.street}, ${p.locality}, ${p.administrativeArea} ${p.postalCode}, ${p.country}';\n\nfinal locations = await locationFromAddress('MG Road, Bengaluru');\nfinal first = locations.first; // first.latitude, first.longitude\n```\n* The `geocoding` package uses the platform geocoders. They are free but have rate limits and vary in quality, and the package doesn't support the web.\n* Production apps often use a backend proxy to the **Google Places/Geocoding APIs**, Mapbox, or HERE. That gives you autocomplete, keeps the API key on the server and enables caching.\n\n---\n\n## 35.5 Google Maps: `google_maps_flutter`\n\n### Setup\n1. In Google Cloud Console, enable **Maps SDK for Android** and **Maps SDK for iOS** (plus the Maps JavaScript API for web). Create API keys **restricted** by Android package + SHA-1 and by iOS bundle ID. Billing must be enabled.\n2. **Android** `AndroidManifest.xml`, inside `\u003capplication>`:\n```xml\n\u003cmeta-data android:name=\"com.google.android.geo.API_KEY\" android:value=\"${MAPS_API_KEY}\" />\n```\n   You can inject the key from `local.properties`/CI with `manifestPlaceholders[\"MAPS_API_KEY\"] = ...` in Gradle, so it isn't committed.\n3. **iOS** `AppDelegate.swift`:\n```swift\nimport GoogleMaps\n// inside application(_:didFinishLaunchingWithOptions:) before GeneratedPluginRegistrant\nGMSServices.provideAPIKey(\"YOUR_IOS_KEY\")\n```\n4. **Web:** add the Maps JavaScript script tag with your key in `web/index.html`.\n\n### Map with markers, polyline and camera control\n```dart\nimport 'dart:async';\nimport 'package:flutter/material.dart';\nimport 'package:google_maps_flutter/google_maps_flutter.dart';\n\nclass StoresMap extends StatefulWidget {\n  const StoresMap({super.key, required this.stores});\n  final List\u003cStore> stores;\n  @override\n  State\u003cStoresMap> createState() => _StoresMapState();\n}\n\nclass _StoresMapState extends State\u003cStoresMap> {\n  final _controller = Completer\u003cGoogleMapController>();\n  Store? _selected;\n\n  static const _initial = CameraPosition(target: LatLng(12.9716, 77.5946), zoom: 12);\n\n  Set\u003cMarker> get _markers => {\n        for (final s in widget.stores)\n          Marker(\n            markerId: MarkerId(s.id),\n            position: LatLng(s.lat, s.lng),\n            infoWindow: InfoWindow(title: s.name, snippet: s.address),\n            icon: BitmapDescriptor.defaultMarkerWithHue(\n              s.id == _selected?.id ? BitmapDescriptor.hueAzure : BitmapDescriptor.hueRed,\n            ),\n            onTap: () => setState(() => _selected = s),\n          ),\n      };\n\n  Set\u003cPolyline> get _route => {\n        if (widget.stores.length > 1)\n          Polyline(\n            polylineId: const PolylineId('route'),\n            points: [for (final s in widget.stores) LatLng(s.lat, s.lng)],\n            width: 5,\n            color: Colors.blue,\n          ),\n      };\n\n  Future\u003cvoid> _fitAll() async {\n    if (widget.stores.isEmpty) return;\n    final lats = widget.stores.map((s) => s.lat);\n    final lngs = widget.stores.map((s) => s.lng);\n    final bounds = LatLngBounds(\n      southwest: LatLng(lats.reduce((a, b) => a \u003c b ? a : b), lngs.reduce((a, b) => a \u003c b ? a : b)),\n      northeast: LatLng(lats.reduce((a, b) => a > b ? a : b), lngs.reduce((a, b) => a > b ? a : b)),\n    );\n    final c = await _controller.future;\n    await c.animateCamera(CameraUpdate.newLatLngBounds(bounds, 48));   // 48px padding\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n      body: GoogleMap(\n        initialCameraPosition: _initial,\n        onMapCreated: (c) {\n          if (!_controller.isCompleted) _controller.complete(c);\n          _fitAll();\n        },\n        markers: _markers,\n        polylines: _route,\n        myLocationEnabled: true,          // needs location permission granted first!\n        myLocationButtonEnabled: true,\n        zoomControlsEnabled: false,\n        mapToolbarEnabled: false,\n        padding: const EdgeInsets.only(bottom: 80),   // keep the Google logo/buttons above your bottom UI\n        // style: darkMapStyleJson,       // JSON from the Google styling wizard (newer API; older versions used controller.setMapStyle)\n        onTap: (_) => setState(() => _selected = null),\n        onCameraIdle: () { /* fetch markers for the visible region */ },\n      ),\n      floatingActionButton: FloatingActionButton(onPressed: _fitAll, child: const Icon(Icons.zoom_out_map)),\n    );\n  }\n}\n```\nOther features:\n* **Custom marker icons:** `BitmapDescriptor.asset(ImageConfiguration(size: Size(48, 48)), 'assets/pin.png')` in newer versions (older: `fromAssetImage`). You can also render a widget to bytes and use `BitmapDescriptor.bytes(...)`.\n* Circles, polygons, heatmaps, tile overlays.\n* Read the visible area with `getVisibleRegion()`.\n* **Marker clustering** (built-in `ClusterManager` in recent versions, or `google_maps_cluster_manager`).\n* **Gestures inside scroll views:** pass `gestureRecognizers: {Factory\u003cOneSequenceGestureRecognizer>(() => EagerGestureRecognizer())}` so the map gets drag gestures.\n\n### Performance and other gotchas\n* The map is a **platform view** (Chapter 19). Avoid many maps on one screen or maps inside list items. For thumbnails, use the **Static Maps API** image instead.\n* Thousands of markers → cluster them, and load markers by viewport (`onCameraIdle` + `getVisibleRegion`).\n* Animating a moving car marker: interpolate positions with an `AnimationController` between updates, and update the marker set at a throttled rate.\n* **Grey map** = wrong API key, API not enabled, or billing not set up. Check `adb logcat`, which shows the auth failure.\n\n### Directions\nThe Maps SDK has **no routing built in**. Call the **Directions/Routes API** from your backend, decode the encoded polyline (`flutter_polyline_points` or your own decoder), and draw it as a `Polyline`. To open turn-by-turn navigation in Google/Apple Maps, use `url_launcher`:\n```dart\nfinal uri = Uri.parse('https://www.google.com/maps/dir/?api=1&destination=12.97,77.59&travelmode=driving');\nawait launchUrl(uri, mode: LaunchMode.externalApplication);\n```\n\n---\n\n## 35.6 OpenStreetMap with `flutter_map` (no Google dependency)\n```dart\nimport 'package:flutter_map/flutter_map.dart';\nimport 'package:latlong2/latlong.dart';\n\nFlutterMap(\n  options: const MapOptions(initialCenter: LatLng(12.9716, 77.5946), initialZoom: 13),\n  children: [\n    TileLayer(\n      urlTemplate: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',\n      userAgentPackageName: 'com.mycompany.app',     // required by the OSM tile usage policy\n    ),\n    MarkerLayer(markers: [\n      Marker(\n        point: const LatLng(12.9716, 77.5946),\n        width: 40, height: 40,\n        child: const Icon(Icons.location_pin, color: Colors.red, size: 40),\n      ),\n    ]),\n    PolylineLayer(polylines: [\n      Polyline(points: const [LatLng(12.97, 77.59), LatLng(12.98, 77.60)], strokeWidth: 4, color: Colors.blue),\n    ]),\n    const RichAttributionWidget(attributions: [TextSourceAttribution('OpenStreetMap contributors')]),\n  ],\n);\n```\n* It's pure Flutter widgets (no platform view), so it works the same on mobile, web and desktop.\n* ⚠️ The public OSM tile servers **must not be used for heavy production traffic** (tile usage policy). Use a tile provider (MapTiler, Stadia, Thunderforest, Mapbox raster tiles) or host your own tiles.\n* Offline tiles: `flutter_map_tile_caching`.\n* Other options: **`mapbox_maps_flutter`** (official Mapbox SDK, vector maps and navigation) and `apple_maps_flutter`.\n\n---\n\n## 35.7 Geofencing (alert me when I enter or leave an area)\n* The OS provides geofencing: Android `GeofencingClient` and iOS `CLCircularRegion` monitoring. iOS limits you to **20 regions per app**, and Android to **100 per app per user**.\n* In Flutter, use plugins (`native_geofence`, `geofence_service`, or the commercial `flutter_background_geolocation`) or write your own with Pigeon (Chapter 19).\n* Geofence events can wake your app in the background. The handler runs in a separate isolate, so mark it with `@pragma('vm:entry-point')` and set up dependencies again (Chapter 18).\n* Accuracy is roughly 100 m+. For smaller zones, combine with an active location stream while the app is in the foreground.\n\n---\n\n## 35.8 Battery & privacy best practices 🔋\n* Request the lowest accuracy that works (city-level search → `low`).\n* Use `distanceFilter` and intervals. Stop streams when the screen is hidden (cancel subscriptions in `dispose`, react to app lifecycle).\n* Use **significant-change / activity-based** tracking for long periods.\n* Send location updates in batches (store locally, upload every N points or minutes).\n* Show clearly when tracking is active (the persistent notification on Android, the blue indicator on iOS).\n* Treat location as **sensitive personal data**: get consent, keep it only as long as needed, encrypt it at rest, and declare it in the Play Data safety form and App Store privacy labels.\n* Mock locations: on Android, `Position.isMocked` can detect fake GPS apps. This matters for delivery and attendance apps.\n\n---\n\n## 35.9 Common map/location bugs\n| Bug | Fix |\n|---|---|\n| Grey/blank Google map | API key restrictions/SHA-1, SDK not enabled, billing |\n| Works in debug, fails in Play build | Add the Play App Signing SHA-1 to the key restrictions |\n| `myLocationEnabled` shows nothing | Location permission not granted before building the map |\n| Permission dialog never shows again | `deniedForever` → send the user to app settings |\n| Background updates stop after minutes (Android) | No foreground service, or OEM battery optimizations → foreground service + ask the user to exempt the app |\n| iOS background updates stop | `allowBackgroundLocationUpdates` + `UIBackgroundModes` + \"Always\" permission |\n| `getCurrentPosition` hangs indoors | Use `timeLimit` and fall back to the last known position |\n| Map gestures don't work inside ListView | `gestureRecognizers` with `EagerGestureRecognizer` |\n| Jank with many markers | Clustering, load by viewport, cache bitmap descriptors |\n\n---\n\n## 35.10 Interview questions — maps & location\n\n**Q1. How do you handle location permissions correctly?**\nCheck that the location service is on. Check the permission, then request it with an explanation first. Handle denied and denied-forever (open settings) cases. Ask for background permission separately and only when needed. Declare everything in the manifest and Info.plist.\n\n**Q2. How do you track location in the background on Android 14?**\nUse a foreground service with the location type, a visible notification, background location permission if tracking continues after the app is closed, and the store policy declaration. Use distance filters and batching to save battery.\n\n**Q3. google_maps_flutter vs flutter_map?**\ngoogle_maps_flutter is a native platform view with Google tiles, billing and familiar Google features. flutter_map is pure Flutter: tiles from any provider, works the same on every platform, and is easier to customize. You need a proper tile provider for production.\n\n**Q4. How do you show thousands of markers efficiently?**\nClustering, loading markers by viewport on camera idle, caching marker icons, and throttling updates.\n\n**Q5. How do you draw a route between two points?**\nCall a Directions/Routes API (ideally through your backend), decode the polyline, and draw a Polyline. For turn-by-turn, hand off to the native maps apps with url_launcher.\n\n**Q6. How do you detect fake GPS?**\nUse `Position.isMocked` on Android, plus server-side checks for impossible speed or jumps, and device integrity attestation.\n"}, {"n": 36, "file": "36-in-app-purchases-and-payments.md", "title": "Chapter 36 — In-App Purchases, Subscriptions & Payment Gateways (Full Code)", "subtitle": "In-App Purchases, Subscriptions & Payment Gateways (Full Code)", "short": "In-App Purchases & Payments", "sub": "Store billing, Stripe, Razorpay", "level": "intermediate", "minutes": 12, "qa": 7, "md": "# Chapter 36 — In-App Purchases, Subscriptions & Payment Gateways (Full Code)\n\n> **Goal:** Sell digital products with Apple/Google billing correctly (including server verification, restores and subscription states), and take payments for physical goods with Stripe and Razorpay. Money bugs are the most expensive bugs, so follow the rules in this chapter carefully.\n\n---\n\n## 36.1 5-year-old picture 💰\nIf you sell **stickers that live inside the app** (coins, premium mode), the **app store is the shopkeeper** and takes its share. If you sell **real things** (shoes, pizza, taxi rides), you use a normal **cash register** (payment gateway) like Stripe or Razorpay. And never trust the child (the app) when it says \"I paid!\". Always ask the bank (your server) to check.\n\n## 36.2 Which payment system? (store policies)\n| You sell | Use | Notes |\n|---|---|---|\n| Digital content/features used in the app (premium, coins, subscriptions, ad removal) | **Apple IAP / Google Play Billing** | Required by App Store guideline 3.1.1 and Google Play's payments policy. There are regional exceptions: e.g., US external purchase links on iOS after the 2025 court ruling, EU DMA alternatives, Play alternative/user-choice billing in some countries. Check current rules before deciding |\n| Physical goods/services (e-commerce, food, rides, tickets, consulting) | Payment gateway (Stripe, Razorpay, PayPal, Adyen, Braintree), Apple Pay / Google Pay via gateway | Store billing **not allowed** for these |\n| \"Reader\" apps (Netflix/Spotify style) | Special rules (external link entitlement) | Check Apple's reader app rules |\n| Person-to-person payments, donations to registered charities | Special cases | Check the guidelines |\n\n---\n\n## 36.3 Store product types\n| Type | Apple | Google | Example |\n|---|---|---|---|\n| Consumable | Consumable | In-app product (consume after use) | Coins, gems |\n| Non-consumable | Non-consumable | In-app product (not consumed) | Remove ads, unlock a level pack |\n| Auto-renewing subscription | Auto-renewable subscription (subscription groups) | Subscription with base plans & offers | Premium monthly/yearly |\n| Non-renewing subscription | Non-renewing | (model as in-app product) | Season pass |\n\nProducts are set up in **App Store Connect** (with agreements, tax and banking completed) and **Play Console** (the app must be uploaded to a testing track first). Product IDs should match across stores where possible (e.g., `premium_monthly`).\n\n---\n\n## 36.4 `in_app_purchase` (official plugin): complete purchase flow\n\n```dart\nimport 'dart:async';\nimport 'package:in_app_purchase/in_app_purchase.dart';\n\nclass BillingService {\n  BillingService(this._api);\n  final PurchaseVerificationApi _api;          // your backend\n  final InAppPurchase _iap = InAppPurchase.instance;\n  StreamSubscription\u003cList\u003cPurchaseDetails>>? _sub;\n\n  static const premiumMonthly = 'premium_monthly';\n  static const coins100 = 'coins_100';\n  static const removeAds = 'remove_ads';\n\n  final _products = \u003cString, ProductDetails>{};\n  final _status = StreamController\u003cBillingEvent>.broadcast();\n  Stream\u003cBillingEvent> get events => _status.stream;\n\n  /// ❗ Call EARLY (e.g., at app start), so purchases completed while the app was\n  /// closed or interrupted (pending, renewals, family approvals) are delivered and handled.\n  Future\u003cvoid> init() async {\n    _sub = _iap.purchaseStream.listen(\n      _onPurchases,\n      onError: (Object e) => _status.add(BillingError('$e')),\n    );\n    if (!await _iap.isAvailable()) {\n      _status.add(BillingError('Store not available'));\n      return;\n    }\n    final response = await _iap.queryProductDetails({premiumMonthly, coins100, removeAds});\n    if (response.notFoundIDs.isNotEmpty) {\n      // Wrong IDs, products not approved yet, app not uploaded to a test track, or agreements missing\n      _status.add(BillingError('Missing products: ${response.notFoundIDs}'));\n    }\n    for (final p in response.productDetails) {\n      _products[p.id] = p;              // p.title, p.description, p.price (localized string), p.rawPrice, p.currencyCode\n    }\n  }\n\n  ProductDetails? product(String id) => _products[id];\n\n  Future\u003cvoid> buy(String productId, {required String appUserId}) async {\n    final product = _products[productId];\n    if (product == null) throw StateError('Product $productId not loaded');\n    final param = PurchaseParam(\n      productDetails: product,\n      applicationUserName: appUserId,   // links the purchase to your user (obfuscated account id on Play)\n    );\n    if (productId == coins100) {\n      await _iap.buyConsumable(purchaseParam: param, autoConsume: true);\n    } else {\n      await _iap.buyNonConsumable(purchaseParam: param);   // ALSO used for subscriptions\n    }\n    // The result does NOT come back here. It arrives on purchaseStream.\n  }\n\n  Future\u003cvoid> restore() => _iap.restorePurchases();     // App Store requires a visible \"Restore Purchases\" button\n\n  Future\u003cvoid> _onPurchases(List\u003cPurchaseDetails> purchases) async {\n    for (final p in purchases) {\n      switch (p.status) {\n        case PurchaseStatus.pending:\n          _status.add(BillingPending(p.productID));       // e.g., cash payment or parental approval. Don't grant yet!\n        case PurchaseStatus.canceled:\n          _status.add(BillingCancelled(p.productID));\n        case PurchaseStatus.error:\n          _status.add(BillingError(p.error?.message ?? 'Purchase failed'));\n        case PurchaseStatus.purchased:\n        case PurchaseStatus.restored:\n          // ❗ Verify on YOUR server before granting anything\n          final ok = await _api.verify(\n            platform: p.verificationData.source,                         // 'app_store' / 'google_play'\n            productId: p.productID,\n            token: p.verificationData.serverVerificationData,           // Play purchase token / App Store receipt or JWS (depends on plugin/StoreKit version)\n          );\n          if (ok) {\n            _status.add(BillingSuccess(p.productID));\n          } else {\n            _status.add(BillingError('Verification failed'));\n          }\n      }\n      // ❗ Always complete. On Android, a purchase not acknowledged within 3 days is\n      // AUTOMATICALLY REFUNDED. On iOS, unfinished transactions are delivered again on every launch.\n      if (p.pendingCompletePurchase) {\n        await _iap.completePurchase(p);\n      }\n    }\n  }\n\n  Future\u003cvoid> dispose() async {\n    await _sub?.cancel();\n    await _status.close();\n  }\n}\n\nsealed class BillingEvent {}\nfinal class BillingPending extends BillingEvent { BillingPending(this.productId); final String productId; }\nfinal class BillingCancelled extends BillingEvent { BillingCancelled(this.productId); final String productId; }\nfinal class BillingSuccess extends BillingEvent { BillingSuccess(this.productId); final String productId; }\nfinal class BillingError extends BillingEvent { BillingError(this.message); final String message; }\n```\n> **When to complete a purchase:** complete it **after** your server has verified and granted the entitlement. If verification fails because of a temporary network error, don't complete it yet. The purchase will be delivered again so you can retry, but on Android remember the 3-day acknowledgement limit. If the purchase is invalid, complete it (or let it be refunded) and don't grant anything.\n\n### Paywall UI snippet\n```dart\nfinal product = billing.product(BillingService.premiumMonthly);\nFilledButton(\n  onPressed: product == null ? null : () => billing.buy(product.id, appUserId: userId),\n  child: Text(product == null ? 'Loading…' : 'Go Premium — ${product.price}/month'),  // ALWAYS show the store's localized price\n);\nTextButton(onPressed: billing.restore, child: const Text('Restore purchases'));\n```\nPaywall rules: show the price, the billing period, and the trial terms (\"then ₹299/month\"). Link to Terms and the Privacy Policy. Don't trick users. Apple and Google both reject misleading paywalls.\n\n### Platform-specific extras\n* **Android subscriptions with offers/base plans:** cast to `GooglePlayProductDetails` to get `subscriptionOfferDetails`. Upgrades/downgrades use `GooglePlayPurchaseParam(changeSubscriptionParam: ChangeSubscriptionParam(oldPurchaseDetails: ..., replacementMode: ...))`.\n* **iOS:** `InAppPurchaseStoreKitPlatformAddition` gives access to the code redemption sheet and the offer code UI. Newer plugin versions support StoreKit 2.\n* Use **Xcode StoreKit configuration files** for local testing without App Store Connect. Use sandbox testers, and Play **license testers** plus internal testing tracks.\n\n---\n\n## 36.5 Server-side verification & entitlements (the important part) 🔐\n```\nApp ──purchase token──► Your backend ──► Google Play Developer API (purchases.products / purchases.subscriptionsv2)\n                                     └──► App Store Server API (transaction info, JWS verification)\n         ◄── entitlement (premium until 2026-11-15) ──┘\nStore ──server notifications──► Your backend   (renewals, cancellations, refunds, billing retry, grace period)\n        • Google: Real-Time Developer Notifications (Pub/Sub)\n        • Apple: App Store Server Notifications V2\n```\n* The **server is the source of truth** for entitlements. The app asks `GET /me/entitlements` at startup and after purchases. It caches the answer locally for offline use, with a short trust window.\n* Protect against **replay**: one purchase token per user, and store the token with its order ID.\n* Handle every subscription state: active, in **grace period** (payment issue but access continues), **on hold / billing retry** (access paused), cancelled-but-active-until-expiry, expired, refunded/revoked, paused (Play), upgraded/downgraded.\n* Never decide \"premium\" from a client-side flag in SharedPreferences. That can be changed on a rooted device.\n\n---\n\n## 36.6 RevenueCat (managed subscriptions backend), the common choice\nRevenueCat (`purchases_flutter`) handles receipt validation, entitlements, cross-platform subscription status, webhooks, paywalls (`purchases_ui_flutter`), analytics and experiments.\n```dart\nawait Purchases.configure(PurchasesConfiguration(Platform.isIOS ? appleApiKey : googleApiKey)..appUserID = userId);\nfinal offerings = await Purchases.getOfferings();\nfinal package = offerings.current?.monthly;\nif (package != null) {\n  // Method names changed across major versions (e.g., purchasePackage vs purchase(PurchaseParams...)). Check your version.\n  final result = await Purchases.purchasePackage(package);\n}\nfinal info = await Purchases.getCustomerInfo();\nfinal isPremium = info.entitlements.active.containsKey('premium');\nPurchases.addCustomerInfoUpdateListener((info) { /* update UI */ });\n```\nTrade-off: you pay RevenueCat fees above a revenue threshold, and you depend on a vendor, but you save a lot of backend work. Alternatives: Adapty, Qonversion, Glassfy.\n\n---\n\n## 36.7 Stripe (`flutter_stripe`) for physical goods/services\n\n### Flow (PaymentIntent + Payment Sheet)\n```\n1. App → your backend: \"create order for cart X\"\n2. Backend → Stripe: create PaymentIntent(amount, currency, customer, idempotency key) → returns client_secret\n   (+ ephemeral key & customer id if saving cards)\n3. App: initPaymentSheet(clientSecret) → presentPaymentSheet()\n4. Stripe → backend webhook: payment_intent.succeeded → backend marks order PAID (source of truth)\n5. App polls/listens for order status (don't rely only on the app callback)\n```\n### Setup\n* Android: `MainActivity` must extend **`FlutterFragmentActivity`** (not FlutterActivity), and the app theme must be a `Theme.AppCompat`/`MaterialComponents` descendant. Otherwise the payment sheet crashes or does nothing.\n* iOS: a minimum iOS version per the README. Apple Pay needs a merchant ID capability.\n\n```dart\nimport 'package:flutter_stripe/flutter_stripe.dart';\n\nFuture\u003cvoid> main() async {\n  WidgetsFlutterBinding.ensureInitialized();\n  Stripe.publishableKey = const String.fromEnvironment('STRIPE_PK');   // publishable key only. NEVER the secret key\n  Stripe.merchantIdentifier = 'merchant.com.mycompany.shop';         // Apple Pay\n  await Stripe.instance.applySettings();\n  runApp(const App());\n}\n\nFuture\u003cPaymentOutcome> checkout(String orderId) async {\n  final intent = await api.createPaymentIntent(orderId);   // backend returns clientSecret, customerId, ephemeralKey\n  await Stripe.instance.initPaymentSheet(\n    paymentSheetParameters: SetupPaymentSheetParameters(\n      paymentIntentClientSecret: intent.clientSecret,\n      merchantDisplayName: 'My Shop',\n      customerId: intent.customerId,\n      customerEphemeralKeySecret: intent.ephemeralKey,\n      applePay: const PaymentSheetApplePay(merchantCountryCode: 'US'),\n      googlePay: const PaymentSheetGooglePay(merchantCountryCode: 'US', testEnv: true),\n      style: ThemeMode.system,\n      returnURL: 'myshop://stripe-redirect',   // for redirect-based payment methods\n    ),\n  );\n  try {\n    await Stripe.instance.presentPaymentSheet();\n    // The UI succeeded, but CONFIRM with the backend (webhook-updated order status)\n    final paid = await api.waitForOrderPaid(orderId, timeout: const Duration(seconds: 20));\n    return paid ? PaymentOutcome.success : PaymentOutcome.processing;\n  } on StripeException catch (e) {\n    if (e.error.code == FailureCode.Canceled) return PaymentOutcome.cancelled;\n    return PaymentOutcome.failed;\n  }\n}\nenum PaymentOutcome { success, processing, cancelled, failed }\n```\n3-D Secure (SCA) authentication is handled by the Payment Sheet. Use idempotency keys on the server so retries don't create duplicate charges.\n\n---\n\n## 36.8 Razorpay (popular in India) 🇮🇳\n```dart\nimport 'package:razorpay_flutter/razorpay_flutter.dart';\n\nclass RazorpayCheckout {\n  RazorpayCheckout(this._api) {\n    _razorpay.on(Razorpay.EVENT_PAYMENT_SUCCESS, _onSuccess);\n    _razorpay.on(Razorpay.EVENT_PAYMENT_ERROR, _onError);\n    _razorpay.on(Razorpay.EVENT_EXTERNAL_WALLET, _onWallet);\n  }\n  final OrdersApi _api;\n  final _razorpay = Razorpay();\n\n  Future\u003cvoid> pay({required String cartId, required String phone, required String email}) async {\n    // 1. Backend creates the Razorpay ORDER (amount in paise, receipt id) with its key secret\n    final order = await _api.createRazorpayOrder(cartId);\n    // 2. Open checkout with the PUBLIC key id + order_id\n    _razorpay.open({\n      'key': order.keyId,\n      'amount': order.amountPaise,          // e.g. 49900 = ₹499.00\n      'currency': 'INR',\n      'order_id': order.id,\n      'name': 'My Shop',\n      'description': 'Order #${order.receipt}',\n      'prefill': {'contact': phone, 'email': email},\n      'retry': {'enabled': true, 'max_count': 2},\n    });\n  }\n\n  Future\u003cvoid> _onSuccess(PaymentSuccessResponse r) async {\n    // 3. ❗ Backend verifies the signature HMAC_SHA256(order_id + \"|\" + payment_id, key_secret) == r.signature\n    await _api.verifyRazorpayPayment(orderId: r.orderId!, paymentId: r.paymentId!, signature: r.signature!);\n  }\n\n  void _onError(PaymentFailureResponse r) { /* r.code, r.message → show retry */ }\n  void _onWallet(ExternalWalletResponse r) { /* r.walletName */ }\n\n  void dispose() => _razorpay.clear();   // ❗ removes listeners\n}\n```\nAlso handle **payment captured webhooks** (`payment.captured`, `order.paid`) on the server. The app callback can be lost if the app is killed mid-payment. For UPI intent flows, check the plugin docs for the Android `\u003cqueries>` entries needed for UPI apps. Other Indian gateways: Cashfree, PayU, PhonePe PG, Paytm.\n\n---\n\n## 36.9 Google Pay / Apple Pay buttons (`pay` package)\nThe `pay` package shows the native Google Pay/Apple Pay buttons and returns a payment token. You send that token to your gateway (Stripe/Adyen/Braintree) on the server. The configuration JSON defines the gateway and merchant info. Apple Pay needs a merchant ID, a processing certificate and a domain or app capability.\n\n---\n\n## 36.10 Payment correctness checklist ✅\n- [ ] Prices come from the server or store (never hard-coded or computed only on the client)\n- [ ] The server creates orders/intents with **idempotency keys**\n- [ ] The app never marks an order paid. **Webhooks** do, and the app reads the status\n- [ ] Double-tap protection on the pay button\n- [ ] Recovery when the app is killed mid-payment (check pending orders at launch)\n- [ ] Every store purchase is verified server-side and completed/acknowledged\n- [ ] Restore purchases button (iOS); subscription management link (Play / App Store)\n- [ ] Refund/revocation notifications handled\n- [ ] Testing: sandbox/license testers, test cards (4242…), failure cases, 3DS, slow networks\n- [ ] PCI scope minimized (never touch raw card numbers; use SDK UIs/tokenization)\n- [ ] Analytics: checkout funnel events; alerts on payment failure spikes\n\n---\n\n## 36.11 Common payment bugs\n| Bug | Cause / Fix |\n|---|---|\n| Products not found | Product not active/approved, app not uploaded to a Play testing track, App Store agreements/tax/banking incomplete, bundle ID mismatch, waiting for propagation (can take hours) |\n| Users refunded automatically after 3 days (Play) | Purchases never acknowledged → `completePurchase` after granting |\n| \"Purchase dialog appears again on every launch\" (iOS) | Transactions not finished → `completePurchase` |\n| Premium lost after reinstall | No restore flow / entitlement not fetched from the server |\n| Payment sheet doesn't open on Android (Stripe) | `MainActivity` must be a `FlutterFragmentActivity`; AppCompat theme |\n| Duplicate charges | No idempotency key; double taps |\n| Paid but order shows failed | App killed before the callback → use webhooks + order status polling |\n| Razorpay success but backend unverified | Signature verification missing |\n\n---\n\n## 36.12 Interview questions — payments\n\n**Q1. When must you use in-app purchases instead of Stripe?**\nFor digital goods or features consumed in the app (premium, coins, subscriptions), store billing is required, with some regional exceptions. Physical goods and real-world services must use regular gateways.\n\n**Q2. Why verify purchases on the server?**\nClient data can be tampered with. Server verification against the Apple/Google APIs prevents fraud and replay. The server tracks entitlements and processes renewal and refund notifications.\n\n**Q3. What happens if you don't acknowledge a Play purchase?**\nIt is automatically refunded after 3 days. On iOS, unfinished transactions keep being delivered again.\n\n**Q4. How do you handle subscriptions' lifecycle?**\nWith server notifications (RTDN, App Store Server Notifications) that update the entitlement state: renewals, grace period, billing retry or hold, cancellation, expiry, refunds and plan changes. The app reads the entitlements from the backend.\n\n**Q5. Describe a reliable Stripe checkout flow.**\nThe backend creates a PaymentIntent with an idempotency key. The app shows the Payment Sheet with the client secret. A Stripe webhook marks the order paid, and the app confirms the order status with the backend.\n\n**Q6. How does Razorpay verification work?**\nThe backend creates the order. After checkout, the app sends payment_id, order_id and signature to the backend, which checks the HMAC-SHA256 with the key secret. Webhooks give extra assurance.\n\n**Q7. RevenueCat — why use it?**\nIt manages receipt validation, cross-platform entitlements, webhooks, paywalls and analytics, so you don't build a subscription backend yourself. The trade-off is cost and vendor dependency.\n"}, {"n": 37, "file": "37-state-restoration-slivers-advanced-widgets.md", "title": "Chapter 37 — State Restoration, Custom Slivers & Advanced Widgets (Tables, Overlays, Search, Stepper, Autocomplete)", "subtitle": "State Restoration, Custom Slivers & Advanced Widgets (Tables, Overlays, Search, Stepper, Autocomplete)", "short": "Restoration & Advanced Widgets", "sub": "Process death, slivers, tables, overlays", "level": "advanced", "minutes": 14, "qa": 7, "md": "# Chapter 37 — State Restoration, Custom Slivers & Advanced Widgets (Tables, Overlays, Search, Stepper, Autocomplete)\n\n> **Goal:** Make apps survive Android process death without losing the user's work. Understand how slivers lay out by writing one. Master the \"enterprise\" widgets used in dashboards and admin apps: data tables, 2D tables, overlays/dropdowns, search and multi-step forms.\n\n---\n\n# Part A — State Restoration ♻️\n\n## 37.1 5-year-old picture\nYou're drawing, and Mom says \"bath time!\" and takes your paper away (the OS kills the app to free memory). When you come back, a good mom gives you **your same drawing back**, not a blank page. **State restoration** is that mom.\n\n## 37.2 Why it matters\nOn Android (and sometimes iOS), when your app is in the background and the device needs memory, the OS **kills the process**. When the user returns from the recent apps list, Android recreates the app and expects it to look **as they left it**: same screen, same scroll position, same typed text. Without restoration, Flutter starts from `main()` again with fresh state. The user lands on the home screen and their half-filled form is gone. Common real cases:\n* The user opens the camera app or a payment app (UPI, bank 3DS page) from your app, and your app gets killed meanwhile.\n* Low-end devices with many apps open.\n\n**Test it:** Android **Developer options → \"Don't keep activities\"**, or `adb shell am kill \u003cpackage>` while the app is in the background. Then reopen it from Recents.\n\n## 37.3 How it works\n* `MaterialApp(restorationScopeId: 'app')` turns on restoration for the app and its Navigator.\n* Each widget that wants to restore state uses **`RestorationMixin`**, defines a **`restorationId`**, and registers **`RestorableProperty`** objects in `restoreState`.\n* Data is saved into a **`RestorationBucket`** tree. The engine sends it to the OS (`onSaveInstanceState` on Android, NSCoder on iOS) and gets it back on relaunch.\n* Only small, serializable data belongs here (IDs, scroll offsets, text, selected tab). **Do not** put large data or secrets in it. Load data again from the repository using the restored IDs.\n\n## 37.4 Restoring a counter, a text field and a tab\n```dart\nclass App extends StatelessWidget {\n  const App({super.key});\n  @override\n  Widget build(BuildContext context) =>\n      const MaterialApp(restorationScopeId: 'app', home: EditProfilePage());\n}\n\nclass EditProfilePage extends StatefulWidget {\n  const EditProfilePage({super.key});\n  @override\n  State\u003cEditProfilePage> createState() => _EditProfilePageState();\n}\n\nclass _EditProfilePageState extends State\u003cEditProfilePage>\n    with RestorationMixin, SingleTickerProviderStateMixin {\n  // Built-in restorable types: RestorableInt, RestorableDouble, RestorableBool, RestorableString,\n  // RestorableDateTime, RestorableTextEditingController, RestorableEnum, nullable variants (RestorableIntN, …)\n  final RestorableTextEditingController _name = RestorableTextEditingController();\n  final RestorableTextEditingController _bio = RestorableTextEditingController();\n  final RestorableInt _tab = RestorableInt(0);\n  final RestorableBool _agreed = RestorableBool(false);\n\n  // A TabController we own: listener added ONCE (never inside build)\n  late final TabController _tabs = TabController(length: 2, vsync: this)\n    ..addListener(() => _tab.value = _tabs.index);\n\n  @override\n  String get restorationId => 'edit_profile';     // unique among siblings in its restoration scope\n\n  @override\n  void restoreState(RestorationBucket? oldBucket, bool initialRestore) {\n    registerForRestoration(_name, 'name');\n    registerForRestoration(_bio, 'bio');\n    registerForRestoration(_tab, 'tab');\n    registerForRestoration(_agreed, 'agreed');\n    _tabs.index = _tab.value;                     // apply the restored tab\n    // initialRestore == true → values just came back from the OS.\n    // If there is nothing saved, the defaults above stay. Load server data now if needed:\n    if (_name.value.text.isEmpty) _loadFromServerIfEmpty();\n  }\n\n  void _loadFromServerIfEmpty() { /* fetch the profile, then set _name.value.text = ... */ }\n\n  @override\n  void dispose() {\n    _tabs.dispose();\n    _name.dispose();      // ❗ restorable properties must be disposed\n    _bio.dispose();\n    _tab.dispose();\n    _agreed.dispose();\n    super.dispose();\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n      appBar: AppBar(\n        title: const Text('Edit profile'),\n        bottom: TabBar(controller: _tabs, tabs: const [Tab(text: 'Basic'), Tab(text: 'More')]),\n      ),\n      body: TabBarView(controller: _tabs, children: [\n        ListView(padding: const EdgeInsets.all(16), children: [\n          TextField(controller: _name.value, decoration: const InputDecoration(labelText: 'Name')),\n          CheckboxListTile(\n            value: _agreed.value,\n            onChanged: (v) => setState(() => _agreed.value = v ?? false),\n            title: const Text('Show profile publicly'),\n          ),\n        ]),\n        ListView(padding: const EdgeInsets.all(16), children: [\n          TextField(controller: _bio.value, maxLines: 5, decoration: const InputDecoration(labelText: 'Bio')),\n        ]),\n      ]),\n    );\n  }\n}\n```\n\n## 37.5 Restoring navigation\nRoutes pushed with plain `Navigator.push` are **not** restorable, because closures can't be serialized. Use the restorable APIs with a **static** route builder and serializable arguments:\n```dart\n// Push\nNavigator.restorablePush(context, _detailsRouteBuilder, arguments: productId);\n\n// MUST be a static or top-level function\n@pragma('vm:entry-point')\nstatic Route\u003cvoid> _detailsRouteBuilder(BuildContext context, Object? arguments) {\n  return MaterialPageRoute\u003cvoid>(builder: (_) => ProductDetailsPage(id: arguments! as String));\n}\n// Also: restorablePushNamed, restorablePushReplacement, restorablePopAndPushNamed …\n// Dialogs: showDialog is not restorable → use Navigator.restorablePush with DialogRoute / RawDialogRoute.\n```\n* **go_router**: set `restorationScopeId` on `GoRouter` (and `MaterialApp.router`). Pages restore from the URL/location. Path parameters restore; **`extra` objects need an `extraCodec`** to be restorable (Chapter 11).\n* Scroll positions: give scrollables a `restorationId` (`ListView(restorationId: 'feed')`) inside a restoration scope.\n* Custom types: subclass `RestorableValue\u003cT>` (implement `createDefaultValue`, `fromPrimitives`, `toPrimitives`, `didUpdateValue`), or `RestorableListenable`.\n* Testing: `await tester.restartAndRestore();` in widget tests (with `restorationScopeId` set) simulates the save → kill → restore cycle. Also `tester.getRestorationData()` / `restoreFrom(data)`.\n\n## 37.6 Alternatives & complements\n* Persist drafts (form data) to local storage as the user types (debounced). This also survives the user swiping the app away, which restoration does **not** cover.\n* Hydrated state management (`hydrated_bloc`, Riverpod offline persistence) for app-level state.\n* Restore the user's **context** (which screen) through routing restoration, and their **data** through repositories.\n\n---\n\n# Part B — Writing a Custom Sliver (to really understand slivers) 🥓\n\n## 37.7 The sliver protocol recap\n* **In:** `SliverConstraints`\n  * `scrollOffset`: how far this sliver's start has scrolled past the viewport's leading edge\n  * `remainingPaintExtent`: how much visible space is left\n  * `crossAxisExtent`\n  * `overlap`: pinned headers above you\n  * `cacheOrigin`/`remainingCacheExtent`\n  * `axisDirection`, `growthDirection`, `userScrollDirection`\n* **Out:** `SliverGeometry`\n  * `scrollExtent`: total scrollable length of this sliver\n  * `paintExtent`: how much it paints now (≤ remainingPaintExtent)\n  * `layoutExtent`: how much space it uses before the next sliver (defaults to paintExtent)\n  * `maxPaintExtent`\n  * `hitTestExtent`\n  * `paintOrigin`: draw offset; negative values allow overlap effects\n  * `cacheExtent`, `hasVisualOverflow`\n\n## 37.8 Example: how `SliverToBoxAdapter` really works\nThis is essentially the framework's own implementation (`RenderSliverToBoxAdapter`). Reading it teaches you the protocol:\n```dart\nclass MySliverBox extends SingleChildRenderObjectWidget {\n  const MySliverBox({super.key, required Widget super.child});\n  @override\n  RenderMySliverBox createRenderObject(BuildContext context) => RenderMySliverBox();\n}\n\nclass RenderMySliverBox extends RenderSliverSingleBoxAdapter {\n  @override\n  void performLayout() {\n    if (child == null) {\n      geometry = SliverGeometry.zero;\n      return;\n    }\n    final constraints = this.constraints;\n    // 1. Lay out the box child with box constraints: cross axis = viewport width, main axis unbounded\n    child!.layout(constraints.asBoxConstraints(), parentUsesSize: true);\n    final childExtent = switch (constraints.axis) {\n      Axis.horizontal => child!.size.width,\n      Axis.vertical => child!.size.height,\n    };\n    // 2. How much of [0, childExtent] is visible given the current scroll offset?\n    final paintedChildSize = calculatePaintOffset(constraints, from: 0.0, to: childExtent);\n    final cacheExtent = calculateCacheOffset(constraints, from: 0.0, to: childExtent);\n    // 3. Report geometry\n    geometry = SliverGeometry(\n      scrollExtent: childExtent,\n      paintExtent: paintedChildSize,\n      cacheExtent: cacheExtent,\n      maxPaintExtent: childExtent,\n      hitTestExtent: paintedChildSize,\n      hasVisualOverflow: childExtent > constraints.remainingPaintExtent || constraints.scrollOffset > 0.0,\n    );\n    // 4. Position the child (negative offset when partially scrolled off the top)\n    setChildParentData(child!, constraints, geometry!);\n  }\n}\n// Usage: CustomScrollView(slivers: [MySliverBox(child: Text('Hello')), SliverList(...)])\n```\n\n## 37.9 Example: a sliver that fades its child as it scrolls away\nBuilding on the same class, override `paint` to apply opacity based on the scroll offset:\n```dart\nclass RenderFadingSliverBox extends RenderMySliverBox {\n  @override\n  bool get alwaysNeedsCompositing => child != null;   // we push an OpacityLayer (same idea as RenderOpacity)\n\n  @override\n  void paint(PaintingContext context, Offset offset) {\n    if (child == null || geometry == null || !geometry!.visible) {\n      layer = null;\n      return;\n    }\n    final extent = geometry!.scrollExtent;\n    final progress = extent == 0 ? 0.0 : (constraints.scrollOffset / extent).clamp(0.0, 1.0);\n    final alpha = ((1 - progress) * 255).round();\n    final childParentData = child!.parentData! as SliverPhysicalParentData;\n    layer = context.pushOpacity(\n      offset,\n      alpha,\n      (context, offset) => context.paintChild(child!, offset + childParentData.paintOffset),\n      oldLayer: layer as OpacityLayer?,      // reuse the layer between frames\n    );\n  }\n}\n```\nThe sliver is laid out again on every scroll, so `paint` runs with the new `scrollOffset` and the fade updates automatically. (Create a widget class whose `createRenderObject` returns `RenderFadingSliverBox`, just like `MySliverBox`.) For most pinned/floating headers, **don't** write render slivers. Use `SliverPersistentHeader`, `PinnedHeaderSliver`, `SliverFloatingHeader`, `SliverResizingHeader` or `SliverLayoutBuilder`:\n```dart\nSliverLayoutBuilder(\n  builder: (context, constraints) {\n    final collapsed = constraints.scrollOffset > 120;\n    return SliverToBoxAdapter(child: AnimatedOpacity(opacity: collapsed ? 0 : 1, duration: const Duration(milliseconds: 200), child: const Header()));\n  },\n);\n```\n\n---\n\n# Part C — Data tables 📊\n\n## 37.10 `DataTable` (small tables) with sorting & selection\n```dart\nclass OrdersTable extends StatefulWidget {\n  const OrdersTable({super.key, required this.orders});\n  final List\u003cOrder> orders;\n  @override\n  State\u003cOrdersTable> createState() => _OrdersTableState();\n}\n\nclass _OrdersTableState extends State\u003cOrdersTable> {\n  late List\u003cOrder> _rows = [...widget.orders];\n  int? _sortColumn;\n  bool _ascending = true;\n  final _selected = \u003cString>{};\n\n  void _sort\u003cT extends Comparable\u003cT>>(T Function(Order o) key, int column, bool asc) {\n    setState(() {\n      _rows.sort((a, b) => asc ? key(a).compareTo(key(b)) : key(b).compareTo(key(a)));\n      _sortColumn = column;\n      _ascending = asc;\n    });\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return SingleChildScrollView(                 // horizontal scroll for wide tables\n      scrollDirection: Axis.horizontal,\n      child: DataTable(\n        sortColumnIndex: _sortColumn,\n        sortAscending: _ascending,\n        showCheckboxColumn: true,\n        columns: [\n          DataColumn(label: const Text('Order'), onSort: (i, asc) => _sort((o) => o.id, i, asc)),\n          DataColumn(label: const Text('Customer'), onSort: (i, asc) => _sort((o) => o.customer, i, asc)),\n          DataColumn(label: const Text('Total'), numeric: true, onSort: (i, asc) => _sort((o) => o.total, i, asc)),\n          const DataColumn(label: Text('Status')),\n        ],\n        rows: [\n          for (final o in _rows)\n            DataRow(\n              key: ValueKey(o.id),\n              selected: _selected.contains(o.id),\n              onSelectChanged: (v) => setState(() => v! ? _selected.add(o.id) : _selected.remove(o.id)),\n              cells: [\n                DataCell(Text(o.id)),\n                DataCell(Text(o.customer)),\n                DataCell(Text('₹${o.total.toStringAsFixed(2)}')),\n                DataCell(Chip(label: Text(o.status))),\n              ],\n            ),\n        ],\n      ),\n    );\n  }\n}\n```\n⚠️ `DataTable` builds **all rows** at once. It's fine for tens of rows, but slow for thousands.\n\n## 37.11 `PaginatedDataTable` (pages of rows)\n```dart\nclass OrdersSource extends DataTableSource {\n  OrdersSource(this.orders);\n  final List\u003cOrder> orders;\n\n  @override\n  DataRow? getRow(int index) {\n    if (index >= orders.length) return null;\n    final o = orders[index];\n    return DataRow.byIndex(index: index, cells: [DataCell(Text(o.id)), DataCell(Text(o.customer)), DataCell(Text('${o.total}'))]);\n  }\n\n  @override\n  int get rowCount => orders.length;\n  @override\n  bool get isRowCountApproximate => false;   // true when the server total is unknown\n  @override\n  int get selectedRowCount => 0;\n}\n\nPaginatedDataTable(\n  header: const Text('Orders'),\n  rowsPerPage: 10,\n  availableRowsPerPage: const [10, 25, 50],\n  onRowsPerPageChanged: (v) => setState(() => _rowsPerPage = v!),\n  onPageChanged: (firstRowIndex) => _maybeFetchMore(firstRowIndex),   // load server pages lazily\n  columns: const [DataColumn(label: Text('Order')), DataColumn(label: Text('Customer')), DataColumn(label: Text('Total'), numeric: true)],\n  source: OrdersSource(orders),\n);\n```\nWhen the data changes, call `notifyListeners()` on the source (`DataTableSource` is a `ChangeNotifier`).\n\n## 37.12 Huge 2D tables: `TableView` (`two_dimensional_scrollables`, official)\nIt builds lazily in **both directions**, supports pinned header rows and columns, and handles very large grids such as spreadsheets:\n```dart\nimport 'package:two_dimensional_scrollables/two_dimensional_scrollables.dart';\n\nTableView.builder(\n  rowCount: 10000,\n  columnCount: 50,\n  pinnedRowCount: 1,           // sticky header row\n  pinnedColumnCount: 1,        // sticky first column\n  columnBuilder: (index) => TableSpan(\n    extent: FixedTableSpanExtent(index == 0 ? 160 : 100),\n    foregroundDecoration: const TableSpanDecoration(border: TableSpanBorder(trailing: BorderSide(color: Colors.black12))),\n  ),\n  rowBuilder: (index) => TableSpan(\n    extent: const FixedTableSpanExtent(44),\n    backgroundDecoration: TableSpanDecoration(color: index.isEven ? Colors.black.withValues(alpha: 0.03) : null),\n  ),\n  cellBuilder: (context, vicinity) => TableViewCell(\n    child: Padding(\n      padding: const EdgeInsets.symmetric(horizontal: 8),\n      child: Align(\n        alignment: Alignment.centerLeft,\n        child: Text(vicinity.row == 0 ? 'Col ${vicinity.column}' : 'R${vicinity.row}C${vicinity.column}'),\n      ),\n    ),\n  ),\n);\n```\nThe same package has `TreeView` for hierarchical rows. Other options: `data_table_2` (a DataTable with fixed headers), `syncfusion_flutter_datagrid` and `pluto_grid`/`trina_grid` (feature-rich grids with editing, filtering and export; check licenses).\n\n---\n\n# Part D — Overlays, dropdowns & search 🪟\n\n## 37.13 `OverlayPortal`: a custom anchored dropdown\n```dart\nclass AnchoredMenu extends StatefulWidget {\n  const AnchoredMenu({super.key, required this.items, required this.onSelected});\n  final List\u003cString> items;\n  final ValueChanged\u003cString> onSelected;\n  @override\n  State\u003cAnchoredMenu> createState() => _AnchoredMenuState();\n}\n\nclass _AnchoredMenuState extends State\u003cAnchoredMenu> {\n  final _portal = OverlayPortalController();\n  final _link = LayerLink();\n  final _groupId = Object();           // tapping either the button or the menu doesn't count as \"outside\"\n\n  @override\n  Widget build(BuildContext context) {\n    return OverlayPortal(\n      controller: _portal,\n      overlayChildBuilder: (context) => CompositedTransformFollower(\n        link: _link,\n        targetAnchor: Alignment.bottomLeft,       // stick the menu's top-left to the button's bottom-left\n        followerAnchor: Alignment.topLeft,\n        offset: const Offset(0, 4),\n        child: Align(\n          alignment: AlignmentDirectional.topStart,   // the overlay gives full-screen constraints → let the menu size itself\n          child: TapRegion(\n            groupId: _groupId,\n            onTapOutside: (_) =>
