    }\n  }\n\n  @override\n  void dispose() {\n    _controller.dispose();\n    super.dispose();\n  }\n\n  void scrollToTop() => _controller.animateTo(0,\n      duration: const Duration(milliseconds: 400), curve: Curves.easeOut);\n  ...\n}\n```\n* `jumpTo(offset)`, `animateTo(offset, ...)`, `offset`, `position.maxScrollExtent`, `position.userScrollDirection`, `hasClients` (check before using!).\n* Error: *\"ScrollController attached to multiple scroll views\"* — same controller given to two scrollables. *\"ScrollController not attached to any scroll views\"* — used before build or after dispose (`if (_controller.hasClients)`).\n* `NotificationListener\u003cScrollNotification>` alternative to controllers: listen to `ScrollStartNotification`, `ScrollUpdateNotification`, `ScrollEndNotification`, `OverscrollNotification`, `UserScrollNotification`; return `true` to stop bubbling.\n* Scroll to a specific widget: `Scrollable.ensureVisible(key.currentContext!)`; for index-based scrolling in long lazy lists use `scrollable_positioned_list` / `super_sliver_list` packages (ListView can't scroll to an index of unbuilt variable-height items).\n\n---\n\n## 9.4 Infinite scrolling / pagination (production pattern)\n\n```dart\nclass PagedList extends StatefulWidget { ... }\n\nclass _PagedListState extends State\u003cPagedList> {\n  final _items = \u003cItem>[];\n  int _page = 1;\n  bool _loading = false;\n  bool _hasMore = true;\n  Object? _error;\n\n  @override\n  void initState() { super.initState(); _loadMore(); }\n\n  Future\u003cvoid> _loadMore() async {\n    if (_loading || !_hasMore) return;            // ❗ guard against duplicate calls\n    setState(() { _loading = true; _error = null; });\n    try {\n      final page = await api.fetchItems(page: _page, limit: 20);\n      if (!mounted) return;\n      setState(() {\n        _items.addAll(page);\n        _page++;\n        _hasMore = page.length == 20;\n      });\n    } catch (e) {\n      if (mounted) setState(() => _error = e);\n    } finally {\n      if (mounted) setState(() => _loading = false);\n    }\n  }\n\n  Future\u003cvoid> _refresh() async {\n    setState(() { _items.clear(); _page = 1; _hasMore = true; });\n    await _loadMore();\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return RefreshIndicator(\n      onRefresh: _refresh,\n      child: ListView.builder(\n        physics: const AlwaysScrollableScrollPhysics(),\n        itemCount: _items.length + 1,   // +1 for footer\n        itemBuilder: (context, i) {\n          if (i \u003c _items.length) {\n            if (i == _items.length - 5) _loadMore();  // prefetch near end (side effect in build: acceptable here because guarded, but many teams prefer a scroll listener)\n            return ItemTile(key: ValueKey(_items[i].id), item: _items[i]);\n          }\n          if (_error != null) return TextButton(onPressed: _loadMore, child: const Text('Retry'));\n          if (_hasMore) return const Padding(padding: EdgeInsets.all(16), child: Center(child: CircularProgressIndicator()));\n          return const SizedBox.shrink();\n        },\n      ),\n    );\n  }\n}\n```\n⚠️ Calling `_loadMore()` (which calls `setState`) from `itemBuilder` *during build* can trigger \"setState() called during build\". Safer: schedule it: `WidgetsBinding.instance.addPostFrameCallback((_) => _loadMore());` or use a scroll listener. Packages: **`infinite_scroll_pagination`** (popular, handles all states).\n\nPagination styles: **offset/limit (page numbers)** (simple, but duplicates/skips when data changes) vs **cursor-based** (`nextCursor` from server; stable for feeds). Senior interview: prefer cursor-based for live feeds.\n\n---\n\n## 9.5 GridView\n\n```dart\nGridView.builder(\n  gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(\n    crossAxisCount: 2, mainAxisSpacing: 8, crossAxisSpacing: 8, childAspectRatio: 3 / 4,\n  ),\n  itemCount: products.length,\n  itemBuilder: (_, i) => ProductCard(product: products[i]),\n);\n\n// Responsive: as many columns as fit with max tile width 200\nGridView.builder(\n  gridDelegate: const SliverGridDelegateWithMaxCrossAxisExtent(maxCrossAxisExtent: 200, childAspectRatio: 1),\n  ...\n);\nGridView.count(crossAxisCount: 3, children: [...]);\nGridView.extent(maxCrossAxisExtent: 150, children: [...]);\n```\nGotcha: grid tiles have **fixed aspect ratio**; content taller than the tile → overflow. Use `childAspectRatio` or `mainAxisExtent` (fixed height) on the delegate. Staggered/masonry grids: `flutter_staggered_grid_view` package.\n\n---\n\n## 9.6 PageView, TabBarView, carousels\n\n```dart\nfinal _pageController = PageController(viewportFraction: 0.9);  // peek next page\nPageView.builder(\n  controller: _pageController,\n  itemCount: banners.length,\n  onPageChanged: (i) => setState(() => _current = i),\n  itemBuilder: (_, i) => BannerCard(banners[i]),\n);\n_pageController.animateToPage(2, duration: const Duration(milliseconds: 300), curve: Curves.ease);\n```\n* Material 3 `CarouselView` (Flutter 3.24+) for carousels.\n* Tabs: `DefaultTabController(length: 3, child: Scaffold(appBar: AppBar(bottom: TabBar(tabs: ...)), body: TabBarView(children: ...)))`. Or a manual `TabController` with `TickerProviderStateMixin`.\n* Tabs/pages lose state when scrolled away → keep alive (9.8).\n\n---\n\n## 9.7 Slivers & CustomScrollView 🥓\n\nA **sliver** is a piece of a scrollable area that knows how to lay itself out lazily based on the visible portion (`SliverConstraints` in, `SliverGeometry` out — a different protocol from boxes!). `ListView` itself is just a `CustomScrollView` with one `SliverList` (plus padding).\n\nUse **CustomScrollView** when you want **multiple different scrolling things to scroll together as one** (header + grid + list + footer), collapsing app bars, sticky headers — **instead of nesting ListViews with shrinkWrap**.\n\n```dart\nCustomScrollView(\n  slivers: [\n    SliverAppBar(\n      pinned: true,          // stays visible (collapsed) at top\n      floating: false,       // reappears immediately on scroll up if true\n      snap: false,           // with floating: snaps fully open/closed\n      expandedHeight: 220,\n      stretch: true,\n      flexibleSpace: FlexibleSpaceBar(\n        title: const Text('Goa Trip'),\n        background: Image.network(coverUrl, fit: BoxFit.cover),\n      ),\n    ),\n    const SliverToBoxAdapter(child: Padding(padding: EdgeInsets.all(16), child: Text('Highlights'))),\n    SliverPadding(\n      padding: const EdgeInsets.symmetric(horizontal: 16),\n      sliver: SliverGrid.builder(\n        gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 3, mainAxisSpacing: 8, crossAxisSpacing: 8),\n        itemCount: photos.length,\n        itemBuilder: (_, i) => PhotoTile(photos[i]),\n      ),\n    ),\n    SliverList.separated(\n      itemCount: reviews.length,\n      separatorBuilder: (_, __) => const Divider(),\n      itemBuilder: (_, i) => ReviewTile(reviews[i]),\n    ),\n    const SliverFillRemaining(hasScrollBody: false, child: Center(child: Text('The end'))),\n  ],\n);\n```\n\n### Sliver catalogue\n| Sliver | Purpose |\n|---|---|\n| `SliverList` / `SliverList.builder` / `.separated` / `.list` | Lazy list |\n| `SliverFixedExtentList`, `SliverPrototypeExtentList`, `SliverVariedExtentList` | Faster lists with known extents |\n| `SliverGrid` | Lazy grid |\n| `SliverAppBar`, `SliverAppBar.medium/.large` (M3) | Collapsing app bar |\n| `SliverToBoxAdapter` | Put one normal (box) widget inside |\n| `SliverPadding` | Padding around a sliver |\n| `SliverFillRemaining` | Fill leftover viewport space |\n| `SliverFillViewport` | Children fill viewport (pages) |\n| `SliverPersistentHeader` | Custom sticky/collapsing headers (with delegate) |\n| `SliverOpacity`, `SliverIgnorePointer`, `SliverVisibility`, `SliverOffstage` | Sliver versions of effects |\n| `SliverAnimatedList` | Animated insert/remove |\n| `SliverLayoutBuilder` | Build based on SliverConstraints |\n| `SliverMainAxisGroup`, `SliverCrossAxisGroup` (3.13+) | Group slivers; sticky header per section with `pinned` SliverPersistentHeader |\n| `SliverResizingHeader`, `PinnedHeaderSliver`, `SliverFloatingHeader` (3.24+) | Easier headers without delegates |\n| `DecoratedSliver` (3.16+) | Background decoration for slivers |\n| `SliverSafeArea` | Safe area for slivers |\n\n**Error:** putting a box widget directly in `slivers:` → *\"A RenderViewport expected a child of type RenderSliver but received a child of type RenderPadding\"* (or similar). Wrap box widgets in `SliverToBoxAdapter`; use `SliverPadding` not `Padding`.\n\n### SliverPersistentHeader (sticky header)\n```dart\nclass _HeaderDelegate extends SliverPersistentHeaderDelegate {\n  _HeaderDelegate(this.title);\n  final String title;\n  @override double get minExtent => 48;\n  @override double get maxExtent => 48;\n  @override\n  Widget build(BuildContext context, double shrinkOffset, bool overlapsContent) =>\n      Container(color: Theme.of(context).colorScheme.surface, alignment: Alignment.centerLeft,\n          padding: const EdgeInsets.symmetric(horizontal: 16), child: Text(title));\n  @override\n  bool shouldRebuild(_HeaderDelegate old) => old.title != title;\n}\nSliverPersistentHeader(pinned: true, delegate: _HeaderDelegate('Section A'));\n```\nFor grouped sticky headers (\"contacts A, B, C\"), use `SliverMainAxisGroup` with a pinned header per group, or the `sliver_tools` / `flutter_sticky_header` packages.\n\n### NestedScrollView\nOuter header (e.g., collapsing app bar + TabBar) + inner scrollable per tab, coordinated:\n```dart\nNestedScrollView(\n  headerSliverBuilder: (context, innerBoxIsScrolled) => [\n    SliverOverlapAbsorber(\n      handle: NestedScrollView.sliverOverlapAbsorberHandleFor(context),\n      sliver: SliverAppBar(pinned: true, expandedHeight: 200, forceElevated: innerBoxIsScrolled,\n        bottom: const TabBar(tabs: [Tab(text: 'Posts'), Tab(text: 'Media')])),\n    ),\n  ],\n  body: TabBarView(children: [PostsTab(), MediaTab()]), // each uses SliverOverlapInjector at top\n);\n```\nNestedScrollView has subtle bugs (overlap, scroll position sharing); test carefully.\n\n---\n\n## 9.8 Keeping state alive in lists, tabs and pages\n\nLazy lists **dispose** off-screen items (state lost: text typed, video position, checkbox local state). Options:\n1. **Lift state up** into a model / state management (best practice).\n2. `AutomaticKeepAliveClientMixin`:\n```dart\nclass _TabState extends State\u003cMyTab> with AutomaticKeepAliveClientMixin {\n  @override\n  bool get wantKeepAlive => true;\n  @override\n  Widget build(BuildContext context) {\n    super.build(context);  // ❗ must call\n    return ListView(...);\n  }\n}\n```\n3. `PageStorageKey` to remember **scroll position** across tab switches:\n`ListView(key: const PageStorageKey('feed-list'), ...)`.\n4. `IndexedStack` for bottom nav tabs (keeps all alive — memory trade-off), or go_router's `StatefulShellRoute` (Chapter 11).\n\n---\n\n## 9.9 Animated lists & reordering\n```dart\nfinal _listKey = GlobalKey\u003cAnimatedListState>();\nAnimatedList(\n  key: _listKey,\n  initialItemCount: items.length,\n  itemBuilder: (context, i, animation) => SizeTransition(sizeFactor: animation, child: ItemTile(items[i])),\n);\nvoid insert(Item item) { items.insert(0, item); _listKey.currentState!.insertItem(0); }\nvoid remove(int i) {\n  final removed = items.removeAt(i);\n  _listKey.currentState!.removeItem(i, (ctx, anim) => SizeTransition(sizeFactor: anim, child: ItemTile(removed)));\n}\n```\n`ReorderableListView.builder` (needs keys), `SliverReorderableList`, `ReorderableDragStartListener` for custom handles. `implicitly_animated_reorderable_list` / `animated_list_plus` packages diff lists automatically.\n\n---\n\n## 9.10 Scroll performance checklist ⚡\n1. Use `.builder` constructors for long lists.\n2. Provide `itemExtent`/`prototypeItem` when heights are fixed.\n3. Keep `itemBuilder` cheap: no heavy computation, no synchronous JSON parsing, no creating controllers.\n4. Use `const` widgets inside items.\n5. Avoid `shrinkWrap: true` + nested ListViews; use slivers.\n6. Images: proper sizes (`cacheWidth`), `cached_network_image`, placeholders with fixed sizes (avoid layout jumps).\n7. Avoid `Opacity`, `ClipPath`, `BackdropFilter`, `saveLayer`-heavy effects per item; avoid `IntrinsicHeight` in items.\n8. Avoid rebuilding the whole list when one item changes: per-item state (e.g., `select` in Provider/Riverpod, `BlocSelector`), keys.\n9. Profile in **profile mode** with DevTools performance view (Chapter 23).\n10. For **very** large or complex lists: `super_sliver_list` (better extent estimation, jump to index).\n\n---\n\n## 9.11 Common scrolling bugs\n| Bug | Fix |\n|---|---|\n| Unbounded height (ListView in Column) | `Expanded` / slivers |\n| Nested scroll views fighting (inner ListView scrolls instead of outer) | Use single CustomScrollView; or inner `physics: NeverScrollableScrollPhysics()` + `shrinkWrap` for SHORT lists |\n| RefreshIndicator doesn't trigger with few items | `physics: AlwaysScrollableScrollPhysics()` |\n| Scroll position resets after setState | Controller recreated in build, or key changes; keep controller in State; use PageStorageKey |\n| `ScrollController not attached` | Check `hasClients`; call after first frame |\n| Horizontal list inside vertical list has no height | Wrap in `SizedBox(height: ...)` |\n| Jank when scrolling images | Resize/cache images, `RepaintBoundary` (default), avoid expensive effects |\n| Lost text in TextFields inside list | Lift state; keys; keep alive |\n| Load-more fires many times | Guard with `_loading` flag; debounce |\n| Overscroll glow/stretch unwanted | `ScrollConfiguration(behavior: ScrollConfiguration.of(context).copyWith(overscroll: false), ...)` |\n| Can't drag-scroll with mouse on web/desktop | Since Flutter 2.5, mouse drag scrolling is disabled by default; add `PointerDeviceKind.mouse` to `ScrollBehavior.dragDevices` via a custom `MaterialScrollBehavior` |\n\n---\n\n## 9.12 Interview Questions — Scrolling\n\n**Q1. ListView vs ListView.builder?** Default ListView builds all children upfront; builder lazily builds visible items — use for long/infinite lists.\n\n**Q2. What is a sliver?** A portion of a scrollable area using the sliver layout protocol (SliverConstraints → SliverGeometry) enabling lazy and custom scroll effects; composed in CustomScrollView.\n\n**Q3. When use CustomScrollView?** When combining multiple scrollable sections (lists, grids, headers) into one scroll, or for effects like collapsing/sticky headers.\n\n**Q4. Why avoid shrinkWrap?** It forces the scrollable to lay out all children to compute its size, losing laziness — expensive for long lists.\n\n**Q5. How do you implement infinite scroll?** ScrollController listener or NotificationListener detecting near-end, guarded loading flag, page/cursor tracking, footer loader & error/retry, refresh resetting state.\n\n**Q6. How do you preserve state of tabs/list items?** AutomaticKeepAliveClientMixin, PageStorageKey, IndexedStack, StatefulShellRoute, or lifting state out of widgets.\n\n**Q7. What does `itemExtent` do?** Gives fixed main-axis extent per item allowing O(1) layout calculations and efficient jumps/scrollbar.\n\n**Q8. NestedScrollView use case?** Coordinating an outer collapsing header with inner scroll views (e.g., profile header + tabs with lists).\n\n**Q9. How do you make a sticky header?** `SliverAppBar(pinned: true)`, `SliverPersistentHeader(pinned: true)`, `PinnedHeaderSliver`, or grouping with `SliverMainAxisGroup`.\n\n**Q10. What is cacheExtent?** Area before/after the visible viewport where items are pre-built for smooth scrolling.\n"}, {"n": 10, "file": "10-theming-i18n-accessibility.md", "title": "Chapter 10 — Theming, Material 3, Design Systems, Assets, Fonts, Localization & Accessibility", "subtitle": "Theming, Material 3, Design Systems, Assets, Fonts, Localization & Accessibility", "short": "Theming, i18n & Accessibility", "sub": "Material 3, design systems, RTL, a11y", "level": "intermediate", "minutes": 10, "qa": 10, "md": "# Chapter 10 — Theming, Material 3, Design Systems, Assets, Fonts, Localization & Accessibility\n\n> **Goal:** Build apps that look consistent (design systems), support dark mode, multiple languages and RTL, and are accessible to everyone. These topics separate hobby apps from enterprise apps.\n\n---\n\n## 10.1 Theme basics — the app's outfit 👗\n\n**5-year-old:** Instead of telling every button \"be blue\" one by one, you tell the whole app at the top: \"**our team colour is blue**.\" Everybody below automatically wears blue. That's a **Theme**.\n\n```dart\nMaterialApp(\n  theme: ThemeData(\n    colorScheme: ColorScheme.fromSeed(seedColor: const Color(0xFF0061A4)),\n    useMaterial3: true,                 // default true since Flutter 3.16\n    textTheme: GoogleFonts.interTextTheme(),\n    visualDensity: VisualDensity.adaptivePlatformDensity,\n  ),\n  darkTheme: ThemeData(\n    colorScheme: ColorScheme.fromSeed(\n      seedColor: const Color(0xFF0061A4),\n      brightness: Brightness.dark,\n    ),\n  ),\n  themeMode: ThemeMode.system,\n);\n```\nReading theme values:\n```dart\nfinal theme = Theme.of(context);\nfinal cs = theme.colorScheme;\nContainer(color: cs.primaryContainer, child: Text('Hi', style: theme.textTheme.titleMedium?.copyWith(color: cs.onPrimaryContainer)));\n```\n**Rule:** never hard-code colours/text styles in widgets in a company app; always use theme tokens. This makes dark mode, rebranding, and white-labelling trivial.\n\n---\n\n## 10.2 Material 3 (Material You)\n\n* M3 became **default in Flutter 3.16** (`useMaterial3: true`). Set `false` to keep M2 temporarily (M2 is being phased out).\n* **ColorScheme roles** (memorise the pattern): `primary` / `onPrimary` / `primaryContainer` / `onPrimaryContainer`; same for `secondary`, `tertiary`, `error`; `surface` / `onSurface` / `onSurfaceVariant`; `surfaceContainerLowest`…`surfaceContainerHighest` (tonal surfaces, replaced deprecated `background`/`surfaceVariant` in Flutter 3.22); `outline`, `outlineVariant`, `inverseSurface`, `shadow`, `scrim`.\n  * \"on\" colours are for content (text/icons) placed **on** the matching colour — guarantees contrast.\n* `ColorScheme.fromSeed` generates a harmonious tonal palette from one seed colour (dynamic color algorithm). `dynamic_color` package uses Android 12+ wallpaper colours.\n* **Elevation** in M3 is shown by **surface tint** colour more than shadows; `scrolledUnderElevation` on AppBar.\n* New components: `FilledButton`, `NavigationBar`, `NavigationRail`, `NavigationDrawer`, `SegmentedButton`, `SearchBar`/`SearchAnchor`, `Badge`, `MenuAnchor`, `DropdownMenu`, `CarouselView`, M3 `SliverAppBar.medium/.large`.\n* Typography: `displayLarge/Medium/Small`, `headlineLarge/…`, `titleLarge/…`, `bodyLarge/…`, `labelLarge/…` (old names `headline1`, `bodyText1` etc. were removed).\n\n### Material & Cupertino moving to packages (Flutter 3.44–3.47+)\nThe Flutter team **froze** `material.dart`/`cupertino.dart` in the framework in **3.44** and published them as standalone packages **`material_ui`** and **`cupertino_ui`** (1.0 published starting with Flutter 3.47). Reason: Material/Cupertino updates can ship on their own schedule instead of waiting for quarterly SDK releases. Migration is designed to be drop-in (mostly import changes, with a `dart fix` migration available). The in-framework libraries are planned to be deprecated and later removed — follow the official breaking-change guide (\"Migrate to standalone material_ui and cupertino_ui packages\") when your team upgrades. All widget APIs in this book are the same whichever import you use.\n\n---\n\n## 10.3 Component themes — design system in code\n\n```dart\nThemeData buildTheme(Brightness b) {\n  final cs = ColorScheme.fromSeed(seedColor: AppColors.brand, brightness: b);\n  return ThemeData(\n    colorScheme: cs,\n    scaffoldBackgroundColor: cs.surface,\n    appBarTheme: AppBarTheme(centerTitle: true, backgroundColor: cs.surface, elevation: 0),\n    filledButtonTheme: FilledButtonThemeData(\n      style: FilledButton.styleFrom(\n        minimumSize: const Size(64, 48),\n        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),\n      ),\n    ),\n    inputDecorationTheme: InputDecorationTheme(\n      filled: true,\n      border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),\n    ),\n    cardTheme: const CardThemeData(margin: EdgeInsets.zero, elevation: 0), // CardThemeData in recent versions\n    snackBarTheme: const SnackBarThemeData(behavior: SnackBarBehavior.floating),\n    pageTransitionsTheme: const PageTransitionsTheme(builders: {\n      TargetPlatform.android: PredictiveBackPageTransitionsBuilder(), // Android predictive back\n      TargetPlatform.iOS: CupertinoPageTransitionsBuilder(),\n    }),\n    extensions: [AppSpacing.regular, AppBrandColors.light],\n  );\n}\n```\n> Note: in Flutter 3.27+, `ThemeData.cardTheme`, `dialogTheme`, `tabBarTheme` etc. are being normalized to `*ThemeData` classes (`CardThemeData`, `DialogThemeData`, `TabBarThemeData`). Analyzer/`dart fix` will guide you.\n\n### ThemeExtension — your own custom tokens\n```dart\n@immutable\nclass AppBrandColors extends ThemeExtension\u003cAppBrandColors> {\n  const AppBrandColors({required this.success, required this.warning});\n  final Color success;\n  final Color warning;\n\n  static const light = AppBrandColors(success: Color(0xFF2E7D32), warning: Color(0xFFF9A825));\n  static const dark  = AppBrandColors(success: Color(0xFF81C784), warning: Color(0xFFFFD54F));\n\n  @override\n  AppBrandColors copyWith({Color? success, Color? warning}) =>\n      AppBrandColors(success: success ?? this.success, warning: warning ?? this.warning);\n\n  @override\n  AppBrandColors lerp(ThemeExtension\u003cAppBrandColors>? other, double t) {\n    if (other is! AppBrandColors) return this;\n    return AppBrandColors(\n      success: Color.lerp(success, other.success, t)!,\n      warning: Color.lerp(warning, other.warning, t)!,\n    );\n  }\n}\n// Use:\nfinal brand = Theme.of(context).extension\u003cAppBrandColors>()!;\nIcon(Icons.check, color: brand.success);\n```\n`lerp` enables smooth animated theme transitions (MaterialApp animates between themes using `AnimatedTheme`).\n\n### Local theme overrides\n```dart\nTheme(\n  data: Theme.of(context).copyWith(colorScheme: Theme.of(context).colorScheme.copyWith(primary: Colors.red)),\n  child: const DangerZone(),\n);\n```\n\n### Color API changes to know (Flutter 3.27+)\n* `Color.withOpacity()` is **deprecated** → use `color.withValues(alpha: 0.5)` (wide-gamut colour support; components are now doubles `r`, `g`, `b`, `a` in 0–1).\n* `Color.value`, `.red`, `.green`, `.blue`, `.opacity` deprecated → `toARGB32()`, `.r`, `.g`, `.b`, `.a`.\n\n### Dark mode toggle (persisted)\nStore `ThemeMode` in your state management + SharedPreferences; MaterialApp listens and rebuilds:\n```dart\nValueListenableBuilder\u003cThemeMode>(\n  valueListenable: themeController,   // ValueNotifier\u003cThemeMode>\n  builder: (_, mode, __) => MaterialApp(themeMode: mode, theme: light, darkTheme: dark, home: ...),\n);\n```\n\n### Design system organisation (enterprise)\n```\nlib/core/design_system/\n├── tokens/ (colors.dart, typography.dart, spacing.dart, radii.dart, durations.dart)\n├── theme/ (app_theme.dart, extensions.dart)\n└── components/ (app_button.dart, app_text_field.dart, app_card.dart, ...)\n```\nMany companies put this in a separate **package** in a monorepo (`packages/design_system`) with its own **widgetbook** (Storybook-like catalog: `widgetbook` package) and **golden tests** (Chapter 22). Figma tokens can be exported and generated into Dart.\n\n---\n\n## 10.4 Assets, fonts, icons, splash\n\n### Loading assets\n```dart\nImage.asset('assets/images/logo.png');\nfinal jsonStr = await rootBundle.loadString('assets/config/app.json');\nfinal bytes = await rootBundle.load('assets/models/model.tflite');\nDefaultAssetBundle.of(context).loadString(...);   // testable alternative\n```\nType-safe asset references: **`flutter_gen`** generates `Assets.images.logo.image()` — avoids typos (\"Unable to load asset\").\n\nAsset **transformers** (Flutter 3.22+): transform assets at build time (e.g., `vector_graphics_compiler` for SVGs) via `transformers:` in pubspec.\n\n### Fonts\nDeclare in pubspec (Chapter 2), then `fontFamily: 'Inter'` or in `ThemeData(fontFamily: 'Inter')`. Variable fonts supported with `FontVariation`. Packaged fonts: `fontFamily: 'Roboto', package: 'my_design_system'`.\n\n### App icons & splash screens\n* **`flutter_launcher_icons`** — generates Android adaptive icons and iOS icon sets.\n* **`flutter_native_splash`** — generates native splash (Android 12+ uses the `SplashScreen` API: icon on background colour only; iOS LaunchScreen storyboard). The native splash shows while the engine loads; then your first Flutter frame. Keep it until init finishes: `FlutterNativeSplash.preserve(widgetsBinding: binding)` → `FlutterNativeSplash.remove()`.\n* Don't build a fake \"splash page\" with a timer just to show a logo — it delays users. Do real initialization instead.\n\n---\n\n## 10.5 Internationalization (i18n) & Localization (l10n) 🌍\n\n**i18n** = making the app *able* to support many languages/regions. **l10n** = actually translating & formatting for a specific locale.\n\n### Official setup with `gen-l10n`\n1. `pubspec.yaml`:\n```yaml\ndependencies:\n  flutter_localizations:\n    sdk: flutter\n  intl: any          # version pinned by flutter_localizations\nflutter:\n  generate: true\n```\n2. `l10n.yaml` at project root:\n```yaml\narb-dir: lib/l10n\ntemplate-arb-file: app_en.arb\noutput-localization-file: app_localizations.dart\n# Recent Flutter versions generate into the source tree (no synthetic package):\n# output-dir: lib/l10n/gen\nnullable-getter: false\n```\n3. `lib/l10n/app_en.arb`:\n```json\n{\n  \"@@locale\": \"en\",\n  \"helloUser\": \"Hello {name}!\",\n  \"@helloUser\": { \"placeholders\": { \"name\": { \"type\": \"String\" } } },\n  \"itemsInCart\": \"{count, plural, =0{Your cart is empty} =1{1 item in cart} other{{count} items in cart}}\",\n  \"@itemsInCart\": { \"placeholders\": { \"count\": { \"type\": \"int\" } } },\n  \"genderGreeting\": \"{gender, select, male{Welcome sir} female{Welcome madam} other{Welcome}}\",\n  \"price\": \"Price: {amount}\",\n  \"@price\": { \"placeholders\": { \"amount\": { \"type\": \"double\", \"format\": \"currency\", \"optionalParameters\": { \"symbol\": \"₹\", \"decimalDigits\": 2 } } } },\n  \"lastSeen\": \"Last seen {date}\",\n  \"@lastSeen\": { \"placeholders\": { \"date\": { \"type\": \"DateTime\", \"format\": \"yMMMd\" } } }\n}\n```\n`app_hi.arb`, `app_ar.arb` etc. with the same keys.\n4. Wire up:\n```dart\nMaterialApp(\n  localizationsDelegates: AppLocalizations.localizationsDelegates, // includes GlobalMaterialLocalizations etc.\n  supportedLocales: AppLocalizations.supportedLocales,\n  locale: userSelectedLocale,   // null = follow device\n);\n// Use:\nText(AppLocalizations.of(context).helloUser('Asha'));\n// handy extension: extension L10nX on BuildContext { AppLocalizations get l10n => AppLocalizations.of(this); }\n```\nRun `flutter gen-l10n` (or it runs automatically on `flutter run`/`build` when `generate: true`).\n\n> The old \"synthetic package\" approach (`import 'package:flutter_gen/gen_l10n/app_localizations.dart'`) was deprecated in Flutter 3.29-ish; newer projects generate into the source tree (`output-dir`), imported like normal source.\n\n### iOS extra step\nAdd supported languages to `ios/Runner/Info.plist` `CFBundleLocalizations` array, or iOS may not switch.\n\n### Formatting with `intl`\n```dart\nNumberFormat.currency(locale: 'en_IN', symbol: '₹').format(123456.5); // ₹1,23,456.50\nNumberFormat.compact().format(1200000);   // 1.2M\nDateFormat.yMMMMd('fr').format(DateTime.now());  // 15 octobre 2026\nDateFormat('dd/MM/yyyy HH:mm').format(dt);\n```\nCall `initializeDateFormatting()` if using DateFormat for non-default locales outside the Flutter localizations delegates.\n\n### RTL (Arabic, Hebrew, Urdu)\n* Flutter flips layouts automatically based on `Directionality` (set by locale).\n* Use `EdgeInsetsDirectional`, `AlignmentDirectional`, `PositionedDirectional`, `start/end` instead of `left/right`.\n* Icons like arrows: use `Icons.arrow_back` (auto-mirrored in RTL for certain icons) or `Directionality.of(context)` checks.\n* Test with `locale: Locale('ar')`.\n\n### Alternatives\n`easy_localization` (JSON/CSV/YAML, runtime switching, popular), `slang` (type-safe, codegen), translation management tools (Lokalise, Crowdin, Phrase) that sync ARB files.\n\n### Org best practices\n* Never concatenate translated strings (`'Hello ' + name`) — word order differs per language; use placeholders.\n* Use ICU plurals/selects; plural rules differ (Arabic has 6 forms!).\n* Don't put text in images.\n* Allow text expansion (German ~30% longer) — avoid fixed-width text containers.\n* Pseudo-localization testing.\n* Keys named by meaning (`checkoutPayButton`), with descriptions for translators (`\"description\"` in `@key`).\n\n---\n\n## 10.6 Accessibility (a11y) ♿\n\n**5-year-old:** Some people can't see the screen well, some can't use their hands easily, some need bigger letters. Accessibility means **everyone** can use your app — like ramps next to stairs.\n\nFlutter builds a **Semantics tree** parallel to the render tree, which it sends to the platform accessibility services (TalkBack on Android, VoiceOver on iOS, screen readers on web/desktop).\n\n### Key techniques\n```dart\n// 1. Labels for icons/images\nIconButton(icon: const Icon(Icons.delete), tooltip: 'Delete', onPressed: ...); // tooltip provides semantics label\nImage.asset('assets/chart.png', semanticLabel: 'Sales up 20% this month');\nconst Image(image: AssetImage('decor.png'), excludeFromSemantics: true);   // decorative\n\n// 2. Custom semantics\nSemantics(\n  label: 'Rating: 4 out of 5 stars',\n  button: false,\n  child: Row(children: stars),\n);\nMergeSemantics(child: Row(children: [Checkbox(...), const Text('Remember me')])); // read as one\nExcludeSemantics(child: decorativeWidget);\nSemantics(liveRegion: true, child: Text(statusMessage));  // announce updates\nSemanticsService.announce('Item deleted', TextDirection.ltr);  // ad-hoc announcement\n\n// 3. Large text: respect user text scaling; test at 200%. Avoid fixed heights for text containers.\n// 4. Contrast: WCAG AA ≥ 4.5:1 for normal text, 3:1 for large text — use colorScheme \"on\" colours.\n// 5. Tap targets ≥ 48×48 dp (Android) / 44×44 pt (iOS). Material widgets handle this via MaterialTapTargetSize.padded.\n// 6. Focus & keyboard navigation (desktop/web/TV): FocusTraversalGroup, Shortcuts, Actions, visible focus indicators.\n// 7. Don't convey info by colour alone (add icons/text).\n// 8. Reduce motion: MediaQuery.disableAnimationsOf(context) → shorten/skip animations.\n// 9. Ordering: OrdinalSortKey / FocusTraversalOrder to fix reading order.\n```\n\n### Testing accessibility\n* Turn on TalkBack/VoiceOver and navigate your app.\n* `showSemanticsDebugger: true` in MaterialApp.\n* Widget tests with guidelines:\n```dart\ntestWidgets('meets a11y guidelines', (tester) async {\n  final handle = tester.ensureSemantics();\n  await tester.pumpWidget(const MyApp());\n  await expectLater(tester, meetsGuideline(androidTapTargetGuideline));\n  await expectLater(tester, meetsGuideline(iOSTapTargetGuideline));\n  await expectLater(tester, meetsGuideline(labeledTapTargetGuideline));\n  await expectLater(tester, meetsGuideline(textContrastGuideline));\n  handle.dispose();\n});\n```\n* Accessibility Scanner (Android), Accessibility Inspector (Xcode).\n* Web: Flutter web builds the semantics tree lazily; users enable it via a hidden \"Enable accessibility\" button, or you can call `SemanticsBinding.instance.ensureSemantics()` to force it on (helps automation/SEO tooling too).\n\nLegal context: many countries require accessible apps (ADA in US, European Accessibility Act enforced from June 2025, etc.) — enterprise clients ask for WCAG 2.1/2.2 AA compliance.\n\n---\n\n## 10.7 Interview Questions — Theming, i18n, a11y\n\n**Q1. How do you implement dark mode?** Provide `theme` and `darkTheme` (e.g., `ColorScheme.fromSeed` with brightness) and `themeMode` (system/light/dark), read colours from `Theme.of(context).colorScheme`, persist the user choice.\n\n**Q2. What is ColorScheme.fromSeed?** Generates a full M3 tonal colour scheme from a single seed colour.\n\n**Q3. How do you add custom theme properties?** `ThemeExtension\u003cT>` with `copyWith` and `lerp`, registered in `ThemeData.extensions`, accessed with `Theme.of(context).extension\u003cT>()`.\n\n**Q4. How do you localize a Flutter app?** flutter_localizations + intl, ARB files, gen-l10n generating `AppLocalizations`, delegates and supported locales on MaterialApp, `AppLocalizations.of(context)`; ICU plurals/selects; Info.plist locales for iOS.\n\n**Q5. How does Flutter support RTL?** Directionality from locale; directional widgets (`EdgeInsetsDirectional`, `AlignmentDirectional`), Row/ListView automatically mirror.\n\n**Q6. How do you make a Flutter app accessible?** Semantic labels, tooltips, MergeSemantics/ExcludeSemantics, sufficient contrast, 48dp tap targets, support text scaling, focus traversal & keyboard, reduce motion, test with screen readers and `meetsGuideline`.\n\n**Q7. What is the Semantics tree?** A tree of semantic nodes generated from widgets that describes meaning (labels, actions, states) for accessibility services.\n\n**Q8. What changed with Material 3 in Flutter?** M3 default from 3.16; new colour roles & tonal surfaces; new components (FilledButton, NavigationBar, etc.); typography names; surface tint elevation.\n\n**Q9. `withOpacity` vs `withValues`?** `withOpacity` is deprecated (3.27+) in favour of `withValues(alpha:)` due to wide-gamut colour support and float components.\n\n**Q10. What are `material_ui` and `cupertino_ui`?** Standalone pub.dev packages containing Flutter's Material and Cupertino libraries, decoupled from the SDK (published from Flutter 3.47) so they can release independently.\n"}, {"n": 11, "file": "11-navigation-and-routing.md", "title": "Chapter 11 — Navigation & Routing: Navigator 1.0, Navigator 2.0, go_router, Deep Links", "subtitle": "Navigation & Routing: Navigator 1.0, Navigator 2.0, go_router, Deep Links", "short": "Navigation & Routing", "sub": "Navigator, go_router, PopScope, deep links", "level": "intermediate", "minutes": 13, "qa": 12, "md": "# Chapter 11 — Navigation & Routing: Navigator 1.0, Navigator 2.0, go_router, Deep Links\n\n> **Goal:** Move between screens correctly, pass and return data, handle back buttons (Android predictive back!), nested navigation with bottom tabs, authentication redirects, deep links and web URLs.\n\n---\n\n## 11.1 5-year-old picture: a stack of plates 🍽️\n\nThe **Navigator** keeps screens like a **stack of plates**. Opening a new screen = **put a plate on top** (`push`). Going back = **take the top plate off** (`pop`). You only see the top plate.\n\n```\npush(Details)        pop()\n┌─────────┐          \n│ Details │ ← top     \n├─────────┤          ┌─────────┐\n│  Home   │          │  Home   │\n└─────────┘          └─────────┘\n```\n\n---\n\n## 11.2 Navigator 1.0 (imperative)\n\n### Push and pop\n```dart\n// Push a new route\nNavigator.of(context).push(\n  MaterialPageRoute(builder: (context) => DetailsPage(id: item.id)),\n);\n// Shorthand\nNavigator.push(context, MaterialPageRoute(builder: (_) => const SettingsPage()));\n\n// Pop (go back)\nNavigator.of(context).pop();\nNavigator.pop(context);\nNavigator.maybePop(context);          // pops only if possible\nNavigator.canPop(context);\n```\n`MaterialPageRoute` gives platform-appropriate transitions; `CupertinoPageRoute` gives iOS swipe-back transition; `PageRouteBuilder` for custom transitions; `fullscreenDialog: true` for modal pages (slide-up, close \"X\").\n\n### Passing data forward\nVia constructor (type-safe — best):\n```dart\nNavigator.push(context, MaterialPageRoute(builder: (_) => DetailsPage(product: product)));\n```\n\n### Returning data back ↩️\n```dart\n// Screen A\nfinal selected = await Navigator.push\u003cColor>(\n  context,\n  MaterialPageRoute(builder: (_) => const ColorPickerPage()),\n);\nif (!context.mounted) return;\nif (selected != null) setState(() => _color = selected);\n\n// Screen B (ColorPickerPage)\nonTap: () => Navigator.pop(context, Colors.red),\n```\n`selected` is `null` if the user pressed system back.\n\n### Replacing & clearing the stack\n```dart\nNavigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const HomePage())); // replace current (e.g., after splash)\nNavigator.pushAndRemoveUntil(                                                            // e.g., after login/logout\n  context,\n  MaterialPageRoute(builder: (_) => const LoginPage()),\n  (route) => false,          // remove ALL previous routes\n);\nNavigator.popUntil(context, (route) => route.isFirst);         // back to first\nNavigator.popUntil(context, ModalRoute.withName('/home'));\n```\n\n### Named routes (legacy-ish)\n```dart\nMaterialApp(\n  initialRoute: '/',\n  routes: {\n    '/': (_) => const HomePage(),\n    '/details': (_) => const DetailsPage(),\n  },\n  onGenerateRoute: (settings) {       // for routes needing arguments/parsing\n    if (settings.name == '/product') {\n      final id = settings.arguments as String;\n      return MaterialPageRoute(builder: (_) => ProductPage(id: id), settings: settings);\n    }\n    return null;\n  },\n  onUnknownRoute: (_) => MaterialPageRoute(builder: (_) => const NotFoundPage()),\n);\nNavigator.pushNamed(context, '/product', arguments: 'p42');\nfinal args = ModalRoute.of(context)!.settings.arguments;\n```\nThe Flutter team **no longer recommends named routes** for most apps: arguments aren't type-safe, deep link behaviour can't be customised, and they don't support the browser forward button well. Use a router package (go_router) instead.\n\n### Navigating without BuildContext\n```dart\nfinal navigatorKey = GlobalKey\u003cNavigatorState>();\nMaterialApp(navigatorKey: navigatorKey, ...);\nnavigatorKey.currentState?.pushNamed('/login');   // e.g., from interceptor on 401\n```\nUse carefully — prefer routing state (go_router redirect) for auth flows.\n\n### Route lifecycle observing\n```dart\nclass LoggingObserver extends NavigatorObserver {\n  @override\n  void didPush(Route route, Route? previousRoute) => analytics.logScreen(route.settings.name);\n  @override\n  void didPop(Route route, Route? previousRoute) {}\n}\nMaterialApp(navigatorObservers: [LoggingObserver(), routeObserver]);\n```\n`RouteAware` + `RouteObserver\u003cModalRoute>` lets a screen know when it becomes visible again (`didPopNext`) — e.g., refresh data when returning.\n\n---\n\n## 11.3 Back button handling: `PopScope` (WillPopScope is deprecated)\n\nAndroid 14+ introduced **predictive back** (preview of the previous screen while swiping). The system must know **in advance** whether back is allowed, so the old `WillPopScope` (async decision) was **deprecated in Flutter 3.12+** and replaced with `PopScope`:\n\n```dart\nPopScope\u003cObject?>(\n  canPop: !_hasUnsavedChanges,                       // decided in advance\n  onPopInvokedWithResult: (didPop, result) async {   // Flutter 3.24+ (replaces onPopInvoked)\n    if (didPop) return;                              // already popped\n    final leave = await showDialog\u003cbool>(\n      context: context,\n      builder: (c) => AlertDialog(\n        title: const Text('Discard changes?'),\n        actions: [\n          TextButton(onPressed: () => Navigator.pop(c, false), child: const Text('Stay')),\n          TextButton(onPressed: () => Navigator.pop(c, true), child: const Text('Discard')),\n        ],\n      ),\n    );\n    if (leave == true && context.mounted) Navigator.pop(context);\n  },\n  child: const EditForm(),\n);\n```\n* `canPop: false` blocks the back gesture/button and calls `onPopInvokedWithResult(didPop: false)`.\n* For predictive back animations on Android, `PredictiveBackPageTransitionsBuilder` in the theme and `android:enableOnBackInvokedCallback=\"true\"` in the manifest (the default behaviour changes with targetSdk 35/36 — predictive back is enabled by default for apps targeting Android 15+/16).\n* \"Double back to exit\" pattern: `canPop: false` + track last back press time + `SystemNavigator.pop()`.\n\n---\n\n## 11.4 Navigator 2.0 (declarative Router API)\n\nNavigator 2.0 (introduced in Flutter 1.22) lets you set the **whole page stack as a function of app state**, and syncs with the platform (browser URL, deep links).\n\nPieces:\n* **`Page`** — immutable description of a route (`MaterialPage`, `CupertinoPage`, custom `Page`).\n* **`Navigator(pages: [...], onDidRemovePage: ...)`** — declarative stack. (`onPopPage` was deprecated in 3.24 in favour of `onDidRemovePage`.)\n* **`Router`** — coordinates:\n  * **`RouteInformationProvider`** — gets route info (URL) from OS/browser.\n  * **`RouteInformationParser`** — parses URL ↔ your app's route configuration (typed).\n  * **`RouterDelegate`** — builds the `Navigator` with pages from app state; notifies on change; handles `setNewRoutePath` (deep link) and `currentConfiguration` (URL update).\n  * **`BackButtonDispatcher`** — Android back button.\n\nMinimal declarative example:\n```dart\nclass _AppState extends State\u003cApp> {\n  Book? _selected;\n  @override\n  Widget build(BuildContext context) {\n    return MaterialApp(\n      home: Navigator(\n        pages: [\n          MaterialPage(key: const ValueKey('list'), child: BookList(onTap: (b) => setState(() => _selected = b))),\n          if (_selected != null) MaterialPage(key: ValueKey(_selected), child: BookDetails(book: _selected!)),\n        ],\n        onDidRemovePage: (page) {\n          if (page.key == ValueKey(_selected)) setState(() => _selected = null);\n        },\n      ),\n    );\n  }\n}\n```\nImplementing RouterDelegate/Parser by hand is verbose and error-prone → teams use **go_router** (official, maintained by the Flutter team), or **auto_route** (codegen), or **beamer**.\n\nInterview: *\"Navigator 1.0 vs 2.0?\"* → 1.0 is imperative push/pop; 2.0 is declarative (pages from state), supports deep linking/web URLs/browser history, and complex nested navigation, but is complex; router packages build on 2.0. They can coexist (go_router uses Navigator 2.0 and still allows `Navigator.push` for dialogs).\n\n---\n\n## 11.5 go_router — the standard choice 🧭\n\n```yaml\ndependencies:\n  go_router: ^x.y.z    # check pub.dev for latest\n```\n\n### Basic setup\n```dart\nfinal router = GoRouter(\n  initialLocation: '/',\n  debugLogDiagnostics: true,\n  routes: [\n    GoRoute(\n      path: '/',\n      name: 'home',\n      builder: (context, state) => const HomePage(),\n      routes: [                               // nested (child) routes → stacked on parent\n        GoRoute(\n          path: 'product/:id',                // → /product/42\n          name: 'product',\n          builder: (context, state) {\n            final id = state.pathParameters['id']!;\n            final tab = state.uri.queryParameters['tab'];   // /product/42?tab=reviews\n            final extra = state.extra as Product?;            // object (NOT in URL; lost on web refresh/deep link)\n            return ProductPage(id: id, initialTab: tab, preloaded: extra);\n          },\n        ),\n      ],\n    ),\n    GoRoute(path: '/login', builder: (_, __) => const LoginPage()),\n  ],\n  errorBuilder: (context, state) => NotFoundPage(error: state.error),\n);\n\nvoid main() => runApp(MaterialApp.router(routerConfig: router));\n```\n\n### Navigating\n```dart\ncontext.go('/product/42');               // GO to location: replaces stack to match URL hierarchy (/, /product/42)\ncontext.push('/product/42');             // PUSH on top of current stack (returns Future for result)\ncontext.goNamed('product', pathParameters: {'id': '42'}, queryParameters: {'tab': 'reviews'});\ncontext.pushNamed('product', pathParameters: {'id': '42'}, extra: product);\ncontext.pop();                           // or context.pop(result)\ncontext.replace('/x');  context.pushReplacement('/x');\ncontext.canPop();\nfinal result = await context.push\u003cbool>('/confirm');\n```\n**`go` vs `push`** (very common interview question):\n* `go` **navigates to a URL**; the page stack becomes whatever the route hierarchy for that URL defines (sub-routes stacked on parents). Previous stack outside that hierarchy is discarded. Browser URL updates.\n* `push` **adds a page on top** of the current stack (like Navigator.push), regardless of hierarchy. Good for \"detail on top of current context\" and awaiting results.\n\n### Redirects & authentication guard\n```dart\nfinal router = GoRouter(\n  refreshListenable: authNotifier,       // re-run redirect when auth state changes (ChangeNotifier / Listenable)\n  redirect: (context, state) {\n    final loggedIn = authNotifier.isLoggedIn;\n    final loggingIn = state.matchedLocation == '/login';\n    if (!loggedIn && !loggingIn) {\n      return '/login?from=${Uri.encodeComponent(state.uri.toString())}';  // remember where to go back\n    }\n    if (loggedIn && loggingIn) return state.uri.queryParameters['from'] ?? '/';\n    return null;                          // no redirect\n  },\n  routes: [...],\n);\n```\nPer-route `redirect:` also available. Avoid redirect loops (go_router throws after a limit, `redirectLimit` default 5).\n\nFor Riverpod/Bloc: expose auth state as a `Listenable` (e.g., a `ValueNotifier` updated by a stream listener, or the `GoRouterRefreshStream` pattern).\n\n### ShellRoute & StatefulShellRoute (bottom navigation with nested stacks)\n```dart\nGoRouter(routes: [\n  StatefulShellRoute.indexedStack(\n    builder: (context, state, navigationShell) => ScaffoldWithNavBar(navigationShell: navigationShell),\n    branches: [\n      StatefulShellBranch(routes: [\n        GoRoute(path: '/home', builder: (_, __) => const HomeTab(), routes: [\n          GoRoute(path: 'details/:id', builder: (_, s) => DetailsPage(id: s.pathParameters['id']!)),\n        ]),\n      ]),\n      StatefulShellBranch(routes: [\n        GoRoute(path: '/profile', builder: (_, __) => const ProfileTab()),\n      ]),\n    ],\n  ),\n]);\n\nclass ScaffoldWithNavBar extends StatelessWidget {\n  const ScaffoldWithNavBar({super.key, required this.navigationShell});\n  final StatefulNavigationShell navigationShell;\n  @override\n  Widget build(BuildContext context) => Scaffold(\n    body: navigationShell,                       // IndexedStack of branch navigators — each keeps its own stack & state\n    bottomNavigationBar: NavigationBar(\n      selectedIndex: navigationShell.currentIndex,\n      onDestinationSelected: (i) => navigationShell.goBranch(i, initialLocation: i == navigationShell.currentIndex), // tap active tab → pop to root\n      destinations: const [\n        NavigationDestination(icon: Icon(Icons.home), label: 'Home'),\n        NavigationDestination(icon: Icon(Icons.person), label: 'Profile'),\n      ],\n    ),\n  );\n}\n```\n`ShellRoute` (non-stateful) wraps routes in a common UI (e.g., persistent bottom bar) with one nested navigator but doesn't preserve each tab's stack.\n\nShowing a full-screen page **above** the bottom bar from inside a branch: give the route `parentNavigatorKey: rootNavigatorKey`.\n\n### Type-safe routes\n`go_router_builder` generates typed route classes:\n```dart\n@TypedGoRoute\u003cProductRoute>(path: '/product/:id')\nclass ProductRoute extends GoRouteData with $ProductRoute {   // (mixin name depends on go_router_builder version)\n  const ProductRoute({required this.id});\n  final String id;\n  @override\n  Widget build(BuildContext context, GoRouterState state) => ProductPage(id: id);\n}\nconst ProductRoute(id: '42').go(context);\n```\n\n### Custom transitions\n```dart\nGoRoute(\n  path: '/modal',\n  pageBuilder: (context, state) => CustomTransitionPage(\n    key: state.pageKey,\n    child: const ModalPage(),\n    transitionsBuilder: (context, animation, secondary, child) =>\n        FadeTransition(opacity: animation, child: child),\n  ),\n);\n```\n\n### go_router gotchas\n* `extra` is not serialized into the URL: lost on web refresh, deep links, and process death restoration (unless you provide an `extraCodec`). Prefer path/query params with IDs and fetch data.\n* `context.go` inside `initState`/build → schedule after frame or use redirect.\n* Don't create the `GoRouter` inside `build` (recreated → navigation state lost). Create once (top-level final, or in a provider).\n* Using `Navigator.push` alongside go_router works but those pages aren't URL-addressable.\n* Breaking changes happen in major versions — read the changelog when upgrading (e.g., `GoRouterState.location` → `uri`, `queryParams` → `uri.queryParameters`, `params` → `pathParameters`).\n\n### auto_route (alternative)\nCode-generated, strongly typed routes (`context.router.push(ProductRoute(id: '42'))`), nested routers, guards (`AutoRouteGuard`), tabs (`AutoTabsRouter`). Popular in large codebases.\n\n---\n\n## 11.6 Deep links & App Links / Universal Links 🔗\n\n**Deep link** = a URL that opens a specific screen in your app, e.g., `https://shop.example.com/product/42` or `myshop://product/42`.\n\n| Type | Example | Verified ownership? | Opens app directly? |\n|---|---|---|---|\n| Custom scheme | `myshop://product/42` | ❌ (any app can claim) | Shows chooser / may conflict |\n| Android App Links | `https://...` | ✅ via `assetlinks.json` | ✅ |\n| iOS Universal Links | `https://...` | ✅ via `apple-app-site-association` | ✅ |\n\n### Android setup\n`android/app/src/main/AndroidManifest.xml` inside `\u003cactivity ...MainActivity>`:\n```xml\n\u003cintent-filter android:autoVerify=\"true\">\n  \u003caction android:name=\"android.intent.action.VIEW\" />\n  \u003ccategory android:name=\"android.intent.category.DEFAULT\" />\n  \u003ccategory android:name=\"android.intent.category.BROWSABLE\" />\n  \u003cdata android:scheme=\"https\" android:host=\"shop.example.com\" />\n\u003c/intent-filter>\n```\nHost `https://shop.example.com/.well-known/assetlinks.json` with your package name and **SHA-256 signing certificate fingerprints** (both upload key and **Play App Signing key** — a common mistake is only adding the debug/upload key!).\n\nFlutter's built-in deep link handling is controlled by `\u003cmeta-data android:name=\"flutter_deeplinking_enabled\" android:value=\"true\" />` (enabled by default in recent Flutter versions). If you use a third-party deep link plugin (e.g., `app_links`, Firebase Dynamic Links legacy, Branch), you may need to **disable** Flutter's handling to avoid double handling.\n\nTest: `adb shell am start -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d \"https://shop.example.com/product/42\" com.example.shop`.\n\n### iOS setup\n* Xcode → Signing & Capabilities → **Associated Domains** → `applinks:shop.example.com`.\n* Host `https://shop.example.com/.well-known/apple-app-site-association` (JSON, no extension, served as `application/json`, HTTPS, no redirects) listing `TEAMID.bundleId` and paths.\n* `Info.plist`: `FlutterDeepLinkingEnabled` = YES (for Flutter's handler; default in recent versions).\n* Test: `xcrun simctl openurl booted \"https://shop.example.com/product/42\"`.\n\n### With go_router\nOnce platform setup is done, the URL path is passed to the router, which matches `/product/42` → ProductPage automatically, including on cold start. Make sure your redirect logic (auth) preserves the deep link target (`?from=`).\n\nDevTools has a **Deep Links validator** tool to check Android/iOS config.\n\nNote: **Firebase Dynamic Links was shut down (August 2025)** — teams migrated to App Links/Universal Links directly or to providers like Branch, AppsFlyer OneLink, Adjust.\n\n---\n\n## 11.7 Web URLs\n* URL strategy: default is **hash** (`/#/product/42`) historically; use path URLs:\n```dart\nimport 'package:flutter_web_plugins/url_strategy.dart';\nvoid main() { usePathUrlStrategy(); runApp(...); }\n```\n(go_router: path strategy also via this.) Server must rewrite all routes to `index.html` (SPA fallback), or refreshes give 404.\n* Browser back/forward works with Router API / go_router.\n\n---\n\n## 11.8 Navigation architecture best practices (org level)\n1. **Single source of truth** for routes: a `router.dart` with route constants or typed routes.\n2. Pass **IDs**, not big objects, between screens (deep-linkable, restoration-safe); load data in the destination via repository/cache.\n3. Centralize **auth guards** in redirect; never sprinkle \"if not logged in push login\" in screens.\n4. Keep navigation **out of business logic** where possible: logic emits state/events, UI layer navigates (or use a navigation service abstraction for testability).\n5. Track screens for analytics with a `NavigatorObserver`.\n6. Handle **unknown routes** (404 page).\n7. Test deep links on cold start, warm start, logged-out state.\n8. Restoration: `restorationScopeId` in MaterialApp and `RestorableProperty` / go_router restoration for Android process death.\n\n---\n\n## 11.9 Common navigation bugs\n| Bug | Cause | Fix |\n|---|---|---|\n| \"Navigator operation requested with a context that does not include a Navigator\" | context above MaterialApp | use context below MaterialApp / navigatorKey |\n| Black screen after pop | popped the last route | check `canPop`; use `maybePop`; don't pop root |\n| Dialog pop closes the page instead | used page context with nested navigators / popped twice | pop with dialog's context; `useRootNavigator` alignment |\n| `setState` after navigating away | async continues | `mounted` checks |\n| Double navigation on double tap | | debounce/disable button; go_router `go` is idempotent for same location |\n| Back button exits app from tab | nested navigators not handling back | StatefulShellRoute / `NavigatorPopHandler` / PopScope |\n| Deep link opens app but not the page | router not matching path / redirect swallowing it | debugLogDiagnostics, preserve `from` param |\n| App Links open browser instead of app | assetlinks fingerprint missing (Play signing key) / autoVerify failed | fix assetlinks.json; `adb shell pm get-app-links \u003cpkg>` |\n| Page rebuilds/resets on keyboard open | Router/GoRouter created inside a widget that rebuilds (MediaQuery dependency) | create router once outside build |\n\n---\n\n## 11.10 Interview Questions — Navigation\n\n**Q1. How does the Navigator work?** It manages a stack of `Route` objects (with an Overlay); push adds, pop removes; only top routes are visible.\n\n**Q2. How do you pass data between screens and return results?** Constructor arguments forward; `Navigator.pop(context, result)` + `await Navigator.push` (or `context.pop(result)` with `await context.push`).\n\n**Q3. Difference between `push`, `pushReplacement`, `pushAndRemoveUntil`?** Add on top; replace current; add and remove previous routes until predicate true (clear stack).\n\n**Q4. What is Navigator 2.0?** Declarative Router API: pages list derived from app state, Router with RouteInformationParser/RouterDelegate syncing with platform URLs and deep links.\n\n**Q5. go vs push in go_router?** go navigates to a location (stack defined by route hierarchy, URL-synced); push adds a page atop the current stack.\n\n**Q6. How do you protect routes requiring login?** go_router `redirect` with `refreshListenable` bound to auth state (or auto_route guards).\n\n**Q7. How do you keep separate navigation stacks per bottom tab?** `StatefulShellRoute.indexedStack` (go_router), nested Navigators with IndexedStack, or auto_route `AutoTabsRouter`.\n\n**Q8. What replaced WillPopScope and why?** `PopScope` with `canPop` and `onPopInvokedWithResult`, because Android predictive back needs to know ahead of time whether pop is allowed.\n\n**Q9. How do deep links work in Flutter?** Platform config (Android intent filters with App Links verification; iOS Associated Domains with AASA) delivers URL to Flutter's router which parses it into routes.\n\n**Q10. How do you navigate without context (e.g., from a service)?** GlobalKey\u003cNavigatorState> on MaterialApp, or router instance (`router.go(...)`), ideally through an abstraction.\n\n**Q11. What is `RouteAware`?** Mixin to get notified when a route is pushed/popped relative to the current one (didPush, didPopNext...), via a RouteObserver.\n\n**Q12. Why avoid passing objects via `extra`?** Not part of the URL — not restorable, not deep-linkable, lost on web refresh.\n"}, {"n": 12, "file": "12-animations.md", "title": "Chapter 12 — Animations: Implicit, Explicit, Hero, Physics, Staggered, Lottie/Rive", "subtitle": "Animations: Implicit, Explicit, Hero, Physics, Staggered, Lottie/Rive", "short": "Animations", "sub": "Implicit, explicit, Hero, physics, Lottie", "level": "intermediate", "minutes": 10, "qa": 12, "md": "# Chapter 12 — Animations: Implicit, Explicit, Hero, Physics, Staggered, Lottie/Rive\n\n> **Goal:** Make UIs feel alive — and know *which* animation approach to choose, how `AnimationController`, `Tween`, `Curve` and `Ticker` work under the hood, and how to keep animations at 60/120 fps.\n\n---\n\n## 12.1 5-year-old picture: a flip book 📖\n\nAn animation is a **flip book**: many slightly different pictures shown quickly. Flutter draws a new picture every frame (60–120 per second). You just say *\"go from small to big in 1 second, starting slow and ending fast\"* and Flutter draws all the in-between pictures (**tweening** = \"in-betweening\").\n\n---\n\n## 12.2 Decision tree: which animation tool?\n\n```\nIs it a simple property change (size, colour, opacity, padding, alignment) when state changes?\n ├─ YES → IMPLICIT animation (AnimatedContainer, AnimatedOpacity, TweenAnimationBuilder…)\n └─ NO → Does it repeat, need play/pause/reverse, sync with gestures, or chain/stagger?\n          ├─ YES → EXPLICIT animation (AnimationController + Transition widgets / AnimatedBuilder)\n          └─ Is it a complex designer-made animation (vector, character, illustrations)?\n               ├─ YES → Lottie or Rive\n               └─ Shared element between screens? → Hero\n                  Custom drawing every frame? → CustomPainter + controller\n                  Physics feel (spring, fling)? → physics simulations\n```\n\n---\n\n## 12.3 Implicit animations — \"just change the value\"\n\nThey animate automatically from the old value to the new when you rebuild with a different value.\n\n```dart\nclass _BoxState extends State\u003cBox> {\n  bool _big = false;\n  @override\n  Widget build(BuildContext context) {\n    return GestureDetector(\n      onTap: () => setState(() => _big = !_big),\n      child: AnimatedContainer(\n        duration: const Duration(milliseconds: 400),\n        curve: Curves.easeInOut,\n        width: _big ? 200 : 100,\n        height: _big ? 200 : 100,\n        decoration: BoxDecoration(\n          color: _big ? Colors.blue : Colors.red,\n          borderRadius: BorderRadius.circular(_big ? 32 : 8),\n        ),\n        onEnd: () => debugPrint('done'),\n      ),\n    );\n  }\n}\n```\nBuilt-in implicit widgets (`ImplicitlyAnimatedWidget` subclasses): `AnimatedContainer`, `AnimatedOpacity`, `AnimatedPadding`, `AnimatedAlign`, `AnimatedPositioned` (in Stack), `AnimatedPositionedDirectional`, `AnimatedDefaultTextStyle`, `AnimatedPhysicalModel`, `AnimatedRotation`, `AnimatedScale`, `AnimatedSlide`, `AnimatedFractionallySizedBox`, `AnimatedTheme`.\n\nOther \"auto\" animators:\n* **`AnimatedSwitcher`** — cross-fades (or custom transition) when its **child changes** (different type or key!):\n```dart\nAnimatedSwitcher(\n  duration: const Duration(milliseconds: 300),\n  transitionBuilder: (child, anim) => ScaleTransition(scale: anim, child: child),\n  child: Text('$_count', key: ValueKey(_count)),  // ❗ key needed: same type Text → otherwise no animation\n);\n```\n* **`AnimatedCrossFade`** — between exactly two children.\n* **`AnimatedSize`** — animates its size when child size changes.\n* **`AnimatedList`** — insert/remove (Chapter 9).\n* **`TweenAnimationBuilder`** — custom implicit animation of *any* value:\n```dart\nTweenAnimationBuilder\u003cdouble>(\n  tween: Tween(begin: 0, end: progress),   // animates whenever `end` changes\n  duration: const Duration(milliseconds: 600),\n  builder: (context, value, child) => CircularProgressIndicator(value: value),\n);\n```\n\n---\n\n## 12.4 Core animation classes (explicit)\n\n| Class | What it is (5-year-old) | Tech |\n|---|---|---|\n| `Ticker` | A **metronome** ticking every frame | Calls a callback once per frame (vsync) |\n| `TickerProvider` (`vsync`) | Gives you a metronome that **stops when the screen isn't visible** | `SingleTickerProviderStateMixin` (one controller) / `TickerProviderStateMixin` (many) |\n| `AnimationController` | The **remote control**: play, reverse, stop, repeat; value 0.0→1.0 over duration | `Animation\u003cdouble>` you drive |\n| `Tween\u003cT>` | Translator: \"0..1 means 50px..200px\" | maps begin→end |\n| `Curve` / `CurvedAnimation` | Speed style: slow-start, bounce, elastic | non-linear timing |\n| `Animation\u003cT>` | A value that changes over time + listeners + status | `value`, `status`, `addListener`, `addStatusListener` |\n| `AnimatedBuilder` / `*Transition` widgets | Redraw when animation changes | rebuild only the animated part |\n\n```dart\nclass Pulse extends StatefulWidget {\n  const Pulse({super.key, required this.child});\n  final Widget child;\n  @override\n  State\u003cPulse> createState() => _PulseState();\n}\n\nclass _PulseState extends State\u003cPulse> with SingleTickerProviderStateMixin {\n  late final AnimationController _controller = AnimationController(\n    vsync: this,                                  // ❗ prevents off-screen animations from wasting battery\n    duration: const Duration(milliseconds: 800),\n  )..repeat(reverse: true);\n\n  late final Animation\u003cdouble> _scale = Tween\u003cdouble>(begin: 1.0, end: 1.15)\n      .chain(CurveTween(curve: Curves.easeInOut))\n      .animate(_controller);\n\n  @override\n  void dispose() {\n    _controller.dispose();                         // ❗ always dispose\n    super.dispose();\n  }\n\n  @override\n  Widget build(BuildContext context) =>\n      ScaleTransition(scale: _scale, child: widget.child);\n}\n```\n\n### AnimationController API\n```dart\n_controller.forward();                // 0 → 1   (returns TickerFuture, awaitable)\n_controller.forward(from: 0);\n_controller.reverse();                // 1 → 0\n_controller.repeat();                 // loop\n_controller.repeat(reverse: true);    // ping-pong\n_controller.stop();\n_controller.reset();                  // value = lowerBound\n_controller.animateTo(0.5, duration: ..., curve: ...);\n_controller.fling(velocity: 2.0);     // physics-based\n_controller.value = 0.3;              // jump (e.g., dragging)\n_controller.isAnimating; _controller.status;  // dismissed, forward, reverse, completed\nAnimationController(vsync: this, lowerBound: 0, upperBound: 360);    // custom range\nAnimationController.unbounded(vsync: this);                           // for physics\n```\nStatus listener:\n```dart\n_controller.addStatusListener((status) {\n  if (status == AnimationStatus.completed) _controller.reverse();\n  if (status == AnimationStatus.dismissed) _controller.forward();\n});\n```\n\n### Tweens\n`Tween\u003cdouble>`, `ColorTween`, `SizeTween`, `RectTween`, `IntTween`, `AlignmentTween`, `BorderRadiusTween`, `DecorationTween`, `EdgeInsetsTween`, `TextStyleTween`, `ConstantTween`, `TweenSequence` (multi-segment):\n```dart\nfinal shake = TweenSequence\u003cdouble>([\n  TweenSequenceItem(tween: Tween(begin: 0, end: -10), weight: 1),\n  TweenSequenceItem(tween: Tween(begin: -10, end: 10), weight: 2),\n  TweenSequenceItem(tween: Tween(begin: 10, end: 0), weight: 1),\n]).animate(_controller);\n```\nTwo ways to apply: `tween.animate(controller)` → `Animation\u003cT>`; or `tween.evaluate(animation)` / `tween.transform(t)` manually.\n\n### Curves\n`Curves.linear`, `ease`, `easeIn`, `easeOut`, `easeInOut`, `fastOutSlowIn` (Material standard), `easeOutCubic`, `bounceOut`, `elasticOut`, `decelerate`, `Interval(0.2, 0.6, curve: Curves.easeOut)` (sub-range — staggering), `Threshold`, `Cubic(a,b,c,d)` custom. M3 recommends `Easing.emphasizedDecelerate`, etc. (`Easing` class), and durations `Durations.medium2`.\n\n### Transition widgets (efficient, no setState)\n`FadeTransition`, `ScaleTransition`, `RotationTransition` (turns), `SlideTransition` (Offset, fraction of child size), `SizeTransition`, `PositionedTransition`, `RelativePositionedTransition`, `DecoratedBoxTransition`, `AlignTransition`, `DefaultTextStyleTransition`, `MatrixTransition` (3.13+).\n\n### AnimatedBuilder for anything custom\n```dart\nAnimatedBuilder(\n  animation: _controller,\n  child: const FlutterLogo(size: 100),               // not rebuilt\n  builder: (context, child) => Transform(\n    alignment: Alignment.center,\n    transform: Matrix4.identity()\n      ..setEntry(3, 2, 0.001)                         // perspective\n      ..rotateY(_controller.value * pi),\n    child: child,\n  ),\n);\n```\nOr subclass `AnimatedWidget` for reusable animated components.\n\n### ❌ Anti-pattern: setState on every tick\n```dart\n_controller.addListener(() => setState(() {}));   // rebuilds whole widget every frame — avoid in big widgets\n```\nUse `AnimatedBuilder`/transitions to rebuild **only** the animated subtree.\n\n---\n\n## 12.5 Staggered animations\nOne controller, many tweens with `Interval`s:\n```dart\nlate final _fade = CurvedAnimation(parent: _c, curve: const Interval(0.0, 0.3, curve: Curves.easeIn));\nlate final _slide = Tween(begin: const Offset(0, 0.2), end: Offset.zero)\n    .animate(CurvedAnimation(parent: _c, curve: const Interval(0.2, 0.6, curve: Curves.easeOut)));\nlate final _scale = Tween(begin: 0.8, end: 1.0)\n    .animate(CurvedAnimation(parent: _c, curve: const Interval(0.5, 1.0, curve: Curves.elasticOut)));\n\nFadeTransition(opacity: _fade, child: SlideTransition(position: _slide, child: ScaleTransition(scale: _scale, child: card)));\n```\nStaggered list entrance: delay each item by index (e.g., `Interval(i * 0.1, i * 0.1 + 0.5)` clamped) or use `flutter_animate` package:\n```dart\nText('Hello').animate().fadeIn(duration: 300.ms).slideY(begin: 0.2).then(delay: 200.ms).shake();\n```\n\n---\n\n## 12.6 Hero animations (shared element) 🦸\n\n```dart\n// List page\nHero(tag: 'product-${p.id}', child: Image.network(p.thumb));\n// Details page\nHero(tag: 'product-${p.id}', child: Image.network(p.image));\n```\n* Same **unique tag** on both routes; Flutter flies the widget between positions during route transition.\n* Tags must be unique per route (error: *\"There are multiple heroes that share the same tag within a subtree\"* — common when the same item appears twice, e.g., in two lists on one page).\n* `flightShuttleBuilder` to customise the flying widget; `placeholderBuilder`; wrap text heroes in `Material(type: MaterialType.transparency)` to avoid yellow underline / text style glitches.\n* `HeroMode(enabled: false)` to disable.\n* Works with `Navigator` routes (and go_router pages); for nested navigators the HeroController must be present in that Navigator.\n\n---\n\n## 12.7 Page transitions\n```dart\nNavigator.push(context, PageRouteBuilder(\n  transitionDuration: const Duration(milliseconds: 400),\n  pageBuilder: (_, __, ___) => const DetailsPage(),\n  transitionsBuilder: (_, animation, secondaryAnimation, child) {\n    final offset = Tween(begin: const Offset(1, 0), end: Offset.zero)\n        .chain(CurveTween(curve: Curves.easeOutCubic))\n        .animate(animation);\n    return SlideTransition(position: offset, child: child);\n  },\n));\n```\nGlobal: `PageTransitionsTheme` in ThemeData. The `animations` package (official) provides Material motion patterns: **Container transform** (`OpenContainer`), **Shared axis**, **Fade through**, **Fade**.\n\n---\n\n## 12.8 Physics-based animation\n```dart\nfinal simulation = SpringSimulation(\n  const SpringDescription(mass: 1, stiffness: 300, damping: 15),\n  _controller.value,   // start\n  1.0,                 // end\n  velocity,            // from drag end: details.velocity.pixelsPerSecond.dy / height\n);\n_controller.animateWith(simulation);\n```\nAlso: `FrictionSimulation`, `GravitySimulation`, `ClampedSimulation`, `BouncingScrollSimulation`. Use for drag-to-dismiss sheets, card swipe, snapping. `DraggableScrollableSheet` and scroll physics use these internally.\n\n---\n\n## 12.9 Lottie & Rive (designer animations)\n* **Lottie** (`lottie` package): plays After Effects animations exported as JSON (via Bodymovin). Great for loaders, success checkmarks, onboarding. Control with your own `AnimationController`:\n```dart\nLottie.asset('assets/success.json', controller: _c, onLoaded: (comp) { _c..duration = comp.duration..forward(); });\n```\n* **Rive** (`rive` package): interactive vector animations with **state machines** (inputs/triggers), small file sizes, runtime interactivity (e.g., animated login bear following your typing). Rive's newer runtime renders with its own renderer.\n* Performance: complex Lottie files can be heavy (many layers, masks); test on low-end devices; prefer Rive for interactive ones.\n\n---\n\n## 12.10 CustomPainter animations\n```dart\nclass WavePainter extends CustomPainter {\n  WavePainter(this.animation) : super(repaint: animation);  // ⭐ repaint on tick WITHOUT rebuilding widgets\n  final Animation\u003cdouble> animation;\n\n  @override\n  void paint(Canvas canvas, Size size) {\n    final path = Path()..moveTo(0, size.height / 2);\n    for (double x = 0; x \u003c= size.width; x++) {\n      final y = size.height / 2 + sin((x / size.width * 2 * pi) + animation.value * 2 * pi) * 20;\n      path.lineTo(x, y);\n    }\n    canvas.drawPath(path, Paint()..color = Colors.blue..style = PaintingStyle.stroke..strokeWidth = 3);\n  }\n\n  @override\n  bool shouldRepaint(WavePainter old) => false; // repaint driven by `repaint:` listenable\n}\nCustomPaint(painter: WavePainter(_controller), size: const Size(double.infinity, 100));\n```\nPassing the animation as `repaint:` makes only the **paint** phase run each frame — cheapest possible animation.\n\nFragment shaders (`FragmentProgram`, GLSL `.frag` files declared under `shaders:` in pubspec) enable GPU effects (ripples, shimmer, noise).\n\n---\n\n## 12.11 Animation performance & best practices ⚡\n1. Prefer **Transition widgets / AnimatedBuilder with `child`** over `setState` per frame.\n2. Animate **transform and opacity** (cheap: paint/composite) rather than layout properties (width/height/padding cause relayout each frame) when possible: `ScaleTransition` vs `AnimatedContainer(width)`.\n3. `Opacity` widget animating → use `FadeTransition`/`AnimatedOpacity` (they use an opacity layer efficiently without rebuilding).\n4. Wrap frequently repainting animations in `RepaintBoundary` so the rest of the screen isn't repainted.\n5. Avoid animating `BackdropFilter`/blur and `ClipPath` on big areas.\n6. Always `dispose()` controllers; use `vsync`.\n7. Respect **reduce motion** (`MediaQuery.disableAnimationsOf(context)`).\n8. Keep durations short for UI feedback (100–300 ms), longer for large transitions (300–500 ms).\n9. Test in **profile mode**; check the raster & UI thread graphs.\n10. Shader compilation jank on first run was a Skia problem; Impeller removes it on iOS/Android (Chapter 20/23).\n\n---\n\n## 12.12 Common animation bugs\n| Bug | Cause | Fix |\n|---|---|---|\n| `AnimationController.dispose() called more than once` / `...used after being disposed` | double dispose / using after dispose | single owner, check lifecycle |\n| `_MyState is a SingleTickerProviderStateMixin but multiple tickers were created` | two controllers with Single mixin | use `TickerProviderStateMixin` |\n| Ticker leak error in tests: \"A Ticker was active when the widget tree was disposed\" | controller not disposed / repeat running | dispose; in tests `pumpAndSettle` won't settle with repeating animations — use `pump(duration)` |\n| AnimatedSwitcher doesn't animate | same widget type without key | add `ValueKey` |\n| Hero tag conflict | duplicate tags in same route | unique tags |\n| Animation stutters on first run (older Skia builds) | shader compilation | Impeller; or SkSL warm-up (legacy) |\n| Animation restarts on every rebuild | controller created in build / `forward()` in build | create in initState; trigger from events or didUpdateWidget |\n\n---\n\n## 12.13 Interview Questions — Animations\n\n**Q1. Implicit vs explicit animations?** Implicit (AnimatedFoo, TweenAnimationBuilder) animate automatically when target values change, managing their own controller. Explicit use your AnimationController for full control (repeat, reverse, sync to gestures, staggering).\n\n**Q2. What is an AnimationController?** An `Animation\u003cdouble>` that produces values (default 0–1) over a duration each frame using a Ticker; provides forward, reverse, repeat, stop, fling, animateTo.\n\n**Q3. What is `vsync` / TickerProvider?** Supplies Tickers synchronized with the screen refresh and muted when the widget isn't visible (TickerMode), saving resources.\n\n**Q4. What is a Tween?** Maps the controller's 0–1 range to a value range of type T (double, Color, Offset...).\n\n**Q5. What is a Curve?** A function mapping linear time to eased progress (easeIn, bounce, elastic, Interval).\n\n**Q6. What is AnimatedBuilder and why use `child`?** A widget that rebuilds its builder on each animation tick; passing an expensive static subtree as `child` avoids rebuilding it every frame.\n\n**Q7. How does Hero animation work?** On route transition, Flutter finds Hero widgets with matching tags on both routes, computes their positions, and animates a \"flight\" in the Overlay between them.\n\n**Q8. SingleTickerProviderStateMixin vs TickerProviderStateMixin?** Single supports exactly one Ticker (more efficient); the other supports many.\n\n**Q9. How to make a staggered animation?** One controller with multiple tweens using `Interval` curves for different time slices.\n\n**Q10. How do you avoid jank in animations?** Animate cheap properties (transform/opacity), avoid rebuilding large trees per frame, RepaintBoundary, avoid expensive effects, test in profile mode.\n\n**Q11. What is AnimatedSwitcher?** Animates the transition between an old and new child when the child's type or key changes.\n\n**Q12. Lottie vs Rive?** Lottie plays AE-exported JSON timeline animations; Rive supports interactive state machines with runtime inputs and typically smaller files.\n"}, {"n": 13, "file": "13-gestures-painting-custom-renderobjects.md", "title": "Chapter 13 — Gestures, Focus & Keyboard, CustomPainter and Custom RenderObjects", "subtitle": "Gestures, Focus & Keyboard, CustomPainter and Custom RenderObjects", "short": "Gestures & Custom Painting", "sub": "Gesture arena, shortcuts, RenderObjects", "level": "intermediate", "minutes": 10, "qa": 12, "md": "# Chapter 13 — Gestures, Focus & Keyboard, CustomPainter and Custom RenderObjects\n\n> **Goal:** Handle every kind of user input (touch, mouse, keyboard, stylus), understand the gesture arena and hit testing, draw anything with `CustomPainter`, and write your own `RenderObject` when widgets aren't enough.\n\n---\n\n## 13.1 Pointer events → gestures (two layers)\n\n1. **Pointer events** (raw): `PointerDownEvent`, `PointerMoveEvent`, `PointerUpEvent`, `PointerCancelEvent`, `PointerHoverEvent`, `PointerScrollEvent`. Widget: `Listener`.\n2. **Gestures** (semantic): tap, double tap, long press, drag, pan, scale. Widget: `GestureDetector` (uses gesture recognizers).\n\n### Hit testing — \"who did I touch?\" 🎯\nWhen a finger goes down, Flutter performs a **hit test** from the root RenderObject down: each render box checks if the point is inside its bounds and asks its children (top-most painted first). The result is a **list of hit targets** (deepest first, then ancestors). Pointer events are delivered to all of them.\n\n`HitTestBehavior` on `GestureDetector`/`Listener`:\n* `deferToChild` (default) — only hit if a child is hit. ⚠️ A `GestureDetector` around a `Container` **without colour** or around empty space won't receive taps in the transparent areas!\n* `opaque` — hit anywhere in bounds; blocks targets visually behind.\n* `translucent` — hit anywhere in bounds and also lets targets behind receive events.\n\n```dart\nGestureDetector(\n  behavior: HitTestBehavior.opaque,   // ✅ fixes \"tap on empty space of Row does nothing\"\n  onTap: () {},\n  child: Row(children: const [Icon(Icons.info), SizedBox(width: 50), Text('Info')]),\n);\n```\n\n---\n\n## 13.2 GestureDetector — all callbacks\n\n```dart\nGestureDetector(\n  onTap: () {}, onTapDown: (d) {}, onTapUp: (d) {}, onTapCancel: () {},\n  onDoubleTap: () {},\n  onLongPress: () {}, onLongPressStart: (d) {}, onLongPressMoveUpdate: (d) {}, onLongPressEnd: (d) {},\n  onSecondaryTap: () {},                   // right click\n  onVerticalDragUpdate: (d) {},  onHorizontalDragUpdate: (d) {},\n  onPanStart: (d) {}, onPanUpdate: (d) => _offset += d.delta, onPanEnd: (d) => d.velocity,\n  onScaleStart: (d) {}, onScaleUpdate: (d) => _scale = d.scale /* also d.rotation, d.focalPoint */, onScaleEnd: (d) {},\n  onForcePressStart: (d) {},               // 3D touch devices\n  child: ...,\n);\n```\n⚠️ You can't use `onPan*` and `onScale*` together (scale is a superset of pan) → error \"Having both a pan gesture recognizer and a scale gesture recognizer is redundant; scale is a superset of pan.\" Use scale only.\n\n⚠️ Adding `onDoubleTap` **delays** `onTap` (Flutter waits ~300ms to see if a second tap comes).\n\n### The gesture arena ⚔️ (interview favourite)\nWhen multiple recognizers could claim the same pointer (e.g., a horizontal drag inside a vertical scroll view, tap vs double-tap vs long press), they enter the **gesture arena**:\n* Each recognizer watches pointer movement and can **accept** or **reject**.\n* The first to accept **wins**; others are rejected. If all but one reject, the last one wins.\n* Example: vertical `ListView` + horizontal `PageView` child: a mostly-horizontal move makes the horizontal drag recognizer win (it declares victory after moving past \"touch slop\", ~18 logical px); a mostly-vertical move lets the scroll win.\n* Parent and child GestureDetectors with `onTap`: the **child (deepest)** wins by default because when the pointer goes up, the arena is \"swept\" and the first recognizer (deepest hit) wins.\n\nCustom arena behaviour: `RawGestureDetector` with custom `GestureRecognizer` subclasses; `EagerGestureRecognizer`; for platform views, `gestureRecognizers` set.\n\n### Listener vs GestureDetector\n`Listener` gets raw pointer events **without** arena (always receives events) — use for drawing apps, analytics of touches, or custom behaviour. `GestureDetector` recognizes gestures and competes in the arena.\n\n### Other gesture widgets\n`InkWell`/`InkResponse` (Material ripple), `Draggable` + `DragTarget` (+ `LongPressDraggable`) for drag & drop, `Dismissible`, `InteractiveViewer` (pan/zoom images/maps), `MouseRegion` (hover, cursor: `SystemMouseCursors.click`), `AbsorbPointer` (block children, *absorbs* hit), `IgnorePointer` (children invisible to hit testing; events go to widgets behind), `TapRegion` (detect taps outside a region — used by TextField `onTapOutside`).\n\n```dart\nDraggable\u003cString>(\n  data: 'apple',\n  feedback: const Material(child: Text('🍎', style: TextStyle(fontSize: 40))),\n  childWhenDragging: const Opacity(opacity: 0.3, child: Text('🍎')),\n  child: const Text('🍎'),\n);\nDragTarget\u003cString>(\n  onWillAcceptWithDetails: (details) =
