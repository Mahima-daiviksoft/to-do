<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a reading app built like a Flutter widget tree — chapter rail (parent), reading column (child), section map (sibling).
   Ink-navy on cool "blueprint" paper; Flutter-sky accent for constraints, amber for the "explain it like I'm 5" voice. */
:root {
  --paper: #f4f6fb;
  --surface: #ffffff;
  --raised: #eef2fa;
  --ink: #0f1830;
  --muted: #59647d;
  --rule: #dfe5f0;
  --accent: #155ff0;
  --accent-ink: #ffffff;
  --accent-soft: #e3ecff;
  --sky: #0aa6e0;
  --amber: #c97a00;
  --amber-soft: #fff3d6;
  --good: #128a5a;
  --good-soft: #dcf5ea;
  --warn: #b4410c;
  --warn-soft: #fde8dd;
  --code-bg: #f0f3f9;
  --mark: #ffe58a;
  --shadow: 0 1px 2px rgba(15, 24, 48, 0.06), 0 8px 24px rgba(15, 24, 48, 0.06);
  --kw: #8a2fc4; --str: #127a43; --num: #b35400; --com: #7a869b; --fn: #155ff0; --type: #00809f;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --read: "Literata", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --read-size: 18px;
  --rail: 288px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0a0f1d; --surface: #111a2d; --raised: #17223a; --ink: #e8edf8; --muted: #9aa6bf; --rule: #24304b;
    --accent: #6fa2ff; --accent-ink: #08101f; --accent-soft: #19284a; --sky: #4cd0ff;
    --amber: #f3b54a; --amber-soft: #33270f; --good: #45d398; --good-soft: #10301f; --warn: #ff9a6b; --warn-soft: #3a1d12;
    --code-bg: #0d1426; --mark: #6b5513; --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.35);
    --kw: #d6a2ff; --str: #7fdca6; --num: #ffb86b; --com: #7c889e; --fn: #8fb7ff; --type: #6ad9f5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0a0f1d; --surface: #111a2d; --raised: #17223a; --ink: #e8edf8; --muted: #9aa6bf; --rule: #24304b;
  --accent: #6fa2ff; --accent-ink: #08101f; --accent-soft: #19284a; --sky: #4cd0ff;
  --amber: #f3b54a; --amber-soft: #33270f; --good: #45d398; --good-soft: #10301f; --warn: #ff9a6b; --warn-soft: #3a1d12;
  --code-bg: #0d1426; --mark: #6b5513; --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.35);
  --kw: #d6a2ff; --str: #7fdca6; --num: #ffb86b; --com: #7c889e; --fn: #8fb7ff; --type: #6ad9f5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--display); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: flex; align-items: center; gap: 10px; height: 58px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--rule);
}
.progress-line { position: absolute; left: 0; bottom: -1px; height: 3px; width: 0; background: linear-gradient(90deg, var(--accent), var(--sky)); transition: width 0.1s linear; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.brand b { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
.logo { width: 28px; height: 28px; }
.logo .a { fill: var(--accent); } .logo .b { fill: var(--sky); }
.spacer { flex: 1; }
.btn-plain {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink); text-decoration: none;
}
.btn-plain:hover { border-color: var(--accent); }
.btn-plain svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; flex: none; }
.search-trigger { min-width: 230px; justify-content: flex-start; color: var(--muted); font-weight: 400; }
.search-trigger kbd { margin-left: auto; }
kbd { font-family: var(--mono); font-size: 11px; padding: 2px 6px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 5px; color: var(--muted); background: var(--raised); }
.menu-btn { display: none; }
.icon-only { width: 38px; justify-content: center; padding: 0; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); align-items: start; }
.rail {
  position: sticky; top: calc(58px + env(safe-area-inset-top, 0px));
  height: calc(100vh - 58px - env(safe-area-inset-top, 0px));
  overflow-y: auto; overscroll-behavior: contain;
  padding: 14px 10px 48px max(10px, env(safe-area-inset-left, 0px));
  border-right: 1px solid var(--rule); background: var(--surface);
  font-size: 14px; line-height: 1.3;
}
.rail-progress { margin: 4px 6px 12px; padding: 12px; border-radius: 12px; background: var(--raised); }
.rail-progress .row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.bar { height: 6px; border-radius: 6px; background: var(--rule); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--sky)); border-radius: 6px; transition: width 0.4s ease; }
.rail nav a.top { margin-bottom: 4px; }
.rail h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 16px 8px 6px; font-weight: 600; }
.rail nav a {
  display: grid; grid-template-columns: 24px 1fr 16px; gap: 6px; align-items: start; padding: 6px 8px; border-radius: 8px;
  color: var(--ink); text-decoration: none;
}
.rail nav a .n { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.rail nav a .ok { width: 14px; height: 14px; margin-top: 2px; stroke: var(--good); fill: none; stroke-width: 3; visibility: hidden; }
.rail nav a.done .ok { visibility: visible; }
.rail nav a:hover { background: var(--raised); }
.rail nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.rail nav a[aria-current="page"] .n { color: var(--accent); }

main { min-width: 0; padding-block: 28px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1100px; margin: 0 auto; }

/* ---------- home: hero ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 18px 40px; }
.eyebrow { font-family: var(--mono); font-size: 12.5px; color: var(--sky); letter-spacing: 0.04em; }
.hero h1 { font-weight: 800; font-size: clamp(40px, 6.4vw, 78px); line-height: 0.98; letter-spacing: -0.04em; margin: 14px 0 18px; text-wrap: balance; }
.hero h1 .hl { background: linear-gradient(100deg, var(--accent), var(--sky)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p.lede { font-family: var(--read); font-size: 19px; line-height: 1.6; color: var(--muted); max-width: 52ch; margin: 0; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 12px;
  font-weight: 600; font-size: 15.5px; text-decoration: none; cursor: pointer; border: 1px solid transparent;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--rule); }
.btn.secondary:hover { border-color: var(--accent); }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 26px; color: var(--muted); font-size: 14px; }
.facts b { color: var(--ink); font-size: 20px; font-weight: 800; display: block; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

.tree-card { position: relative; background: var(--surface); border: 1px solid var(--rule); border-radius: 22px; padding: 18px 18px 14px; box-shadow: var(--shadow); }
.tree-card svg { display: block; width: 100%; height: auto; max-width: 100%; }
.tree-card .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted); padding: 6px 4px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend .down i { background: var(--accent); } .legend .up i { background: var(--amber); }
.tree-node rect { fill: var(--raised); stroke: var(--rule); }
.tree-node.root rect { fill: var(--accent); stroke: var(--accent); }
.tree-node.root text { fill: var(--accent-ink); }
.tree-node.leaf rect { fill: var(--surface); }
.tree-node text { fill: var(--ink); font-family: var(--mono); font-size: 12.5px; }
.tree-edge { stroke: var(--rule); stroke-width: 2; fill: none; }
.dot-down { fill: var(--accent); } .dot-up { fill: var(--amber); }
.tree-caption { position: absolute; top: 14px; right: 16px; font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* ---------- home: sections ---------- */
.section-h { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 44px 0 14px; }
.section-h h2 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
.section-h p { margin: 4px 0 0; color: var(--muted); }

.you { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 22px; align-items: center; background: var(--surface); border: 1px solid var(--rule); border-radius: 18px; padding: 18px 22px; }
.ring { width: 84px; height: 84px; }
.ring circle { fill: none; stroke-width: 9; }
.ring .track { stroke: var(--raised); }
.ring .val { stroke: url(#ringGrad); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 0.6s ease; }
.ring text { fill: var(--ink); font-family: var(--display); font-weight: 800; font-size: 20px; }
.you h3 { margin: 0 0 4px; font-size: 19px; }
.you p { margin: 0; color: var(--muted); }
.you .mini { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 13.5px; color: var(--muted); }
.you .mini b { color: var(--ink); }

.paths { display: grid; gap: 14px; }
.path-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.path-tab { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.path-tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.path-body { background: var(--surface); border: 1px solid var(--rule); border-radius: 18px; padding: 18px; }
.path-body p { margin: 0 0 14px; color: var(--muted); max-width: 70ch; }
.steps { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.step { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px 7px 8px; border-radius: 10px; background: var(--raised); color: var(--ink); text-decoration: none; font-size: 14px; }
.step .n { font-family: var(--mono); font-size: 11.5px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 1px 5px; color: var(--muted); }
.step.done { background: var(--good-soft); }
.step.done .n { color: var(--good); border-color: transparent; }
.step:hover { outline: 1px solid var(--accent); }
.arrow { color: var(--muted); font-size: 13px; }

.part-block { margin-top: 30px; }
.part-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.part-head .tag { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; }
.part-head h3 { margin: 0; font-size: 21px; letter-spacing: -0.01em; }
.part-head p { margin: 0; color: var(--muted); font-size: 14.5px; flex-basis: 100%; }
.cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card {
  position: relative; display: flex; flex-direction: column; gap: 8px; height: 100%; padding: 16px; border-radius: 16px;
  background: var(--surface); border: 1px solid var(--rule); color: var(--ink); text-decoration: none;
  transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow); }
.card .num { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -0.04em; color: var(--accent-soft); -webkit-text-stroke: 1.2px var(--accent); }
.card h4 { margin: 0; font-size: 16.5px; line-height: 1.25; }
.card .sub { color: var(--muted); font-size: 13.5px; }
.card .meta { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--raised); color: var(--muted); white-space: nowrap; }
.chip.lvl-beginner { background: var(--good-soft); color: var(--good); }
.chip.lvl-intermediate { background: var(--accent-soft); color: var(--accent); }
.chip.lvl-advanced { background: var(--warn-soft); color: var(--warn); }
.chip.lvl-interview { background: var(--amber-soft); color: var(--amber); }
.card .done-badge { position: absolute; top: 14px; right: 14px; display: none; width: 24px; height: 24px; border-radius: 50%; background: var(--good); }
.card .done-badge svg { width: 14px; height: 14px; margin: 5px; stroke: var(--surface); fill: none; stroke-width: 3; }
.card.done .done-badge { display: block; }

.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.feature { padding: 16px; border-radius: 16px; border: 1px dashed var(--rule); }
.feature b { display: block; margin-bottom: 4px; font-size: 15.5px; }
.feature span { color: var(--muted); font-size: 14px; }
.feature .k { margin-top: 8px; display: flex; gap: 4px; }

/* ---------- chapter view ---------- */
.chapter-layout { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 40px; max-width: 1120px; margin: 0 auto; }
.reading { min-width: 0; max-width: 760px; }
.ch-head { padding-bottom: 22px; margin-bottom: 8px; border-bottom: 1px solid var(--rule); }
.ch-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.ch-top .tag { font-family: var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
.ch-title { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: end; margin-top: 12px; }
.ch-num { font-weight: 800; font-size: clamp(64px, 9vw, 112px); line-height: 0.8; letter-spacing: -0.06em; color: transparent; -webkit-text-stroke: 2px var(--accent); }
.ch-title h1 { margin: 0; font-size: clamp(28px, 3.8vw, 44px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 800; text-wrap: balance; }
.ch-title .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 15.5px; }
.ch-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
.ch-actions .chip { font-size: 12.5px; padding: 5px 10px; }
.toggle-done[aria-pressed="true"] { background: var(--good); color: var(--surface); border-color: var(--good); }

.toc-side { position: sticky; top: calc(84px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 110px); overflow-y: auto; font-size: 13.5px; padding-left: 14px; border-left: 1px solid var(--rule); }
.toc-side h5 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.toc-side a { display: block; padding: 4px 0; color: var(--muted); text-decoration: none; line-height: 1.3; }
.toc-side a:hover { color: var(--ink); }
.toc-side a.on { color: var(--accent); font-weight: 600; }

/* article typography */
article { font-family: var(--read); font-size: var(--read-size); line-height: 1.72; }
article > h1:first-child { display: none; }
article h2, article h3, article h4 { font-family: var(--display); line-height: 1.2; text-wrap: balance; letter-spacing: -0.015em; scroll-margin-top: calc(80px + env(safe-area-inset-top, 0px)); position: relative; }
article h2 { font-size: 1.55em; font-weight: 800; margin: 2.1em 0 0.6em; }
article h3 { font-size: 1.22em; font-weight: 700; margin: 1.7em 0 0.4em; }
article h4 { font-size: 1.05em; font-weight: 700; margin: 1.4em 0 0.3em; }
.mark-btn { position: absolute; left: -34px; top: 0.1em; width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; opacity: 0; display: grid; place-items: center; }
.mark-btn svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; }
article h2:hover .mark-btn, article h3:hover .mark-btn, .mark-btn:focus-visible, .mark-btn[aria-pressed="true"] { opacity: 1; }
.mark-btn[aria-pressed="true"] svg { fill: var(--amber); stroke: var(--amber); }
article p, article li { max-width: 70ch; }
article strong { font-weight: 600; }
article hr { border: 0; height: 1px; background: var(--rule); margin: 2.2em 0; }
article ul, article ol { padding-left: 1.3em; }
article li { margin: 0.25em 0; }
article li::marker { color: var(--accent); }
article code { font-family: var(--mono); font-size: 0.8em; background: var(--code-bg); border: 1px solid var(--rule); padding: 1px 5px; border-radius: 6px; }
article blockquote { margin: 1.3em 0; padding: 14px 18px 14px 50px; border-radius: 14px; background: var(--accent-soft); position: relative; font-size: 0.95em; }
article blockquote::before { content: "i"; position: absolute; left: 16px; top: 15px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 700 13px/22px var(--display); text-align: center; }
article blockquote p { margin: 0.25em 0; }
article blockquote.warn { background: var(--warn-soft); }
article blockquote.warn::before { content: "!"; background: var(--warn); }
article blockquote.tip { background: var(--amber-soft); }
article blockquote.tip::before { content: "★"; background: var(--amber); font-size: 12px; }
article p.eli5 { background: var(--amber-soft); padding: 14px 18px; border-radius: 14px; }
article p.eli5 strong:first-child { color: var(--amber); font-family: var(--display); }

.code { position: relative; margin: 1.1em 0 1.5em; border: 1px solid var(--rule); border-radius: 14px; background: var(--code-bg); overflow: hidden; }
.code-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--rule); font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-transform: lowercase; }
.copy { border: 1px solid var(--rule); background: var(--surface); border-radius: 7px; padding: 3px 9px; font-family: var(--display); font-size: 12px; cursor: pointer; color: var(--muted); text-transform: none; }
.copy:hover { color: var(--accent); border-color: var(--accent); }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.55; }
.code pre code { font-family: var(--mono); background: none; border: 0; padding: 0; font-size: 1em; font-variant-ligatures: none; }

.table-wrap { overflow-x: auto; margin: 1.1em 0 1.6em; border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); }
article table { border-collapse: collapse; width: 100%; font-family: var(--display); font-size: 14px; line-height: 1.45; }
article th, article td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
article th { background: var(--raised); font-weight: 600; white-space: nowrap; }
article tr:last-child td { border-bottom: 0; }
article tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }

/* Q&A cards */
details.qa { border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); margin: 10px 0; font-size: 0.95em; }
details.qa > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 13px 16px; font-family: var(--display); font-weight: 600; line-height: 1.4; }

<script type="application/json" id="book-data">{"chapters": [{"n": 1, "file": "01-what-is-flutter.md", "title": "Chapter 1 — What Is Flutter? (The Big Picture)", "subtitle": "What Is Flutter? (The Big Picture)", "short": "What Is Flutter?", "sub": "Architecture, rendering, build modes, hot reload", "level": "beginner", "minutes": 19, "qa": 12, "md": "# Chapter 1 — What Is Flutter? (The Big Picture)\n\n> **Goal of this chapter:** By the end you will be able to explain what Flutter is, how it is different from other ways of building apps, how it draws pixels on the screen, and why companies choose it — the way you would explain it to a child *and* the way you would explain it to a senior interviewer.\n\n---\n\n## 1.1 The \"5-year-old\" explanation\n\nImagine you want to draw the same picture on **six different pieces of paper**: one is an iPhone, one is an Android phone, one is a web browser, one is a Windows PC, one is a Mac, and one is a Linux computer.\n\n* **Old way:** You hire six different artists. Each artist speaks a different language (Swift, Kotlin, JavaScript, C#…). Each artist draws the picture a little bit differently. When you want to change the colour of the sun, you must tell all six artists. Expensive and slow.\n* **Flutter way:** You hire **one artist** (you!) who speaks **one language (Dart)**. You give this artist a **magic paintbrush (the Flutter engine)** that works on every piece of paper. The artist paints *every single pixel* themselves, so the picture looks *exactly* the same everywhere.\n\nThat magic paintbrush is the key idea: **Flutter does not ask Android or iOS to draw buttons for it. Flutter draws its own buttons**, pixel by pixel, on a blank canvas the operating system gives it.\n\n---\n\n## 1.2 The grown-up definition\n\n**Flutter** is an open-source **UI toolkit / SDK** created by **Google** for building **natively compiled**, multi-platform applications from a **single codebase**. It targets:\n\n| Platform | Status |\n|---|---|\n| Android | Stable |\n| iOS | Stable |\n| Web | Stable (since Flutter 2.0, March 2021) |\n| Windows | Stable (since Flutter 2.10, Feb 2022) |\n| macOS | Stable (since Flutter 3.0, May 2022) |\n| Linux | Stable (since Flutter 3.0, May 2022) |\n| Embedded (cars, kiosks, TVs) | Through custom embedders (e.g., Toyota, LG webOS, Sony) |\n\nKey facts interviewers like:\n\n* **Language:** Dart (also created by Google).\n* **First announced:** 2015 as \"Sky\" (Dart Developer Summit). **Flutter 1.0** released **4 December 2018**.\n* **Flutter 2.0** (March 2021): web stable + sound null safety.\n* **Flutter 3.0** (May 2022): all 6 platforms stable, Material 3 begins.\n* **Flutter 3.10** (May 2023): Dart 3 (100% sound null safety, records, patterns, sealed classes), Impeller default on iOS.\n* **Flutter 3.16** (Nov 2023): Material 3 becomes the default (`useMaterial3: true`).\n* **Flutter 3.22** (May 2024): WebAssembly (Wasm) web compilation stable.\n* **Flutter 3.27** (Dec 2024): Impeller default on Android API 29+ (Android 10+).\n* **Flutter 3.29** (Feb 2025): Skia opt-out removed on iOS (Impeller only on iOS).\n* **Flutter 3.38 / Dart 3.10** (Nov 2025): Dart *dot shorthands*, widget previews in IDEs, web hot reload by default.\n* **Flutter 3.44** (May 2026): Swift Package Manager default for iOS/macOS, freezing of `material.dart`/`cupertino.dart` in the framework ahead of decoupling.\n* **Flutter 3.47 / Dart 3.13** (Aug 2026): standalone `material_ui` and `cupertino_ui` packages on pub.dev (1.0); Dart **primary constructors** stable.\n\n> ⚠️ Release history moves fast. Always check your actual version with `flutter --version`. This book focuses on concepts that stay true across versions, and flags things that changed recently so you are never surprised in an interview or in a codebase that uses an older SDK.\n\n---\n\n## 1.3 Why does Flutter exist? (The problem it solves)\n\nBefore Flutter, there were three main ways to build a mobile app:\n\n### 1.3.1 Native development\n* Android with **Kotlin/Java**, iOS with **Swift/Objective-C**.\n* ✅ Best access to platform features, best performance.\n* ❌ Two teams, two codebases, features drift apart, double cost.\n\n### 1.3.2 Web-view / hybrid apps (Cordova, Ionic, Capacitor)\n* Your app is a website inside a native \"browser box\" (WebView).\n* ✅ Web developers can build apps.\n* ❌ Often feels slower, less \"native\", limited by the WebView.\n\n### 1.3.3 JavaScript-bridge frameworks (React Native — classic architecture, Xamarin.Forms)\n* You write JavaScript; it tells the platform to create **real native widgets** (UIButton, android.widget.Button).\n* ✅ Native look.\n* ❌ Historically, a \"bridge\" serialised messages between JS and native — a bottleneck. (React Native's *New Architecture* with JSI/Fabric reduces this, but the model is still \"control native widgets\".)\n* ❌ Each platform's widgets behave differently → subtle cross-platform bugs.\n\n### 1.3.4 Flutter's approach\n* You write **Dart**. It is compiled **ahead-of-time (AOT)** to **native ARM / x64 machine code** for release builds.\n* Flutter **does not use platform widgets**. It ships its own rendering engine and **paints every pixel itself** onto a surface (a \"canvas\") provided by the OS.\n* ✅ Pixel-perfect consistency across platforms.\n* ✅ No JS bridge for UI work — the UI code runs directly as machine code.\n* ✅ Hot reload: change code and see it in under a second, state preserved.\n* ❌ Larger minimum app size (engine is bundled; a \"hello world\" release APK is a few MB).\n* ❌ Must re-implement platform look-and-feel (Material, Cupertino) — and keep up when Apple/Google change their design.\n* ❌ Platform features still need plugins (which use **platform channels** or **FFI** to talk to native code).\n\n---\n\n## 1.4 Flutter's architecture — the layered cake 🎂\n\nThink of Flutter as a **three-layer cake**. You mostly eat the top layer, but the other layers hold it up.\n\n```\n┌──────────────────────────────────────────────────────────────┐\n│  FRAMEWORK (Dart)                                            │\n│  ┌─────────────────────────┐ ┌──────────────────────────┐    │\n│  │ Material      Cupertino │  ← Design languages          │  │\n│  ├─────────────────────────┴─┴──────────────────────────┤    │\n│  │ Widgets                                               │    │\n│  ├───────────────────────────────────────────────────────┤    │\n│  │ Rendering   (RenderObjects: layout + paint)           │    │\n│  ├──────────────┬──────────────┬─────────────────────────┤    │\n│  │ Animation    │ Painting     │ Gestures                │    │\n│  ├──────────────┴──────────────┴─────────────────────────┤    │\n│  │ Foundation   (basic utilities, ChangeNotifier, keys)  │    │\n│  └───────────────────────────────────────────────────────┘    │\n├──────────────────────────────────────────────────────────────┤\n│  ENGINE (mostly C++)                                         │\n│  Dart runtime (VM) · Impeller / Skia (graphics) · Text       │\n│  layout (libtxt/SkParagraph, HarfBuzz) · Platform channels   │\n│  · dart:ui · Accessibility bridge · Plugin architecture      │\n├──────────────────────────────────────────────────────────────┤\n│  EMBEDDER (platform-specific)                                │\n│  Android: Java/Kotlin + C++   iOS/macOS: Objective-C/Swift   │\n│  Windows: C++   Linux: C++/GTK   Web: JS + Wasm/CanvasKit    │\n│  Provides: rendering surface, input events, threads,         │\n│  event loop, app lifecycle, plugin registration              │\n└──────────────────────────────────────────────────────────────┘\n```\n\n### 1.4.1 Embedder (the plate under the cake)\nThe **embedder** is the native app that \"hosts\" Flutter. On Android it is an `Activity` (`FlutterActivity`) containing a `FlutterView`; on iOS it is a `FlutterViewController`. The embedder:\n* Creates the drawing **surface** (an OpenGL/Vulkan/Metal surface).\n* Sets up **threads** (task runners).\n* Forwards **touch, keyboard, mouse** events into Flutter.\n* Forwards **lifecycle** events (app paused/resumed).\n* Hosts **plugins** (native code).\n\n### 1.4.2 Engine (the sponge)\nWritten mostly in **C++**. It contains:\n* **Dart runtime** — runs your Dart code (JIT in debug, AOT in release).\n* **Graphics renderer** — **Impeller** (the modern default on iOS and Android API 29+) or **Skia** (the older renderer still used in some configurations such as older Android devices, and historically on desktop/web via CanvasKit).\n* **Text layout** — shaping, line breaking.\n* **`dart:ui`** — the lowest-level Dart library, exposing the engine to the framework: `Canvas`, `Paint`, `Path`, `Picture`, `Scene`, `PlatformDispatcher`, etc.\n\n### 1.4.3 Framework (the icing — where you work)\nWritten in **Dart**. This is the `package:flutter/...` you import. Layers, bottom to top:\n1. **Foundation** — `ChangeNotifier`, `Key`, `debugPrint`, `kReleaseMode`, `compute`.\n2. **Animation, Painting, Gestures** — `AnimationController`, `Tween`, `TextPainter`, `GestureDetector` internals.\n3. **Rendering** — the `RenderObject` tree that does layout & painting.\n4. **Widgets** — the declarative layer: `StatelessWidget`, `StatefulWidget`, `Row`, `Text`.\n5. **Material & Cupertino** — ready-made design systems. (Since Flutter 3.47 also published as standalone `material_ui` and `cupertino_ui` packages — see Chapter 10.)\n\n> 🎯 **Interview soundbite:** \"Flutter is layered: the embedder hosts it on each platform, the C++ engine runs Dart and renders using Impeller or Skia, and the Dart framework gives us widgets which build an element tree, which manages a render-object tree that performs layout and paint. Because Flutter paints its own pixels, it gets consistent UI across platforms.\"\n\n---\n\n## 1.5 How does Flutter get pixels on the screen? (Simple version)\n\n1. **You** write widgets: \"I want a blue box with the text Hello in the middle.\"\n2. Flutter **builds** a tree of widgets → creates **elements** → creates **render objects**.\n3. Render objects **lay out** (decide sizes and positions) and **paint** (record drawing commands).\n4. The painted commands are put into **layers** and sent as a **scene** to the engine.\n5. The engine's **raster thread** uses **Impeller/Skia** to turn the commands into GPU instructions.\n6. The GPU draws the pixels. The OS shows them on the screen.\n\nThis happens up to **60 times per second** on a 60 Hz screen (16.67 ms per frame), or **120 times per second** on 120 Hz screens (8.33 ms per frame). If a frame takes longer, the user sees a stutter called **jank**. Chapter 20 goes deep into this pipeline; Chapter 23 shows how to fix jank.\n\n---\n\n## 1.6 Dart: why did Flutter pick it?\n\nInterviewers *love* this question.\n\n1. **JIT + AOT compilation.**\n   * **JIT (Just-In-Time)** in debug mode → enables **hot reload** (inject changed code into a running VM).\n   * **AOT (Ahead-Of-Time)** in release mode → fast startup, predictable performance, native machine code.\n   Few languages do *both* well.\n2. **Fast allocation & garbage collection.** Flutter creates and throws away thousands of tiny widget objects every frame. Dart's **generational GC** has a very fast \"young generation\" (scavenger) that is optimised exactly for short-lived objects.\n3. **Single-threaded event loop + isolates.** No shared-memory threads means **no locks needed** in UI code; widgets can be rebuilt without race conditions. Heavy work goes to **isolates** (separate memory heaps communicating via messages).\n4. **Sound null safety & strong typing** → fewer runtime crashes.\n5. **Familiar syntax** for Java / C# / JavaScript / Kotlin / Swift developers.\n6. **Google controls both** → the Dart team can add features Flutter needs (e.g., hot reload support, records, patterns, dot shorthands for enums like `.center`).\n7. **Tree shaking** — unused code is removed from release builds.\n\n---\n\n## 1.7 Build modes (debug, profile, release)\n\n| Mode | Command | Compilation | Use for | Features |\n|---|---|---|---|---|\n| **Debug** | `flutter run` | JIT | Development | Hot reload, assertions on, debug banner, service extensions, slow |\n| **Profile** | `flutter run --profile` | AOT | Performance measurement | Close to release speed, DevTools performance tools work, no hot reload, **real device only** |\n| **Release** | `flutter run --release` / `flutter build ...` | AOT | Shipping to users | Fastest, smallest, assertions removed, no debugging |\n\nUseful constants from `package:flutter/foundation.dart`:\n```dart\nimport 'package:flutter/foundation.dart';\n\nif (kDebugMode) print('only in debug');\nif (kProfileMode) { /* ... */ }\nif (kReleaseMode) { /* ... */ }\nif (kIsWeb) { /* running on web */ }\n```\n\n> ⚠️ **Common mistake:** Measuring performance in debug mode. Debug mode is *much* slower (JIT, assertions, extra checks). Always measure jank in **profile mode on a real device**.\n\n> 🔎 Note on the web: web has no \"JIT/AOT to machine code\" in the same sense. Debug web builds use the `dartdevc` (DDC) compiler to JavaScript modules; release builds use `dart2js` (optimised JavaScript) or `dart2wasm` (WebAssembly) when you build with `--wasm`.\n\n---\n\n## 1.8 Hot reload vs hot restart vs full restart\n\nThis is asked in almost **every** Flutter interview.\n\n| | Hot Reload (`r`) | Hot Restart (`R`) | Full restart (stop & run) |\n|---|---|---|---|\n| Speed | ~sub-second | a few seconds | slow (recompile native) |\n| Keeps app state? | ✅ Yes | ❌ No (state reset) | ❌ No |\n| How it works | Injects updated source into running Dart VM, then rebuilds widget tree | Recompiles, restarts the Dart isolate, re-runs `main()` | Rebuilds native app |\n| Re-runs `main()`/`initState()`? | ❌ No | ✅ Yes | ✅ Yes |\n\n**When hot reload does NOT reflect your change** (memorise this list):\n1. Changes to `main()` or to code only run once at startup.\n2. Changes to `initState()` of an already-created widget (it won't run again).\n3. Changes to **global variables and static fields initialisers** (they're already initialised).\n4. Changing a `StatelessWidget` into a `StatefulWidget` (or vice versa) — may produce errors; use hot restart.\n5. Changing **enum** types to classes, or **generic type** declarations — may require hot restart.\n6. **Native code** changes (Kotlin, Swift, `AndroidManifest.xml`, `Info.plist`, Gradle, Podfile) — need a full rebuild.\n7. Adding **new assets** to `pubspec.yaml` or new **packages** — usually needs restart/rebuild.\n8. Changes in code that a **compile error** blocked.\n\n---\n\n## 1.9 Everything is a widget\n\nIn Flutter, almost everything you see — and many things you don't — are **widgets**:\n* Visible things: `Text`, `Image`, `Icon`, `ElevatedButton`.\n* Layout: `Row`, `Column`, `Padding`, `Center`, `Stack`.\n* Behaviour: `GestureDetector`, `Dismissible`, `Draggable`.\n* Styling: `Theme`, `DefaultTextStyle`.\n* Even the whole app: `MaterialApp`.\n\nA **widget** is just an **immutable description** of part of the UI — like a **blueprint** or a **recipe card**. It is *not* the actual thing on screen. When anything changes, Flutter builds new, cheap blueprints and compares them with the old ones to decide what to actually change. Chapter 6 explains this deeply.\n\n### Your first Flutter app, explained line by line\n\n```dart\nimport 'package:flutter/material.dart'; // 1. Bring in Material widgets.\n\nvoid main() {                // 2. Every Dart program starts at main().\n  runApp(const MyApp());     // 3. runApp() attaches the root widget to the screen.\n}\n\nclass MyApp extends StatelessWidget {   // 4. A widget with no changing state.\n  const MyApp({super.key});              // 5. const constructor → can be cached.\n\n  @override\n  Widget build(BuildContext context) {   // 6. Describes the UI.\n    return MaterialApp(                  // 7. Sets up theme, navigation, etc.\n      title: 'Hello App',\n      theme: ThemeData(colorSchemeSeed: Colors.blue),\n      home: const HomePage(),\n    );\n  }\n}\n\nclass HomePage extends StatefulWidget {  // 8. A widget whose state can change.\n  const HomePage({super.key});\n\n  @override\n  State\u003cHomePage> createState() => _HomePageState(); // 9. Creates its State object.\n}\n\nclass _HomePageState extends State\u003cHomePage> {\n  int _count = 0;                         // 10. The changing data (state).\n\n  void _increment() {\n    setState(() {                         // 11. \"Hey Flutter, my data changed —\n      _count++;                           //      please call build() again.\"\n    });\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return Scaffold(                      // 12. Basic page layout (app bar, body, FAB).\n      appBar: AppBar(title: const Text('Counter')),\n      body: Center(\n        child: Text(\n          'You pressed $_count times',\n          style: Theme.of(context).textTheme.headlineMedium,\n        ),\n      ),\n      floatingActionButton: FloatingActionButton(\n        onPressed: _increment,\n        child: const Icon(Icons.add),\n      ),\n    );\n  }\n}\n```\n\nWhat happens when you tap the button?\n1. `_increment` runs → `setState` marks this State's element as **dirty**.\n2. On the next frame, Flutter calls `build()` again for this widget.\n3. A new `Text` widget with the new number is created.\n4. Flutter compares it with the old one: same type, same position → **reuse** the existing element & render object, just **update** the text.\n5. Only that text is re-laid-out and repainted.\n\n---\n\n## 1.10 Declarative vs imperative UI\n\n**Imperative** (old Android/iOS style): *\"Find the label. Change its text to 5. Make the button red.\"* You tell the UI **how** to change, step by step.\n\n```java\n// Imperative (Android Views)\nTextView label = findViewById(R.id.label);\nlabel.setText(\"5\");\n```\n\n**Declarative** (Flutter, SwiftUI, Jetpack Compose, React): *\"When count is 5, the UI looks like this.\"* You describe **what** the UI should look like for a given state; the framework figures out the changes.\n\n```dart\n// Declarative (Flutter)\nText('$count')\n```\n\nFormula Flutter docs use: **UI = f(state)** — the UI is a function of the state. `build()` is that function.\n\nBenefits: fewer bugs from forgetting to update a view, easier reasoning, easy testing.\n\n---\n\n## 1.11 Flutter vs alternatives (interview comparison table)\n\n| Aspect | Flutter | React Native | Native (Kotlin/Swift) | Kotlin Multiplatform (KMP) / Compose Multiplatform |\n|---|---|---|---|---|\n| Language | Dart | JavaScript/TypeScript | Kotlin / Swift | Kotlin |\n| UI rendering | Own engine draws every pixel | Native platform widgets | Native widgets | KMP: share logic, native UI; Compose MP: own rendering via Skia (Skiko) |\n| Code sharing | UI + logic | UI + logic | none | logic (+ UI with Compose MP) |\n| Performance | Near-native, AOT | Good; JS engine (Hermes) | Best | Native |\n| Hot reload | Yes, stateful | Fast Refresh | Limited (Compose previews / Live Edit, SwiftUI previews) | Compose hot reload (newer) |\n| Look & feel | Identical everywhere unless adapted | Native per platform | Native | Native / custom |\n| App size | Larger baseline | Medium | Smallest | Small/medium |\n| Web | Yes (canvas-based; not SEO-friendly by default) | React Native Web | No | Wasm (Compose) |\n\n**When NOT to choose Flutter** (senior candidates should know):\n* App is mostly **content/SEO websites** → use a web framework.\n* App relies heavily on **cutting-edge platform-specific UI** (e.g., new iOS widgets/Live Activities, deep OS integrations) — Flutter can still do it but you write native code anyway.\n* Extremely **size-constrained** apps (instant apps, App Clips have size limits — Flutter is possible but tight).\n* Team already has strong native teams and features differ completely per platform.\n\n**When Flutter shines:** startups/MVPs, branded custom UI, apps needing identical UX across iOS/Android, internal enterprise apps, apps that also want desktop/web from the same code, design-heavy apps, fintech/e-commerce dashboards. Known users: Google Pay, Google Ads, Google Classroom (parts), BMW (My BMW app), Alibaba (Xianyu), ByteDance products, Nubank, Toyota (infotainment), eBay Motors, Philips Hue, Reflectly, Credit Agricole, LG webOS, etc.\n\n---\n\n## 1.12 Threads in Flutter (simple version)\n\nFlutter's engine uses several **task runners** (threads):\n\n| Runner | Job |\n|---|---|\n| **Platform thread** (main thread) | OS events, plugin calls (platform channel handlers on native side run here by default) |\n| **UI thread** | Runs **your Dart code** (root isolate): build, layout, paint (recording), animations, event handling |\n| **Raster thread** (formerly \"GPU thread\") | Takes the layer tree and rasterises it with Impeller/Skia, talks to the GPU |\n| **IO thread** | Expensive I/O like decoding images, uploading textures |\n\n> 📌 Recent change: Starting around Flutter 3.29 on iOS and Android, the engine **merged the platform and UI threads** by default (Dart now runs on the platform's main thread). This enables synchronous calls to native code (useful for FFI and future direct native interop). Conceptually, you still think of \"the UI thread running Dart\" — but don't be surprised if an interviewer mentions this.\n\nKey consequence: **all your Dart code runs on one thread** (per isolate). If you do heavy work (parse a 20 MB JSON, image processing) on it, frames are missed → **jank**. Solution: `Isolate.run()` / `compute()` (Chapter 5 & 23).\n\n---\n\n## 1.13 Summary checklist ✅\n- [ ] Flutter = Google's UI toolkit, one Dart codebase, 6+ platforms.\n- [ ] Draws its own pixels using Impeller/Skia (not platform widgets).\n- [ ] Three layers: Embedder → Engine (C++) → Framework (Dart).\n- [ ] Debug = JIT + hot reload; Release = AOT machine code.\n- [ ] Hot reload keeps state; hot restart resets state; native changes need full rebuild.\n- [ ] Declarative: UI = f(state); widgets are immutable blueprints.\n- [ ] Single UI thread for Dart → use isolates for heavy work.\n\n---\n\n## 1.14 Interview Questions for this chapter\n\n**Q1. What is Flutter? How is it different from other cross-platform frameworks?**\nA: Flutter is Google's open-source UI SDK for building natively compiled apps for mobile, web, desktop and embedded from one Dart codebase. Its key difference is that it doesn't wrap native UI components — it ships its own rendering engine (Impeller/Skia) and draws every pixel, giving consistent UI and high performance. Release builds are compiled AOT to native machine code, so there is no JavaScript bridge for UI.\n\n**Q2. Why does Flutter use Dart?**\nA: Dart supports both JIT (for hot reload in development) and AOT (fast, predictable native code in production); has a generational GC optimised for many short-lived objects (widgets); a single-threaded event loop with isolates so UI code needs no locks; sound null safety; tree shaking; and Google owns both so the language evolves with Flutter's needs.\n\n**Q3. Explain Flutter's architecture.**\nA: Embedder (platform-specific host: surface, threads, input, lifecycle, plugins) → Engine (C++: Dart runtime, Impeller/Skia, text layout, dart:ui, platform channels) → Framework (Dart: foundation, animation/painting/gestures, rendering, widgets, Material/Cupertino).\n\n**Q4. Difference between hot reload and hot restart?**\nA: Hot reload injects changed code into the running Dart VM and rebuilds the widget tree, preserving state; it doesn't rerun `main()` or `initState()`. Hot restart recompiles and restarts the app's Dart state from `main()`, losing state. Native changes need a full rebuild.\n\n**Q5. What are Flutter build modes?**\nA: Debug (JIT, hot reload, assertions, slow), Profile (AOT, profiling enabled, real device only), Release (AOT, optimised, minimal). Measure performance only in profile mode.\n\n**Q6. Is Flutter \"native\"?**\nA: The compiled code is native machine code (AOT ARM/x64) and it uses native rendering APIs (Metal/Vulkan/OpenGL), but the UI widgets are not platform-native widgets; they are Flutter re-implementations. Native platform features are accessed via plugins using platform channels or FFI.\n\n**Q7. What is Impeller and why was it created?**\nA: Impeller is Flutter's newer rendering engine replacing Skia on mobile. Skia compiled shaders at runtime the first time an effect was used, causing \"shader compilation jank\" on first animations. Impeller precompiles a smaller, fixed set of shaders at engine build time, so there is no runtime shader compilation, giving predictable frame times. It targets Metal on iOS and Vulkan (with OpenGL ES fallback) on Android.\n\n**Q8. What is the difference between declarative and imperative UI?**\nA: Imperative: you mutate UI objects step by step. Declarative: you describe the UI for the current state (UI = f(state)) and the framework diffs and updates. Flutter is declarative.\n\n**Q9. What threads does Flutter use?**\nA: Platform, UI (Dart), Raster, and IO task runners. Dart code runs on one thread per isolate; heavy computations should move to another isolate.\n\n**Q10. What are the disadvantages of Flutter?**\nA: Larger app size, non-native widgets (must mimic platform design), web output is canvas-based (SEO and text selection need care), needing native code for some platform features, plugin quality varies, and Dart talent pool smaller than JS.\n\n**Q11. What is `runApp()`?**\nA: It inflates the given widget and attaches it to the screen, making it the root of the widget tree. It ensures the `WidgetsFlutterBinding` is initialized and schedules the first frame. Calling it again replaces the root.\n\n**Q12. What is `WidgetsFlutterBinding.ensureInitialized()` and when do you need it?**\nA: The binding is the glue between the framework and the engine. `runApp` initialises it automatically, but if you need to use platform channels/plugins *before* `runApp` (e.g., `await Firebase.initializeApp()`, `SharedPreferences.getInstance()`, setting orientations), you must call `WidgetsFlutterBinding.ensureInitialized()` first, otherwise you get \"Binding has not yet been initialized\".\n\n```dart\nFuture\u003cvoid> main() async {\n  WidgetsFlutterBinding.ensureInitialized();\n  await Firebase.initializeApp();\n  runApp(const MyApp());\n}\n```\n"}, {"n": 2, "file": "02-setup-and-tooling.md", "title": "Chapter 2 — Setup, Tooling, Project Structure & the Flutter CLI", "subtitle": "Setup, Tooling, Project Structure & the Flutter CLI", "short": "Setup & Tooling", "sub": "Install, pubspec, pub, CLI, Gradle/Xcode fixes", "level": "beginner", "minutes": 19, "qa": 14, "md": "# Chapter 2 — Setup, Tooling, Project Structure & the Flutter CLI\n\n> **Goal:** Install Flutter correctly, understand every file in a new project, master the CLI, pub (package manager), versioning, and IDE tools. Most \"it doesn't build!\" problems in companies come from this chapter's topics.\n\n---\n\n## 2.1 Installing Flutter (all platforms)\n\n### 2.1.1 What you need\n| You want to build for | You need |\n|---|---|\n| Android | Android Studio (or command-line tools), Android SDK, a JDK (Android Studio bundles one), an emulator or device |\n| iOS / macOS | A **Mac** with **Xcode**, plus CocoaPods (still used by many plugins) — Swift Package Manager is increasingly the default |\n| Web | Chrome (for debugging) |\n| Windows | Visual Studio (not VS Code) with \"Desktop development with C++\" workload |\n| Linux | clang, cmake, ninja-build, pkg-config, libgtk-3-dev |\n\n> You **cannot** build an iOS app on Windows/Linux locally. Companies use Macs or cloud CI Macs (Codemagic, GitHub Actions macOS runners, Bitrise).\n\n### 2.1.2 Steps (conceptually the same on every OS)\n1. Download the Flutter SDK (zip from docs.flutter.dev, or `git clone https://github.com/flutter/flutter.git -b stable`). The VS Code Flutter extension can also download the SDK for you.\n2. Add `flutter/bin` to your **PATH**.\n3. Run `flutter doctor` — it checks everything and tells you what is missing.\n4. Accept Android licenses: `flutter doctor --android-licenses`.\n5. Install IDE plugins: **Flutter** and **Dart** plugins for VS Code or Android Studio / IntelliJ.\n\n### 2.1.3 `flutter doctor` explained like you're 5\n`flutter doctor` is a **doctor that checks your computer's health for Flutter**. Each line is a check:\n```\n[✓] Flutter (Channel stable, 3.x.x, ...)\n[✓] Android toolchain - develop for Android devices\n[✗] Xcode - develop for iOS and macOS        ← missing!\n[✓] Chrome - develop for the web\n[!] Android Studio (version ...)              ← warning\n[✓] Connected device (2 available)\n[✓] Network resources\n```\n* `✓` healthy · `!` warning (may work) · `✗` broken. Use `flutter doctor -v` for details.\n\n---\n\n## 2.2 Channels & versions\n\nFlutter has **release channels**:\n| Channel | What | Who should use |\n|---|---|---|\n| **stable** | Tested releases, roughly quarterly + hotfixes | Production apps — ALWAYS |\n| **beta** | Monthly-ish preview of next stable | Trying new features |\n| **main** | Latest commits, may break | Contributors |\n\n(The old `dev` channel was retired in 2022.)\n\n```bash\nflutter channel            # show channels\nflutter channel stable     # switch\nflutter upgrade            # upgrade current channel\nflutter downgrade          # go back to previous version on that channel\nflutter --version          # show Flutter, engine, Dart versions\n```\n\n### 2.2.1 Version pinning in teams — **FVM**\nIn a company, **everyone must use the same Flutter version**; otherwise \"works on my machine\" bugs appear (different lint rules, generated code, Gradle versions).\n\n**FVM (Flutter Version Management)** solves this:\n```bash\ndart pub global activate fvm\nfvm install 3.x.x\nfvm use 3.x.x          # writes .fvmrc in the project\nfvm flutter run        # use the pinned version\n```\nCommit `.fvmrc` to git; add `.fvm/` (the symlink folder) to `.gitignore`. CI uses the same version (e.g., `subosito/flutter-action` in GitHub Actions reading the version from the file).\n\nAlternatives: asdf/mise version managers, or specifying `flutter:` constraint in `pubspec.yaml` `environment:` (which only *checks* — it does not install).\n\n---\n\n## 2.3 Creating a project\n\n```bash\nflutter create my_app                              # default counter app\nflutter create --org com.mycompany my_app          # sets bundle id / package name prefix\nflutter create --platforms=android,ios my_app      # only some platforms\nflutter create -t package my_package               # pure Dart/Flutter package\nflutter create -t plugin --platforms=android,ios my_plugin   # plugin with native code\nflutter create -t plugin_ffi my_ffi_plugin         # FFI plugin\nflutter create -e my_app                           # \"empty\" minimal app (no counter comments)\nflutter create -t module my_module                 # add-to-app module\n```\n\n> **Tip:** Always set `--org` up front. Changing the Android `applicationId` and iOS bundle identifier later is tedious (but possible — see Chapter 26).\n\n---\n\n## 2.4 Project structure — every file explained\n\n```\nmy_app/\n├── android/                  ← Native Android project (Gradle)\n│   ├── app/\n│   │   ├── build.gradle(.kts)  ← app module config: applicationId, minSdk, signing, flavors\n│   │   └── src/main/\n│   │       ├── AndroidManifest.xml  ← permissions, activities, deep links, app name\n│   │       ├── kotlin/.../MainActivity.kt  ← extends FlutterActivity\n│   │       └── res/          ← icons (mipmap), launch background, styles\n│   ├── build.gradle(.kts)    ← project-level Gradle\n│   ├── settings.gradle(.kts) ← plugin management, Flutter Gradle plugin, AGP & Kotlin versions\n│   └── gradle/wrapper/gradle-wrapper.properties ← Gradle version\n├── ios/                      ← Native iOS project (Xcode)\n│   ├── Runner/\n│   │   ├── AppDelegate.swift ← FlutterAppDelegate\n│   │   ├── Info.plist        ← permissions descriptions, URL schemes, display name\n│   │   └── Assets.xcassets   ← app icons, launch images\n│   ├── Runner.xcworkspace    ← OPEN THIS in Xcode (not .xcodeproj) when CocoaPods is used\n│   └── Podfile               ← CocoaPods deps (platform :ios, 'xx.0')\n├── lib/                      ← YOUR DART CODE lives here\n│   └── main.dart             ← entry point\n├── test/                     ← unit & widget tests (files must end with _test.dart)\n├── integration_test/         ← integration tests (you create it)\n├── web/                      ← index.html, manifest.json, icons for web\n├── windows/ macos/ linux/    ← desktop runners\n├── assets/                   ← (you create) images, fonts, json\n├── pubspec.yaml              ← project manifest: name, version, deps, assets, fonts\n├── pubspec.lock              ← exact resolved versions (COMMIT for apps)\n├── analysis_options.yaml     ← lint rules\n├── .metadata                 ← used by flutter tool for migrations; commit it\n├── .dart_tool/               ← generated tool cache (DON'T commit)\n├── build/                    ← build outputs (DON'T commit)\n└── README.md\n```\n\n### 2.4.1 `pubspec.yaml` deeply explained\n```yaml\nname: my_app                       # package name: lowercase_with_underscores\ndescription: \"A new Flutter project.\"\npublish_to: 'none'                 # prevents accidental `pub publish` of an app\n\nversion: 1.2.3+45                  # versionName 1.2.3 + build number 45\n                                   # Android: versionName=1.2.3, versionCode=45\n                                   # iOS: CFBundleShortVersionString=1.2.3, CFBundleVersion=45\n\nenvironment:\n  sdk: ^3.5.0                      # Dart SDK constraint (also enables language features by version!)\n  flutter: \">=3.24.0\"              # optional minimum Flutter\n\ndependencies:                      # needed at runtime\n  flutter:\n    sdk: flutter\n  cupertino_icons: ^1.0.8\n  http: ^1.2.0                     # caret syntax: >=1.2.0 \u003c2.0.0\n  my_local_pkg:\n    path: ../packages/my_local_pkg # local path dependency\n  some_fork:\n    git:\n      url: https://github.com/me/some_fork.git\n      ref: v1.0.1                  # branch, tag or commit — pin it!\n      path: packages/some_fork     # subdirectory, optional\n\ndev_dependencies:                  # only for development: tests, code generation, lints\n  flutter_test:\n    sdk: flutter\n  flutter_lints: ^5.0.0\n  build_runner: ^2.4.0\n\ndependency_overrides:              # FORCE a version (use sparingly, document why!)\n  intl: 0.19.0\n\nflutter:\n  uses-material-design: true       # includes Material Icons font\n  generate: true                   # needed for gen-l10n (localization) in many setups\n  assets:\n    - assets/images/               # folder (NOT recursive into subfolders!)\n    - assets/config/app.json       # single file\n  fonts:\n    - family: Inter\n      fonts:\n        - asset: assets/fonts/Inter-Regular.ttf\n        - asset: assets/fonts/Inter-Bold.ttf\n          weight: 700\n```\n\n#### Semantic versioning (SemVer) & caret syntax\n`MAJOR.MINOR.PATCH` → `2.4.1`\n* **MAJOR** — breaking changes.\n* **MINOR** — new features, backwards compatible.\n* **PATCH** — bug fixes.\n\n`^1.2.3` means `>=1.2.3 \u003c2.0.0`. **Special case for 0.x:** `^0.2.3` means `>=0.2.3 \u003c0.3.0` (because in 0.x, minor bumps may break).\n\nOther constraints: `any` (avoid!), `\">=1.0.0 \u003c3.0.0\"`, `1.2.3` (exact).\n\n#### `environment: sdk:` lower bound is important\nThe **lower bound** of your Dart SDK constraint decides the **language version** your package uses. Example: features like records/patterns need `sdk: ^3.0.0`; dot shorthands need `^3.10.0`; primary constructors need `^3.13.0`. If your lower bound is too low, the analyzer says *\"This requires the 'xyz' language feature to be enabled.\"*\n\n### 2.4.2 `pubspec.lock` — commit or not?\n* **Apps: COMMIT IT.** Everyone and CI gets the *exact same* versions → reproducible builds.\n* **Packages (libraries): historically not committed**, because consumers resolve their own versions. (Modern guidance: committing it in packages is OK for your own CI reproducibility; it is ignored by consumers anyway.)\n\n### 2.4.3 Assets gotcha\n```yaml\nassets:\n  - assets/images/\n```\nThis includes files **directly** inside `assets/images/` but **not** `assets/images/icons/`. You must list subfolders separately. This is a top-3 beginner bug: *\"Unable to load asset\"*.\n\nAlso: resolution-aware images:\n```\nassets/images/logo.png        ← 1.0x\nassets/images/2.0x/logo.png   ← used on 2x screens\nassets/images/3.0x/logo.png   ← used on 3x screens\n```\nYou still reference `assets/images/logo.png`; Flutter picks the best variant.\n\n---\n\n## 2.5 Pub — the package manager\n\n```bash\nflutter pub get                    # download deps per pubspec (creates/updates lock)\nflutter pub add dio                # add latest compatible dep\nflutter pub add --dev mocktail     # add dev dependency\nflutter pub add 'dio:^5.4.0'       # with constraint\nflutter pub remove dio\nflutter pub upgrade                # upgrade within constraints (updates lock)\nflutter pub upgrade --major-versions  # bump constraints to latest majors (review!)\nflutter pub outdated               # show what's outdated (Current/Upgradable/Resolvable/Latest)\nflutter pub deps                   # dependency tree\nflutter pub cache repair           # fix corrupted cache\nflutter pub cache clean            # wipe global cache\ndart pub global activate \u003cpkg>     # install CLI tools\n```\n\n### 2.5.1 Choosing a package on pub.dev (organisational checklist)\nBefore adding any dependency to a company app, check:\n1. **Publisher** — verified publisher (e.g., `dart.dev`, `flutter.dev`, `firebase.google.com`, well-known companies).\n2. **Likes / Pub points / Downloads (popularity)**.\n3. **Last published date** — abandoned packages are a risk.\n4. **Platform support** badges (Android, iOS, Web…).\n5. **Null safety / Dart 3 compatibility** (all current packages are null-safe; Dart 3 requires null safety).\n6. **Open issues & how maintainers respond**.\n7. **License** (MIT/BSD/Apache OK for most companies; GPL may be a problem — ask legal).\n8. **Transitive dependencies** — does it pull in 30 others?\n9. **Native code quality** for plugins: permissions it adds to your manifest, minimum SDK, size impact.\n10. Could you write it yourself in 50 lines? Then maybe don't add a dependency.\n\n### 2.5.2 Version conflict (\"version solving failed\")\n```\nBecause app depends on a ^2.0.0 which depends on intl ^0.18.0,\nand app depends on b ^3.0.0 which depends on intl ^0.19.0, version solving failed.\n```\nFixes, in order of preference:\n1. `flutter pub upgrade` / bump `a` or `b` to versions compatible with each other.\n2. Check package changelogs for a version supporting the newer dependency.\n3. Temporarily `dependency_overrides:` with a **comment** explaining why and a ticket to remove it.\n4. Fork & fix, depend via `git:` with a pinned `ref`.\n\n---\n\n## 2.6 Essential Flutter CLI commands (cheat sheet)\n\n```bash\nflutter devices                    # list connected devices/emulators\nflutter emulators                  # list emulators\nflutter emulators --launch \u003cid>\nflutter run                        # run on device (debug)\nflutter run -d chrome              # web\nflutter run -d \u003cdeviceId>\nflutter run --release / --profile\nflutter run --flavor dev -t lib/main_dev.dart        # flavors (Chapter 26)\nflutter run --dart-define=API_URL=https://dev.api    # compile-time env vars\nflutter run --dart-define-from-file=config/dev.json  # many vars from a JSON file\n\nflutter build apk --release                  # Android APK (universal)\nflutter build apk --split-per-abi            # smaller per-ABI APKs\nflutter build appbundle                      # AAB for Play Store\nflutter build ipa                            # iOS archive for App Store\nflutter build web --release                  # web (add --wasm for WebAssembly)\nflutter build windows | macos | linux\n\nflutter test                                  # run tests\nflutter test --coverage                       # generate coverage/lcov.info\nflutter test test/foo_test.dart --name \"adds\"\nflutter analyze                               # static analysis (lints)\ndart format .                                 # format code\ndart fix --dry-run / dart fix --apply         # automated migrations & lint fixes\nflutter clean                                 # delete build/ and .dart_tool/ (fixes many weird issues)\nflutter gen-l10n                              # generate localization classes\nflutter pub run build_runner build --delete-conflicting-outputs   # older form\ndart run build_runner build --delete-conflicting-outputs           # modern form\ndart run build_runner watch                                        # continuous codegen\nflutter logs                                  # device logs\nflutter attach                                # attach to running app (add-to-app)\nflutter screenshot\nflutter config --enable-web / --no-analytics  # global config\nflutter precache                              # download engine artifacts\nflutter symbolize -i \u003cstacktrace> -d \u003csymbols-dir>  # de-obfuscate stack traces\n```\n\n### 2.6.1 Keys while `flutter run` is running\n| Key | Action |\n|---|---|\n| `r` | Hot reload |\n| `R` | Hot restart |\n| `p` | Toggle debug paint (layout boundaries) |\n| `P` | Performance overlay |\n| `o` | Toggle platform (Android ↔ iOS look) |\n| `w` | Dump widget tree |\n| `t` | Dump render tree |\n| `L` | Dump layer tree |\n| `S` | Dump semantics tree |\n| `i` | Toggle widget inspector |\n| `v` | Open DevTools |\n| `M` | Write SkSL shaders (legacy Skia only) |\n| `q` | Quit |\n| `h` | Help |\n\n---\n\n## 2.7 `--dart-define` and environment configuration\n\n```dart\n// Reading compile-time constants:\nconst apiUrl = String.fromEnvironment('API_URL', defaultValue: 'https://prod.api');\nconst isStaging = bool.fromEnvironment('STAGING');\nconst retries = int.fromEnvironment('RETRIES', defaultValue: 3);\n```\n* These are **compile-time constants** — `const` required; changing them needs rebuild (not hot reload).\n* ⚠️ They are **embedded in the binary**. **Never put secrets** (private keys) here — anyone can extract strings from an APK/IPA. API keys meant to be public (e.g., Firebase client keys, Maps keys restricted by app signature) are acceptable.\n* `--dart-define-from-file=env/dev.json` (JSON or `.env` file) is the clean approach for many variables.\n\nAlternative: `flutter_dotenv` (reads a bundled asset `.env` at runtime — same security caveat: it's in the bundle), `envied` (code generation with optional obfuscation — obfuscation is *not* real security).\n\n---\n\n## 2.8 analysis_options.yaml & lints\n\n```yaml\ninclude: package:flutter_lints/flutter.yaml   # or package:very_good_analysis/analysis_options.yaml\n\nanalyzer:\n  exclude:\n    - \"**/*.g.dart\"\n    - \"**/*.freezed.dart\"\n  language:\n    strict-casts: true          # no implicit dynamic casts\n    strict-inference: true\n    strict-raw-types: true\n  errors:\n    missing_required_param: error\n    missing_return: error\n    todo: ignore\n\nlinter:\n  rules:\n    - prefer_const_constructors\n    - prefer_final_locals\n    - avoid_print\n    - always_use_package_imports    # or prefer_relative_imports — pick ONE in your team\n    - require_trailing_commas\n    - unawaited_futures\n    - cancel_subscriptions\n    - close_sinks\n    - use_build_context_synchronously\n```\nLint packages:\n* `lints` — Dart core/recommended sets.\n* `flutter_lints` — Flutter's recommended set (default in new projects).\n* `very_good_analysis` — strict set used by Very Good Ventures, popular in companies.\n* **DCM (Dart Code Metrics)** — commercial tool with metrics (cyclomatic complexity, etc.) and extra rules.\n* Custom lint rules: `custom_lint` package, or the newer official **analyzer plugin** system (Dart 3.10+).\n\nSuppress for one line: `// ignore: avoid_print`; for a file: `// ignore_for_file: avoid_print`.\n\n---\n\n## 2.9 IDEs & productivity\n\n### VS Code\n* Extensions: **Flutter**, **Dart**. Optional: Error Lens, Pubspec Assist, Awesome Flutter Snippets, bloc / riverpod snippets.\n* Shortcuts: `Ctrl/Cmd + .` → **Quick actions**: *Wrap with widget, Wrap with Padding/Center/Column, Remove widget, Extract widget, Extract method, Convert to StatefulWidget*.\n* `stless` / `stful` snippets create widgets.\n* Run & Debug panel, breakpoints, `launch.json` for flavors and dart-defines:\n```json\n{\n  \"configurations\": [\n    {\n      \"name\": \"dev\",\n      \"request\": \"launch\",\n      \"type\": \"dart\",\n      \"program\": \"lib/main_dev.dart\",\n      \"args\": [\"--flavor\", \"dev\", \"--dart-define-from-file=env/dev.json\"]\n    }\n  ]\n}\n```\n\n### Android Studio / IntelliJ\n* Flutter + Dart plugins. Flutter Inspector, Flutter Outline, Performance tabs.\n* `Alt+Enter` (Win/Linux) / `Option+Enter` (Mac) → quick actions (wrap, extract).\n* Good for native Android debugging (Logcat, Gradle).\n\n### Xcode\nNeeded for iOS signing, capabilities (Push, Sign in with Apple, App Groups), archive, and debugging native crashes.\n\n### Widget Previews\nNewer Flutter versions (3.35 experimental, IDE integration in 3.38+) support **widget previews** via a `@Preview` annotation so you can see widgets in the IDE without running the app (similar to Compose/SwiftUI previews). Check your version's docs as the API is evolving.\n\n### DevTools\nBrowser-based suite: Inspector, Performance, CPU Profiler, Memory, Network, Logging, App Size, Deep Links validator, Provider/Riverpod/Bloc extensions. Opened with `v` in `flutter run`, from IDE, or `dart devtools`. Chapter 23 covers it deeply.\n\n---\n\n## 2.10 Android-specific setup knowledge (comes up in every company!)\n\n### 2.10.1 Gradle files (modern Kotlin DSL — default for new projects since Flutter 3.29)\n`android/settings.gradle.kts` (simplified):\n```kotlin\npluginManagement {\n    val flutterSdkPath = run { /* reads local.properties flutter.sdk */ }\n    includeBuild(\"$flutterSdkPath/packages/flutter_tools/gradle\")\n    repositories { google(); mavenCentral(); gradlePluginPortal() }\n}\nplugins {\n    id(\"dev.flutter.flutter-plugin-loader\") version \"1.0.0\"\n    id(\"com.android.application\") version \"8.x.x\" apply false   // AGP version\n    id(\"org.jetbrains.kotlin.android\") version \"2.x.x\" apply false\n}\ninclude(\":app\")\n```\n`android/app/build.gradle.kts`:\n```kotlin\nplugins {\n    id(\"com.android.application\")\n    id(\"kotlin-android\")\n    id(\"dev.flutter.flutter-gradle-plugin\") // must come after Android & Kotlin plugins\n}\nandroid {\n    namespace = \"com.mycompany.myapp\"\n    compileSdk = flutter.compileSdkVersion\n    defaultConfig {\n        applicationId = \"com.mycompany.myapp\"\n        minSdk = 23                     // or flutter.minSdkVersion\n        targetSdk = flutter.targetSdkVersion\n        versionCode = flutter.versionCode\n        versionName = flutter.versionName\n    }\n    buildTypes {\n        release {\n            signingConfig = signingConfigs.getByName(\"release\")\n            isMinifyEnabled = true      // R8 shrinking of Java/Kotlin code\n            isShrinkResources = true\n        }\n    }\n}\n```\nOlder projects use Groovy `build.gradle` with `apply plugin:` \"imperative apply\" — Flutter 3.16+ migrated to the **declarative `plugins {}` block**; old style now shows deprecation warnings / errors. Migration guide: \"Deprecated imperative apply of Flutter's Gradle plugins\".\n\n### 2.10.2 Version compatibility triangle\n**Gradle ↔ Android Gradle Plugin (AGP) ↔ Java (JDK) ↔ Kotlin** must be compatible.\n* AGP 8.x needs Java 17.\n* Each AGP version needs a minimum Gradle version.\n* Flutter tool warns if versions are too old.\nTypical error: *\"Unsupported class file major version 65\"* → your JDK is too new for your Gradle (65 = Java 21). Fix: upgrade Gradle wrapper (`gradle-wrapper.properties`) or point Flutter to a different JDK: `flutter config --jdk-dir=/path/to/jdk17`.\n\n### 2.10.3 minSdk / targetSdk / compileSdk\n* **minSdk** — oldest Android version supported. Many plugins require ≥ 21 or higher (Firebase etc.). Flutter itself has raised its minimum over time (currently API 21+, with recent releases moving the default higher — check your version).\n* **targetSdk** — the Android behaviour version you've tested against; Google Play requires a recent targetSdk (typically within one year of the latest Android release).\n* **compileSdk** — SDK used to compile; must be ≥ what plugins need.\n\n### 2.10.4 MultiDex\nOnly needed for minSdk \u003c 21. Flutter tool can enable it automatically (`flutter run --multidex` historically). With minSdk 21+ it's native.\n\n---\n\n## 2.11 iOS-specific setup knowledge\n\n* Open `ios/Runner.xcworkspace` in Xcode.\n* **Signing & Capabilities** tab: Team, Bundle Identifier, capabilities (Push Notifications, Background Modes, Associated Domains for universal links).\n* `Podfile`: `platform :ios, '13.0'` — many plugins require a minimum iOS version; mismatches cause `pod install` errors: *\"The plugin X requires a higher minimum iOS deployment version\"*.\n* Common fixes:\n  ```bash\n  cd ios\n  pod deintegrate         # if very broken\n  rm -rf Pods Podfile.lock\n  pod repo update         # update specs\n  pod install\n  cd ..\n  flutter clean && flutter pub get\n  ```\n* Apple Silicon (M1+) historical issue: `ffi` gem / running `arch -x86_64 pod install` — no longer needed on modern CocoaPods.\n* **Swift Package Manager (SwiftPM)**: Flutter added support (opt-in 3.24, increasingly default; default for iOS/macOS in Flutter 3.44). Plugins that ship `Package.swift` integrate via SPM; CocoaPods is still used as a fallback for plugins that don't support SPM yet. Enable/disable with `flutter config --enable-swift-package-manager` / `--no-enable-swift-package-manager`, or per project in `pubspec.yaml` under `flutter: config:` (check your version's docs).\n* `Info.plist` must contain **usage descriptions** for every permission (`NSCameraUsageDescription`, `NSLocationWhenInUseUsageDescription`, `NSPhotoLibraryUsageDescription`, …) — missing ones cause **instant crash** when requesting the permission and **App Store rejection**.\n\n---\n\n## 2.12 Common setup problems & fixes (company survival kit)\n\n| Symptom | Cause | Fix |\n|---|---|---|\n| `flutter: command not found` | PATH not set | Add `\u003cflutter>/bin` to PATH, restart terminal |\n| `Android license status unknown` | licenses not accepted | `flutter doctor --android-licenses` |\n| `cmdline-tools component is missing` | SDK Manager missing tools | Android Studio → SDK Manager → SDK Tools → Android SDK Command-line Tools |\n| `Gradle task assembleDebug failed with exit code 1` | Generic; read the error above it | Run `cd android && ./gradlew assembleDebug --stacktrace` for details |\n| `Unsupported class file major version XX` | JDK vs Gradle mismatch | Upgrade Gradle wrapper or `flutter config --jdk-dir` |\n| `Execution failed for task ':app:checkDebugAarMetadata'` | Plugin needs higher compileSdk | Raise `compileSdk` |\n| `Manifest merger failed: uses-sdk:minSdkVersion X cannot be smaller than version Y declared in library` | Plugin needs higher minSdk | Raise `minSdk` |\n| `CocoaPods not installed` / `pod: command not found` | | `sudo gem install cocoapods` or `brew install cocoapods` |\n| `CocoaPods could not find compatible versions for pod \"Firebase/...\"` | Specs repo outdated / version conflict | `pod repo update`, delete Podfile.lock, `pod install` |\n| `Module 'xyz' not found` (Xcode) | Opened .xcodeproj or pods not installed | Open .xcworkspace, `pod install` |\n| `Unable to load asset` | Asset not declared or wrong path / subfolder | Check pubspec indentation & paths, full restart |\n| `Waiting for another flutter command to release the startup lock` | Stale lock | Kill flutter processes; delete `\u003cflutter>/bin/cache/lockfile` |\n| Strange errors after upgrading | stale build caches | `flutter clean && flutter pub get` (+ `pod install`) |\n| `version solving failed` | dep conflicts | see §2.5.2 |\n| `The current Dart SDK version is X. Because app requires SDK version >=Y` | Your Flutter is older than a package needs | Upgrade Flutter or downgrade package |\n| Emulator very slow | No hardware acceleration | Enable HAXM/Hypervisor/KVM, use x86_64/arm64 system image matching host |\n| `No connected devices` | USB debugging off / drivers | Enable Developer options → USB debugging; `adb devices`; accept RSA prompt |\n\n---\n\n## 2.13 Interview Questions\n\n**Q1. What is `pubspec.yaml`?** The project manifest: name, version, SDK constraints, dependencies, dev_dependencies, dependency_overrides, assets, fonts and Flutter-specific settings.\n\n**Q2. Difference between `dependencies` and `dev_dependencies`?** Dependencies are needed by the app at runtime and are compiled in; dev_dependencies are tools used during development (tests, code generators, lints) and are not included in the app or passed on to consumers of a package.\n\n**Q3. What is `pubspec.lock` and should it be committed?** It records the exact resolved versions of all (transitive) dependencies. Commit it for applications for reproducible builds.\n\n**Q4. What does `^1.2.3` mean?** `>=1.2.3 \u003c2.0.0`. For `^0.2.3` it's `>=0.2.3 \u003c0.3.0`.\n\n**Q5. What is `dependency_overrides`?** Forces a package version regardless of other constraints — useful for temporary conflicts or testing a local fork, but risky; document and remove ASAP.\n\n**Q6. `flutter pub get` vs `flutter pub upgrade`?** `get` resolves deps respecting the existing lock file (only changing what's needed); `upgrade` tries to move every dependency to the latest version allowed by constraints and rewrites the lock file.\n\n**Q7. What does `flutter clean` do?** Deletes the `build/` folder and `.dart_tool/` (and some ephemeral files), forcing a full rebuild — fixes stale artifact issues.\n\n**Q8. How do you manage different environments (dev/staging/prod)?** Flavors (Android productFlavors, iOS schemes/configurations) + separate entrypoints (`main_dev.dart`) and/or `--dart-define(-from-file)`; never put secrets in the binary.\n\n**Q9. What is FVM and why use it?** Flutter Version Management pins a Flutter SDK version per project so the entire team and CI use the same version.\n\n**Q10. What is the version format in pubspec and how does it map to stores?** `x.y.z+n` → Android versionName/versionCode, iOS CFBundleShortVersionString/CFBundleVersion. Build number must increase on each store upload.\n\n**Q11. What are Flutter channels?** stable, beta, main; use stable in production.\n\n**Q12. How do you add assets/fonts?** Declare under `flutter: assets:` / `fonts:` in pubspec with correct indentation; subdirectories must be listed separately; use `Image.asset`, `rootBundle.loadString`, `fontFamily`.\n\n**Q13. What is `analysis_options.yaml`?** Configures the Dart analyzer: included lint sets, enabled/disabled rules, strict modes, excluded files, error severities.\n\n**Q14. Package vs plugin?** A package is pure Dart (possibly Flutter-dependent) code; a plugin is a package that includes platform-specific native code (Kotlin/Swift/C++/JS) accessed via platform channels or FFI.\n"}, {"n": 3, "file": "03-dart-basics.md", "title": "Chapter 3 — Dart Language, Part 1: The Basics", "subtitle": "Dart Language, Part 1: The Basics", "short": "Dart Basics", "sub": "Null safety, functions, collections, errors", "level": "beginner", "minutes": 22, "qa": 20, "md": "# Chapter 3 — Dart Language, Part 1: The Basics\n\n> **Goal:** Learn Dart from zero: variables, types, null safety, operators, control flow, functions and collections. Every Flutter interview has Dart questions — `final` vs `const`, null safety, `late`, `dynamic` vs `var` vs `Object` — so read carefully.\n\nYou can try every example at **dartpad.dev** without installing anything.\n\n---\n\n## 3.1 Hello Dart\n\n```dart\nvoid main() {\n  print('Hello, Dart!');\n}\n```\n* `main()` is the entry point.\n* `void` means it returns nothing.\n* Statements end with `;`.\n* `print()` writes to the console. (In Flutter apps prefer `debugPrint()` or a logger — `print` is flagged by the `avoid_print` lint.)\n\nComments:\n```dart\n// single line\n/* multi\n   line */\n/// Documentation comment — shows up in IDE hover & dart doc.\n/// Use [ClassName] to link.\n```\n\n---\n\n## 3.2 Variables — boxes with labels 📦\n\nA **variable** is a labelled box that holds a value.\n\n```dart\nvar name = 'Asha';        // type inferred as String\nString city = 'Pune';     // explicit type\nint age = 25;\ndouble height = 5.6;\nbool isStudent = true;\n```\n\n### 3.2.1 `var`, `final`, `const`, `late`, `dynamic`, `Object`\n\n| Keyword | Can reassign? | When value is known | Example |\n|---|---|---|---|\n| `var` | ✅ yes | runtime | `var x = 1; x = 2;` |\n| `final` | ❌ no (set once) | **runtime** | `final now = DateTime.now();` |\n| `const` | ❌ no | **compile time** | `const pi = 3.14159;` |\n| `late` | depends (`late final` = once) | initialised **later**, lazily | `late final String token;` |\n| `dynamic` | ✅ and type can change; **no static checks** | runtime | `dynamic d = 1; d = 'hi'; d.foo(); // compiles, crashes at runtime` |\n| `Object` / `Object?` | ✅ yes, any type, but **type-checked** | runtime | `Object o = 1; o.foo(); // compile error` |\n\n#### `final` vs `const` — the most asked Dart question\n**5-year-old version:**\n* `const` is a toy that is **glued shut at the factory**. Before the shop even opens (compile time), everyone knows exactly what is inside, and **every identical const toy is literally the same toy** (shared in memory).\n* `final` is a box you can **fill once when the shop is open** (runtime), then tape shut forever.\n\n```dart\nfinal time = DateTime.
