> details.data == 'apple',\n  onAcceptWithDetails: (details) => setState(() => basket.add(details.data)),\n  builder: (context, candidates, rejected) => Container(color: candidates.isEmpty ? Colors.grey : Colors.green, ...),\n);\n```\n\n---\n\n## 13.3 Focus & keyboard (desktop, web, TV, accessibility, hardware keyboards)\n\n### Focus tree\nParallel to widgets: `FocusNode`s organised in `FocusScopeNode`s. `Focus` widget creates a node; `FocusScope` groups (e.g., each route has a scope). `FocusManager.instance.primaryFocus` is the current focus.\n\n```dart\nFocus(\n  autofocus: true,\n  onFocusChange: (hasFocus) => setState(() => _focused = hasFocus),\n  onKeyEvent: (node, event) {\n    if (event is KeyDownEvent && event.logicalKey == LogicalKeyboardKey.enter) {\n      _submit();\n      return KeyEventResult.handled;\n    }\n    return KeyEventResult.ignored;\n  },\n  child: ...,\n);\n```\n`RawKeyboardListener`/`RawKeyEvent` were **deprecated** (3.18) → use `KeyboardListener`/`Focus.onKeyEvent` with `KeyEvent` (`KeyDownEvent`, `KeyUpEvent`, `KeyRepeatEvent`), `HardwareKeyboard.instance`.\n\n### Shortcuts & Actions (the right way for keyboard shortcuts)\n```dart\nclass SaveIntent extends Intent { const SaveIntent(); }\n\nShortcuts(\n  shortcuts: const \u003cShortcutActivator, Intent>{\n    SingleActivator(LogicalKeyboardKey.keyS, control: true): SaveIntent(),\n    SingleActivator(LogicalKeyboardKey.keyS, meta: true): SaveIntent(),   // Cmd+S on macOS\n  },\n  child: Actions(\n    actions: \u003cType, Action\u003cIntent>>{\n      SaveIntent: CallbackAction\u003cSaveIntent>(onInvoke: (_) => _save()),\n    },\n    child: const Focus(autofocus: true, child: Editor()),\n  ),\n);\n```\n`CallbackShortcuts` is a simpler version. `FocusTraversalGroup` + `OrderedTraversalPolicy` control Tab order. `Actions.invoke(context, const SaveIntent())` from buttons — the same action for menu, shortcut and button.\n\n### Text input specifics\n`TextInputAction`, `TextInputType`, IME composing, `SystemChannels.textInput`. Hardware keyboard Enter submits only if `onSubmitted`/`textInputAction` set. For Android TV / D-pad navigation, focus highlights matter (`FocusableActionDetector`).\n\n---\n\n## 13.4 CustomPainter — your own drawing canvas 🎨\n\n**5-year-old:** Flutter gives you a **blank paper (Canvas)** and **crayons (Paint)**. You tell it \"draw a circle here, a line there\".\n\n```dart\nclass PieChartPainter extends CustomPainter {\n  PieChartPainter({required this.values, required this.colors});\n  final List\u003cdouble> values;\n  final List\u003cColor> colors;\n\n  @override\n  void paint(Canvas canvas, Size size) {\n    final total = values.fold\u003cdouble>(0, (a, b) => a + b);\n    final rect = Offset.zero & size;                    // Rect from (0,0) with size\n    var start = -pi / 2;                                 // start at 12 o'clock\n    for (var i = 0; i \u003c values.length; i++) {\n      final sweep = values[i] / total * 2 * pi;\n      canvas.drawArc(rect, start, sweep, true, Paint()..color = colors[i]);\n      start += sweep;\n    }\n    // centre hole → donut\n    canvas.drawCircle(size.center(Offset.zero), size.shortestSide * 0.25,\n        Paint()..color = Colors.white);\n  }\n\n  @override\n  bool shouldRepaint(PieChartPainter old) =>\n      !listEquals(old.values, values) || !listEquals(old.colors, colors);\n}\n\nCustomPaint(\n  size: const Size(200, 200),          // used if no child\n  painter: PieChartPainter(values: [30, 50, 20], colors: [Colors.red, Colors.green, Colors.blue]),\n  foregroundPainter: null,              // painted on top of child\n  child: null,\n);\n```\n\n### Canvas API essentials\n```dart\ncanvas.drawLine(p1, p2, paint);\ncanvas.drawRect(rect, paint);\ncanvas.drawRRect(RRect.fromRectAndRadius(rect, const Radius.circular(12)), paint);\ncanvas.drawCircle(center, radius, paint);\ncanvas.drawOval(rect, paint);\ncanvas.drawArc(rect, startAngle, sweepAngle, useCenter, paint);\ncanvas.drawPath(path, paint);\ncanvas.drawImage(image, offset, paint);           // ui.Image\ncanvas.drawImageRect(image, src, dst, paint);\ncanvas.drawPoints(PointMode.points, points, paint);\ncanvas.drawShadow(path, Colors.black, 4, false);\ncanvas.drawParagraph(paragraph, offset);\n// Text with TextPainter:\nfinal tp = TextPainter(text: const TextSpan(text: 'Hi', style: TextStyle(color: Colors.black)), textDirection: TextDirection.ltr)..layout(maxWidth: size.width);\ntp.paint(canvas, Offset(10, 10));\n// Transforms & state\ncanvas.save(); canvas.translate(dx, dy); canvas.rotate(angle); canvas.scale(2); canvas.restore();\ncanvas.clipRect(rect); canvas.clipPath(path);\ncanvas.saveLayer(bounds, paint);   // ⚠️ expensive offscreen buffer\n```\nPaint:\n```dart\nfinal paint = Paint()\n  ..color = Colors.blue\n  ..style = PaintingStyle.stroke     // or fill\n  ..strokeWidth = 4\n  ..strokeCap = StrokeCap.round\n  ..strokeJoin = StrokeJoin.round\n  ..isAntiAlias = true\n  ..shader = const LinearGradient(colors: [Colors.blue, Colors.purple]).createShader(rect)\n  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 4)\n  ..blendMode = BlendMode.srcOver;\n```\nPath:\n```dart\nfinal path = Path()\n  ..moveTo(0, 0)\n  ..lineTo(100, 0)\n  ..quadraticBezierTo(150, 50, 100, 100)\n  ..cubicTo(80, 120, 20, 120, 0, 100)\n  ..arcToPoint(const Offset(0, 0), radius: const Radius.circular(50))\n  ..addOval(Rect.fromCircle(center: Offset(50, 50), radius: 10))\n  ..close();\npath.contains(point);                  // hit testing\npath.computeMetrics();                 // animate drawing along path (extractPath)\n```\nClipping widgets with a custom shape: `ClipPath(clipper: MyClipper())` with `CustomClipper\u003cPath>`; `ShapeBorder` subclasses for custom card shapes.\n\n### Making CustomPaint interactive\nOverride `hitTest(Offset position)` in the painter to restrict taps to drawn areas, and wrap in `GestureDetector`. Semantics: override `semanticsBuilder` to describe drawn content for screen readers.\n\n### Performance\n* `shouldRepaint` must return false when nothing changed.\n* Use `repaint:` listenable for animations (Chapter 12).\n* Wrap in `RepaintBoundary` if it repaints often or rarely while surroundings change.\n* Cache expensive `Path`s/`Picture`s (`PictureRecorder`) between paints.\n\n---\n\n## 13.5 Custom RenderObjects — when widgets aren't enough 🛠️\n\nYou rarely need this, but senior interviews ask, and libraries use it. Reasons:\n* A layout no combination of existing widgets can express efficiently (e.g., a \"flow\" text layout with inline badges, a custom chat bubble that wraps time stamps intelligently, a custom grid).\n* Maximum performance (avoid many widgets).\n\n### Leaf example: a render object that paints a coloured box and sizes itself\n```dart\nclass ColoredSquare extends LeafRenderObjectWidget {\n  const ColoredSquare({super.key, required this.color, this.side = 50});\n  final Color color;\n  final double side;\n\n  @override\n  RenderColoredSquare createRenderObject(BuildContext context) =>\n      RenderColoredSquare(color: color, side: side);\n\n  @override\n  void updateRenderObject(BuildContext context, RenderColoredSquare renderObject) {\n    renderObject\n      ..color = color\n      ..side = side;\n  }\n}\n\nclass RenderColoredSquare extends RenderBox {\n  RenderColoredSquare({required Color color, required double side})\n      : _color = color, _side = side;\n\n  Color _color;\n  set color(Color value) {\n    if (value == _color) return;\n    _color = value;\n    markNeedsPaint();          // only repaint needed\n  }\n\n  double _side;\n  set side(double value) {\n    if (value == _side) return;\n    _side = value;\n    markNeedsLayout();         // size changes → relayout\n  }\n\n  @override\n  void performLayout() {\n    size = constraints.constrain(Size.square(_side));   // obey constraints!\n  }\n\n  @override\n  void paint(PaintingContext context, Offset offset) {\n    context.canvas.drawRect(offset & size, Paint()..color = _color);\n  }\n\n  @override\n  bool hitTestSelf(Offset position) => true;\n\n  @override\n  double computeMinIntrinsicWidth(double height) => _side;\n  @override\n  double computeMaxIntrinsicWidth(double height) => _side;\n  @override\n  double computeMinIntrinsicHeight(double width) => _side;\n  @override\n  double computeMaxIntrinsicHeight(double width) => _side;\n}\n```\n\n### Key RenderBox concepts\n* `performLayout()` — compute `size` (and lay out children with `child.layout(constraints, parentUsesSize: true)`).\n* `sizedByParent` + `computeDryLayout` — when size depends only on constraints; `computeDryLayout` used by intrinsic queries / `LayoutBuilder`.\n* `paint(context, offset)` — draw self, then `context.paintChild(child, offset + childOffset)`.\n* `hitTest`, `hitTestChildren`, `hitTestSelf`.\n* Intrinsic dimension methods (`computeMinIntrinsicWidth` ...) — used by `IntrinsicWidth`, `Table`, etc.\n* `markNeedsLayout()`, `markNeedsPaint()`, `markNeedsSemanticsUpdate()`, `markNeedsCompositingBitsUpdate()`.\n* **ParentData**: each child carries data used by the parent (e.g., `BoxParentData.offset`, `FlexParentData.flex`). Multi-child render objects use `ContainerRenderObjectMixin` + `RenderBoxContainerDefaultsMixin`.\n* **Relayout boundary**: if a render object's size doesn't depend on its children changes (tight constraints, `sizedByParent`, or `parentUsesSize: false`), layout changes inside don't propagate upward — a key performance optimisation.\n* **Repaint boundary** (`isRepaintBoundary = true`): gets its own layer, so repainting it doesn't repaint ancestors/siblings.\n\nSimpler alternatives first: `CustomSingleChildLayout`, `CustomMultiChildLayout` (with `MultiChildLayoutDelegate` + `LayoutId`), `Flow` (with `FlowDelegate`, paint-time transforms — great for animated menus).\n\n---\n\n## 13.6 Interview Questions — Gestures & painting\n\n**Q1. GestureDetector vs Listener?** GestureDetector recognizes high-level gestures and participates in the gesture arena; Listener gives raw pointer events without disambiguation.\n\n**Q2. What is the gesture arena?** The mechanism resolving conflicts when multiple gesture recognizers track the same pointer; recognizers accept/reject, and one wins.\n\n**Q3. Why doesn't my GestureDetector receive taps on empty areas?** Default `HitTestBehavior.deferToChild` only registers hits on painted children; use `HitTestBehavior.opaque` or give a background colour.\n\n**Q4. AbsorbPointer vs IgnorePointer?** AbsorbPointer consumes hits itself (blocking widgets behind it and its children); IgnorePointer makes itself and children invisible to hit testing so events pass to widgets behind.\n\n**Q5. How do you implement drag and drop?** `Draggable`/`LongPressDraggable` with `data` + `feedback`, and `DragTarget` with accept callbacks; or `ReorderableListView` for lists.\n\n**Q6. How do you implement keyboard shortcuts?** Shortcuts + Actions with Intents (or CallbackShortcuts), within a focused subtree.\n\n**Q7. What is CustomPainter and shouldRepaint?** API to draw directly on a Canvas; shouldRepaint tells Flutter whether a new painter instance needs to repaint compared to the old one.\n\n**Q8. When would you write a custom RenderObject?** For layouts/painting not achievable efficiently with existing widgets or delegates, or for performance-critical components.\n\n**Q9. markNeedsLayout vs markNeedsPaint?** Layout marks the render object for relayout (and repaint); paint only schedules repainting, cheaper.\n\n**Q10. What is a repaint boundary?** A render object with its own compositing layer, isolating repaints so they don't spread to ancestors/siblings (`RepaintBoundary` widget).\n\n**Q11. What's a relayout boundary?** A render object whose size doesn't depend on child changes, stopping layout invalidation from propagating to its parent.\n\n**Q12. How does hit testing work?** From the root, render objects check if the position is inside their bounds, recursively testing children in reverse paint order; hits are added to a HitTestResult path that receives pointer events.\n"}, {"n": 14, "file": "14-state-management-foundations.md", "title": "Chapter 14 — State Management, Part 1: Concepts, setState, InheritedWidget, ValueNotifier, ChangeNotifier & Provider", "subtitle": "State Management, Part 1: Concepts, setState, InheritedWidget, ValueNotifier, ChangeNotifier & Provider", "short": "State Management Basics", "sub": "setState, ChangeNotifier, Provider", "level": "intermediate", "minutes": 10, "qa": 12, "md": "# Chapter 14 — State Management, Part 1: Concepts, setState, InheritedWidget, ValueNotifier, ChangeNotifier & Provider\n\n> **Goal:** Understand *what* state is, the different kinds, *where* it should live, and master Flutter's built-in tools and Provider. This is the foundation for Riverpod and Bloc (Chapter 15).\n\n---\n\n## 14.1 What is \"state\"? 🧠\n\n**5-year-old:** State is **anything that can change and that the screen needs to remember**: the number on a counter, whether you're logged in, items in your cart, which tab is selected, the text you typed.\n\n**Grown-up (Flutter docs):** *\"Whatever data you need in order to rebuild your UI at any moment in time.\"* Since **UI = f(state)**, managing state = deciding where data lives, who can change it, and how the UI learns about changes.\n\n### Two kinds of state\n| | Ephemeral (local/UI) state | App (shared) state |\n|---|---|---|\n| Examples | current page in PageView, animation progress, is the password visible, selected tab, text field focus | logged-in user, cart, preferences, notifications, cached server data |\n| Used by | one widget | many widgets/screens |\n| Survives navigation? | No need | Yes |\n| Tool | `setState`, `ValueNotifier` | Provider, Riverpod, Bloc, … |\n\nThere's no hard rule; start local and **lift state up** when others need it.\n\n### Other useful classifications (senior-level)\n* **Server state** (remote data cache: loading/error/data, refetching, staleness) vs **client state** (UI selections, form inputs). Mixing them is a common source of bugs; Riverpod's `FutureProvider`/`AsyncNotifier` or dedicated caching layers handle server state well.\n* **Derived state** — computed from other state (cart total from cart items). Don't store it separately — compute or memoize, or it gets out of sync.\n* **Persistent state** — must survive restarts (tokens, settings) → storage (Chapter 17).\n* **Navigation state** — current route stack (router).\n\n---\n\n## 14.2 Principles of good state management (interview-ready)\n1. **Single source of truth** — each piece of data lives in exactly one place.\n2. **Unidirectional data flow** — events go up (user action → logic), state flows down (logic → UI).\n3. **Immutability** — create new state objects instead of mutating (easy change detection, no hidden mutations, time-travel debugging).\n4. **Separation of concerns** — UI renders; business logic lives in testable classes without `BuildContext`.\n5. **Minimal rebuilds** — only widgets depending on changed data rebuild.\n6. **Testability** — logic testable without widgets; dependencies injectable.\n7. **Predictability** — state changes happen in known places.\n\n---\n\n## 14.3 `setState` — local state\n\nCovered in Chapter 6. Use for ephemeral state inside one widget.\n\n### Lifting state up\nWhen two siblings need the same state, move it to the **nearest common ancestor** and pass down **data + callbacks**:\n```dart\nclass CartPage extends StatefulWidget { ... }\nclass _CartPageState extends State\u003cCartPage> {\n  final List\u003cItem> _items = [];\n  void _add(Item i) => setState(() => _items.add(i));\n  @override\n  Widget build(BuildContext context) => Column(children: [\n    CartBadge(count: _items.length),       // data down\n    ProductList(onAdd: _add),              // callbacks up\n  ]);\n}\n```\nProblem at scale: **prop drilling** — passing data through many layers that don't use it. Solutions: InheritedWidget-based tools (Provider, Riverpod, Bloc).\n\n---\n\n## 14.4 `ValueNotifier` & `ValueListenableBuilder` — the simplest reactive box 📦🔔\n\n```dart\nfinal counter = ValueNotifier\u003cint>(0);   // a box that rings a bell when its value changes\n\nValueListenableBuilder\u003cint>(\n  valueListenable: counter,\n  builder: (context, value, child) => Text('$value'),  // only this rebuilds\n);\ncounter.value++;          // rings the bell (only if value != old value, using ==)\ncounter.dispose();        // when done\n```\n⚠️ Mutating a list inside a ValueNotifier does **not** notify:\n```dart\nfinal items = ValueNotifier\u003cList\u003cString>>([]);\nitems.value.add('x');                     // ❌ no notification (same list instance)\nitems.value = [...items.value, 'x'];      // ✅ new list → notifies\n```\n`ValueNotifier` + `InheritedNotifier`/`get_it` is enough for many small apps.\n\n---\n\n## 14.5 `ChangeNotifier` — observable class 📣\n\n```dart\nclass CartModel extends ChangeNotifier {\n  final List\u003cItem> _items = [];\n  UnmodifiableListView\u003cItem> get items => UnmodifiableListView(_items);  // expose read-only\n  int get totalPrice => _items.fold(0, (sum, i) => sum + i.price);       // derived\n\n  void add(Item item) {\n    _items.add(item);\n    notifyListeners();      // 🔔 tell listeners to rebuild\n  }\n\n  void removeAll() {\n    _items.clear();\n    notifyListeners();\n  }\n}\n```\n* `addListener`/`removeListener`, `dispose()`, `hasListeners`.\n* `notifyListeners()` after disposal → error *\"A CartModel was used after being disposed.\"*\n* `ListenableBuilder(listenable: cart, builder: ...)` rebuilds on notifications (Flutter 3.10+; `AnimatedBuilder` works too).\n* Calling `notifyListeners` **during build** → \"setState() or markNeedsBuild() called during build\" error.\n* `ChangeNotifier` is O(1) to add/remove listeners and O(N) to dispatch — fine for UI models.\n\n**Drawbacks**: mutable, one big notifier rebuilds all listeners (use `select`/`Selector`), notify-forgetting bugs, async state (loading/error) must be modelled manually.\n\nThe **official Flutter architecture guide** (docs.flutter.dev/app-architecture) recommends **MVVM**: ViewModels extend `ChangeNotifier`, Views listen with `ListenableBuilder`, repositories handle data, and a \"Command\" pattern for actions (Chapter 21).\n\n---\n\n## 14.6 InheritedWidget / InheritedNotifier as DIY DI\n\n```dart\nclass CartScope extends InheritedNotifier\u003cCartModel> {\n  const CartScope({super.key, required CartModel cart, required super.child}) : super(notifier: cart);\n  static CartModel of(BuildContext context) =>\n      context.dependOnInheritedWidgetOfExactType\u003cCartScope>()!.notifier!;\n}\n// Above the app:\nCartScope(cart: CartModel(), child: const MyApp());\n// Anywhere below:\nfinal cart = CartScope.of(context);   // rebuilds when cart notifies\n```\nThat's essentially what **Provider** does with nicer APIs and lifecycle handling.\n\n---\n\n## 14.7 Provider 📦➡️\n\n`provider` (by Remi Rousselet) — \"a wrapper around InheritedWidget to make them easier to use and more reusable\". It was the Flutter team's recommended approach for years and is still extremely common in company codebases.\n\n### Setup\n```dart\nvoid main() {\n  runApp(\n    MultiProvider(\n      providers: [\n        Provider\u003cApiClient>(create: (_) => ApiClient()),                          // plain object (DI)\n        ChangeNotifierProvider(create: (_) => AuthModel()),                       // owns & disposes it\n        ChangeNotifierProxyProvider\u003cAuthModel, CartModel>(                        // depends on another\n          create: (_) => CartModel(),\n          update: (_, auth, cart) => cart!..userId = auth.userId,\n        ),\n        FutureProvider\u003cConfig?>(create: (_) => loadConfig(), initialData: null),\n        StreamProvider\u003cConnectivityStatus>(create: (_) => connectivity.stream, initialData: ConnectivityStatus.unknown),\n      ],\n      child: const MyApp(),\n    ),\n  );\n}\n```\n\n### Reading\n```dart\n// 1. watch: listen & rebuild when it changes (use in build)\nfinal cart = context.watch\u003cCartModel>();\n\n// 2. read: get without listening (use in callbacks, NOT in build to get values for display)\nonPressed: () => context.read\u003cCartModel>().add(item),\n\n// 3. select: rebuild only when a specific part changes\nfinal count = context.select\u003cCartModel, int>((c) => c.items.length);\n\n// Older equivalents:\nProvider.of\u003cCartModel>(context);               // listen: true (watch)\nProvider.of\u003cCartModel>(context, listen: false); // read\n\n// Widgets:\nConsumer\u003cCartModel>(\n  builder: (context, cart, child) => Text('Total: ${cart.totalPrice}'),\n  child: const ExpensiveStaticPart(),   // not rebuilt\n);\nSelector\u003cCartModel, int>(\n  selector: (_, cart) => cart.items.length,\n  builder: (_, count, __) => Badge(label: Text('$count')),\n);\n```\n\n### `create` vs `.value` — VERY common bug & interview question\n```dart\n// ✅ Creating a NEW object → use create (Provider owns lifecycle & disposes ChangeNotifier)\nChangeNotifierProvider(create: (_) => CartModel(), child: ...);\n\n// ✅ Providing an EXISTING object (e.g., in a list item or passing to a new route) → use .value\nChangeNotifierProvider.value(value: existingCart, child: ...);\n\n// ❌ BAD: .value with a new instance inside build → recreated every rebuild, state lost, leaks\nChangeNotifierProvider.value(value: CartModel(), child: ...);\n// ❌ BAD: create with an existing instance → Provider will DISPOSE it when removed, though you still use it elsewhere\n```\n\n### Common Provider errors\n* **`ProviderNotFoundException` / \"Could not find the correct Provider\u003cX> above this Widget\"**: \n  1. Provider is below the widget reading it (e.g., read in the same `build` that creates it → use `Builder` or `Consumer`).\n  2. Reading in a **new route** — routes are children of `Navigator` (under MaterialApp), not of the page that pushed them; providers declared in a page aren't visible in pushed routes → move provider above MaterialApp or pass `.value` into the new route.\n  3. Wrong generic type (`ChangeNotifierProvider\u003cCartModel>` vs reading `context.watch\u003cCart>()`), or imported from two different paths (relative vs package import making two \"different\" types!).\n  4. Hot reload after adding a provider → do a hot restart.\n* **\"Tried to listen to a value exposed with provider, from outside of the widget tree\"** → used `watch`/`Provider.of` with listen:true in a callback; use `read`.\n* **\"setState() or markNeedsBuild() called during build\"** → calling a method that `notifyListeners()` from build/initState synchronously → use `addPostFrameCallback` or `Future.microtask`.\n\n### Provider pros/cons\n✅ Simple, built on Flutter primitives, official-ish, lots of examples, good for small/medium apps.\n❌ Depends on `BuildContext` (can't easily access outside widgets), runtime errors (ProviderNotFound) instead of compile-time safety, combining/depending providers is clunky (ProxyProvider), same-type conflicts (two providers of the same type: the nearest wins).\n\nThe author created **Riverpod** to solve these issues (Chapter 15).\n\n---\n\n## 14.8 Modelling async state correctly\n\nEvery screen loading remote data has (at least) these states: **initial/idle, loading, data (success), empty, error** — and sometimes \"refreshing with old data\", \"loading more\".\n\n❌ Fragile: separate booleans that allow impossible combinations:\n```dart\nbool isLoading; String? error; List\u003cItem>? data;   // isLoading && error both true??\n```\n✅ Use a sealed class (Dart 3):\n```dart\nsealed class LoadState\u003cT> { const LoadState(); }\nfinal class Idle\u003cT> extends LoadState\u003cT> { const Idle(); }\nfinal class Loading\u003cT> extends LoadState\u003cT> { const Loading({this.previous}); final T? previous; }\nfinal class Loaded\u003cT> extends LoadState\u003cT> { const Loaded(this.data); final T data; }\nfinal class Failed\u003cT> extends LoadState\u003cT> { const Failed(this.error, {this.previous}); final Object error; final T? previous; }\n\nWidget build(BuildContext context) => switch (state) {\n  Idle() => const SizedBox.shrink(),\n  Loading(previous: final p?) => ItemsList(p, refreshing: true),\n  Loading() => const Center(child: CircularProgressIndicator()),\n  Loaded(:final data) when data.isEmpty => const EmptyView(),\n  Loaded(:final data) => ItemsList(data),\n  Failed(:final error) => ErrorView(error: error, onRetry: reload),\n};\n```\nRiverpod's `AsyncValue` and Bloc's state classes implement this idea.\n\n---\n\n## 14.9 Comparison table (overview — details in Chapter 15)\n\n| Approach | Boilerplate | Learning curve | Testability | Scales to big apps | Context needed | Notes |\n|---|---|---|---|---|---|---|\n| setState | none | trivial | low (logic in UI) | ❌ | yes | local state only |\n| ValueNotifier/ChangeNotifier + InheritedNotifier/ListenableBuilder | low | low | good | medium | yes | official MVVM guide uses ChangeNotifier |\n| Provider | low | low | good | medium–large | yes | very common legacy/current |\n| Riverpod | low–medium | medium | excellent | ✅ | no (uses ref) | compile-safe, async-first, codegen optional |\n| Bloc/Cubit | medium–high | medium | excellent | ✅ | yes (BlocProvider) | events/states, traceable, enterprise favourite |\n| GetX | very low | low | weak | ❌ (debated) | no | all-in-one, magic, frowned upon in many teams |\n| MobX | medium (codegen) | medium | good | ✅ | no | observables/reactions |\n| Redux | high | high | excellent | ✅ | yes | single store, rarely chosen for new apps |\n| signals | low | low | good | medium | no | fine-grained reactivity (signals package) |\n\n**What to answer when asked \"Which state management is best?\"**: *\"There's no single best; it depends on team size, app complexity, and conventions. For small apps setState/ValueNotifier/Provider is enough. For large apps I prefer Riverpod or Bloc because they enforce separation, are testable, and handle async well. Consistency across the codebase matters more than the choice itself.\"* Then give concrete reasons for your preference.\n\n---\n\n## 14.10 Interview Questions — State management foundations\n\n**Q1. What is state in Flutter?** Data needed to rebuild the UI at any moment.\n\n**Q2. Ephemeral vs app state?** Ephemeral is local to one widget (setState); app state is shared/persistent across parts of the app (state management solutions).\n\n**Q3. What is \"lifting state up\"?** Moving state to the closest common ancestor of widgets that need it, passing data down and callbacks up.\n\n**Q4. What is prop drilling and how to avoid it?** Passing data through many intermediate widgets; avoid with InheritedWidget-based solutions (Provider, Riverpod, Bloc) or DI.\n\n**Q5. What is ChangeNotifier?** A class providing listener registration and `notifyListeners()` to signal changes; used with ListenableBuilder/Provider.\n\n**Q6. ValueNotifier vs ChangeNotifier?** ValueNotifier holds a single value and notifies when the value is replaced with a non-equal one; ChangeNotifier is a general base where you call notifyListeners manually.\n\n**Q7. context.watch vs context.read vs context.select?** watch listens and rebuilds; read gets once without listening (callbacks); select listens to a derived value and rebuilds only when it changes.\n\n**Q8. Provider `create` vs `.value`?** create for new instances (provider owns/disposes), .value for existing instances (no disposal) — misuse causes state loss or disposed-object errors.\n\n**Q9. Why does ProviderNotFoundException occur?** The reading context isn't a descendant of the provider (same build method, different route, wrong type/import).\n\n**Q10. Why is immutable state preferred?** Easy change detection (==), predictable updates, no accidental shared mutation, simpler debugging/time travel, safe across isolates.\n\n**Q11. How do you avoid unnecessary rebuilds in Provider?** `select`/`Selector`, `Consumer` placed low, `child` param, splitting models, const widgets.\n\n**Q12. How do you represent loading/error/data states?** Sealed classes/union types (or AsyncValue), avoiding inconsistent boolean flags.\n"}, {"n": 15, "file": "15-state-management-riverpod-bloc-others.md", "title": "Chapter 15 — State Management, Part 2: Riverpod, Bloc/Cubit, GetX, MobX, Redux, Signals", "subtitle": "State Management, Part 2: Riverpod, Bloc/Cubit, GetX, MobX, Redux, Signals", "short": "Riverpod, Bloc & Others", "sub": "Riverpod 3, Bloc/Cubit, choosing", "level": "intermediate", "minutes": 18, "qa": 20, "md": "# Chapter 15 — State Management, Part 2: Riverpod, Bloc/Cubit, GetX, MobX, Redux, Signals\n\n> **Goal:** Become fluent in the two dominant enterprise solutions — **Riverpod** and **Bloc** — and know enough about the others to discuss trade-offs and maintain legacy code.\n\n> Versions: this chapter reflects **Riverpod 3.x** (released Sept 2025) and **flutter_bloc 9.x**. Where older APIs are still common in codebases, they're noted.\n\n---\n\n# Part A — Riverpod 🌊\n\n## 15.1 What and why\n\n**5-year-old:** Riverpod is a **magic backpack of ingredients**. Any widget can reach into the backpack (`ref`) and grab an ingredient (`provider`). If an ingredient changes (the milk goes sour), everyone using it is told automatically. Ingredients can be made from other ingredients (pancakes need milk + eggs). And you don't need to know where in the house (widget tree) the backpack is.\n\nRiverpod (an anagram of *Provider*), by the same author as Provider, fixes Provider's problems:\n* **No dependency on BuildContext/widget tree position** to find providers → no `ProviderNotFoundException`.\n* **Compile-time safety** — providers are global *declarations* (final variables), but their **state** lives in a `ProviderContainer` (inside `ProviderScope`), so they are not global singletons and are fully testable/overridable.\n* **Multiple providers of the same type** — fine (they're distinct variables).\n* **Async-first**: `FutureProvider`, `StreamProvider`, `AsyncNotifier`, and `AsyncValue` (loading/data/error) built in.\n* **Auto-dispose**, **families** (parameterised providers), caching, **combining providers** reactively with `ref.watch`.\n* Works outside Flutter (pure Dart).\n\n## 15.2 Setup\n```yaml\ndependencies:\n  flutter_riverpod: ^3.0.0\n  riverpod_annotation: ^3.0.0     # for codegen (optional)\ndev_dependencies:\n  riverpod_generator: ^3.0.0\n  build_runner: ^2.4.0\n  riverpod_lint: ^3.0.0           # (lints; works via the analyzer plugin system in recent versions)\n```\n```dart\nvoid main() {\n  runApp(const ProviderScope(child: MyApp()));   // ❗ required at the root\n}\n```\n\n## 15.3 Provider types\n\n| Provider | For | Example |\n|---|---|---|\n| `Provider` | Read-only computed values / services / DI | repository, filtered list |\n| `FutureProvider` | Async read-only value (one-shot fetch) | user profile |\n| `StreamProvider` | Stream of values | auth state changes, websockets |\n| `NotifierProvider` | Synchronous mutable state with methods | counter, filters, cart |\n| `AsyncNotifierProvider` | Async state with methods (load + mutate) | todo list from API |\n| `StreamNotifierProvider` | Stream-based state with methods | chat |\n| *Legacy:* `StateProvider`, `StateNotifierProvider`, `ChangeNotifierProvider` | old code | In Riverpod 3 moved to `package:flutter_riverpod/legacy.dart` |\n\n### Manual (no codegen) syntax\n```dart\n// Service / DI\nfinal apiClientProvider = Provider\u003cApiClient>((ref) {\n  final client = ApiClient(baseUrl: ref.watch(configProvider).apiUrl);\n  ref.onDispose(client.close);\n  return client;\n});\n\n// Notifier (sync)\nclass Counter extends Notifier\u003cint> {\n  @override\n  int build() => 0;                       // initial state\n  void increment() => state++;            // assigning `state` notifies listeners\n}\nfinal counterProvider = NotifierProvider\u003cCounter, int>(Counter.new);\n\n// FutureProvider (auto-dispose when nobody listens)\nfinal userProvider = FutureProvider.autoDispose\u003cUser>((ref) async {\n  final api = ref.watch(apiClientProvider);\n  return api.fetchMe();\n});\n\n// Family (parameter)\nfinal productProvider = FutureProvider.autoDispose.family\u003cProduct, String>((ref, id) async {\n  return ref.watch(apiClientProvider).fetchProduct(id);\n});\n\n// AsyncNotifier\nclass TodoList extends AsyncNotifier\u003cList\u003cTodo>> {\n  @override\n  Future\u003cList\u003cTodo>> build() => ref.watch(todoRepoProvider).fetchAll();\n\n  Future\u003cvoid> add(String title) async {\n    final repo = ref.read(todoRepoProvider);\n    state = const AsyncLoading();\n    state = await AsyncValue.guard(() async {\n      await repo.add(title);\n      return repo.fetchAll();\n    });\n  }\n\n  Future\u003cvoid> toggle(String id) async {\n    final previous = state.value ?? [];\n    // Optimistic update\n    state = AsyncData([\n      for (final t in previous) if (t.id == id) t.copyWith(done: !t.done) else t,\n    ]);\n    try {\n      await ref.read(todoRepoProvider).toggle(id);\n    } catch (e) {\n      state = AsyncData(previous);   // rollback the optimistic change\n      rethrow;                       // let the UI show a snackbar (catch at call site)\n    }\n  }\n}\nfinal todoListProvider = AsyncNotifierProvider\u003cTodoList, List\u003cTodo>>(TodoList.new);\n```\n> Tip: When a provider **rebuilds itself** (e.g., after `ref.invalidate` or a watched dependency changes), Riverpod keeps the previous value available while loading (`state.value`, `isRefreshing`/`isReloading`), so the UI can show old data with a small progress indicator. When you assign `AsyncLoading()` manually, decide explicitly whether to keep old data (e.g., keep a local copy) — helper names for this differ between Riverpod versions, so check the docs for yours.\n\n### Code generation syntax (recommended by Riverpod docs)\n```dart\nimport 'package:riverpod_annotation/riverpod_annotation.dart';\npart 'todo_providers.g.dart';\n\n@riverpod                                  // auto-dispose by default\nFuture\u003cUser> user(Ref ref) => ref.watch(apiClientProvider).fetchMe();   // → userProvider\n\n@riverpod\nFuture\u003cProduct> product(Ref ref, String id) =>                         // family automatically\n    ref.watch(apiClientProvider).fetchProduct(id);                       // → productProvider(id)\n\n@Riverpod(keepAlive: true)                 // not auto-disposed\nApiClient apiClient(Ref ref) => ApiClient();\n\n@riverpod\nclass TodoList extends _$TodoList {        // → todoListProvider\n  @override\n  Future\u003cList\u003cTodo>> build() => ref.watch(todoRepoProvider).fetchAll();\n  Future\u003cvoid> add(String title) async { ... }\n}\n```\nRun `dart run build_runner watch -d`.\n\n## 15.4 Consuming providers in widgets\n```dart\nclass TodoPage extends ConsumerWidget {           // instead of StatelessWidget\n  const TodoPage({super.key});\n\n  @override\n  Widget build(BuildContext context, WidgetRef ref) {\n    final todos = ref.watch(todoListProvider);    // rebuilds on change\n\n    // Side effects (snackbars, navigation) — NOT in build logic, use listen:\n    ref.listen(todoListProvider, (previous, next) {\n      if (next is AsyncError) {\n        ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('${next.error}')));\n      }\n    });\n\n    return switch (todos) {\n      AsyncData(:final value) => TodoListView(value),\n      AsyncError(:final error) => ErrorView(error, onRetry: () => ref.invalidate(todoListProvider)),\n      _ => const Center(child: CircularProgressIndicator()),\n    };\n    // or: todos.when(data: ..., error: (e, st) => ..., loading: () => ...)\n  }\n}\n\n// Calling methods: read the notifier (don't watch in callbacks)\nonPressed: () => ref.read(todoListProvider.notifier).add('Buy milk'),\n\n// Rebuild only on part of state\nfinal doneCount = ref.watch(todoListProvider.select((s) => s.value?.where((t) => t.done).length ?? 0));\n\n// Stateful version\nclass EditPage extends ConsumerStatefulWidget { ... }\nclass _EditPageState extends ConsumerState\u003cEditPage> {\n  @override\n  void initState() {\n    super.initState();\n    // ref is available in ConsumerState; use ref.read here, not watch\n  }\n}\n\n// Local scope rebuild:\nConsumer(builder: (context, ref, child) => Text('${ref.watch(counterProvider)}'));\n```\n\n### `ref.watch` vs `ref.read` vs `ref.listen` (most asked Riverpod question)\n| | When | Rebuilds? | Where |\n|---|---|---|---|\n| `ref.watch(p)` | Need the value to build UI / compute a provider | ✅ | `build` of widgets and providers |\n| `ref.read(p)` | One-off read, typically to call a method | ❌ | callbacks (onPressed), notifier methods |\n| `ref.listen(p, cb)` | React to changes with side effects (navigate, snackbar, log) | ❌ (calls cb) | build of widgets (Riverpod manages lifecycle), providers |\n\n**Rule:** don't `ref.read` inside `build` to get a value for display — UI won't update.\n\nOther ref methods: `ref.invalidate(p)` (reset & recompute lazily), `ref.refresh(p)` (invalidate + read immediately, returns new value), `ref.onDispose`, `ref.onCancel`/`onResume` (listeners leaving/coming back), `ref.keepAlive()` (prevent auto-dispose, returns a link you can `close()`), `ref.mounted` (Riverpod 3: check after `await` in notifiers, like widget `mounted`).\n\n## 15.5 Combining providers (reactive dependency graph)\n```dart\n@riverpod\nList\u003cTodo> filteredTodos(Ref ref) {\n  final filter = ref.watch(todoFilterProvider);\n  final todos = ref.watch(todoListProvider).value ?? const [];\n  return switch (filter) {\n    Filter.all => todos,\n    Filter.done => todos.where((t) => t.done).toList(),\n    Filter.active => todos.where((t) => !t.done).toList(),\n  };\n}\n```\nWhen the filter or todos change, `filteredTodos` recomputes, and widgets watching it rebuild — if the result is different (`==`). Search with debounce & cancellation:\n```dart\n@riverpod\nFuture\u003cList\u003cResult>> search(Ref ref, String query) async {\n  // Debounce: if the provider is disposed/rebuilt within 300ms, abort\n  var cancelled = false;\n  ref.onDispose(() => cancelled = true);\n  await Future\u003cvoid>.delayed(const Duration(milliseconds: 300));\n  if (cancelled) throw Exception('cancelled');\n\n  final cancelToken = CancelToken();          // dio\n  ref.onDispose(cancelToken.cancel);\n  return ref.watch(apiProvider).search(query, cancelToken: cancelToken);\n}\n```\n\n## 15.6 Auto-dispose, keepAlive, caching\n* **autoDispose**: state destroyed when no longer listened to (e.g., leaving a screen) → no memory leak, fresh data next time.\n* `ref.keepAlive()` to cache e.g. after successful load; combine with a timer to expire cache:\n```dart\nfinal link = ref.keepAlive();\nfinal timer = Timer(const Duration(minutes: 5), link.close);\nref.onDispose(timer.cancel);\n```\n\n## 15.7 Riverpod 3 highlights (know for interviews in 2026)\n* **Automatic retry** of failing providers (exponential backoff by default; configurable / disable with `retry:`).\n* **`Ref.mounted`** to check whether the notifier/provider is still alive after async gaps.\n* Listeners are **paused** when widgets aren't visible (e.g., under another route / `TickerMode` off) to save resources.\n* **Offline persistence** (experimental) and **mutations** (experimental) APIs.\n* `AsyncValue` is sealed with `AsyncData`, `AsyncError`, `AsyncLoading`; `valueOrNull` removed — `.value` returns null during errors/loading without previous data.\n* `StateProvider`, `StateNotifierProvider`, `ChangeNotifierProvider` moved to `legacy` imports.\n* Family notifiers receive arguments through the **constructor** (`FamilyNotifier` removed).\n* Notifiers are recreated on provider rebuild.\n* Unified `Ref` (no more `FutureProviderRef` etc. subtypes in codegen).\n* `ProviderContainer.test()` helper for tests.\n\n## 15.8 Testing Riverpod\n```dart\ntest('counter increments', () {\n  final container = ProviderContainer.test();       // auto-disposed after test (Riverpod 3)\n  expect(container.read(counterProvider), 0);\n  container.read(counterProvider.notifier).increment();\n  expect(container.read(counterProvider), 1);\n});\n\ntest('todo list loads from repository', () async {\n  final container = ProviderContainer.test(overrides: [\n    todoRepoProvider.overrideWithValue(FakeTodoRepo([Todo(id: '1', title: 'A')])),\n  ]);\n  final todos = await container.read(todoListProvider.future);\n  expect(todos.single.title, 'A');\n});\n\ntestWidgets('shows todos', (tester) async {\n  await tester.pumpWidget(ProviderScope(\n    overrides: [todoListProvider.overrideWith(() => FakeTodoList())],\n    child: const MaterialApp(home: TodoPage()),\n  ));\n  await tester.pump();\n  expect(find.text('A'), findsOneWidget);\n});\n```\n\n## 15.9 Riverpod best practices & pitfalls\n* Keep providers **small and focused**; derive with `ref.watch`.\n* Don't put `BuildContext` or widgets in providers.\n* Use `ref.listen` for one-time side effects; never navigate inside `build` directly.\n* Don't call `ref.read` on autoDispose providers in callbacks expecting state to persist — if nobody watches it, it may be disposed immediately after read. Watch it somewhere or keepAlive.\n* Avoid `ref.watch` inside notifier methods (use `ref.read`); `ref.watch` belongs in `build`.\n* Avoid passing complex objects as family parameters unless they implement `==`/`hashCode` (records, freezed, primitives) — otherwise each call creates a new provider → infinite loading/leaks.\n* \"Modifying a provider while the widget tree was building\" error → don't mutate state during build/initState; use `Future.microtask` or move to event.\n* `ProviderScope` overrides for flavors/environments and tests.\n* Use `riverpod_lint` to catch mistakes.\n\n---\n\n# Part B — Bloc & Cubit 🧱\n\n## 15.10 The idea\n\n**5-year-old:** A **Bloc** is a **vending machine** 🥤. You press buttons (**events**). The machine does its internal work and drops out a snack (**state**). You can't reach inside; you can only press buttons and look at what comes out. Everyone can see what was pressed and what came out — great for debugging.\n\nA **Cubit** is a **simpler vending machine** where instead of pressing labelled buttons (events), you directly call functions (`increment()`), and it emits new states.\n\n```\nUI ──(event)──► Bloc ──(state stream)──► UI\n                 │\n                 ▼\n            Repository → API/DB\n```\n* Based on **Streams** (Bloc = Business Logic Component, pattern introduced by Google in 2018; library by Felix Angelov/VGV).\n* Enforces separation: UI ↔ Bloc ↔ Repository ↔ Data providers.\n* Every state change is traceable (BlocObserver: onEvent, onChange, onTransition, onError) → excellent for large teams and debugging.\n\n## 15.11 Cubit\n```dart\nclass CounterCubit extends Cubit\u003cint> {\n  CounterCubit() : super(0);                 // initial state\n  void increment() => emit(state + 1);\n  void decrement() => emit(state - 1);\n}\n```\n\n## 15.12 Bloc with events and states (Dart 3 sealed classes)\n```dart\n// Events\nsealed class LoginEvent {}\nfinal class LoginEmailChanged extends LoginEvent { LoginEmailChanged(this.email); final String email; }\nfinal class LoginPasswordChanged extends LoginEvent { LoginPasswordChanged(this.password); final String password; }\nfinal class LoginSubmitted extends LoginEvent {}\n\n// State (single class with status — common pattern)\nenum LoginStatus { initial, submitting, success, failure }\n\nfinal class LoginState extends Equatable {\n  const LoginState({this.email = '', this.password = '', this.status = LoginStatus.initial, this.error});\n  final String email;\n  final String password;\n  final LoginStatus status;\n  final String? error;\n\n  bool get isValid => email.contains('@') && password.length >= 8;\n\n  LoginState copyWith({String? email, String? password, LoginStatus? status, String? error}) => LoginState(\n        email: email ?? this.email,\n        password: password ?? this.password,\n        status: status ?? this.status,\n        error: error,\n      );\n\n  @override\n  List\u003cObject?> get props => [email, password, status, error];\n}\n\n// Bloc\nclass LoginBloc extends Bloc\u003cLoginEvent, LoginState> {\n  LoginBloc({required AuthRepository authRepository})\n      : _auth = authRepository,\n        super(const LoginState()) {\n    on\u003cLoginEmailChanged>((event, emit) => emit(state.copyWith(email: event.email)));\n    on\u003cLoginPasswordChanged>((event, emit) => emit(state.copyWith(password: event.password)));\n    on\u003cLoginSubmitted>(_onSubmitted, transformer: droppable()); // ignore extra taps while submitting (bloc_concurrency)\n  }\n\n  final AuthRepository _auth;\n\n  Future\u003cvoid> _onSubmitted(LoginSubmitted event, Emitter\u003cLoginState> emit) async {\n    if (!state.isValid) return;\n    emit(state.copyWith(status: LoginStatus.submitting));\n    try {\n      await _auth.logIn(email: state.email, password: state.password);\n      emit(state.copyWith(status: LoginStatus.success));\n    } on AuthException catch (e) {\n      emit(state.copyWith(status: LoginStatus.failure, error: e.message));\n    }\n  }\n}\n```\nBloc 8+ removed `mapEventToState` (async generator style) in favour of `on\u003cEvent>` handlers. If you see `mapEventToState` in a codebase, it's Bloc ≤7.\n\n### Event transformers (`bloc_concurrency`)\nBy default (Bloc 8+), events are processed **concurrently**. Transformers:\n* `sequential()` — one at a time in order (queue).\n* `droppable()` — ignore new events while one is processing (prevent double submit).\n* `restartable()` — cancel the running handler, start the new one (search-as-you-type).\n* `concurrent()` — default.\nDebounce: custom transformer `(events, mapper) => events.debounceTime(300.ms).switchMap(mapper)` with rxdart.\n\n### Emitting from streams\n```dart\non\u003cTodosSubscriptionRequested>((event, emit) async {\n  await emit.forEach\u003cList\u003cTodo>>(\n    _repo.watchTodos(),\n    onData: (todos) => state.copyWith(todos: todos, status: Status.success),\n    onError: (_, __) => state.copyWith(status: Status.failure),\n  );\n});\n```\n⚠️ Never `emit` after the handler completed (e.g., inside a `stream.listen` callback) → error \"emit was called after an event handler completed normally\". Use `emit.forEach`/`emit.onEach` or add an internal event.\n\n### Bloc vs Cubit\n| Cubit | Bloc |\n|---|---|\n| Methods → emit | Events → handlers → emit |\n| Less boilerplate | More boilerplate |\n| Can't use event transformers | Debounce/throttle/droppable/restartable |\n| Traceability: state changes only | Full event → state transitions |\n| Good for simple features | Good for complex flows, audit trails |\nStart with Cubit; refactor to Bloc when you need event processing control.\n\n## 15.13 Flutter widgets (flutter_bloc)\n```dart\n// Provide (creates & closes automatically)\nBlocProvider(\n  create: (context) => LoginBloc(authRepository: context.read\u003cAuthRepository>()),\n  child: const LoginView(),\n);\nMultiBlocProvider(providers: [...], child: ...);\nRepositoryProvider(create: (_) => AuthRepository(), child: ...);   // DI for repositories\nBlocProvider.value(value: existingBloc, child: ...);              // existing instance (e.g., to new route) — not closed automatically\n\n// Build UI from state\nBlocBuilder\u003cLoginBloc, LoginState>(\n  buildWhen: (prev, curr) => prev.status != curr.status,   // rebuild filter\n  builder: (context, state) => state.status == LoginStatus.submitting\n      ? const CircularProgressIndicator()\n      : FilledButton(onPressed: () => context.read\u003cLoginBloc>().add(LoginSubmitted()), child: const Text('Login')),\n);\n\n// Side effects (navigation, snackbars) — called once per state change\nBlocListener\u003cLoginBloc, LoginState>(\n  listenWhen: (prev, curr) => prev.status != curr.status,\n  listener: (context, state) {\n    if (state.status == LoginStatus.success) context.go('/home');\n    if (state.status == LoginStatus.failure) {\n      ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(state.error ?? 'Login failed')));\n    }\n  },\n  child: ...,\n);\n\nBlocConsumer\u003cLoginBloc, LoginState>(listener: ..., builder: ...);   // both\nBlocSelector\u003cLoginBloc, LoginState, bool>(selector: (s) => s.isValid, builder: (_, isValid) => ...);\nMultiBlocListener(listeners: [...], child: ...);\n\n// Extensions\ncontext.read\u003cLoginBloc>();                         // no listen (callbacks)\ncontext.watch\u003cLoginBloc>().state;                  // listen (build)\ncontext.select((LoginBloc b) => b.state.email);    // listen to part\n```\n\n## 15.14 Testing Bloc (`bloc_test` + `mocktail`)\n```dart\nclass MockAuthRepository extends Mock implements AuthRepository {}\n\nvoid main() {\n  late MockAuthRepository auth;\n  setUp(() => auth = MockAuthRepository());\n\n  blocTest\u003cLoginBloc, LoginState>(\n    'emits [submitting, success] when login succeeds',\n    setUp: () => when(() => auth.logIn(email: any(named: 'email'), password: any(named: 'password')))\n        .thenAnswer((_) async {}),\n    build: () => LoginBloc(authRepository: auth),\n    seed: () => const LoginState(email: 'a@b.com', password: '12345678'),\n    act: (bloc) => bloc.add(LoginSubmitted()),\n    expect: () => const [\n      LoginState(email: 'a@b.com', password: '12345678', status: LoginStatus.submitting),\n      LoginState(email: 'a@b.com', password: '12345678', status: LoginStatus.success),\n    ],\n    verify: (_) => verify(() => auth.logIn(email: 'a@b.com', password: '12345678')).called(1),\n  );\n}\n```\nWidget tests: `MockBloc`/`MockCubit` from bloc_test + `whenListen(bloc, Stream.fromIterable([...]), initialState: ...)`.\n\n## 15.15 Bloc ecosystem\n* `BlocObserver` — global logging/analytics/crash reporting of transitions & errors (`Bloc.observer = AppBlocObserver();`).\n* `hydrated_bloc` — persists state automatically (`toJson`/`fromJson`) — great for settings, carts.\n* `replay_bloc` — undo/redo.\n* `bloc_lint` / `bloc_tools` (CLI) — lint rules & generators; VS Code/IntelliJ extensions for scaffolding.\n* `very_good_cli` — project templates using Bloc + layered architecture.\n\n## 15.16 Bloc pitfalls\n* **Equality**: states must implement `==` (Equatable/freezed/records). Bloc **doesn't emit** a state equal to the current one (`emit` skips if `state == newState`). Mutating a list in place then emitting the same object → **no rebuild**! Always create new lists: `emit(state.copyWith(items: [...state.items, newItem]))`.\n* Without Equatable, two identical-content states are unequal → unnecessary rebuilds.\n* Forgetting to `close()` blocs you create manually (BlocProvider with `create` closes automatically).\n* Using `BlocProvider(create: ...)` with an existing bloc → it gets closed when the provider is disposed; use `.value`.\n* Putting navigation inside the bloc (it should be UI concern via BlocListener).\n* Bloc-to-bloc direct dependencies (tight coupling) → prefer communicating via repositories (shared streams) or presentation layer (BlocListener in UI dispatches to another bloc).\n* `emit` after close → `StateError: Cannot emit new states after calling close` — check `isClosed` after awaits in Cubits.\n\n---\n\n# Part C — Other solutions\n\n## 15.17 GetX\nAll-in-one: state (`.obs` + `Obx`, `GetBuilder`), DI (`Get.put`, `Get.find`, `Get.lazyPut`), routing (`Get.to(Page())`, `Get.back()`), snackbars/dialogs without context, translations.\n```dart\nclass CounterController extends GetxController {\n  final count = 0.obs;\n  void increment() => count.value++;\n}\nfinal c = Get.put(CounterController());\nObx(() => Text('${c.count}'));\n```\n✅ Extremely fast to start, little boilerplate.\n❌ Criticised by much of the community and many companies: lots of \"magic\"/global state, weaker testability, mixing concerns (routing+state+DI+utils in one package), large API surface, historically slow maintenance and breaking changes, non-idiomatic patterns (context-less everything). **Interview-safe answer:** \"I can work with GetX in existing codebases, but for new large projects I prefer Riverpod/Bloc for testability and explicit architecture.\"\n\n## 15.18 MobX\nObservables, actions, computed values, reactions; uses code generation:\n```dart\npart 'counter.g.dart';\nclass Counter = _Counter with _$Counter;\nabstract class _Counter with Store {\n  @observable int value = 0;\n  @computed bool get isEven => value.isEven;\n  @action void increment() => value++;\n}\nObserver(builder: (_) => Text('${counter.value}'));\nreaction((_) => counter.value, (v) => print('changed to $v'));\n```\nTransparent reactive programming (like MobX in JS). Good for teams from React+MobX.\n\n## 15.19 Redux\nSingle immutable **store**, **actions**, pure **reducers** `(state, action) => newState`, **middleware** for side effects (`redux_thunk`, `redux_epics`), `StoreProvider`/`StoreConnector` (`flutter_redux`). Predictable, time travel, but verbose. Rare in new Flutter projects.\n\n## 15.20 Signals\n`signals` package (inspired by Preact/SolidJS signals): fine-grained reactivity.\n```dart\nfinal count = signal(0);\nfinal doubled = computed(() => count.value * 2);\neffect(() => print('count is ${count.value}'));\nWatch((context) => Text('${doubled.value}'));\ncount.value++;\n```\nSimple and performant; growing popularity.\n\n## 15.21 flutter_hooks\nNot state management per se — React-style hooks to reduce StatefulWidget boilerplate:\n```dart\nclass Search extends HookWidget {\n  @override\n  Widget build(BuildContext context) {\n    final controller = useTextEditingController();          // auto-disposed\n    final anim = useAnimationController(duration: const Duration(seconds: 1));\n    final count = useState(0);\n    useEffect(() { final sub = stream.listen(...); return sub.cancel; }, [stream]);\n    return TextField(controller: controller);\n  }\n}\n```\nOften combined with Riverpod (`hooks_riverpod`, `HookConsumerWidget`). Rules: hooks must be called unconditionally in the same order in `build`.\n\n---\n\n## 15.22 Choosing for an organisation (decision guide)\n\n| Situation | Recommendation |\n|---|---|\n| Small app / prototype / 1–2 devs | setState + ValueNotifier/ChangeNotifier, or Provider/Riverpod |\n| Following official Flutter architecture guide | MVVM with ChangeNotifier ViewModels + repositories (+ Provider for DI) |\n| Large team, need strict conventions, audit trail, many juniors | Bloc (with very_good structure) |\n| Large app, heavy async/caching, want less boilerplate, strong DI/testing | Riverpod (with codegen) |\n| Existing codebase | **Stay consistent** with what's there; migrate gradually only with strong reasons |\n\nMigration strategy (e.g., Provider → Riverpod or GetX → Bloc): feature-by-feature, both can coexist; start with new features; write tests around the old behaviour first; don't do a big-bang rewrite.\n\n---\n\n## 15.23 Interview Questions — Riverpod, Bloc, others\n\n**Q1. What problems does Riverpod solve over Provider?** No BuildContext dependency, compile-time safety (no ProviderNotFound), multiple providers of the same type, easy combination/dependency of providers, built-in async handling, auto-dispose & families, easier testing/overrides, usable outside Flutter.\n\n**Q2. ref.watch vs ref.read vs ref.listen?** watch = subscribe & rebuild (build methods); read = one-time read (callbacks); listen = side effects on changes.\n\n**Q3. What is a family modifier?** Creates a parameterised provider: a separate cached state per argument (e.g., productProvider(id)); args need proper equality.\n\n**Q4. What is autoDispose?** Destroys provider state when it has no listeners; prevents leaks and gives fresh state; `ref.keepAlive` to retain.\n\n**Q5. What is AsyncValue?** Riverpod's sealed union for async state: AsyncData, AsyncError, AsyncLoading, with helpers like `when`, `value`, `isLoading`, `hasError`, and `AsyncValue.guard`.\n\n**Q6. Notifier vs StateNotifier vs StateProvider?** Notifier (Riverpod 2+) is the modern class-based mutable provider; StateNotifier and StateProvider are legacy APIs (moved to legacy in Riverpod 3).\n\n**Q7. Explain the Bloc pattern.** UI dispatches events; Bloc processes them (calling repositories) and emits new immutable states via a stream; UI rebuilds from states. Separation, testability, traceability.\n\n**Q8. Bloc vs Cubit?** Cubit exposes methods that emit states; Bloc receives events handled by `on\u003cEvent>` with transformers; Bloc gives more control/traceability, Cubit less boilerplate.\n\n**Q9. BlocBuilder vs BlocListener vs BlocConsumer?** Builder rebuilds UI; Listener runs side effects once per change; Consumer does both.\n\n**Q10. Why use Equatable with Bloc?** Value equality for states/events so identical states are deduplicated and tests can compare expected states.\n\n**Q11. Why might a Bloc not rebuild UI after emit?** Emitted state is equal to the previous (same instance mutated, or Equatable props missing the changed field).\n\n**Q12. How do you prevent duplicate submissions in Bloc?** `droppable()` transformer, status checks, disabling the button.\n\n**Q13. How do you implement search with debounce in Bloc?** A custom transformer using `debounceTime` + `switchMap` (rxdart) or `restartable()`.\n\n**Q14. How do blocs communicate?** Via shared repositories exposing streams, or in the presentation layer using BlocListener to add events to another bloc; avoid direct bloc dependencies.\n\n**Q15. What is BlocObserver?** Global hook to observe all bloc creations, events, changes, transitions, errors and closes — logging/analytics/crash reporting.\n\n**Q16. What is HydratedBloc?** Bloc extension that automatically persists and restores state using storage.\n\n**Q17. Why do some teams avoid GetX?** Implicit global state and magic, mixing concerns, harder testing, maintenance concerns, non-standard patterns.\n\n**Q18. Which state management do you prefer and why?** Give a reasoned answer with trade-offs (e.g., Riverpod for compile-safe DI + async; Bloc for strict event-driven architecture in large teams), emphasise consistency.\n\n**Q19. How would you test a Notifier/Cubit?** Unit test with ProviderContainer (overrides with fakes) / blocTest with mocked repositories; assert state sequences.\n\n**Q20. What is `AsyncValue.guard`?** Runs a future and converts the result to AsyncData or AsyncError, avoiding manual try/catch.\n"}, {"n": 16, "file": "16-networking-and-json.md", "title": "Chapter 16 — Networking: HTTP, Dio, JSON Serialization, REST, GraphQL, WebSockets, Error Handling & Offline", "subtitle": "Networking: HTTP, Dio, JSON Serialization, REST, GraphQL, WebSockets, Error Handling & Offline", "short": "Networking & JSON", "sub": "Dio, token refresh, codegen, caching", "level": "intermediate", "minutes": 13, "qa": 12, "md": "# Chapter 16 — Networking: HTTP, Dio, JSON Serialization, REST, GraphQL, WebSockets, Error Handling & Offline\n\n> **Goal:** Talk to servers like a professional: robust API clients with interceptors, token refresh, retries, cancellation, typed models, error mapping, caching and real-time connections.\n\n---\n\n## 16.1 5-year-old picture: sending letters 📮\n\nYour app **writes a letter** (request) to a server: *\"Dear server, please GIVE me the list of toys\"* (`GET /toys`). The server **writes back** (response) with a status (\"200 OK — here are the toys\" or \"404 — no such toys\") and a **package** (body, usually **JSON** text). Your app must **unpack** the JSON into Dart objects (deserialization).\n\n---\n\n## 16.2 HTTP basics you must know\n\n| Method | Meaning | Idempotent? |\n|---|---|---|\n| GET | Read | ✅ |\n| POST | Create / action | ❌ |\n| PUT | Replace | ✅ |\n| PATCH | Partial update | ❌ (usually) |\n| DELETE | Delete | ✅ |\n\nStatus codes: **2xx** success (200 OK, 201 Created, 204 No Content), **3xx** redirect (304 Not Modified), **4xx** client error (400 Bad Request, 401 Unauthorized = not logged in/token expired, 403 Forbidden = no permission, 404 Not Found, 409 Conflict, 422 Unprocessable Entity (validation), 429 Too Many Requests), **5xx** server error (500, 502 Bad Gateway, 503 Service Unavailable, 504 Gateway Timeout).\n\nHeaders: `Authorization: Bearer \u003ctoken>`, `Content-Type: application/json`, `Accept`, `Accept-Language`, `If-None-Match`/`ETag`, `Cache-Control`, custom `X-Request-Id`, `Idempotency-Key`.\n\n### Platform setup\n* **Android**: `\u003cuses-permission android:name=\"android.permission.INTERNET\" />` in `src/main/AndroidManifest.xml` — **missing in release** is a classic bug: works in debug (debug manifest has it) but release can't connect! Cleartext HTTP (non-HTTPS) is blocked on Android 9+ unless `android:usesCleartextTraffic=\"true\"` or network security config (only for dev!).\n* **iOS**: App Transport Security blocks plain HTTP; exceptions via `NSAppTransportSecurity` in Info.plist (avoid in prod).\n* **macOS**: enable `com.apple.security.network.client` entitlement — otherwise \"Operation not permitted\".\n* **Web**: **CORS** — the server must send `Access-Control-Allow-Origin` headers; you can't fix CORS from Flutter code. During development use `web_dev_config.yaml` proxy (Flutter 3.38+) or a dev proxy.\n* Android emulator → your laptop's localhost is `10.0.2.2`, not `localhost`. iOS simulator can use `localhost`. Physical device: use your machine's LAN IP or tunnelling (ngrok).\n\n---\n\n## 16.3 The `http` package (official, simple)\n\n```dart\nimport 'dart:convert';\nimport 'package:http/http.dart' as http;\n\nFuture\u003cList\u003cPost>> fetchPosts() async {\n  final uri = Uri.https('jsonplaceholder.typicode.com', '/posts', {'_limit': '10'});\n  final response = await http.get(uri, headers: {'Accept': 'application/json'})\n      .timeout(const Duration(seconds: 15));\n\n  if (response.statusCode == 200) {\n    final list = jsonDecode(response.body) as List\u003cdynamic>;\n    return list.map((e) => Post.fromJson(e as Map\u003cString, dynamic>)).toList();\n  }\n  throw HttpException('Failed: ${response.statusCode}');\n}\n\nFuture\u003cPost> createPost(Post post) async {\n  final res = await http.post(\n    Uri.parse('https://api.example.com/posts'),\n    headers: {'Content-Type': 'application/json'},\n    body: jsonEncode(post.toJson()),      // ❗ encode! passing a Map sends form-encoded data\n  );\n  ...\n}\n```\n* Reuse a `http.Client()` for multiple requests (keep-alive) and `close()` it.\n* `response.body` decodes using charset from headers (defaults to latin1 if absent!) — for UTF-8 safety use `utf8.decode(response.bodyBytes)` when the server omits charset (common cause of garbled non-English text 🐛).\n* Multipart upload: `http.MultipartRequest('POST', uri)..files.add(await http.MultipartFile.fromPath('file', path))`.\n* Native-optimized clients: `cupertino_http` (NSURLSession on iOS/macOS), `cronet_http` (Cronet on Android) — HTTP/2/3, better performance, system proxy/VPN support.\n\n---\n\n## 16.4 Dio — the enterprise HTTP client\n\nDio adds **interceptors, global config, cancellation, timeouts, FormData, download/upload progress, transformers**.\n\n```dart\nfinal dio = Dio(BaseOptions(\n  baseUrl: 'https://api.example.com/v1',\n  connectTimeout: const Duration(seconds: 10),\n  receiveTimeout: const Duration(seconds: 20),\n  sendTimeout: const Duration(seconds: 20),\n  headers: {'Accept': 'application/json'},\n  responseType: ResponseType.json,       // auto-decodes JSON\n  validateStatus: (s) => s != null && s >= 200 && s \u003c 300,\n));\n\nfinal res = await dio.get\u003cList\u003cdynamic>>('/products', queryParameters: {'page': 1});\nfinal products = res.data!.map((e) => Product.fromJson(e as Map\u003cString, dynamic>)).toList();\n\nawait dio.post('/orders', data: order.toJson());\n\n// Upload with progress\nfinal form = FormData.fromMap({'avatar': await MultipartFile.fromFile(path, filename: 'a.jpg')});\nawait dio.post('/me/avatar', data: form, onSendProgress: (sent, total) => print(sent / total));\n\n// Download\nawait dio.download(url, savePath, onReceiveProgress: (r, t) {});\n\n// Cancellation\nfinal token = CancelToken();\ndio.get('/search', queryParameters: {'q': q}, cancelToken: token);\ntoken.cancel('user typed again');\n```\n\n### DioException types (Dio 5)\n`connectionTimeout`, `sendTimeout`, `receiveTimeout`, `badCertificate`, `badResponse` (non-2xx; `e.response?.statusCode`), `cancel`, `connectionError` (no internet / DNS), `unknown`.\n\n### Interceptors 🔌\n```dart\nclass AuthInterceptor extends QueuedInterceptor {   // Queued: requests wait while one refresh happens\n  AuthInterceptor(this._tokens, this._dio);\n  final TokenStore _tokens;\n  final Dio _dio;\n\n  @override\n  void onRequest(RequestOptions options, RequestInterceptorHandler handler) async {\n    final token = await _tokens.accessToken();\n    if (token != null) options.headers['Authorization'] = 'Bearer $token';\n    handler.next(options);\n  }\n\n  @override\n  void onError(DioException err, ErrorInterceptorHandler handler) async {\n    final is401 = err.response?.statusCode == 401;\n    final alreadyRetried = err.requestOptions.extra['retried'] == true;\n    if (!is401 || alreadyRetried) return handler.next(err);\n\n    try {\n      final newToken = await _refreshToken();            // call refresh endpoint with a SEPARATE Dio (no interceptor loop)\n      final opts = err.requestOptions\n        ..headers['Authorization'] = 'Bearer $newToken'\n        ..extra['retried'] = true;\n      final response = await _dio.fetch(opts);           // retry original request\n      handler.resolve(response);\n    } catch (e) {\n      await _tokens.clear();                             // refresh failed → logout\n      authEvents.add(AuthEvent.loggedOut);\n      handler.next(err);\n    }\n  }\n\n  Future\u003cString> _refreshToken() async {\n    final refresh = await _tokens.refreshToken();\n    final res = await Dio(BaseOptions(baseUrl: _dio.options.baseUrl))\n        .post('/auth/refresh', data: {'refresh_token': refresh});\n    await _tokens.save(res.data['access_token'], res.data['refresh_token']);\n    return res.data['access_token'] as String;\n  }\n}\n\ndio.interceptors.addAll([\n  AuthInterceptor(tokenStore, dio),\n  if (kDebugMode) LogInterceptor(requestBody: true, responseBody: true), // ❗ never log tokens/PII in production\n  RetryInterceptor(dio: dio, retries: 3, retryDelays: const [Duration(seconds: 1), Duration(seconds: 2), Duration(seconds: 4)]), // dio_smart_retry\n]);\n```\n**Token refresh race condition** (very common senior question): if 5 requests fail with 401 simultaneously, a naive interceptor calls refresh 5 times (and later refreshes invalidate earlier refresh tokens → user logged out). Solutions: `QueuedInterceptor` (processes one at a time), or a shared `Completer`/`Future` lock so only one refresh runs and others await it. Also refresh **proactively** shortly before expiry (JWT `exp`).\n\n### Retrofit (typed API clients via codegen)\n```dart\n@RestApi(baseUrl: 'https://api.example.com/v1')\nabstract class ProductApi {\n  factory ProductApi(Dio dio, {String baseUrl}) = _ProductApi;\n\n  @GET('/products')\n  Future\u003cList\u003cProduct>> getProducts(@Query('page') int page);\n\n  @GET('/products/{id}')\n  Future\u003cProduct> getProduct(@Path('id') String id);\n\n  @POST('/orders')\n  Future\u003cOrder> createOrder(@Body() CreateOrderRequest body);\n}\n```\nChopper is a similar codegen client.\n\n---\n\n## 16.5 JSON serialization\n\n### 16.5.1 Manual\n```dart\nclass User {\n  const User({required this.id, required this.name, this.email, required this.createdAt, this.tags = const []});\n  final int id;\n  final String name;\n  final String? email;\n  final DateTime createdAt;\n  final List\u003cString> tags;\n\n  factory User.fromJson(Map\u003cString, dynamic> json) => User(\n        id: json['id'] as int,\n        name: json['name'] as String,\n        email: json['email'] as String?,\n        createdAt: DateTime.parse(json['created_at'] as String),\n        tags: (json['tags'] as List\u003cdynamic>? ?? const []).cast\u003cString>(),\n      );\n\n  Map\u003cString, dynamic> toJson() => {\n        'id': id,\n        'name': name,\n        if (email != null) 'email': email,\n        'created_at': createdAt.toIso8601String(),\n        'tags': tags,\n      };\n}\n```\nWith Dart 3 patterns (validates shape and fails clearly):\n```dart\nfactory User.fromJson(Map\u003cString, dynamic> json) {\n  if (json case {'id': int id, 'name': String name, 'created_at': String created}) {\n    return User(id: id, name: name, email: json['email'] as String?, createdAt: DateTime.parse(created));\n  }\n  throw FormatException('Invalid user JSON: $json');\n}\n```\n⚠️ JSON numbers: `1` decodes as `int`, `1.0` or `1.5` as `double`. A server sending `price: 10` sometimes and `10.5` other times → `json['price'] as double` crashes for `10`. Use `(json['price'] as num).toDouble()`.\n\n### 16.5.2 `json_serializable` (codegen — most common)\n```dart\nimport 'package:json_annotation/json_annotation.dart';\npart 'user.g.dart';\n\n@JsonSerializable(fieldRename: FieldRename.snake, explicitToJson: true)\nclass User {\n  User({\n    required this.id,\n    required this.name,\n    this.email,\n    required this.createdAt,\n    this.avatar = '',\n    this.role = Role.unknown,\n    this.address,\n  });\n\n  final int id;                                    // \"id\"\n  final String name;                               // \"name\"\n  final String? email;                             // nullable → missing key OK\n  final DateTime createdAt;                        // \"created_at\" (snake rename), ISO-8601 parsed automatically\n  @JsonKey(name: 'avatar_url', defaultValue: '')   // custom key + default when missing/null\n  final String avatar;\n  @JsonKey(unknownEnumValue: Role.unknown)         // new server enum values won't crash old apps\n  final Role role;\n  final Address? address;                          // nested model — explicitToJson makes toJson recurse\n\n  @JsonKey(includeFromJson: false, includeToJson: false)\n  bool selected = false;                           // UI-only field, not serialized\n\n  factory User.fromJson(Map\u003cString, dynamic> json) => _$UserFromJson(json);\n  Map\u003cString, dynamic> toJson() => _$UserToJson(this);\n}\n```\n`dart run build_runner build --delete-conflicting-outputs`. Custom `JsonConverter\u003cT, S>` for special formats (e.g., epoch timestamps).\n\n### 16.5.3 `freezed` (immutable models + unions + JSON)\n```dart\nimport 'package:freezed_annotation/freezed_annotation.dart';\npart 'product.freezed.dart';\npart 'product.g.dart';\n\n@freezed\nabstract class Product with _$Product {          // freezed 3.x: `abstract class` (or `sealed` for unions)\n  const factory Product({\n    required String id,\n    required String name,\n    @Default(0) int stock,\n    double? discount,\n  }) = _Product;\n\n  factory Product.fromJson(Map\u003cString, dynamic> json) => _$ProductFromJson(json);\n}\n\nfinal p2 = p1.copyWith(stock: 5);   // copyWith, ==, hashCode, toString generated\n```\nUnion (sealed) types with freezed:\n```dart\n@freezed\nsealed class PaymentResult with _$PaymentResult {\n  const factory PaymentResult.success(String txnId) = PaymentSuccess;\n  const factory PaymentResult.failed(String reason) = PaymentFailed;\n}\n```\n(In freezed 3, `when`/`map` helpers were removed in favour of Dart 3 `switch` pattern matching.) Note: freezed versions changed syntax (`class X with _$X` → `abstract class`/`sealed class`); check your version.\n\nOther options: `dart_mappable`, `built_value` (older, Google), Dart 3 macros (`@JsonCodable`) — **cancelled** in 2025.\n\n### 16.5.4 Parse big JSON off the main thread\n```dart\nfinal users = await Isolate.run(() =>\n    (jsonDecode(body) as List).map((e) => User.fromJson(e as Map\u003cString, dynamic>)).toList());\n```\nDio: set `dio.transformer = BackgroundTransformer()` (default in Dio 5 already uses background decoding for large responses on native).\n\n---\n\n## 16.6 Error handling architecture (production pattern)\n\nNever let raw `DioException`/`SocketException` reach the UI. Map to **domain failures**:\n```dart\nsealed class AppFailure implements Exception {\n  const AppFailure(this.message);\n  final String message;\n}\nfinal class NetworkFailure extends AppFailure { const NetworkFailure() : super('No internet connection'); }\nfinal class TimeoutFailure extends AppFailure { const TimeoutFailure() : super('The request timed out'); }\nfinal class UnauthorizedFailure extends AppFailure { const UnauthorizedFailure() : super('Please log in again'); }\nfinal class ServerFailure extends AppFailure { const ServerFailure(super.message, {this.statusCode}); final int? statusCode; }\nfinal class ValidationFailure extends AppFailure { const ValidationFailure(super.message, this.fieldErrors); final Map\u003cString, String> fieldErrors; }\nfinal class UnknownFailure extends AppFailure { const UnknownFailure([super.message = 'Something went wrong']); }\n\nAppFailure mapDioError(DioException e) => switch (e.type) {\n  DioExceptionType.connectionTimeout || DioExceptionType.sendTimeout || DioExceptionType.receiveTimeout => const TimeoutFailure(),\n  DioExceptionType.connectionError => const NetworkFailure(),\n  DioExceptionType.badResponse => switch (e.response?.statusCode) {\n      401 => const UnauthorizedFailure(),\n      422 => ValidationFailure('Invalid data', _fieldErrors(e.response?.data)),\n      final code => ServerFailure(_serverMessage(e.response?.data) ?? 'Server error', statusCode: code),\n    },\n  DioExceptionType.cancel => const UnknownFailure('Cancelled'),\n  _ => const UnknownFailure(),\n};\n```\nRepository returns a `Result\u003cT>` (or throws AppFailure); UI shows user-friendly messages, logs technical details to crash reporting. Libraries: `fpdart` (`Either\u003cFailure, T>`, `TaskEither`), `dartz` (older), or your own sealed `Result`.\n\n### Retry strategy\n* Retry only **idempotent** requests (GET/PUT/DELETE) or POSTs with **idempotency keys**.\n* Exponential backoff with jitter; cap retries (3).\n* Retry on timeouts, 502/503/504, connection errors — not on 4xx.\n\n### Connectivity\n`connectivity_plus` tells you the network *type* (wifi/mobile/none) — **not** whether internet actually works (captive portals!). For real reachability, use `internet_connection_checker_plus` or just attempt the request and handle failure. Listen to connectivity changes to auto-retry queued actions.\n\n---\n\n## 16.7 Caching & offline-first\n\nLevels:\n1. **HTTP caching**: honor `Cache-Control`/`ETag` — `dio_cache_interceptor`.\n2. **Repository cache**: in-memory (Map with TTL) + persistent (database) — **stale-while-revalidate**: show cached data immediately, fetch fresh, update UI.\n3. **Offline-first**: local DB is the **source of truth**; UI watches DB streams (Drift/Isar/ObjectBox/Firestore); sync engine pushes local changes (outbox/queue) and pulls server changes; conflict resolution (last-write-wins, versioning, server-authoritative merge).\n\n```dart\nclass ProductRepository {\n  ProductRepository(this._api, this._db);\n  final ProductApi _api;\n  final ProductDao _db;\n\n  Stream\u003cList\u003cProduct>> watchProducts() => _db.watchAll();   // UI listens here\n\n  Future\u003cvoid> refresh() async {\n    final fresh = await _api.getProducts(1);\n    await _db.replaceAll(fresh);                              // triggers stream update\n  }\n}\n```\n\n---\n\n## 16.8 GraphQL\n`graphql_flutter` / `graphql` (with normalized cache), `ferry` (codegen, typed, streams), `artemis` (older codegen).\n```dart\nfinal client = GraphQLClient(link: AuthLink(getToken: () async => 'Bearer $t').concat(HttpLink('https://api.example.com/graphql')), cache: GraphQLCache(store: HiveStore()));\nfinal result = await client.query(QueryOptions(document: gql(r'''\n  query Product($id: ID!) { product(id: $id) { id name price } }\n'''), variables: {'id': '42'}));\nif (result.hasException) { ... }\n```\nKnow: queries/mutations/subscriptions, fragments, normalized caching, over-/under-fetching benefits, N+1 on the server side, persisted queries.\n\n---\n\n## 16.9 Real-time: WebSockets, SSE, gRPC, MQTT\n```dart\nimport 'package:web_socket_channel/web_socket_channel.dart';\nfinal channel = WebSocketChannel.connect(Uri.parse('wss://chat.example.com/ws'));\nawait channel.ready;                        // throws if connection fails\nchannel.stream.listen((msg) => handle(msg), onDone: reconnect, onError: (_) => reconnect());\nchannel.sink.add(jsonEncode({'type': 'message', 'text': 'hi'}));\nawait channel.sink.close();\n```\nProduction concerns: **reconnection with backoff**, **heartbeats/pings**, re-subscribe after reconnect, message ordering & dedup (ids), app background (sockets die on mobile when backgrounded — use push notifications to wake/sync), auth on connect (token in query/header, refresh).\n* Socket.IO: `socket_io_client`.\n* SSE (server-sent events): one-way streaming over HTTP (used by LLM streaming APIs!) — read a streamed response line by line.\n* **gRPC**: `grpc` package + protobuf codegen; HTTP/2; strongly typed; streaming; gRPC-Web on web.\n* MQTT (IoT): `mqtt_client`.\n\n---\n\n## 16.10 Security in networking (summary — Chapter 25 for more)\n* HTTPS everywhere; **certificate pinning** for high-security apps (banking): Dio `HttpClient` with `badCertificateCallback` checking fingerprints / `SecurityContext` with trusted certs; pinning on both platforms via plugins (`http_certificate_pinning`). Plan pin rotation (pin the intermediate/public key, ship backup pins), or you'll brick old app versions when certificates change.\n* Store tokens in **secure storage** (Keychain/Keystore), not SharedPreferences.\n* Don't log tokens/PII; strip from crash reports.\n* Don't embed secret API keys in the app — proxy through your backend.\n\n---\n\n## 16.11 Testing networking code\n* Abstract API behind an interface; inject fakes into repositories.\n* Mock `http.Client` with `MockClient` from `package:http/testing.dart`:\n```dart\nfinal client = MockClient((request) async =>\n    http.Response(jsonEncode([{'id': 1, 'title': 'x'}]), 200, headers: {'content-type': 'application/json'}));\n```\n* Dio: `http_mock_adapter` (`DioAdapter`).\n* Widget tests: Flutter's `TestWidgetsFlutterBinding` makes **real HTTP calls return 400** by default — always mock network in tests.\n\n---\n\n## 16.12 Common networking bugs\n| Bug | Cause / Fix |\n|---|---|\n| Works in debug, fails in release on Android | INTERNET permission missing in main manifest |\n| `SocketException: Connection refused` on emulator | Using `localhost` → `10.0.2.2` |\n| `HandshakeException` / CERTIFICATE_VERIFY_FAILED | invalid/self-signed cert, old Android root CAs (Let's Encrypt on Android \u003c 7.1.1), wrong system time |\n| Garbled non-English text | decode `bodyBytes` as UTF-8 |\n| `type 'int' is not a subtype of type 'double'` | use `(x as num).toDouble()` |\n| `XMLHttpRequest error` on web | CORS / mixed content (http on https page) |\n| Infinite 401 loop | refresh endpoint going through same auth interceptor; retry flag missing |\n| Multiple refreshes | QueuedInterceptor / lock |\n| UI freezes on large responses | parse in isolate |\n| Responses arrive out of order in search | cancel previous request (CancelToken / switchMap / restartable) |\n| Memory leak / setState after dispose | cancel requests in dispose; check `mounted` |\n| Request body empty on server | forgot `jsonEncode` / `Content-Type` header |\n\n---\n\n## 16.13 Interview Questions — Networking\n\n**Q1. http vs Dio?** http is minimal and official; Dio adds interceptors, base options, cancellation, FormData, progress, retries ecosystem — better for large apps.\n\n**Q2. How do you handle token refresh?** Auth interceptor adds token; on 401, refresh once (queued/locked), retry original request, logout on refresh failure; refresh endpoint uses a separate client to avoid loops.\n\n**
